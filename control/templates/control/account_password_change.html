{% extends "control/base_central.html" %}

{% block title %}비밀번호 변경 | GeoFlow{% endblock %}

{% block content %}
<div class="container-fluid p-0">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-7 col-xl-6">
      <div class="card">
        <div class="card-header">
          <h1 class="h3 mb-1">비밀번호 변경</h1>
          <p class="text-muted mb-0">현재 비밀번호를 확인한 뒤 새 비밀번호로 변경합니다.</p>
        </div>
        <div class="card-body">
          <form method="post" action="{% url 'control:account_password_change' %}" autocomplete="off">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="current_password">현재 비밀번호</label>
              <input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" maxlength="128" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="new_password">새 비밀번호</label>
              <input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" maxlength="128" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="new_password2">새 비밀번호 확인</label>
              <input class="form-control" id="new_password2" name="new_password2" type="password" autocomplete="new-password" maxlength="128" required>
            </div>
            <div class="alert alert-secondary py-2" role="note">
              변경이 완료되면 현재 세션이 종료되며 새 비밀번호로 다시 로그인해야 합니다.
            </div>
            <div class="d-flex justify-content-end gap-2">
              <a class="btn btn-outline-secondary" href="javascript:history.back()">취소</a>
              <button class="btn btn-primary" type="submit">비밀번호 변경</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
