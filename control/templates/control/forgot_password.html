{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="shortcut icon" href="{% static 'control/img/icons/icon-48x48.png' %}" />
  <link class="js-stylesheet" href="{% static 'control/css/light.css' %}" rel="stylesheet">
  <title>비밀번호 찾기 | GeoFlow</title>
</head>
<body data-theme="default" data-layout="fluid">
<main class="d-flex w-100 h-100">
  <div class="container d-flex flex-column">
    <div class="row vh-100">
      <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100">
        <div class="d-table-cell align-middle">
          <div class="card">
            <div class="card-body">
              <div class="m-sm-3">
                <h1 class="h3 mb-2">비밀번호 찾기</h1>
                <p class="text-muted">가입한 이메일 주소를 입력하면 비밀번호 재설정 안내를 받을 수 있습니다.</p>

                {% if submitted %}
                  <div class="alert alert-success" role="status">{{ status_message }}</div>
                {% else %}
                  <form method="post" action="{% url 'password_forgot' %}" autocomplete="off">
                    {% csrf_token %}
                    <div class="mb-3">
                      <label class="form-label" for="reset_email">이메일</label>
                      <input class="form-control form-control-lg" id="reset_email" name="email" type="email" autocomplete="email" maxlength="254" required autofocus>
                    </div>
                    {% if form_error %}<div class="alert alert-danger">{{ form_error }}</div>{% endif %}
                    {% if service_error %}<div class="alert alert-danger">{{ service_error }}</div>{% endif %}
                    <div class="d-grid gap-2 mt-3">
                      <button class="btn btn-lg btn-primary" type="submit">재설정 메일 요청</button>
                    </div>
                  </form>
                {% endif %}
              </div>
            </div>
          </div>
          <div class="text-center mb-3"><a href="{% url 'login' %}">로그인으로 돌아가기</a></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="{% static 'control/js/settings.js' %}"></script>
<script src="{% static 'control/js/app.js' %}"></script>
</body>
</html>
