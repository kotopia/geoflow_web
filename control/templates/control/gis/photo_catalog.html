<section id="photo-catalog" class="gis-pane" hidden>
 <div class="card card-body">
  <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
   <div><h2 class="h5 mb-1">사진 카탈로그</h2><p class="text-muted mb-0">업무·레이어별 Template을 연결하고 순서를 관리합니다.</p></div>
   <button type="button" id="photo-template-open" class="btn btn-outline-primary">Template / Variant / Slot 관리</button>
  </div>
  <div id="photo-message" role="status" aria-live="polite"></div>
  <div class="row g-2 mb-3">
   <label class="col-md-4">상위 업무 (L1)<select id="photo-l1" class="form-select"></select></label>
   <label class="col-md-4">업무 분야 (L2)<select id="photo-l2" class="form-select"></select></label>
   <label class="col-md-4">세부 업무 (L3)<select id="photo-l3" class="form-select"></select></label>
  </div>
  <div id="photo-policy-table" class="table-responsive border rounded"></div>
  <p class="form-text mt-2 mb-0">Template 순서 1번이 최초 기본값입니다. 추가사진은 모든 정책에서 허용됩니다.</p>
 </div>
</section>
<dialog id="photo-template-dialog" class="photo-template-dialog">
 <div class="d-flex justify-content-between align-items-center border-bottom p-3"><div><h2 class="h5 mb-0">사진 Template 관리</h2><span class="small text-muted">Template → Variant → Slot 순서로 구성합니다.</span></div><button type="button" id="photo-template-close" class="btn-close" aria-label="닫기"></button></div>
 <div id="photo-modal-message" class="px-3 pt-3" role="status" aria-live="polite"></div>
 <div class="row g-0 photo-dialog-body">
  <aside class="col-lg-3 border-end p-3"><div class="d-flex justify-content-between mb-2"><h3 class="h6">Template</h3><button id="photo-template-new" class="btn btn-sm btn-outline-primary">+ 추가</button></div><div id="photo-template-list" class="list-group"></div></aside>
  <main class="col-lg-9 p-3">
   <section class="border rounded p-3 mb-3"><form id="photo-template-form"><input type="hidden" name="id"><div class="row g-2"><label class="col-md-7">Template 이름<input name="name" class="form-control" maxlength="120" required></label><label class="col-md-3">순서<input name="sort_order" type="number" class="form-control" value="0"></label><div class="col-md-2 align-self-end"><button type="button" id="photo-template-save" class="btn btn-primary btn-sm">저장</button></div></div><label class="w-100 mt-2">설명<input name="description" class="form-control"></label><button type="button" id="photo-template-deactivate" class="btn btn-outline-warning btn-sm mt-2" hidden>비활성화</button></form></section>
   <section id="photo-variant-section" class="border rounded p-3 mb-3" hidden><div class="d-flex justify-content-between mb-2"><h3 class="h6">Variant</h3><button id="photo-variant-new" class="btn btn-sm btn-outline-primary">+ 추가</button></div><div id="photo-variant-list" class="list-group mb-3"></div><form id="photo-variant-form"><input type="hidden" name="id"><div class="row g-2"><label class="col-md-7">Variant 이름<input name="name" class="form-control" maxlength="120" required></label><label class="col-md-3">순서<input name="sort_order" type="number" class="form-control" value="0"></label><div class="col-md-2 align-self-end"><button type="button" id="photo-variant-save" class="btn btn-primary btn-sm">저장</button></div></div><label class="w-100 mt-2">설명<input name="description" class="form-control"></label><button type="button" id="photo-variant-deactivate" class="btn btn-outline-warning btn-sm mt-2" hidden>비활성화</button></form></section>
   <section id="photo-slot-section" class="border rounded p-3" hidden><div class="d-flex justify-content-between mb-2"><h3 class="h6">Slot</h3><button id="photo-slot-new" class="btn btn-sm btn-outline-primary">+ 추가</button></div><div id="photo-slot-list" class="list-group mb-3"></div><form id="photo-slot-form"><input type="hidden" name="id"><div class="row g-2"><label class="col-md-5">Slot 이름<input name="name" class="form-control" maxlength="120" required></label><label class="col-md-2">최소<input name="min_count" type="number" min="0" max="100" class="form-control" value="1"></label><label class="col-md-2">최대<input name="max_count" type="number" min="0" max="100" class="form-control" value="1"></label><label class="col-md-3">순서<input name="sort_order" type="number" class="form-control" value="0"></label></div><label class="w-100 mt-2">설명<input name="description" class="form-control"></label><h4 class="h6 mt-3">사진별 추가 입력</h4><div id="photo-extra-fields"></div><button type="button" id="photo-extra-add" class="btn btn-outline-secondary btn-sm mb-2">+ 입력 항목</button><div><button type="button" id="photo-slot-save" class="btn btn-primary btn-sm">저장</button> <button type="button" id="photo-slot-deactivate" class="btn btn-outline-warning btn-sm" hidden>비활성화</button></div></form></section>
  </main>
 </div>
</dialog>
<style>.photo-template-dialog{width:min(1180px,96vw);max-width:none;padding:0;border:0;border-radius:.5rem;box-shadow:0 1rem 3rem rgba(0,0,0,.3)}.photo-template-dialog::backdrop{background:rgba(0,0,0,.5)}.photo-dialog-body{max-height:78vh;overflow:auto}#photo-policy-table table{min-width:900px;margin:0}#photo-policy-table th{white-space:nowrap;background:var(--bs-tertiary-bg)}.photo-policy-template{display:grid;grid-template-columns:1fr 80px;gap:.5rem;align-items:center}.photo-template-dialog .list-group-item.active small{color:inherit!important}</style>
<script>
(()=>{'use strict';
 const root=document.getElementById('photo-catalog'),dialog=document.getElementById('photo-template-dialog'),$=id=>document.getElementById(id),api='/control/central/gis/photo-catalog/api/';
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),option=(v,n)=>`<option value="${esc(v)}">${esc(n)}</option>`,code=p=>p+'_'+((crypto.randomUUID?.()||String(Date.now())).replaceAll('-','').slice(0,12).toUpperCase());
 let data=null,loaded=false,selectedTemplate='',selectedVariant='',selectedSlot='';
 function notice(v,k='danger',modal=false){$(modal?'photo-modal-message':'photo-message').innerHTML=`<div class="alert alert-${k} py-2">${esc(v)}</div>`;}
 async function request(payload){const o=payload?{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]')?.value||'','Accept':'application/json'},body:JSON.stringify(payload)}:{credentials:'same-origin',headers:{'Accept':'application/json'}};const r=await fetch(api,o);let j;try{j=await r.json();}catch(_){throw Error(`사진 카탈로그 요청 실패 (HTTP ${r.status})`);}if(!r.ok||!j.ok)throw Error(j.error||`저장 실패 (HTTP ${r.status})`);data=j;loaded=true;return j;}
 function fillScopes(){const a=$('photo-l1'),b=$('photo-l2'),c=$('photo-l3'),old=[a.value,b.value,c.value],l1=data.catalog.nodes.filter(n=>n.level===1);a.innerHTML=l1.map(n=>option(n.id,n.name)).join('');if(l1.some(n=>n.id===old[0]))a.value=old[0];const ids=new Set(data.catalog.parents.filter(p=>p.parent_id===a.value).map(p=>p.child_id)),l2=data.catalog.nodes.filter(n=>n.level===2&&ids.has(n.id));b.innerHTML=l2.map(n=>option(n.id,n.name)).join('');if(l2.some(n=>n.id===old[1]))b.value=old[1];const l3=data.catalog.lv3.filter(n=>n.lv2_id===b.value);c.innerHTML=option('','L2 기본 정책')+l3.map(n=>option(n.id,n.name)).join('');if(l3.some(n=>n.id===old[2]))c.value=old[2];}
 function scope(){return {lv2:$('photo-l2').value,lv3:$('photo-l3').value||null};}
 function policyFor(layer){const s=scope();return data.policies.find(p=>p.active&&p.lv2_id===s.lv2&&p.lv3_id===s.lv3&&p.layer_id===layer);}
 function linksFor(policy){return data.policy_templates.filter(x=>x.active&&x.policy_id===policy?.id).sort((a,b)=>a.sort_order-b.sort_order);}
 function renderPolicies(){const s=scope(),templates=data.templates.filter(t=>t.active),layers=data.catalog.layers.filter(l=>l.lv2_id===s.lv2);$('photo-policy-table').innerHTML=`<table class="table table-sm align-middle"><thead><tr><th>적용 레이어</th><th>적용 Template (순서)</th><th></th></tr></thead><tbody>${layers.map(l=>{const p=policyFor(l.id),links=linksFor(p),selected=new Map(links.map(x=>[x.template_id,x.sort_order]));return `<tr data-photo-layer="${l.id}" data-policy-id="${p?.id||''}"><td><strong>${esc(l.label)}</strong><br><code>${esc(l.standard_name)}</code></td><td>${templates.map(t=>`<label class="photo-policy-template"><span><input type="checkbox" class="form-check-input photo-template-use" value="${t.id}" ${selected.has(t.id)?'checked':''}> ${esc(t.name)}</span><input type="number" class="form-control form-control-sm photo-template-order" value="${selected.get(t.id)??t.sort_order??0}" aria-label="순서"></label>`).join('')||'<span class="text-muted">활성 Template이 없습니다.</span>'}</td><td><button class="btn btn-primary btn-sm photo-policy-save">저장</button>${p?'<button class="btn btn-outline-warning btn-sm ms-1 photo-policy-deactivate">비활성화</button>':''}</td></tr>`;}).join('')}</tbody></table>`;}
 function renderLists(){const templates=data.templates.filter(t=>t.active);if(!templates.some(t=>t.id===selectedTemplate))selectedTemplate='';$('photo-template-list').innerHTML=templates.map(t=>`<button class="list-group-item list-group-item-action ${t.id===selectedTemplate?'active':''}" data-template-id="${t.id}">${esc(t.name)}</button>`).join('')||'<span class="text-muted">Template이 없습니다.</span>';$('photo-variant-section').hidden=!selectedTemplate;const variants=data.variants.filter(v=>v.active&&v.template_id===selectedTemplate);if(!variants.some(v=>v.id===selectedVariant))selectedVariant='';$('photo-variant-list').innerHTML=variants.map(v=>`<button class="list-group-item list-group-item-action ${v.id===selectedVariant?'active':''}" data-variant-id="${v.id}">${esc(v.name)} <small>${esc(v.code)}</small></button>`).join('')||'<span class="text-muted">Variant를 추가하세요.</span>';$('photo-slot-section').hidden=!selectedVariant;const slots=data.slots.filter(s=>s.active&&s.variant_id===selectedVariant);if(!slots.some(s=>s.id===selectedSlot))selectedSlot='';$('photo-slot-list').innerHTML=slots.map(s=>`<button class="list-group-item list-group-item-action ${s.id===selectedSlot?'active':''}" data-slot-id="${s.id}">${esc(s.name)} <small>최소 ${s.min_count} / 최대 ${s.max_count}</small></button>`).join('')||'<span class="text-muted">Slot이 없습니다.</span>';}
 function render(){fillScopes();renderPolicies();renderLists();}
 function resetForm(kind){const form=$(`photo-${kind}-form`);form.reset();form.elements.id.value='';$(`photo-${kind}-deactivate`).hidden=true;if(kind==='template'){selectedTemplate=selectedVariant=selectedSlot='';$('photo-variant-section').hidden=true;$('photo-slot-section').hidden=true;}if(kind==='variant'){selectedVariant=selectedSlot='';$('photo-slot-section').hidden=true;}if(kind==='slot'){selectedSlot='';$('photo-extra-fields').innerHTML='';}renderLists();}
 function edit(kind,id){const rows=kind==='template'?data.templates:kind==='variant'?data.variants:data.slots,row=rows.find(x=>x.id===id);if(!row)return;if(kind==='template'){selectedTemplate=id;selectedVariant=selectedSlot='';}if(kind==='variant'){selectedVariant=id;selectedSlot='';}if(kind==='slot')selectedSlot=id;const f=$(`photo-${kind}-form`);f.reset();['id','name','sort_order','description','min_count','max_count'].forEach(k=>{if(f.elements[k])f.elements[k].value=row[k]??'';});if(kind==='slot'){$('photo-extra-fields').innerHTML='';(row.extra_schema?.fields||[]).forEach(extraField);}$(`photo-${kind}-deactivate`).hidden=false;renderLists();}
 function extraField(field={}){const el=document.createElement('div');el.className='row g-2 mb-2 photo-extra-row';el.dataset.key=field.key||code('F');el.innerHTML=`<label class="col-md-5">이름<input class="form-control photo-extra-label" value="${esc(field.label)}" required></label><label class="col-md-4">유형<select class="form-select photo-extra-kind">${['text','integer','decimal','boolean','date','datetime'].map(k=>option(k,k)).join('')}</select></label><label class="col-md-2 align-self-end"><input type="checkbox" class="photo-extra-required" ${field.required?'checked':''}> 필수</label><button type="button" class="col-md-1 btn btn-outline-danger btn-sm photo-extra-remove">×</button>`;el.querySelector('select').value=field.kind||'text';$('photo-extra-fields').appendChild(el);}
 async function saveDefinition(kind){const f=$(`photo-${kind}-form`);if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f)),rows=kind==='template'?data.templates:kind==='variant'?data.variants:data.slots,p={action:'save',kind,...v,code:v.id?rows.find(x=>x.id===v.id).code:code(kind==='template'?'TPL':kind==='variant'?'VAR':'SLOT')};if(kind==='variant')p.template_id=selectedTemplate;if(kind==='slot'){p.variant_id=selectedVariant;p.extra_schema={fields:Array.from(dialog.querySelectorAll('.photo-extra-row')).map(r=>({key:r.dataset.key,label:r.querySelector('.photo-extra-label').value,kind:r.querySelector('.photo-extra-kind').value,required:r.querySelector('.photo-extra-required').checked}))};}if(!v.id)delete p.id;try{const j=await request(p);edit(kind,j.id);renderPolicies();notice('저장했습니다.','success',true);}catch(e){notice(e.message,'danger',true);}}
 async function savePolicy(row){const chosen=Array.from(row.querySelectorAll('.photo-template-use:checked')).map(c=>({id:c.value,order:Number(c.closest('label').querySelector('.photo-template-order').value)||0})).sort((a,b)=>a.order-b.order).map(x=>x.id);if(!chosen.length){notice('Template을 하나 이상 선택하세요.');return;}const s=scope(),p={action:'save',kind:'policy',id:row.dataset.policyId||undefined,lv2_id:s.lv2,lv3_id:s.lv3,layer_id:row.dataset.photoLayer,template_ids:chosen,sort_order:0,description:''};if(!p.id)delete p.id;try{await request(p);render();notice('사진 정책을 저장했습니다.','success');}catch(e){notice(e.message);}}
 async function deactivate(kind,id,modal=false){if(!id||!confirm('비활성화하시겠습니까?'))return;try{await request({action:'deactivate',kind,id});resetForm(kind==='policy'?'template':kind);render();notice('비활성화했습니다.','success',modal);}catch(e){notice(e.message,'danger',modal);}}
 root.addEventListener('change',e=>{if(e.target.id==='photo-l1'){$('photo-l2').value='';$('photo-l3').value='';render();}else if(e.target.id==='photo-l2'){$('photo-l3').value='';render();}else if(e.target.id==='photo-l3')render();});
 root.addEventListener('click',e=>{const row=e.target.closest('[data-photo-layer]');if(e.target.id==='photo-template-open'){renderLists();dialog.showModal();}else if(e.target.classList.contains('photo-policy-save'))savePolicy(row);else if(e.target.classList.contains('photo-policy-deactivate'))deactivate('policy',row.dataset.policyId);});
 dialog.addEventListener('click',e=>{const t=e.target.closest('[data-template-id]'),v=e.target.closest('[data-variant-id]'),s=e.target.closest('[data-slot-id]');if(t)edit('template',t.dataset.templateId);else if(v)edit('variant',v.dataset.variantId);else if(s)edit('slot',s.dataset.slotId);else if(e.target.id==='photo-template-close')dialog.close();else if(e.target.id==='photo-extra-add')extraField();else if(e.target.classList.contains('photo-extra-remove'))e.target.closest('.photo-extra-row').remove();else for(const kind of ['template','variant','slot']){if(e.target.id===`photo-${kind}-new`)resetForm(kind);if(e.target.id===`photo-${kind}-save`)saveDefinition(kind);if(e.target.id===`photo-${kind}-deactivate`)deactivate(kind,$(`photo-${kind}-form`).elements.id.value,true);}});
 for(const f of dialog.querySelectorAll('form'))f.addEventListener('submit',e=>e.preventDefault());
 document.querySelector('[data-tab="photo-catalog"]').addEventListener('click',async()=>{if(!loaded)try{await request();render();}catch(e){notice(e.message);}});
})();
</script>
