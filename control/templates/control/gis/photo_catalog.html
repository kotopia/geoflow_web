<section id="photo-catalog" class="gis-pane" hidden>
 <div class="card card-body">
  <h2 class="h5">사진 카탈로그</h2>
  <p class="text-muted">프로젝트 업무범위와 기존 레이어에 사진 항목을 연결합니다. 레이어 구성은 변경되지 않습니다.</p>
  <div id="photo-message" role="status"></div>
  <div class="row g-2 mb-3">
   <label class="col-md-4">상위 업무 (L1)<select id="photo-l1" class="form-select"></select></label>
   <label class="col-md-4">업무 분야 (L2)<select id="photo-l2" class="form-select"></select></label>
   <label class="col-md-4">세부 업무 (L3)<select id="photo-l3" class="form-select"></select></label>
  </div>
  <div class="row g-3">
   <div class="col-lg-5"><div class="border rounded p-3 h-100">
    <h3 class="h6">① 사진 템플릿</h3><div id="photo-template-list" class="mb-2"></div>
    <form id="photo-template-form"><input type="hidden" name="id">
     <label class="form-label w-100">이름<input name="name" class="form-control" maxlength="120" required></label>
     <label class="form-label w-100">촬영방식<select name="capture_mode" class="form-select"><option>DIRECT</option><option>INDIRECT</option><option>GENERAL</option></select></label>
     <label class="form-label w-100">설명<input name="description" class="form-control"></label>
     <label class="form-label w-100">순서<input name="sort_order" type="number" class="form-control" value="0"></label>
     <button class="btn btn-primary btn-sm">템플릿 저장</button> <button type="button" class="btn btn-outline-secondary btn-sm" id="photo-template-new">새 템플릿</button>
     <button type="button" class="btn btn-outline-warning btn-sm" id="photo-template-deactivate" hidden>비활성화</button>
    </form>
   </div></div>
   <div class="col-lg-7"><div class="border rounded p-3 h-100">
    <h3 class="h6">② 템플릿 사진 항목</h3><div id="photo-slot-list" class="mb-2"></div>
    <form id="photo-slot-form"><input type="hidden" name="id">
     <label class="form-label w-100">항목 이름<input name="name" class="form-control" maxlength="120" required></label>
     <div class="row g-2"><label class="col-md-4">필수 장수<input name="min_count" type="number" min="0" max="100" class="form-control" value="1"></label>
     <label class="col-md-4">최대 장수<input name="max_count" type="number" min="0" max="100" class="form-control" value="1"></label>
     <label class="col-md-4">순서<input name="sort_order" type="number" class="form-control" value="0"></label></div>
     <label class="form-label w-100 mt-2">설명<input name="description" class="form-control"></label>
     <h4 class="h6 mt-3">사진별 추가 입력</h4><div id="photo-extra-fields"></div>
     <button type="button" id="photo-extra-add" class="btn btn-outline-secondary btn-sm mb-2">+ 입력 항목</button><br>
     <button class="btn btn-primary btn-sm">사진 항목 저장</button> <button type="button" class="btn btn-outline-secondary btn-sm" id="photo-slot-new">새 항목</button>
     <button type="button" class="btn btn-outline-warning btn-sm" id="photo-slot-deactivate" hidden>비활성화</button>
    </form>
   </div></div>
  </div>
  <div class="border rounded p-3 mt-3">
   <h3 class="h6">③ 업무·레이어별 적용 정책</h3><div id="photo-policy-list" class="mb-2"></div>
   <form id="photo-policy-form"><input type="hidden" name="id"><div class="row g-2">
    <label class="col-md-4">적용 레이어<select name="layer_id" id="photo-policy-layer" class="form-select" required></select></label>
    <label class="col-md-4">DIRECT 템플릿<select name="direct_template_id" id="photo-direct-template" class="form-select"></select></label>
    <label class="col-md-4">INDIRECT 템플릿<select name="indirect_template_id" id="photo-indirect-template" class="form-select"></select></label>
    <label class="col-md-4">기본 촬영방식<select name="default_capture_mode" class="form-select"><option>DIRECT</option><option>INDIRECT</option></select></label>
    <label class="col-md-4">순서<input type="number" name="sort_order" class="form-control" value="0"></label>
    <label class="col-md-4 d-flex align-items-center"><input type="checkbox" name="allow_extra_photo" class="form-check-input me-2" checked> 일반 사진 허용</label>
   </div><label class="form-label w-100 mt-2">설명<input name="description" class="form-control"></label>
   <button class="btn btn-primary btn-sm">정책 저장</button> <button type="button" class="btn btn-outline-secondary btn-sm" id="photo-policy-new">새 정책</button>
   <button type="button" class="btn btn-outline-warning btn-sm" id="photo-policy-deactivate" hidden>비활성화</button>
   </form>
  </div>
 </div>
</section>
<script>
(()=>{
 'use strict';
 const root=document.getElementById('photo-catalog');
 const $=id=>document.getElementById(id);
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const option=(v,n)=>`<option value="${esc(v)}">${esc(n)}</option>`;
 const code=prefix=>prefix+'_'+crypto.randomUUID().replaceAll('-','').slice(0,12).toUpperCase();
 const api='/control/central/gis/photo-catalog/api/';
 let data=null, loaded=false, selectedTemplate='',selectedSlot='',selectedPolicy='';
 function message(value,kind='danger'){$('photo-message').innerHTML=`<div class="alert alert-${kind}">${esc(value)}</div>`;}
 async function load(){
  const resp=await fetch(api,{credentials:'same-origin'});const result=await resp.json();
  if(!resp.ok||!result.ok)throw Error(result.error||'사진 카탈로그 조회 실패');
  data=result;loaded=true;render();
 }
 function l2Options(){const childIds=data.catalog.parents.filter(p=>p.parent_id===$('photo-l1').value).map(p=>p.child_id);return data.catalog.nodes.filter(n=>n.level===2&&childIds.includes(n.id));}
 function preserve(id,items,renderOption){const old=$(id).value;$(id).innerHTML=items.map(renderOption).join('');if(items.some(x=>x.id===old))$(id).value=old;}
 function scopes(){
  preserve('photo-l1',data.catalog.nodes.filter(n=>n.level===1),n=>option(n.id,n.name));
  preserve('photo-l2',l2Options(),n=>option(n.id,n.name));
  const lv2=$('photo-l2').value;
  const old=$('photo-l3').value;
  $('photo-l3').innerHTML=option('','L2 기본 정책')+data.catalog.lv3.filter(o=>o.lv2_id===lv2).map(o=>option(o.id,o.name)).join('');
  if(data.catalog.lv3.some(o=>o.id===old&&o.lv2_id===lv2))$('photo-l3').value=old;
  preserve('photo-policy-layer',data.catalog.layers.filter(l=>l.lv2_id===lv2),l=>option(l.id,`${l.standard_name} · ${l.label}`));
 }
 function rowButton(kind,item,label){return `<button type="button" class="btn btn-sm btn-outline-secondary me-1 mb-1" data-photo-kind="${kind}" data-photo-id="${esc(item.id)}">${esc(label)}</button>`;}
 function render(){
  scopes();
  $('photo-template-list').innerHTML=data.templates.filter(t=>t.active).map(t=>rowButton('template',t,`${t.name} (${t.capture_mode})`)).join('')||'<span class="text-muted">템플릿 없음</span>';
  if(!data.templates.some(t=>t.id===selectedTemplate&&t.active))selectedTemplate='';
  $('photo-slot-list').innerHTML=data.slots.filter(s=>s.active&&s.template_id===selectedTemplate).map(s=>rowButton('slot',s,`${s.name} · 필수 ${s.min_count}/${s.max_count}`)).join('')||'<span class="text-muted">템플릿을 선택하면 사진 항목을 편집할 수 있습니다.</span>';
  for(const [id,mode] of [['photo-direct-template','DIRECT'],['photo-indirect-template','INDIRECT']]){
   const old=$(id).value;
   $(id).innerHTML=option('','사용 안 함')+data.templates.filter(t=>t.active&&t.capture_mode===mode).map(t=>option(t.id,t.name)).join('');
   if(data.templates.some(t=>t.id===old&&t.active&&t.capture_mode===mode))$(id).value=old;
  }
  const l2=$('photo-l2').value,l3=$('photo-l3').value;
  $('photo-policy-list').innerHTML=data.policies.filter(p=>p.active&&p.lv2_id===l2&&p.lv3_id===(l3||null)).map(p=>{
   const layer=data.catalog.layers.find(x=>x.id===p.layer_id);
   return rowButton('policy',p,layer?.label||p.layer_id);
  }).join('')||'<span class="text-muted">이 업무의 사진 정책이 없습니다.</span>';
 }
 function reset(kind){
  $(`photo-${kind}-form`).reset();$(`photo-${kind}-form`).elements.id.value='';
  $(`photo-${kind}-deactivate`).hidden=true;
  if(kind==='template'){selectedTemplate='';selectedSlot='';}
  if(kind==='slot'){$('photo-extra-fields').innerHTML='';selectedSlot='';}
  if(kind==='policy')selectedPolicy='';
  render();
 }
 function extraField(field={}){
  const el=document.createElement('div');el.className='row g-2 mb-2 photo-extra-row';
  el.dataset.key=field.key||code('F');
  el.innerHTML=`<label class="col-md-5">이름<input class="form-control photo-extra-label" maxlength="120" value="${esc(field.label)}" required></label>
   <label class="col-md-4">유형<select class="form-select photo-extra-kind">${['text','integer','decimal','boolean','date','datetime'].map(k=>option(k,k)).join('')}</select></label>
   <label class="col-md-2 align-self-end"><input type="checkbox" class="photo-extra-required" ${field.required?'checked':''}> 필수</label>
   <div class="col-md-1 align-self-end"><button type="button" class="btn btn-outline-danger btn-sm photo-extra-remove" aria-label="입력 항목 제거">×</button></div>`;
  el.querySelector('select').value=field.kind||'text';$('photo-extra-fields').appendChild(el);
 }
 function edit(kind,id){
  const item=data[kind==='policy'?'policies':`${kind}s`].find(x=>x.id===id);if(!item)return;
  const form=$(`photo-${kind}-form`);form.reset();
  for(const [key,value] of Object.entries(item))if(form.elements[key]&&key!=='extra_schema'){
   if(form.elements[key].type==='checkbox')form.elements[key].checked=!!value;
   else form.elements[key].value=value??'';
  }
  if(kind==='template'){selectedTemplate=id;selectedSlot='';$('photo-extra-fields').innerHTML='';}
  if(kind==='slot'){
   selectedSlot=id;$('photo-extra-fields').innerHTML='';
   (item.extra_schema?.fields||[]).forEach(extraField);
  }
  if(kind==='policy'){selectedPolicy=id;$('photo-l2').value=item.lv2_id;scopes();$('photo-l3').value=item.lv3_id||'';}
  $(`photo-${kind}-deactivate`).hidden=false;render();
  if(kind==='policy'){
   form.elements.layer_id.value=item.layer_id;
   form.elements.direct_template_id.value=item.direct_template_id||'';
   form.elements.indirect_template_id.value=item.indirect_template_id||'';
  }
 }
 async function save(payload){
  const resp=await fetch(api,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]').value},body:JSON.stringify(payload)});
  const result=await resp.json();if(!resp.ok||!result.ok)throw Error(result.error||'저장 실패');
  data=result;render();message('사진 정의를 저장했습니다.','success');return result.id;
 }
 root.addEventListener('click',async e=>{
  if(e.target.id==='photo-extra-add'){extraField();return;}
  if(e.target.classList.contains('photo-extra-remove')){e.target.closest('.photo-extra-row').remove();return;}
  const button=e.target.closest('[data-photo-kind]');if(button){edit(button.dataset.photoKind,button.dataset.photoId);return;}
  for(const kind of ['template','slot','policy']){
   if(e.target.id===`photo-${kind}-new`){reset(kind);return;}
   if(e.target.id===`photo-${kind}-deactivate`){
    if(!confirm('이 정의를 비활성화하시겠습니까?'))return;
    try{await save({action:'deactivate',kind,id:$(`photo-${kind}-form`).elements.id.value});reset(kind);}catch(err){message(err.message);}
    return;
   }
  }
 });
 root.addEventListener('submit',async e=>{
  const form=e.target;if(!['photo-template-form','photo-slot-form','photo-policy-form'].includes(form.id))return;
  e.preventDefault();const kind=form.id.slice(6,-5), values=Object.fromEntries(new FormData(form));
  const payload={action:'save',kind,...values};
  if(!values.id)delete payload.id;
  if(kind==='template')payload.code=values.id?data.templates.find(t=>t.id===values.id).code:code('TPL');
  if(kind==='slot'){
   if(!selectedTemplate){message('먼저 사진 템플릿을 선택하세요.');return;}
   payload.template_id=selectedTemplate;
   payload.code=values.id?data.slots.find(s=>s.id===values.id).code:code('SLOT');
   payload.extra_schema={fields:Array.from(root.querySelectorAll('.photo-extra-row')).map(row=>({
    key:row.dataset.key,label:row.querySelector('.photo-extra-label').value,
    kind:row.querySelector('.photo-extra-kind').value,required:row.querySelector('.photo-extra-required').checked
   }))};
  }
  if(kind==='policy'){
   payload.lv2_id=$('photo-l2').value;payload.lv3_id=$('photo-l3').value||null;
   payload.allow_extra_photo=form.elements.allow_extra_photo.checked;
  }
  try{const id=await save(payload);edit(kind,id);}catch(err){message(err.message);}
 });
 $('photo-l1').addEventListener('change',()=>{scopes();render();});
 $('photo-l2').addEventListener('change',()=>{scopes();render();});
 $('photo-l3').addEventListener('change',render);
 document.querySelector('[data-tab="photo-catalog"]').addEventListener('click',()=>{
  if(!loaded)load().catch(err=>message(err.message));
 });
})();
</script>
