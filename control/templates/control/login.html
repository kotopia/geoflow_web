{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="GeoFlow 중앙 로그인">

	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link rel="shortcut icon" href="{% static 'control/img/icons/icon-48x48.png' %}" />

	<title>GeoFlow 로그인</title>

	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


	<!-- BEGIN SETTINGS -->
	<!-- Remove this after purchasing -->
	<link class="js-stylesheet" href="{% static 'control/css/light.css' %}" rel="stylesheet">
	
	<!-- <script src="{% static 'control/js/app.js' %}"></script> -->
	<style>
		body {
			opacity: 0;
		}
	</style>
	<!-- END SETTINGS -->
</head>
<!--
  HOW TO USE: 
  data-theme: default (default), dark, light, colored
  data-layout: fluid (default), boxed
  data-sidebar-position: left (default), right
  data-sidebar-layout: default (default), compact
-->

<body data-theme="default" data-layout="fluid" data-sidebar-position="left" data-sidebar-layout="default">
	<main class="d-flex w-100 h-100">
		<div class="container d-flex flex-column">
			<div class="row vh-100">
				<div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100">
					<div class="d-table-cell align-middle">

						<div class="text-center mt-4">
							<!-- <h1 class="h2">GeoFlow</h1> -->
							<!-- <p class="lead">
								Sign in to your account to continue
							</p> -->
						</div>

						<div class="card">
							<div class="card-body">
								<div class="m-sm-3">
									<!-- <div class="d-grid gap-2 mb-3">
										<a class="btn btn-google btn-lg" href="index.html"><i class="fab fa-fw fa-google"></i> Sign in with Google</a>
										<a class="btn btn-facebook btn-lg" href="index.html"><i class="fab fa-fw fa-facebook-f"></i> Sign in with Facebook</a>
										<a class="btn btn-microsoft btn-lg" href="index.html"><i class="fab fa-fw fa-microsoft"></i> Sign in with Microsoft</a>
									</div>
									<div class="row">
										<div class="col">
											<hr>
										</div>
										<div class="col-auto text-uppercase d-flex align-items-center">Or</div>
										<div class="col">
											<hr>
										</div>
									</div> -->
									<form id="loginForm" method="post" action="{% url 'login' %}">
										{% csrf_token %}
										<div class="mb-3">
											<label class="form-label">이메일</label>
											<input class="form-control form-control-lg" type="email" name="email" placeholder="이메일 입력" autocomplete="username" required />
										</div>
										<div class="mb-3">
											<label class="form-label">비밀번호</label>
											<input class="form-control form-control-lg" type="password" name="password" placeholder="비밀번호 입력" autocomplete="current-password" required />
										</div>
										<div class="d-grid gap-2 mt-3">
											<button type="submit" class="btn btn-lg btn-primary" id="btnSignIn">로그인</button>
										</div>
										{% if error %}
											<div class="alert alert-danger mt-3" role="alert">{{ error }}</div>
										{% endif %}
									</form>

								</div>
							</div>
						</div>
						<div class="text-center mb-3">
							<a href="{% url 'signup' %}">회원가입</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<script>
	// 이중 제출 방지: 클릭 즉시 버튼 비활성화 + 폼 한 번만 전송
	(function(){
		const form = document.getElementById('loginForm');
		const btn  = document.getElementById('btnSignIn');
		if (!form || !btn) return;

		let submitted = false;
		form.addEventListener('submit', function(e) {
		if (submitted) {
			e.preventDefault(); // 두 번째 제출 차단
			return false;
		}
		submitted = true;
		btn.disabled = true;
		btn.classList.add('disabled');
		});
	})();
	</script>

	<!-- 하단 한 번만 로딩 -->
	<script src="{% static 'control/js/settings.js' %}"></script>
	<script src="{% static 'control/js/app.js' %}"></script>

</body>

</html>
