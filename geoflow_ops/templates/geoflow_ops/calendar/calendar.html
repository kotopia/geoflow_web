{% extends "geoflow_ops/base_tenant.html" %}
{% load static %}
{% block title %}캘린더 | GeoFlow{% endblock %}
{% block content %}
<div class="mb-3 d-flex justify-content-between align-items-center gap-3 flex-wrap">
  <div><h1 class="h3 mb-1">캘린더</h1><div class="text-muted">이벤트에서 <strong>캘린더에 추가</strong>한 일정만 표시합니다.</div></div>
</div>
<div class="card"><div class="card-body"><div id="geoflow-calendar"></div></div></div>
{% endblock %}
{% block scripts %}
{{ block.super }}
<script src="{% static 'control/js/fullcalendar.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var el=document.getElementById('geoflow-calendar'); if(!el)return;
  if(!window.FullCalendar || !window.FullCalendar.Calendar){el.innerHTML='<div class="alert alert-warning mb-0">캘린더 모듈을 불러올 수 없습니다.</div>';return;}
  var calendar=new FullCalendar.Calendar(el,{initialView:'dayGridMonth',locale:'ko',height:'auto',headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,listMonth'},buttonText:{today:'오늘',month:'월',list:'목록'},events:'{% url "tenant:calendar_events" %}',eventClick:function(info){if(info.event.url){info.jsEvent.preventDefault();window.location.href=info.event.url;}}});
  calendar.render();
});
</script>
{% endblock %}
