{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Dashboard | GeoFlow</title>
        <link rel="shortcut icon" href="{% static 'control/img/icons/icon-48x48.png' %}" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
        <link class="js-stylesheet" href="{% static 'control/css/light.css' %}" rel="stylesheet">
        <script src="{% static 'control/js/settings.js' %}"></script>
    </head>

<nav class="navbar navbar-expand navbar-light navbar-bg">
    <a class="sidebar-toggle js-sidebar-toggle">
        <i class="hamburger align-self-center"></i>
    </a>

    <div class="navbar-collapse collapse">
        <ul class="navbar-nav navbar-align">
            <li class="nav-item dropdown">
                <a class="nav-icon dropdown-toggle" href="#" id="userDropdown" data-bs-toggle="dropdown">
                    <img id="gfTopbarAvatar" src="{% static 'control/img/avatars/avatar.jpg' %}" class="avatar img-fluid rounded me-1" alt="User" {% if avatar_attachment_id %}data-avatar-id="{{ avatar_attachment_id }}"{% endif %} />
                    <span class="text-dark">{{ request.session.user_id }}</span>
                </a>
                <div class="dropdown-menu dropdown-menu-end">
                    <a class="dropdown-item" href="{% url 'control:account_password_change' %}">비밀번호 변경</a>
                    <form method="post" action="{% url 'control:logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item border-0 bg-transparent w-100 text-start">Logout</button>
                    </form>
                </div>
            </li>
        </ul>
    </div>
</nav>

<script>
(function () {
  var avatar = document.getElementById("gfTopbarAvatar");
  if (!avatar) return;

  var attachmentId = avatar.getAttribute("data-avatar-id");
  if (!attachmentId) return;

  fetch("/api/uploads/presign-get/" + encodeURIComponent(attachmentId) + "/?mode=inline", {
    method: "GET",
    credentials: "same-origin"
  })
    .then(function (res) {
      if (!res.ok) return null;
      return res.json();
    })
    .then(function (data) {
      if (data && data.presigned_url) {
        avatar.src = data.presigned_url;
      }
    })
    .catch(function () {
      // Keep the default avatar.
    });
})();
</script>
