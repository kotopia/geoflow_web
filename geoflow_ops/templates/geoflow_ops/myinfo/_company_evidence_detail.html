<section class="card"><div class="card-header"><h3 class="card-title mb-0">증빙파일</h3></div><div class="card-body pt-0">{% for link in detail_evidence %}<div class="company-file"><span class="badge bg-light text-dark">파일</span><div class="company-file-name">{{ link.attachment.original_name }}</div><button type="button" class="btn btn-outline-primary btn-sm btn-preview-att" data-att-id="{{ link.attachment_id }}">미리보기</button><button type="button" class="btn btn-outline-secondary btn-sm btn-download-att" data-att-id="{{ link.attachment_id }}">다운로드</button></div>{% empty %}<p class="company-empty">등록된 증빙파일이 없습니다.</p>{% endfor %}</div></section>
