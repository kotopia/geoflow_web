<form method="post" class="border rounded p-3 bg-light mt-3" data-history-form="education">
  {% csrf_token %}
  <input type="hidden" name="section" value="education">
  <input type="hidden" name="action" value="save">
  <input type="hidden" name="record_id" value="">
  <div class="row g-2">
    <div class="col-md-4"><label class="form-label small">학교명 *</label><input type="text" name="school_name" class="form-control form-control-sm" required></div>
    <div class="col-md-2"><label class="form-label small">학교구분</label><input type="text" name="school_type" class="form-control form-control-sm" placeholder="대학/대학원"></div>
    <div class="col-md-3"><label class="form-label small">학위</label><input type="text" name="degree" class="form-control form-control-sm"></div>
    <div class="col-md-3"><label class="form-label small">전공</label><input type="text" name="major" class="form-control form-control-sm"></div>
    <div class="col-md-3"><label class="form-label small">입학일</label><input type="date" name="admission_date" class="form-control form-control-sm"></div>
    <div class="col-md-3"><label class="form-label small">졸업일</label><input type="date" name="graduation_date" class="form-control form-control-sm"></div>
    <div class="col-md-3"><label class="form-label small">상태</label><input type="text" name="education_status" class="form-control form-control-sm" placeholder="졸업/재학/수료"></div>
    <div class="col-md-3"><label class="form-label small">비고</label><input type="text" name="note" class="form-control form-control-sm"></div>
  </div>
  <div class="text-end mt-2"><button type="submit" class="btn btn-primary btn-sm">학력 저장</button></div>
</form>
