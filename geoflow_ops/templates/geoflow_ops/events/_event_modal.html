<div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="eventModalLabel">이벤트 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="event-alert" class="alert alert-danger d-none"></div>

        <input type="hidden" id="event-scope-type-hidden" value="{{ scope_type }}">
        <input type="hidden" id="event-scope-id-hidden" value="{{ scope_id }}">
        <input type="hidden" id="event-id" value="">
        <!-- Internal history-integrity flag only. Users do not manage status. -->
        <input type="hidden" id="event-status" value="open">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">업무 단계</label>
            <select class="form-select" id="event-stage">
              <option value="pre_contract">계약전</option>
              <option value="contract">계약</option>
              <option value="kickoff">착수</option>
              <option value="execution">수행</option>
              <option value="inspection">검사</option>
              <option value="closeout">준공</option>
              <option value="billing">청구/정산</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">업무 유형</label>
            <select class="form-select" id="event-type">
              <option value="estimate">견적제출</option>
              <option value="contract_doc">계약체결</option>
              <option value="contract_change">계약변경</option>
              <option value="period_extension">기간연장</option>
              <option value="suspend">중지</option>
              <option value="resume">재개</option>
              <option value="contract_cancel">계약취소</option>
              <option value="kickoff">착수</option>
              <option value="kickoff_doc">착수계</option>
              <option value="progress_report">공정보고</option>
              <option value="inspection_request">검사요청</option>
              <option value="inspection">검사완료</option>
              <option value="correction_request">보완요청</option>
              <option value="reinspection">재검사</option>
              <option value="completion_doc">준공계 제출</option>
              <option value="delivery">납품완료</option>
              <option value="closeout_complete">완료</option>
              <option value="advance_payment">선금</option>
              <option value="progress_invoice">기성청구</option>
              <option value="invoice">청구</option>
              <option value="tax_invoice">세금계산서</option>
              <option value="payment">입금/지급완료</option>
              <option value="etc">기타</option>
            </select>
          </div>

          <div class="col-12">
            <div class="alert alert-light border small mb-0">
              업무단계 주요 이벤트: <strong>착수 → 진행</strong>, <strong>준공계 제출 → 준공</strong>, <strong>완료 → 준공 완료</strong>. 착수계·계약변경·기간연장·중지/재개·검사·청구/입금은 이력으로만 기록됩니다.
            </div>
          </div>

          <div class="col-md-8">
            <label class="form-label">제목</label>
            <input type="text" class="form-control" id="event-title" placeholder="(선택)">
          </div>
          <div class="col-md-4">
            <label class="form-label">발생일</label>
            <input type="date" class="form-control" id="event-occurred-at">
          </div>

          <div class="col-md-6">
            <label class="form-label">담당 부서</label>
            <select class="form-select" id="event-owner-department">
              <option value="">미지정</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">담당자</label>
            <select class="form-select" id="event-assignee-employee">
              <option value="">미지정</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">완료 예정일</label>
            <input type="date" class="form-control" id="event-due-at">
          </div>
          <div class="col-md-6 d-flex align-items-end">
            <div class="text-muted small pb-2" id="event-assignment-help">부서/담당자 배정은 디렉터리 조회 권한이 있을 때 사용할 수 있습니다.</div>
          </div>

          <div class="col-12">
            <label class="form-label">메모</label>
            <textarea class="form-control" id="event-memo" rows="4"></textarea>
          </div>

          <div class="col-md-6">
            <label class="small text-muted">Scope Type</label>
            <input type="text" class="form-control" id="event-scope-type" disabled>
          </div>
          <div class="col-md-6">
            <label class="small text-muted">Scope ID</label>
            <input type="text" class="form-control" id="event-scope-id" disabled>
          </div>

          <div class="col-md-6">
            <label class="small text-muted">생성일</label>
            <input type="text" class="form-control" id="event-created-at" disabled>
          </div>
          <div class="col-md-6">
            <label class="small text-muted">생성자</label>
            <input type="text" class="form-control" id="event-created-by" disabled>
          </div>
        </div>

        <hr>

        <div id="event-attach-section" class="d-none">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>첨부</strong>
            <button type="button" class="btn btn-sm btn-outline-primary" id="btn-timeline-attach">
              <i class="fas fa-paperclip"></i> 파일 선택
            </button>
          </div>
          <div id="event-attachment-list" class="small"></div>
          <div class="text-muted small mt-2">이벤트를 저장한 뒤 첨부 업로드가 활성화됩니다.</div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-danger me-auto d-none" id="btn-delete-event-modal">취소 처리</button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">닫기</button>
        <button type="button" class="btn btn-primary" id="btn-save-event">저장</button>
      </div>
    </div>
  </div>
</div>
