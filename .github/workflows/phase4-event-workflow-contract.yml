name: Phase 4 event workflow contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
  push:
    branches:
      - release/stabilized-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase4-event-workflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-phase4-event-workflow-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: geoflow.co.kr
      DJANGO_CSRF_TRUSTED_ORIGINS: https://geoflow.co.kr
      CENTRAL_DB_NAME: ci-central
      CENTRAL_DB_USER: ci-central-user
      CENTRAL_DB_PASSWORD: ci-nonsecret-placeholder
      CENTRAL_DB_HOST: central.example.internal
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant
      TENANT_DB_USER: ci-tenant-user
      TENANT_DB_PASSWORD: ci-nonsecret-placeholder
      TENANT_DB_HOST: tenant.example.internal
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"
      TENANT_DB_REQUIRE_SECRET_REFERENCES: "1"
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET: geoflow-ci-nonexistent

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install exact Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      # The repository has pre-existing migration-state drift outside this Phase 4
      # scope. The release migration-rehearsal job applies the complete graph to
      # disposable Postgres/PostGIS. Keep this contract focused on the current
      # event/workboard/task-execution boundary.
      - name: Compile Phase 4 workflow modules
        run: |
          python -m py_compile \
            geoflow_ops/process_workflow.py \
            geoflow_ops/event_security_views.py \
            geoflow_ops/views_events.py \
            geoflow_ops/views_workboard.py \
            geoflow_ops/views_execution.py \
            geoflow_ops/views_dashboard.py \
            geoflow_ops/views_home_security.py \
            geoflow_ops/services/entity_access.py \
            geoflow_ops/services/tenant_settings.py \
            geoflow_ops/migrations/0019_phase4_event_workflow_foundation.py \
            geoflow_ops/migrations/0020_phase4_project_task_execution.py \
            geoflow_ops/migrations/0023_phase4_configurable_workflow_foundation.py
          node --check geoflow_ops/static/geoflow_ops/js/process-events-ui.js
          node --check geoflow_ops/static/geoflow_ops/js/process-workboard-ui.js

      - name: Run Phase 4 workflow regressions
        run: |
          python manage.py test \
            geoflow_ops.test_phase4_event_workflow_foundation \
            geoflow_ops.test_phase4_cross_department_workboard \
            geoflow_ops.test_phase4_contract_workboard_compat \
            geoflow_ops.test_phase4_task_execution_dashboard \
            geoflow_ops.test_phase4_event_production_audit_contract \
            geoflow_ops.test_phase4_event_production_activation_contract \
            geoflow_ops.test_event_api_security \
            geoflow_ops.test_event_upload_route_boundaries
