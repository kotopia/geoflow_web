name: Phase 2 proxy security staged activation

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Activate exactly one reviewed security stage
        required: true
        type: choice
        options:
          - trust-proxy
          - ssl-redirect
          - short-hsts
      confirm_activation:
        description: Type PHASE2_PROXY_ACTIVATE to confirm the selected stage
        required: true
        type: string
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"
        type: string

permissions:
  contents: read

jobs:
  proxy-security-staged-activation:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}
      STAGE: ${{ inputs.stage }}
      CONFIRM_ACTIVATION: ${{ inputs.confirm_activation }}
      BACKUP_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate reviewed branch and activation input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRM_ACTIVATION" = "PHASE2_PROXY_ACTIVATE" || { echo 'phase2_proxy_activation_blocker=confirmation_mismatch'; exit 2; }
          case "$STAGE" in
            trust-proxy|ssl-redirect|short-hsts) ;;
            *) echo 'phase2_proxy_activation_blocker=invalid_stage'; exit 2 ;;
          esac
          test -n "$SSH_HOST" || { echo 'phase2_proxy_activation_blocker=missing_ssh_host'; exit 2; }
          test -n "$SSH_USER" || { echo 'phase2_proxy_activation_blocker=missing_ssh_user'; exit 2; }
          test -n "$SSH_KEY" || { echo 'phase2_proxy_activation_blocker=missing_ssh_key'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'phase2_proxy_activation_blocker=missing_known_hosts'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'phase2_proxy_activation_blocker=invalid_ssh_port'; exit 2; }

      - name: Verify public proxy boundary before mutation
        shell: bash
        run: |
          set -euo pipefail
          http_headers="$(mktemp)"
          trap 'rm -f "$http_headers"' EXIT
          http_code="$(curl --silent --show-error --output /dev/null --dump-header "$http_headers" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 http://geoflow.co.kr/)"
          case "$http_code" in
            301|302|307|308) ;;
            *) echo 'phase2_proxy_activation_blocker=http_not_redirecting_before_mutation'; exit 2 ;;
          esac
          grep -Eqi '^location:[[:space:]]*https://geoflow\.co\.kr(/|[[:space:]]*$)' "$http_headers" || {
            echo 'phase2_proxy_activation_blocker=http_redirect_not_canonical_https_before_mutation'
            exit 2
          }
          https_code="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://geoflow.co.kr/login/)"
          case "$https_code" in
            2??|3??) ;;
            *) echo 'phase2_proxy_activation_blocker=https_login_unhealthy_before_mutation'; exit 2 ;;
          esac
          echo 'phase2_proxy_activation_public_precheck=yes'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Apply one guarded stage and retain rollback backup
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
            "STAGE='$STAGE' BACKUP_TOKEN='$BACKUP_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          service='geoflow-stabilized.service'
          expected_settings_blob='899e21668f2e0549f7064d229c7fbb25150d24c9'
          expected_proxy_settings_blob='b4e4565d2cc21b1c848f936e0e0efb944776c0f1'
          fail() { echo "phase2_proxy_activation_blocker=$1"; exit 2; }

          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'
          command -v nginx >/dev/null 2>&1 || fail 'nginx_command_missing'
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'service_not_running_before_mutation'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'runtime_repo_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'runtime_python_missing'
          [ "$(git -C "$repo" hash-object geoflow_project/settings.py)" = "$expected_settings_blob" ] || fail 'runtime_settings_not_reviewed'
          [ "$(git -C "$repo" hash-object geoflow_project/proxy_security_settings.py)" = "$expected_proxy_settings_blob" ] || fail 'runtime_proxy_settings_not_reviewed'

          service_environment="$(systemctl show "$service" -p Environment --value 2>/dev/null || true)"
          if printf '%s' "$service_environment" | grep -Eq '(^|[[:space:]"])(DJANGO_TRUST_X_FORWARDED_PROTO|DJANGO_SECURE_SSL_REDIRECT|DJANGO_SECURE_HSTS_SECONDS|DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS|DJANGO_SECURE_HSTS_PRELOAD)='; then
            unset service_environment
            fail 'systemd_direct_proxy_security_override_present'
          fi
          unset service_environment

          nginx_dump="$(mktemp)"
          trap 'rm -f "$nginx_dump"' EXIT
          sudo -n nginx -T >"$nginx_dump" 2>/dev/null || fail 'nginx_config_read_failed'
          grep -Eqi 'proxy_set_header[[:space:]]+X-Forwarded-Proto[[:space:]]+(\$scheme|https)[[:space:]]*;' "$nginx_dump" || fail 'forwarded_proto_not_proven'
          rm -f "$nginx_dump"
          trap - EXIT
          echo 'phase2_proxy_activation_forwarded_proto_precheck=yes'

          cd "$repo"
          current="$($python - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'geoflow_project.settings')
          import django
          django.setup()
          from django.conf import settings
          proxy = '1' if settings.SECURE_PROXY_SSL_HEADER == ('HTTP_X_FORWARDED_PROTO', 'https') else '0'
          redirect = '1' if settings.SECURE_SSL_REDIRECT is True else '0'
          hsts = int(settings.SECURE_HSTS_SECONDS or 0)
          include = '1' if settings.SECURE_HSTS_INCLUDE_SUBDOMAINS is True else '0'
          preload = '1' if settings.SECURE_HSTS_PRELOAD is True else '0'
          print(f'{proxy},{redirect},{hsts},{include},{preload}')
          PY
          )"
          case "$STAGE:$current" in
            trust-proxy:0,0,0,0,0) ;;
            ssl-redirect:1,0,0,0,0) ;;
            short-hsts:1,1,0,0,0) ;;
            *) fail 'stage_precondition_not_met' ;;
          esac
          echo 'phase2_proxy_activation_stage_precondition=yes'

          backup="/tmp/geoflow-phase2-proxy-${BACKUP_TOKEN}.env"
          [ ! -e "$backup" ] || fail 'rollback_backup_already_exists'
          cp -p "$repo/.env" "$backup"
          chmod 600 "$backup"
          mutation_started=0
          rollback_local() {
            set +e
            if [ "$mutation_started" -eq 1 ] && [ -f "$backup" ]; then
              cp -p "$backup" "$repo/.env"
              sudo -n systemctl restart "$service" >/dev/null 2>&1 || true
              sleep 2
            fi
            rm -f "$backup"
            echo 'phase2_proxy_activation_rollback_completed=yes'
          }
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then rollback_local; fi
            exit "$rc"
          }
          trap on_exit EXIT

          mutation_started=1
          "$python" - "$repo/.env" "$STAGE" <<'PY'
          import os
          import sys
          from pathlib import Path

          env_path = Path(sys.argv[1])
          stage = sys.argv[2]
          managed = {
              'DJANGO_TRUST_X_FORWARDED_PROTO',
              'DJANGO_SECURE_SSL_REDIRECT',
              'DJANGO_SECURE_HSTS_SECONDS',
              'DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS',
              'DJANGO_SECURE_HSTS_PRELOAD',
          }
          values = {
              'trust-proxy': ('1', '0', '0'),
              'ssl-redirect': ('1', '1', '0'),
              'short-hsts': ('1', '1', '300'),
          }[stage]
          trust, redirect, hsts = values
          desired = {
              'DJANGO_TRUST_X_FORWARDED_PROTO': trust,
              'DJANGO_SECURE_SSL_REDIRECT': redirect,
              'DJANGO_SECURE_HSTS_SECONDS': hsts,
              'DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS': '0',
              'DJANGO_SECURE_HSTS_PRELOAD': '0',
          }
          out = []
          for line in env_path.read_text().splitlines():
              stripped = line.lstrip()
              if stripped.startswith('#') or '=' not in line:
                  out.append(line)
                  continue
              if line.split('=', 1)[0].strip() not in managed:
                  out.append(line)
          for key in (
              'DJANGO_TRUST_X_FORWARDED_PROTO',
              'DJANGO_SECURE_SSL_REDIRECT',
              'DJANGO_SECURE_HSTS_SECONDS',
              'DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS',
              'DJANGO_SECURE_HSTS_PRELOAD',
          ):
              out.append(f'{key}={desired[key]}')
          tmp = env_path.with_name(env_path.name + '.phase2-proxy.tmp')
          tmp.write_text('\n'.join(out) + '\n')
          os.chmod(tmp, 0o600)
          os.replace(tmp, env_path)
          print('phase2_proxy_activation_runtime_env_updated=yes')
          PY

          "$python" manage.py check >/dev/null
          sudo -n systemctl restart "$service"
          sleep 3
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'service_not_running_after_mutation'

          resulting="$($python - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'geoflow_project.settings')
          import django
          django.setup()
          from django.conf import settings
          proxy = '1' if settings.SECURE_PROXY_SSL_HEADER == ('HTTP_X_FORWARDED_PROTO', 'https') else '0'
          redirect = '1' if settings.SECURE_SSL_REDIRECT is True else '0'
          hsts = int(settings.SECURE_HSTS_SECONDS or 0)
          include = '1' if settings.SECURE_HSTS_INCLUDE_SUBDOMAINS is True else '0'
          preload = '1' if settings.SECURE_HSTS_PRELOAD is True else '0'
          print(f'{proxy},{redirect},{hsts},{include},{preload}')
          PY
          )"
          case "$STAGE:$resulting" in
            trust-proxy:1,0,0,0,0) ;;
            ssl-redirect:1,1,0,0,0) ;;
            short-hsts:1,1,300,0,0) ;;
            *) fail 'runtime_settings_not_expected_after_mutation' ;;
          esac

          # Keep the backup for the runner-side public smoke. A later failure step can
          # still restore it even after this SSH session succeeds.
          mutation_started=0
          trap - EXIT
          echo "phase2_proxy_activation_stage=$STAGE"
          echo 'phase2_proxy_activation_remote_applied=yes'
          REMOTE

      - name: Verify public boundary after activation
        shell: bash
        run: |
          set -euo pipefail
          http_headers="$(mktemp)"
          https_headers="$(mktemp)"
          trap 'rm -f "$http_headers" "$https_headers"' EXIT
          http_code="$(curl --silent --show-error --output /dev/null --dump-header "$http_headers" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 http://geoflow.co.kr/)"
          case "$http_code" in
            301|302|307|308) ;;
            *) echo 'phase2_proxy_activation_blocker=http_not_redirecting_after_mutation'; exit 2 ;;
          esac
          grep -Eqi '^location:[[:space:]]*https://geoflow\.co\.kr(/|[[:space:]]*$)' "$http_headers" || {
            echo 'phase2_proxy_activation_blocker=http_redirect_not_canonical_https_after_mutation'; exit 2;
          }
          https_code="$(curl --proto '=https' --silent --show-error --output /dev/null --dump-header "$https_headers" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://geoflow.co.kr/login/)"
          case "$https_code" in
            2??|3??) ;;
            *) echo 'phase2_proxy_activation_blocker=https_login_unhealthy_after_mutation'; exit 2 ;;
          esac
          if [ "$STAGE" = short-hsts ]; then
            grep -Eqi '^strict-transport-security:[[:space:]]*max-age=300([;[:space:]]|$)' "$https_headers" || {
              echo 'phase2_proxy_activation_blocker=short_hsts_header_not_expected'; exit 2;
            }
          fi
          echo 'phase2_proxy_activation_public_postcheck=yes'

      - name: Finalize successful activation
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "BACKUP_TOKEN='$BACKUP_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          backup="/tmp/geoflow-phase2-proxy-${BACKUP_TOKEN}.env"
          [ -f "$backup" ] || { echo 'phase2_proxy_activation_blocker=rollback_backup_missing_at_finalize'; exit 2; }
          rm -f "$backup"
          echo 'phase2_proxy_security_staged_activation_complete=yes'
          REMOTE

      - name: Roll back if any post-mutation step failed
        if: failure()
        shell: bash
        run: |
          set +e
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "BACKUP_TOKEN='$BACKUP_TOKEN' bash -s" <<'REMOTE'
          set +e
          service='geoflow-stabilized.service'
          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          backup="/tmp/geoflow-phase2-proxy-${BACKUP_TOKEN}.env"
          if [ -n "$repo" ] && [ -f "$backup" ] && sudo -n true >/dev/null 2>&1; then
            cp -p "$backup" "$repo/.env"
            sudo -n systemctl restart "$service" >/dev/null 2>&1
            sleep 2
            rm -f "$backup"
            echo 'phase2_proxy_activation_rollback_completed=yes'
          else
            rm -f "$backup"
            echo 'phase2_proxy_activation_rollback_not_required_or_unavailable=yes'
          fi
          REMOTE