name: Cheonan contract project backfill contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
  push:
    branches:
      - release/stabilized-deploy

permissions:
  contents: read

jobs:
  cheonan-contract-project-backfill-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce guarded aggregate-only backfill contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest control.test_cheonan_contract_project_backfill_contract
