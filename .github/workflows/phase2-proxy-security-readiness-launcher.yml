name: Phase 2 proxy security readiness launcher

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase2-proxy-security-readiness-launcher.yml

permissions:
  contents: read

jobs:
  launch-reviewed-current-release:
    uses: ./.github/workflows/phase2-proxy-security-readiness-diagnostic.yml
    with:
      ssh_port: "22"
    secrets: inherit
