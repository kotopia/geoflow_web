name: Static tenant selection regression

on:
  push:
    branches:
      - release/stabilized-deploy
  pull_request:
    branches:
      - release/stabilized-deploy

permissions:
  contents: read

jobs:
  static-tenant-selection-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-static-tenant-selection-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcd
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,geoflow.co.kr
      CENTRAL_DB_NAME: ci-central
      CENTRAL_DB_USER: ci-central-user
      CENTRAL_DB_PASSWORD: ci-nonsecret-placeholder
      CENTRAL_DB_HOST: central.example.internal
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant
      TENANT_DB_USER: ci-tenant-user
      TENANT_DB_PASSWORD: ci-nonsecret-placeholder
      TENANT_DB_HOST: tenant.example.internal
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install exact Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run static tenant selection regressions
        run: |
          python manage.py test \
            control.test_static_tenant_alias_selection \
            control.test_tenant_connection_registration \
            control.test_phase2_dynamic_tenant_runtime
