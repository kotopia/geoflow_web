name: Static tenant selection regression

on:
  push:
    branches:
      - release/stabilized-deploy
  pull_request:
    branches:
      - release/stabilized-deploy

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  static-tenant-selection-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-static-tenant-selection-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcd
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,geoflow.co.kr
      CENTRAL_DB_NAME: ci-central
      CENTRAL_DB_USER: ci-central-user
      CENTRAL_DB_PASSWORD: ci-nonsecret-placeholder
      CENTRAL_DB_HOST: central.example.internal
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant
      TENANT_DB_USER: ci-tenant-user
      TENANT_DB_PASSWORD: ci-nonsecret-placeholder
      TENANT_DB_HOST: tenant.example.internal
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install exact Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run static tenant selection regressions
        run: |
          python manage.py test \
            control.test_static_tenant_alias_selection \
            control.test_tenant_connection_registration \
            control.test_phase2_dynamic_tenant_runtime \
            control.test_tenant_selection_live_revalidation

      - name: Report owner-approved direct dispatch start
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phase4-direct-dispatch]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/158/comments" -f body="phase4_direct_dispatch_started run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA}" >/dev/null

      - name: Dispatch pinned Phase 4 activation from main
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phase4-direct-dispatch]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"report_issue":"158"}}'
          if printf '%s' "$payload" | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --input - "/repos/${GITHUB_REPOSITORY}/actions/workflows/phase4-owner-approved-breakglass-main.yml/dispatches"; then
            gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/158/comments" -f body="phase4_direct_dispatch_dispatched run_id=${GITHUB_RUN_ID}" >/dev/null
          else
            rc=$?
            gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/158/comments" -f body="phase4_direct_dispatch_failed run_id=${GITHUB_RUN_ID} exit_code=${rc}" >/dev/null || true
            exit "$rc"
          fi

      - name: Report exact pending-production approval dispatch start
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phase4-approve-pending]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/158/comments" -f body="phase4_pending_approver_dispatch_started dispatcher_run_id=${GITHUB_RUN_ID} target_release_sha=4be43c6bce382a2193e19d0537e291a84bedbc6f" >/dev/null

      - name: Dispatch exact pending-production approver from main
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phase4-approve-pending]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"expected_release_sha":"4be43c6bce382a2193e19d0537e291a84bedbc6f","report_issue":"158"}}'
          if printf '%s' "$payload" | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' --input - "/repos/${GITHUB_REPOSITORY}/actions/workflows/phase4-production-pending-deployment-approver.yml/dispatches"; then
            gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/158/comments" -f body="phase4_pending_approver_dispatched dispatcher_run_id=${GITHUB_RUN_ID} target_release_sha=4be43c6bce382a2193e19d0537e291a84bedbc6f" >/dev/null
          else
            rc=$?
            gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/158/comments" -f body="phase4_pending_approver_dispatch_failed dispatcher_run_id=${GITHUB_RUN_ID} target_release_sha=4be43c6bce382a2193e19d0537e291a84bedbc6f exit_code=${rc}" >/dev/null || true
            exit "$rc"
          fi
