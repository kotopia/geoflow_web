name: Phase 1 application deploy contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-application-deploy.yml
      - control/test_phase1_application_deploy_exact_sha_contract.py
      - .github/workflows/phase1-application-deploy-contract.yml
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-application-deploy.yml
      - control/test_phase1_application_deploy_exact_sha_contract.py
      - .github/workflows/phase1-application-deploy-contract.yml

permissions:
  contents: read

jobs:
  phase1-application-deploy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate protected exact-SHA deploy contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest control.test_phase1_application_deploy_exact_sha_contract
