name: Cheonan central metadata remediation

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/cheonan-central-metadata-remediation.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"
        type: string

permissions:
  contents: read

jobs:
  remediate-cheonan-metadata:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/stabilized-deploy
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Guarded Cheonan central metadata remediation
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          service='geoflow-stabilized.service'
          [ "$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)" = active ] || {
            echo 'cheonan_remediation_blocker=stabilized_service_not_active'
            exit 2
          }
          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || { echo 'cheonan_remediation_blocker=runtime_python_missing'; exit 2; }

          "$python" - "$repo" <<'PY'
          import hmac
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import psycopg2
          from django.conf import settings
          from django.db import connections, transaction

          from control.services.tenant_db_secret_resolver import resolve_tenant_db_password

          TARGET_ALIAS = "cheonan_db"

          def text(value):
              return str(value or "").strip()

          def require(condition, code):
              if not condition:
                  raise RuntimeError(code)

          def connect_ok(name, user, password, host, port):
              try:
                  conn = psycopg2.connect(
                      dbname=name,
                      user=user,
                      password=password,
                      host=host,
                      port=port,
                      sslmode="require",
                      connect_timeout=8,
                  )
                  try:
                      with conn.cursor() as cur:
                          cur.execute("SELECT 1")
                          return cur.fetchone() == (1,)
                  finally:
                      conn.close()
              except Exception:
                  return False

          static = settings.DATABASES.get(TARGET_ALIAS)
          require(isinstance(static, dict), "static_alias_missing")
          static_values = (
              static.get("NAME"), static.get("HOST"), static.get("PORT"),
              static.get("USER"), static.get("PASSWORD"),
          )
          require(all(text(value) for value in static_values), "static_config_incomplete")
          require(connect_ok(
              static.get("NAME"), static.get("USER"), static.get("PASSWORD"),
              static.get("HOST"), static.get("PORT"),
          ), "static_alias_not_connectable")

          with transaction.atomic(using="default"):
              with connections["default"].cursor() as cur:
                  cur.execute(
                      """
                      SELECT c.group_id::text, g.status, c.db_name, c.db_host,
                             c.db_port, c.db_user, c.db_password
                        FROM group_db_config c
                        JOIN groups g ON g.id = c.group_id
                       WHERE c.db_alias = %s
                       FOR UPDATE OF c, g
                      """,
                      [TARGET_ALIAS],
                  )
                  rows = cur.fetchall()
                  require(len(rows) == 1, "expected_single_cheonan_config")
                  group_id, group_status, db_name, db_host, db_port, db_user, stored_password = rows[0]

                  require(text(group_status).lower() != "active", "group_already_active_unexpected")
                  require(text(db_host).lower() == text(static.get("HOST")).lower(), "host_mismatch_unexpected")
                  require(text(db_port) == text(static.get("PORT")), "port_mismatch_unexpected")

                  resolved_password = resolve_tenant_db_password(stored_password)
                  require(bool(resolved_password), "stored_password_unresolvable")
                  require(hmac.compare_digest(resolved_password, text(static.get("PASSWORD"))), "stored_password_not_static_match")

                  cur.execute(
                      """
                      SELECT COUNT(*) FILTER (WHERE ugm.status='active'),
                             COUNT(*) FILTER (
                                 WHERE ugm.status='active'
                                   AND u.is_active=TRUE
                                   AND u.email_verified=TRUE
                             )
                        FROM user_group_map ugm
                        JOIN users u ON u.id=ugm.user_id
                       WHERE ugm.group_id=%s
                      """,
                      [group_id],
                  )
                  active_memberships, serving_memberships = cur.fetchone()
                  require(int(active_memberships) > 0, "no_active_membership")
                  require(int(serving_memberships) > 0, "no_active_verified_membership")

                  cur.execute(
                      """
                      SELECT COUNT(*)
                        FROM (
                          SELECT r.id
                            FROM user_group_map ugm
                            JOIN roles r ON r.id=ugm.role_id
                            LEFT JOIN role_permissions rp ON rp.role_id=r.id
                           WHERE ugm.group_id=%s
                             AND ugm.status='active'
                           GROUP BY r.id
                          HAVING COUNT(rp.permission_id)=0
                        ) permissionless
                      """,
                      [group_id],
                  )
                  require(int(cur.fetchone()[0]) == 0, "permissionless_active_role")

                  require(
                      text(db_name) != text(static.get("NAME"))
                      or text(db_user) != text(static.get("USER")),
                      "metadata_mismatch_not_present",
                  )

                  cur.execute(
                      "UPDATE groups SET status='active', updated_at=now() WHERE id=%s",
                      [group_id],
                  )
                  require(cur.rowcount == 1, "group_update_failed")

                  cur.execute(
                      """
                      UPDATE group_db_config
                         SET db_name=%s,
                             db_host=%s,
                             db_port=%s,
                             db_user=%s
                       WHERE group_id=%s AND db_alias=%s
                      """,
                      [
                          static.get("NAME"), static.get("HOST"), static.get("PORT"),
                          static.get("USER"), group_id, TARGET_ALIAS,
                      ],
                  )
                  require(cur.rowcount == 1, "config_update_failed")

                  require(connect_ok(
                      static.get("NAME"), static.get("USER"), resolved_password,
                      static.get("HOST"), static.get("PORT"),
                  ), "remediated_config_not_connectable")

          with connections["default"].cursor() as cur:
              cur.execute(
                  """
                  SELECT lower(COALESCE(g.status,''))='active',
                         c.db_name=%s, lower(c.db_host)=lower(%s),
                         c.db_port::text=%s, c.db_user=%s
                    FROM group_db_config c
                    JOIN groups g ON g.id=c.group_id
                   WHERE c.db_alias=%s
                  """,
                  [
                      static.get("NAME"), static.get("HOST"), text(static.get("PORT")),
                      static.get("USER"), TARGET_ALIAS,
                  ],
              )
              verified = cur.fetchone()
          require(bool(verified and all(verified)), "post_commit_metadata_verification_failed")

          print("cheonan_remediation_group_active=yes")
          print("cheonan_remediation_metadata_matches_static=yes")
          print("cheonan_remediation_password_preserved=yes")
          print("cheonan_remediation_connection_verified=yes")
          print("cheonan_central_metadata_remediation_complete=yes")
          PY
          REMOTE
