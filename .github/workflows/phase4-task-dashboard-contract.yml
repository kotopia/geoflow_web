name: Phase 4 task dashboard contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
  push:
    branches:
      - release/stabilized-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-dashboard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-phase4-task-dashboard-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: geoflow.co.kr
      DJANGO_CSRF_TRUSTED_ORIGINS: https://geoflow.co.kr
      CENTRAL_DB_NAME: ci-central
      CENTRAL_DB_USER: ci-central-user
      CENTRAL_DB_PASSWORD: ci-nonsecret-placeholder
      CENTRAL_DB_HOST: central.example.internal
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant
      TENANT_DB_USER: ci-tenant-user
      TENANT_DB_PASSWORD: ci-nonsecret-placeholder
      TENANT_DB_HOST: tenant.example.internal
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"
      TENANT_DB_REQUIRE_SECRET_REFERENCES: "1"
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET: geoflow-ci-nonexistent

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GeoDjango system libraries
        run: |
          bash scripts/ci/use_ubuntu_https_mirrors.sh
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev fonts-noto-cjk

      - name: Install exact Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile task dashboard boundary
        run: |
          python -m py_compile \
            geoflow_ops/views_execution.py \
            geoflow_ops/views_dashboard.py \
            geoflow_ops/views_home_security.py \
            geoflow_ops/security_views.py \
            geoflow_ops/migrations/0020_phase4_project_task_execution.py

      - name: Run task dashboard regressions
        run: |
          python manage.py test \
            geoflow_ops.test_admin_overview \
            geoflow_ops.test_phase4_task_execution_dashboard \
            geoflow_ops.test_tenant_route_authorization_contract

      - name: Render actual AdminKit templates and verify responsive calendar
        env:
          CHROME_CHANNEL: chrome
        run: |
          python scripts/ci/render_admin_overview.py
          npm install --prefix /tmp/overview-browser --no-save playwright@1.55.0
          NODE_PATH=/tmp/overview-browser/node_modules node scripts/ci/test_admin_overview_browser.cjs

      - name: Verify shared compact layout and sidebar navigation
        env:
          CHROME_CHANNEL: chrome
        run: |
          python scripts/ci/render_compact_layout.py
          NODE_PATH=/tmp/overview-browser/node_modules node scripts/ci/test_compact_layout_browser.cjs

      - name: Upload compact layout browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-layout-screenshots
          path: artifacts/compact-layout/*.png
          if-no-files-found: error

      - name: Upload dashboard browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-overview-screenshots
          path: artifacts/admin-overview/*.png
          if-no-files-found: error
