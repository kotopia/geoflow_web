name: Central bid collection tests
on:
  pull_request:
    paths:
      - 'procurement/**'
      - 'scripts/ci/render_bid_detail.py'
      - 'scripts/ci/test_bid_detail_browser.cjs'
      - 'geoflow_ops/bids/**'
      - 'geoflow_ops/migrations/0037_central_bid_reviews.py'
      - 'geoflow_ops/migrations/0038_bid_central_preferences.py'
      - 'geoflow_ops/migrations/0051_bid_personal_state.py'
      - 'geoflow_ops/migrations/0052_merge_bid_personal_state.py'
      - 'geoflow_ops/migrations/0053_bid_company_search_profiles.py'
      - 'geoflow_ops/migrations/0054_merge_bid_company_search.py'
      - 'geoflow_ops/urls.py'
      - 'geoflow_ops/templates/geoflow_ops/bids/**'
      - 'geoflow_project/settings.py'
      - 'control/db_router.py'
      - 'control/urls.py'
      - 'control/templates/control/partials/sidebar.html'
      - '.github/workflows/central-bids-tests.yml'
      - '.github/workflows/central-bids-live-diagnostic.yml'
      - 'scripts/probe_central_g2b.py'
      - '.github/workflows/production-release-deploy-v2.yml'
      - 'deploy/bids/**'
      - 'scripts/deploy/render_bid_collector_units.py'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: procurement_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PROCUREMENT_TEST_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Django==5.2.16 psycopg2-binary
      - run: python -m django test procurement --settings=procurement.test_settings
      - run: python -m django makemigrations procurement --check --dry-run --settings=procurement.test_settings

      - name: Render and exercise AdminKit bid detail
        env:
          CHROME_CHANNEL: chrome
        run: |
          python scripts/ci/render_bid_detail.py
          npm install --prefix /tmp/bid-detail-browser --no-save playwright@1.55.0
          NODE_PATH=/tmp/bid-detail-browser/node_modules node scripts/ci/test_bid_detail_browser.cjs
      - name: Upload bid detail screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bid-detail-screenshots
          path: artifacts/bid-detail/*.png
          if-no-files-found: ignore
