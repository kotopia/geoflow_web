name: Phase 4 event handoff production activation

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase4-event-handoff-production-activation.yml
      - geoflow_ops/migrations/0024_phase4_event_handoff_and_contract_access.py
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  event-handoff-production-activation:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'event_handoff_activation_blocker=release_advanced'
            exit 2
          }
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || {
            echo 'event_handoff_activation_blocker=invalid_ssh_port'
            exit 2
          }
          echo 'event_handoff_activation_exact_release=yes'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Apply 0024 event handoff migration and deploy exact release
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          candidate_sha="$1"
          service='geoflow-stabilized.service'
          expected_branch='release/stabilized-deploy'
          migration_path='geoflow_ops/migrations/0024_phase4_event_handoff_and_contract_access.py'

          fail() {
            echo "event_handoff_activation_blocker=$1"
            exit 2
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'stabilized_service_not_running_before_activation'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/requirements.txt" ] || fail 'requirements_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'

          origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
          case "$origin" in
            https://github.com/kotopia/geoflow_web|https://github.com/kotopia/geoflow_web.git|git@github.com:kotopia/geoflow_web.git) ;;
            *) fail 'unexpected_repository_origin' ;;
          esac

          dirty_count="$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')"
          [ "$dirty_count" = '0' ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'
          [ -x "$repo/.venv/bin/gunicorn" ] || fail 'stabilized_gunicorn_missing'

          exec_raw="$(systemctl show "$service" -p ExecStart --value 2>/dev/null || true)"
          printf '%s' "$exec_raw" | grep -Fq "$repo/.venv/bin/gunicorn" || fail 'service_exec_not_stabilized_venv'
          printf '%s' "$exec_raw" | grep -Fq 'geoflow_project.wsgi:application' || fail 'service_wsgi_target_unexpected'

          before_code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/login/ || true)"
          case "$before_code" in
            2??|3??) ;;
            *) fail 'local_login_unhealthy_before_activation' ;;
          esac

          previous_sha="$(git -C "$repo" rev-parse HEAD)"
          previous_branch="$(git -C "$repo" symbolic-ref --short -q HEAD || true)"
          echo "event_handoff_activation_previous_sha=$previous_sha"
          echo "event_handoff_activation_candidate_sha=$candidate_sha"

          git -C "$repo" fetch --prune origin refs/heads/release/stabilized-deploy
          fetched_sha="$(git -C "$repo" rev-parse FETCH_HEAD)"
          [ "$fetched_sha" = "$candidate_sha" ] || fail 'candidate_sha_not_current_release_head'
          git -C "$repo" cat-file -e "$candidate_sha:$migration_path" || fail 'candidate_migration_missing'

          "$python" - "$repo" "$candidate_sha" "$migration_path" <<'PY'
          from collections import Counter
          import os
          import subprocess
          import sys
          import types

          repo, candidate_sha, migration_path = sys.argv[1:4]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import psycopg2
          from django.db import connections, transaction

          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          APP = "webgisapp"
          DEPENDENCY = "0023_phase4_configurable_workflow_foundation"
          MIGRATION = "0024_phase4_event_handoff_and_contract_access"
          BASE_RELATIONS = {
              "ctr.contracts",
              "prj.projects",
              "prj.project_members",
              "hr.employee_profile",
              "hr.departments",
              "ops.attachments",
              "ops.process_events",
              "ops.settings_nodes",
              "ops.my_org_units",
          }
          SEED_DEPARTMENTS = ("관리부", "GIS사업부", "지적사업부")

          def text(value):
              return str(value or "").strip()

          def scalar(cur, sql, params=None):
              cur.execute(sql, params or [])
              row = cur.fetchone()
              return row[0] if row else None

          def relation_exists(cur, relation):
              return bool(scalar(cur, "SELECT to_regclass(%s) IS NOT NULL", [relation]))

          def row_counts(cur):
              return {
                  "contracts": int(scalar(cur, "SELECT COUNT(*) FROM ctr.contracts")),
                  "projects": int(scalar(cur, "SELECT COUNT(*) FROM prj.projects")),
                  "members": int(scalar(cur, "SELECT COUNT(*) FROM prj.project_members")),
                  "employees": int(scalar(cur, "SELECT COUNT(*) FROM hr.employee_profile")),
                  "attachments": int(scalar(cur, "SELECT COUNT(*) FROM ops.attachments")),
                  "events": int(scalar(cur, "SELECT COUNT(*) FROM ops.process_events")),
                  "settings": int(scalar(cur, "SELECT COUNT(*) FROM ops.settings_nodes")),
                  "departments": int(scalar(cur, "SELECT COUNT(*) FROM hr.departments")),
              }

          def event_digest(cur):
              cur.execute(
                  """
                  SELECT md5(COALESCE(string_agg(
                      id::text || '|' || COALESCE(scope_type,'') || '|' || scope_id::text || '|' ||
                      COALESCE(stage,'') || '|' || COALESCE(event_type,'') || '|' || COALESCE(status,'') || '|' ||
                      COALESCE(title,'') || '|' || COALESCE(memo,'') || '|' || COALESCE(payload::text,''),
                      E'\n' ORDER BY id::text
                  ), ''))
                    FROM ops.process_events
                  """
              )
              return cur.fetchone()[0]

          def department_snapshot(cur):
              cur.execute(
                  """
                  SELECT id::text, org_unit_id::text, name, active,
                         created_at::text, updated_at::text
                    FROM hr.departments
                   ORDER BY id::text
                  """
              )
              return tuple(cur.fetchall())

          source = subprocess.check_output(
              ["git", "-C", repo, "show", f"{candidate_sha}:{migration_path}"],
              text=True,
          )
          lowered = source.lower()
          for forbidden in (
              "delete from ctr.contracts",
              "truncate ctr.contracts",
              "drop table ctr.contracts",
              "delete from prj.projects",
              "truncate prj.projects",
              "drop table prj.projects",
              "delete from prj.project_members",
              "delete from hr.employee_profile",
              "truncate hr.employee_profile",
              "delete from ops.attachments",
              "delete from ops.process_events",
              "truncate ops.process_events",
              "delete from ops.settings_nodes",
              "truncate ops.settings_nodes",
              "delete from hr.departments",
              "truncate hr.departments",
              "drop table hr.departments",
          ):
              if forbidden in lowered:
                  raise SystemExit("event_handoff_activation_blocker=destructive_candidate_migration")

          module = types.ModuleType("candidate_0024")
          exec(compile(source, migration_path, "exec"), module.__dict__)
          operations = list(module.Migration.operations)
          if len(operations) != 1 or not hasattr(operations[0], "sql"):
              raise SystemExit("event_handoff_activation_blocker=unexpected_migration_shape")
          migration_sql = operations[0].sql
          if not isinstance(migration_sql, str) or not migration_sql.strip():
              raise SystemExit("event_handoff_activation_blocker=migration_sql_missing")

          with transaction.atomic(using="default"):
              with connections["default"].cursor() as central_cur:
                  central_cur.execute("SET LOCAL TRANSACTION READ ONLY")
                  rows = list(
                      GroupDBConfig.objects.using("default")
                      .select_related("group")
                      .order_by("group_id")
                  )

          active_rows = [row for row in rows if text(getattr(row.group, "status", "")).lower() == "active"]
          totals = Counter()
          totals["configs"] = len(rows)
          totals["active_tenants"] = len(active_rows)

          for row in active_rows:
              raw = text(row.db_password)
              try:
                  password = resolve_tenant_db_password(raw) if is_tenant_db_secret_reference(raw) else raw
              except Exception:
                  totals["secret_resolution_failed"] += 1
                  continue
              if not password:
                  totals["secret_resolution_failed"] += 1
                  continue

              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=row.db_host,
                      port=row.db_port,
                      sslmode="require",
                      connect_timeout=8,
                  )
              except Exception:
                  totals["connection_failed"] += 1
                  continue

              try:
                  conn.autocommit = False
                  with conn.cursor() as cur:
                      cur.execute("SET LOCAL lock_timeout = '5s'")
                      cur.execute("SET LOCAL statement_timeout = '90s'")
                      cur.execute("SELECT pg_advisory_xact_lock(hashtext(%s))", ["geoflow:webgisapp:0024"])

                      present = {relation: relation_exists(cur, relation) for relation in BASE_RELATIONS}
                      if not any(present.values()):
                          conn.rollback()
                          totals["schema_absent_skipped"] += 1
                          continue
                      if not all(present.values()):
                          raise RuntimeError("partial tenant event-handoff schema cannot be skipped")

                      dependency_applied = bool(scalar(
                          cur,
                          "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                          [APP, DEPENDENCY],
                      ))
                      if not dependency_applied:
                          raise RuntimeError("0023 dependency not applied")

                      already_applied = bool(scalar(
                          cur,
                          "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                          [APP, MIGRATION],
                      ))

                      before = row_counts(cur)
                      event_digest_before = event_digest(cur)
                      cur.execute("SELECT status, COUNT(*) FROM ctr.contracts GROUP BY status ORDER BY status")
                      contract_statuses_before = tuple(cur.fetchall())
                      departments_before = department_snapshot(cur)
                      access_exists_before = relation_exists(cur, "ops.contract_document_access_requests")
                      access_rows_before = (
                          int(scalar(cur, "SELECT COUNT(*) FROM ops.contract_document_access_requests"))
                          if access_exists_before else 0
                      )
                      cur.execute(
                          """
                          SELECT COUNT(*)
                            FROM ops.my_org_units ou
                            CROSS JOIN (VALUES ('관리부'),('GIS사업부'),('지적사업부')) seed(name)
                           WHERE NOT EXISTS (
                               SELECT 1 FROM hr.departments d
                                WHERE d.org_unit_id=ou.id AND btrim(d.name)=seed.name
                           )
                          """
                      )
                      missing_seed_count = int(cur.fetchone()[0])

                      if not already_applied:
                          cur.execute(migration_sql)
                          cur.execute(
                              """
                              INSERT INTO django_migrations (app, name, applied)
                              SELECT %s, %s, NOW()
                               WHERE NOT EXISTS (
                                   SELECT 1 FROM django_migrations WHERE app=%s AND name=%s
                               )
                              """,
                              [APP, MIGRATION, APP, MIGRATION],
                          )

                      after = row_counts(cur)
                      for key in ("contracts", "projects", "members", "employees", "attachments", "events", "settings"):
                          if after[key] != before[key]:
                              raise RuntimeError(f"{key} row count changed")

                      expected_department_count = before["departments"] if already_applied else before["departments"] + missing_seed_count
                      if after["departments"] != expected_department_count:
                          raise RuntimeError("department seed count exceeded reviewed additions")

                      departments_after = department_snapshot(cur)
                      before_by_id = {row[0]: row for row in departments_before}
                      after_by_id = {row[0]: row for row in departments_after}
                      for department_id, before_row in before_by_id.items():
                          if after_by_id.get(department_id) != before_row:
                              raise RuntimeError("existing department row changed")

                      if event_digest(cur) != event_digest_before:
                          raise RuntimeError("existing event content changed")
                      cur.execute("SELECT status, COUNT(*) FROM ctr.contracts GROUP BY status ORDER BY status")
                      if tuple(cur.fetchall()) != contract_statuses_before:
                          raise RuntimeError("contract status distribution changed")

                      if not relation_exists(cur, "ops.contract_document_access_requests"):
                          raise RuntimeError("contract document access table missing")
                      access_rows_after = int(scalar(cur, "SELECT COUNT(*) FROM ops.contract_document_access_requests"))
                      if access_rows_after != access_rows_before:
                          raise RuntimeError("contract document access rows changed during migration")

                      cur.execute(
                          """
                          SELECT COUNT(*)
                            FROM ops.my_org_units ou
                            CROSS JOIN (VALUES ('관리부'),('GIS사업부'),('지적사업부')) seed(name)
                           WHERE NOT EXISTS (
                               SELECT 1 FROM hr.departments d
                                WHERE d.org_unit_id=ou.id AND btrim(d.name)=seed.name
                           )
                          """
                      )
                      if int(cur.fetchone()[0]) != 0:
                          raise RuntimeError("required department seed missing")

                      migration_recorded = bool(scalar(
                          cur,
                          "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                          [APP, MIGRATION],
                      ))
                      if not migration_recorded:
                          raise RuntimeError("0024 migration record missing")

                  conn.commit()
                  totals["already_applied" if already_applied else "migrated"] += 1
                  totals["contract_rows_verified"] += before["contracts"]
                  totals["project_rows_verified"] += before["projects"]
                  totals["member_rows_verified"] += before["members"]
                  totals["employee_rows_verified"] += before["employees"]
                  totals["attachment_rows_verified"] += before["attachments"]
                  totals["event_rows_verified"] += before["events"]
                  totals["department_rows_after"] += after["departments"]
                  totals["department_seed_added"] += 0 if already_applied else missing_seed_count
                  totals["access_request_rows_verified"] += access_rows_after
              except Exception:
                  conn.rollback()
                  totals["migration_failed"] += 1
              finally:
                  conn.close()

          for key in (
              "configs", "active_tenants", "migrated", "already_applied", "schema_absent_skipped",
              "secret_resolution_failed", "connection_failed", "migration_failed",
              "contract_rows_verified", "project_rows_verified", "member_rows_verified",
              "employee_rows_verified", "attachment_rows_verified", "event_rows_verified",
              "department_rows_after", "department_seed_added", "access_request_rows_verified",
          ):
              print(f"event_handoff_activation_{key}={int(totals[key])}")

          if totals["secret_resolution_failed"] or totals["connection_failed"] or totals["migration_failed"]:
              raise SystemExit("event_handoff_activation_blocker=tenant_migration_failure")
          accounted = totals["migrated"] + totals["already_applied"] + totals["schema_absent_skipped"]
          if accounted != totals["active_tenants"]:
              raise SystemExit("event_handoff_activation_blocker=not_all_active_tenants_accounted")
          print("event_handoff_activation_db_complete=yes")
          PY

          rollback_needed=0
          rollback_code() {
            set +e
            if [ "$rollback_needed" -eq 1 ]; then
              echo 'event_handoff_activation_code_rollback_started=yes'
              if [ -n "$previous_branch" ]; then
                git -C "$repo" checkout -B "$previous_branch" "$previous_sha" >/dev/null 2>&1
              else
                git -C "$repo" checkout --detach "$previous_sha" >/dev/null 2>&1
              fi
              "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt" >/dev/null 2>&1
              "$python" "$repo/manage.py" collectstatic --noinput >/dev/null 2>&1
              sudo -n systemctl restart "$service"
              sleep 3
              echo "event_handoff_activation_rollback_service_state=$(systemctl is-active "$service" 2>/dev/null || true)"
              echo 'event_handoff_activation_code_rollback_completed=yes'
            fi
          }
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then rollback_code; fi
            exit "$rc"
          }
          trap on_exit EXIT
          rollback_needed=1

          git -C "$repo" checkout -B "$expected_branch" "$candidate_sha"
          [ "$(git -C "$repo" rev-parse HEAD)" = "$candidate_sha" ] || fail 'candidate_checkout_failed'

          "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt"
          "$python" -m pip check
          "$python" "$repo/manage.py" check
          "$python" "$repo/manage.py" collectstatic --noinput
          sudo -n systemctl restart "$service"

          ready=no
          for _ in $(seq 1 30); do
            active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
            sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
            code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/login/ || true)"
            if [ "$active" = 'active' ] && [ "$sub" = 'running' ]; then
              case "$code" in
                2??|3??) ready=yes; break ;;
              esac
            fi
            sleep 2
          done
          [ "$ready" = yes ] || fail 'stabilized_service_failed_post_restart_healthcheck'

          public_login="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/login/ || true)"
          echo "event_handoff_activation_public_login_status=$public_login"
          [ "$public_login" = '200' ] || fail 'public_login_not_200_after_activation'

          rollback_needed=0
          trap - EXIT
          echo "event_handoff_activation_deployed_sha=$(git -C "$repo" rev-parse HEAD)"
          echo "event_handoff_activation_deployed_branch=$(git -C "$repo" rev-parse --abbrev-ref HEAD)"
          echo 'event_handoff_production_activation_complete=yes'
          REMOTE
