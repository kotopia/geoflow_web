name: Role assignment SQL regression

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - control/views_users_admin.py
      - control/test_role_assignment_sql_safety.py
      - .github/workflows/role-assignment-sql-regression.yml
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - control/views_users_admin.py
      - control/test_role_assignment_sql_safety.py
      - .github/workflows/role-assignment-sql-regression.yml

permissions:
  contents: read

jobs:
  role-assignment-sql-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile role assignment view
        run: python -m py_compile control/views_users_admin.py

      - name: Verify Psycopg LIKE wildcard escaping regression
        run: python -m unittest control.test_role_assignment_sql_safety
