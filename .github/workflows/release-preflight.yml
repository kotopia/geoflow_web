name: Release preflight

on:
  push:
    branches:
      - release/stabilized-deploy
  pull_request:
    branches:
      - release/stabilized-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: ci-release-preflight-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: geoflow.co.kr
      DJANGO_CSRF_TRUSTED_ORIGINS: https://geoflow.co.kr
      DJANGO_CSRF_COOKIE_SECURE: "1"
      DJANGO_SESSION_COOKIE_SECURE: "1"
      CENTRAL_DB_NAME: ci-central
      CENTRAL_DB_USER: ci-central-user
      CENTRAL_DB_PASSWORD: ci-nonsecret-placeholder
      CENTRAL_DB_HOST: central.example.internal
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant
      TENANT_DB_USER: ci-tenant-user
      TENANT_DB_PASSWORD: ci-nonsecret-placeholder
      TENANT_DB_HOST: tenant.example.internal
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"
      TENANT_DB_REQUIRE_SECRET_REFERENCES: "1"
      USE_SMTP_EMAIL: "1"
      EMAIL_HOST: smtp.naver.com
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "true"
      EMAIL_HOST_USER: ci-user
      EMAIL_HOST_PASSWORD: ci-nonsecret-placeholder
      DEFAULT_FROM_EMAIL: ci@example.com
      SITE_ORIGIN: https://geoflow.co.kr
      SIGNUP_TERMS_URL: https://geoflow.co.kr/terms/
      SIGNUP_PRIVACY_URL: https://geoflow.co.kr/privacy/
      SIGNUP_TERMS_VERSION: 2026-08-08-v2
      SIGNUP_PRIVACY_VERSION: 2026-08-08-v2
      SIGNUP_LEGAL_DOCUMENTS_CONFIRMED: "1"
      SIGNUP_EMAIL_VERIFICATION_ACTIVE_KEY_ID: ci
      SIGNUP_EMAIL_VERIFICATION_HMAC_KEYS_JSON: '{"ci":"QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="}'
      ENABLE_SIGNUP_EMAIL_VERIFICATION_OUTBOX: "1"
      SIGNUP_EMAIL_VERIFICATION_URL: https://geoflow.co.kr/signup/verify/
      SIGNUP_EMAIL_VERIFICATION_TTL_SECONDS: "86400"
      SIGNUP_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: "600"
      SIGNUP_EMAIL_VERIFICATION_OUTBOX_LEASE_SECONDS: "120"
      SIGNUP_EMAIL_VERIFICATION_OUTBOX_RETRY_SECONDS: "300"
      SIGNUP_EMAIL_VERIFICATION_OUTBOX_MAX_ATTEMPTS: "5"
      EMAIL_TIMEOUT: "30"
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET: geoflow-ci-nonexistent

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install exact Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Django system check
        run: python manage.py check

      - name: Focused release security regression tests
        run: |
          python manage.py test \
            control.test_tenant_db_secret_resolver \
            control.test_tenant_db_secret_ref_audit \
            control.test_database_runtime_preflight \
            control.test_web_security_preflight \
            control.test_session_security_preflight \
            control.test_production_runtime_preflight \
            control.test_route_security_preflight \
            control.test_role_assignment_sql_safety \
            geoflow_ops.test_employee_security_boundaries \
            geoflow_ops.test_tenant_security_method_boundaries \
            geoflow_ops.test_event_upload_route_boundaries \
            geoflow_ops.test_s3_default_credential_chain

      - name: Strict repository release preflight
        run: python manage.py check_release_preflight --strict

  migration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geoflow_ci
          POSTGRES_PASSWORD: ci-postgres-placeholder
          POSTGRES_DB: geoflow_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoflow_ci -d geoflow_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: geoflow_project.ci_migration_settings
      DJANGO_SECRET_KEY: ci-migration-rehearsal-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij
      DJANGO_DEBUG: "0"
      CENTRAL_DB_NAME: geoflow_control
      CENTRAL_DB_USER: geoflow_ci
      CENTRAL_DB_PASSWORD: ci-postgres-placeholder
      CENTRAL_DB_HOST: 127.0.0.1
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: cheonan_db
      TENANT_DB_USER: geoflow_ci
      TENANT_DB_PASSWORD: ci-postgres-placeholder
      TENANT_DB_HOST: 127.0.0.1
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install migration rehearsal dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Bootstrap disposable legacy central and tenant databases
        env:
          PGPASSWORD: ci-postgres-placeholder
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U geoflow_ci -d geoflow_control \
            -f scripts/ci/bootstrap_central_legacy_schema.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U geoflow_ci -d postgres \
            -c 'CREATE DATABASE cheonan_db;'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U geoflow_ci -d cheonan_db \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis;'

      - name: Rehearse central migrations and launch schema audit
        run: |
          python manage.py migrate --plan --database=default
          python manage.py migrate --database=default --noinput
          python manage.py migrate --check --database=default
          python manage.py check_signup_launch_schema --strict
          python manage.py check_tenant_db_secret_refs --strict

      - name: Rehearse tenant migrations
        run: |
          python manage.py migrate --plan --database=cheonan_db
          python manage.py migrate --database=cheonan_db --noinput
          python manage.py migrate --check --database=cheonan_db

  public-https-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public HTTPS, redirect, headers, and legal endpoints
        shell: bash
        run: |
          set -uo pipefail
          failures=0

          check_url() {
            label="$1"
            url="$2"
            code="000"
            if ! code="$(curl \
              --proto '=https' \
              --proto-redir '=https' \
              --location \
              --max-redirs 5 \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 20 \
              "$url")"; then
              code="000"
            fi
            echo "$label=$code"
            case "$code" in
              2??|3??) ;;
              *) failures=$((failures + 1)) ;;
            esac
          }

          http_headers="$(mktemp)"
          https_headers="$(mktemp)"
          trap 'rm -f "$http_headers" "$https_headers"' EXIT

          http_code="000"
          if ! http_code="$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --dump-header "$http_headers" \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 20 \
            http://geoflow.co.kr/)"; then
            http_code="000"
          fi
          echo "http_root=$http_code"
          case "$http_code" in
            301|302|307|308) ;;
            *) failures=$((failures + 1)) ;;
          esac

          if grep -Eqi '^location:[[:space:]]*https://geoflow\.co\.kr(/|[[:space:]]*$)' "$http_headers"; then
            echo "http_redirect_https=yes"
          else
            echo "http_redirect_https=no"
            failures=$((failures + 1))
          fi

          https_code="000"
          if ! https_code="$(curl \
            --proto '=https' \
            --silent \
            --show-error \
            --output /dev/null \
            --dump-header "$https_headers" \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 20 \
            https://geoflow.co.kr/)"; then
            https_code="000"
          fi
          echo "https_root=$https_code"
          case "$https_code" in
            2??|3??) ;;
            *) failures=$((failures + 1)) ;;
          esac

          for header in strict-transport-security x-content-type-options x-frame-options referrer-policy; do
            label="${header//-/_}"
            if grep -qi "^${header}:" "$https_headers"; then
              echo "${label}=present"
            else
              echo "${label}=missing"
            fi
          done

          check_url terms https://geoflow.co.kr/terms/
          check_url privacy https://geoflow.co.kr/privacy/

          if (( failures > 0 )); then
            echo "public_https_smoke_ready=no"
            exit 1
          fi
          echo "public_https_smoke_ready=yes"
