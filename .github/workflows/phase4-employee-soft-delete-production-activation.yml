name: Phase 4 employee soft delete production activation

on:
  push:
    branches: [release/stabilized-deploy]
    paths:
      - .github/workflows/phase4-employee-soft-delete-production-activation.yml
      - geoflow_ops/migrations/0027_employee_profile_soft_delete.py
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  employee-soft-delete-production-activation:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'employee_soft_delete_activation_blocker=release_advanced'
            exit 2
          }
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || exit 2

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Apply 0027 schema first and deploy exact release
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          candidate_sha="$1"
          service='geoflow-stabilized.service'
          expected_branch='release/stabilized-deploy'
          fail() { echo "employee_soft_delete_activation_blocker=$1"; exit 2; }

          command -v git >/dev/null 2>&1 || fail git_missing
          command -v curl >/dev/null 2>&1 || fail curl_missing
          command -v sudo >/dev/null 2>&1 || fail sudo_missing
          command -v systemctl >/dev/null 2>&1 || fail systemctl_missing
          sudo -n true >/dev/null 2>&1 || fail passwordless_sudo_required
          [ "$(systemctl is-active "$service" 2>/dev/null || true)" = active ] || fail service_not_running
          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail service_repo_missing
          [ -f "$repo/manage.py" ] && [ -f "$repo/requirements.txt" ] && [ -f "$repo/.env" ] || fail runtime_files_missing
          origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
          case "$origin" in
            https://github.com/kotopia/geoflow_web|https://github.com/kotopia/geoflow_web.git|git@github.com:kotopia/geoflow_web.git) ;;
            *) fail unexpected_repository_origin ;;
          esac
          [ -z "$(git -C "$repo" status --porcelain)" ] || fail production_worktree_dirty
          python="$repo/.venv/bin/python"
          [ -x "$python" ] && [ -x "$repo/.venv/bin/gunicorn" ] || fail stabilized_venv_missing
          exec_raw="$(systemctl show "$service" -p ExecStart --value 2>/dev/null || true)"
          printf '%s' "$exec_raw" | grep -Fq "$repo/.venv/bin/gunicorn" || fail service_exec_unexpected
          printf '%s' "$exec_raw" | grep -Fq 'geoflow_project.wsgi:application' || fail service_wsgi_unexpected
          before_code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/login/ || true)"
          case "$before_code" in 2??|3??) ;; *) fail local_login_unhealthy_before_activation ;; esac

          previous_sha="$(git -C "$repo" rev-parse HEAD)"
          previous_branch="$(git -C "$repo" symbolic-ref --short -q HEAD || true)"
          git -C "$repo" fetch --prune origin refs/heads/release/stabilized-deploy
          [ "$(git -C "$repo" rev-parse FETCH_HEAD)" = "$candidate_sha" ] || fail candidate_sha_not_current_release_head

          "$python" - "$repo" <<'PY'
          from collections import Counter
          import os, sys
          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")
          import django
          django.setup()
          import psycopg2
          from django.db import connections, transaction
          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import is_tenant_db_secret_reference, resolve_tenant_db_password

          APP = "webgisapp"
          DEPENDENCY = "0026_contract_completion_event_backfill"
          MIGRATION = "0027_employee_profile_soft_delete"
          REQUIRED_COLUMNS = {
              "is_deleted": ("boolean", "NO"),
              "deleted_at": ("timestamp with time zone", "YES"),
              "deleted_by": ("text", "YES"),
              "delete_reason": ("text", "YES"),
              "restored_at": ("timestamp with time zone", "YES"),
              "restored_by": ("text", "YES"),
          }

          def text(value): return str(value or "").strip()
          def scalar(cur, sql, params=None):
              cur.execute(sql, params or [])
              row = cur.fetchone()
              return row[0] if row else None
          def exists(cur, relation):
              return bool(scalar(cur, "SELECT to_regclass(%s) IS NOT NULL", [relation]))
          def failure_detail(cfg, stage, exc):
              reason = str(exc) if isinstance(exc, RuntimeError) else type(exc).__name__
              pgcode = text(getattr(exc, "pgcode", "")) or "none"
              print(
                  "employee_soft_delete_activation_tenant_failure="
                  f"group_id:{cfg.group_id},stage:{stage},reason:{reason},pgcode:{pgcode}"
              )
          def apply_0027(cur):
              cur.execute("""
                  ALTER TABLE hr.employee_profile
                      ADD COLUMN IF NOT EXISTS is_deleted boolean NOT NULL DEFAULT false,
                      ADD COLUMN IF NOT EXISTS deleted_at timestamptz NULL,
                      ADD COLUMN IF NOT EXISTS deleted_by text NULL,
                      ADD COLUMN IF NOT EXISTS delete_reason text NULL,
                      ADD COLUMN IF NOT EXISTS restored_at timestamptz NULL,
                      ADD COLUMN IF NOT EXISTS restored_by text NULL
              """)
              cur.execute("""
                  CREATE INDEX IF NOT EXISTS idx_employee_profile_active_name
                      ON hr.employee_profile (name, email) WHERE is_deleted = false
              """)
          def verify_0027(cur):
              cur.execute("""
                  SELECT column_name, data_type, is_nullable, column_default
                    FROM information_schema.columns
                   WHERE table_schema='hr' AND table_name='employee_profile'
                     AND column_name = ANY(%s::text[])
              """, [list(REQUIRED_COLUMNS)])
              found = {row[0]: (row[1], row[2], row[3]) for row in cur.fetchall()}
              if set(found) != set(REQUIRED_COLUMNS): raise RuntimeError("0027 columns missing")
              for name, (expected_type, expected_nullable) in REQUIRED_COLUMNS.items():
                  actual_type, actual_nullable, default = found[name]
                  if (actual_type, actual_nullable) != (expected_type, expected_nullable):
                      raise RuntimeError(f"0027 column shape mismatch: {name}")
                  if name == "is_deleted" and (default is None or "false" not in default.lower()):
                      raise RuntimeError("0027 is_deleted default mismatch")
              if not exists(cur, "hr.idx_employee_profile_active_name"):
                  raise RuntimeError("0027 index missing")
              index_def = scalar(cur, """
                  SELECT indexdef FROM pg_indexes
                   WHERE schemaname='hr' AND tablename='employee_profile'
                     AND indexname='idx_employee_profile_active_name'
              """)
              normalized_index = " ".join(text(index_def).lower().split())
              if "(name, email)" not in normalized_index or "is_deleted = false" not in normalized_index:
                  raise RuntimeError("0027 index shape mismatch")

          with transaction.atomic(using="default"):
              with connections["default"].cursor() as central_cur:
                  central_cur.execute("SET LOCAL TRANSACTION READ ONLY")
                  configs = list(GroupDBConfig.objects.using("default").select_related("group").order_by("group_id"))
          active = [cfg for cfg in configs if text(getattr(cfg.group, "status", "")).lower() == "active"]
          totals = Counter(configs=len(configs), active_tenants=len(active))
          if not active:
              raise SystemExit("employee_soft_delete_activation_blocker=no_active_tenants")
          for cfg in active:
              secret_ref = text(cfg.db_password)
              if not is_tenant_db_secret_reference(secret_ref):
                  totals["invalid_secret_reference"] += 1
                  continue
              try: password = resolve_tenant_db_password(secret_ref)
              except Exception as exc:
                  failure_detail(cfg, "secret_resolution", exc)
                  totals["secret_resolution_failed"] += 1
                  continue
              if not password:
                  totals["secret_resolution_failed"] += 1
                  continue
              try:
                  conn = psycopg2.connect(dbname=cfg.db_name, user=cfg.db_user, password=password,
                                          host=cfg.db_host, port=cfg.db_port, sslmode="require", connect_timeout=8)
              except Exception as exc:
                  failure_detail(cfg, "connection", exc)
                  totals["connection_failed"] += 1
                  continue
              try:
                  conn.autocommit = False
                  with conn.cursor() as cur:
                      cur.execute("SET LOCAL lock_timeout='5s'")
                      cur.execute("SET LOCAL statement_timeout='60s'")
                      cur.execute("SELECT pg_advisory_xact_lock(hashtext(%s))", ["geoflow:webgisapp:0027"])
                      if not exists(cur, "hr.employee_profile"): raise RuntimeError("hr.employee_profile missing")
                      if not exists(cur, "public.django_migrations"): raise RuntimeError("django_migrations missing")
                      dependency = bool(scalar(cur, "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)", [APP, DEPENDENCY]))
                      if not dependency: raise RuntimeError("0026 dependency not applied")
                      already = bool(scalar(cur, "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)", [APP, MIGRATION]))
                      before = int(scalar(cur, "SELECT COUNT(*) FROM hr.employee_profile"))
                      apply_0027(cur)
                      if not already:
                          cur.execute("""
                              INSERT INTO django_migrations (app, name, applied)
                              SELECT %s, %s, NOW() WHERE NOT EXISTS (
                                  SELECT 1 FROM django_migrations WHERE app=%s AND name=%s
                              )
                          """, [APP, MIGRATION, APP, MIGRATION])
                      verify_0027(cur)
                      after = int(scalar(cur, "SELECT COUNT(*) FROM hr.employee_profile"))
                      if after != before: raise RuntimeError("employee profile row count changed")
                      recorded = bool(scalar(cur, "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)", [APP, MIGRATION]))
                      if not recorded: raise RuntimeError("0027 migration record missing")
                  conn.commit()
                  totals["already_applied" if already else "migrated"] += 1
                  totals["employee_rows_verified"] += before
              except Exception as exc:
                  conn.rollback()
                  failure_detail(cfg, "migration", exc)
                  totals["migration_failed"] += 1
              finally:
                  conn.close()

          keys = ("configs", "active_tenants", "migrated", "already_applied", "invalid_secret_reference",
                  "secret_resolution_failed", "connection_failed", "migration_failed", "employee_rows_verified")
          for key in keys: print(f"employee_soft_delete_activation_{key}={int(totals[key])}")
          failures = sum(totals[k] for k in ("invalid_secret_reference", "secret_resolution_failed", "connection_failed", "migration_failed"))
          if failures: raise SystemExit("employee_soft_delete_activation_blocker=tenant_migration_failure")
          if totals["migrated"] + totals["already_applied"] != totals["active_tenants"]:
              raise SystemExit("employee_soft_delete_activation_blocker=not_all_active_tenants_accounted")
          print("employee_soft_delete_activation_db_complete=yes")
          PY

          rollback_needed=0
          rollback_code() {
            set +e
            if [ "$rollback_needed" -eq 1 ]; then
              echo 'employee_soft_delete_activation_code_rollback_started=yes'
              echo 'employee_soft_delete_activation_additive_schema_retained=yes'
              if [ -n "$previous_branch" ]; then
                git -C "$repo" checkout -B "$previous_branch" "$previous_sha" >/dev/null 2>&1
              else
                git -C "$repo" checkout --detach "$previous_sha" >/dev/null 2>&1
              fi
              "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt" >/dev/null 2>&1
              "$python" "$repo/manage.py" collectstatic --noinput >/dev/null 2>&1
              sudo -n systemctl restart "$service"
              echo 'employee_soft_delete_activation_code_rollback_completed=yes'
            fi
          }
          on_exit() { rc=$?; if [ "$rc" -ne 0 ]; then rollback_code; fi; exit "$rc"; }
          trap on_exit EXIT
          rollback_needed=1

          git -C "$repo" checkout -B "$expected_branch" "$candidate_sha"
          [ "$(git -C "$repo" rev-parse HEAD)" = "$candidate_sha" ] || fail candidate_checkout_failed
          [ -z "$(git -C "$repo" status --porcelain)" ] || fail candidate_worktree_dirty
          "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt"
          "$python" -m pip check
          "$python" "$repo/manage.py" check
          "$python" "$repo/manage.py" collectstatic --noinput
          sudo -n systemctl restart "$service"

          ready=no
          for _ in $(seq 1 30); do
            code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/login/ || true)"
            if [ "$(systemctl is-active "$service" 2>/dev/null || true)" = active ]; then
              case "$code" in 2??|3??) ready=yes; break ;; esac
            fi
            sleep 2
          done
          [ "$ready" = yes ] || fail service_failed_post_restart_healthcheck
          public_login="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/login/ || true)"
          echo "employee_soft_delete_activation_public_login_status=$public_login"
          [ "$public_login" = 200 ] || fail public_login_not_200_after_activation

          rollback_needed=0
          trap - EXIT
          echo "employee_soft_delete_activation_deployed_sha=$(git -C "$repo" rev-parse HEAD)"
          echo 'employee_soft_delete_production_activation_complete=yes'
          REMOTE
