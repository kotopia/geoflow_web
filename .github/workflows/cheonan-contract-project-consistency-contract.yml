name: Cheonan contract project diagnostic contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/cheonan-contract-project-consistency-diagnostic.yml
      - .github/workflows/cheonan-contract-project-consistency-contract.yml
      - control/test_cheonan_contract_project_consistency_diagnostic_contract.py
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/cheonan-contract-project-consistency-diagnostic.yml
      - .github/workflows/cheonan-contract-project-consistency-contract.yml
      - control/test_cheonan_contract_project_consistency_diagnostic_contract.py

permissions:
  contents: read

jobs:
  cheonan-contract-project-diagnostic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run static safety contract
        run: python -m unittest control.test_cheonan_contract_project_consistency_diagnostic_contract
