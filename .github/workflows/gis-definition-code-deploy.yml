name: GIS definition administration code deploy

on:
  push:
    branches: [release/stabilized-deploy]
    paths:
      - control/views_gis_admin.py
      - control/services/gis_admin.py
      - control/templates/control/gis/**
      - geoflow_ops/gis/form_definitions.py
      - geoflow_ops/gis/form_definition_views.py
      - geoflow_ops/templates/geoflow_ops/gis/form_configuration.html
      - .github/workflows/gis-definition-code-deploy.yml

concurrency:
  group: geoflow-gis-production-code
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-current-release:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      APPROVED_SHA: ${{ github.sha }}
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate release and deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'release/stabilized-deploy'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'production_release_deploy_blocker=release_advanced'
            exit 2
          }
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Deploy reviewed GIS code only with code rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          candidate_sha="$1"
          service='geoflow-stabilized.service'
          expected_branch='release/stabilized-deploy'

          fail() {
            echo "production_release_deploy_blocker=$1"
            exit 2
          }

          for cmd in git systemctl curl sudo; do command -v "$cmd" >/dev/null 2>&1 || fail "${cmd}_missing"; done
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'service_not_running_before_deploy'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/requirements.txt" ] || fail 'requirements_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'

          origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
          case "$origin" in
            https://github.com/kotopia/geoflow_web|https://github.com/kotopia/geoflow_web.git|git@github.com:kotopia/geoflow_web.git) ;;
            *) fail 'unexpected_repository_origin' ;;
          esac

          dirty_count="$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')"
          [ "$dirty_count" = 0 ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'venv_python_missing'
          [ -x "$repo/.venv/bin/gunicorn" ] || fail 'gunicorn_missing'

          before_code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/login/ || true)"
          case "$before_code" in 2??|3??) ;; *) fail 'local_login_unhealthy_before_deploy' ;; esac

          previous_sha="$(git -C "$repo" rev-parse HEAD)"
          previous_branch="$(git -C "$repo" symbolic-ref --short -q HEAD || true)"
          [ "$previous_branch" = "$expected_branch" ] || fail 'unexpected_production_branch'
          echo "production_release_previous_sha=$previous_sha"
          echo "production_release_candidate_sha=$candidate_sha"

          rollback_needed=0
          rollback_code() {
            set +e
            if [ "$rollback_needed" -eq 1 ]; then
              echo 'production_release_code_rollback_started=yes'
              if [ -n "$previous_branch" ]; then
                git -C "$repo" checkout -B "$previous_branch" "$previous_sha" >/dev/null 2>&1
              else
                git -C "$repo" checkout --detach "$previous_sha" >/dev/null 2>&1
              fi
              sudo -n systemctl restart "$service"
              if [ "$(git -C "$repo" rev-parse HEAD)" = "$previous_sha" ] && systemctl is-active --quiet "$service"; then
                echo 'production_release_code_rollback_service_active=yes'
              else
                echo 'production_release_code_rollback_requires_operator=yes'
              fi
            fi
          }
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then rollback_code; fi
            exit "$rc"
          }
          trap on_exit EXIT

          git -C "$repo" fetch --prune origin refs/heads/release/stabilized-deploy
          fetched_sha="$(git -C "$repo" rev-parse FETCH_HEAD)"
          [ "$fetched_sha" = "$candidate_sha" ] || fail 'candidate_not_current_release_head'
          git -C "$repo" merge-base --is-ancestor "$previous_sha" "$candidate_sha" || fail 'non_forward_release'
          # Reject unrelated release drift instead of deploying omitted dependencies/migrations.
          changed_paths="$(git -C "$repo" diff --name-only "$previous_sha" "$candidate_sha")"
          while IFS= read -r changed_path; do
            case "$changed_path" in
              ''|control/views_gis_admin.py|control/services/gis_admin.py|control/templates/control/gis/definitions.html|control/urls.py|control/templates/control/partials/sidebar.html|geoflow_ops/gis/form_definitions.py|geoflow_ops/gis/form_definition_views.py|geoflow_ops/gis/urls.py|geoflow_ops/templates/geoflow_ops/gis/project_dashboard.html|geoflow_ops/templates/geoflow_ops/gis/form_configuration.html|geoflow_ops/gis/test_form_definitions.py|geoflow_ops/gis/test_form_admin_authorization.py|docs/architecture/gis-form-definitions-v1.sql|docs/operations/gis-definition-admin-release.md|.github/workflows/gis-form-definition-tests.yml|.github/workflows/gis-definition-code-deploy.yml) ;;
              *) fail 'changed_path_outside_gis_code_contract' ;;
            esac
          done <<< "$changed_paths"
          git -C "$repo" checkout -B "$expected_branch" "$candidate_sha"
          rollback_needed=1

          "$python" -m pip check
          PGOPTIONS='-c default_transaction_read_only=on' "$python" "$repo/manage.py" check


          sudo -n systemctl restart "$service"

          ready=no
          for _ in $(seq 1 30); do
            active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
            sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
            code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/login/ || true)"
            if [ "$active" = active ] && [ "$sub" = running ]; then
              case "$code" in 2??|3??) ready=yes; break ;; esac
            fi
            sleep 2
          done
          [ "$ready" = yes ] || fail 'service_failed_post_restart_healthcheck'

          public_login="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/login/ || true)"
          echo "production_release_public_login_status=$public_login"
          [ "$public_login" = 200 ] || fail 'public_login_not_200_after_deploy'

          rollback_needed=0
          trap - EXIT
          echo "production_release_deployed_sha=$(git -C "$repo" rev-parse HEAD)"
          echo "production_release_deployed_branch=$(git -C "$repo" rev-parse --abbrev-ref HEAD)"
          echo 'production_release_deploy_complete=yes'
          REMOTE
