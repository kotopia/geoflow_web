name: iroomsng upstream history current

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-upstream-history-current.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iroomsng-upstream-history-current:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact triggering release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact SHA and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Trace iroomsng upstream history read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v nginx >/dev/null 2>&1 || { echo 'iroomsng_current_blocker=nginx_missing'; exit 2; }
          command -v python3 >/dev/null 2>&1 || { echo 'iroomsng_current_blocker=python_missing'; exit 2; }
          command -v ss >/dev/null 2>&1 || { echo 'iroomsng_current_blocker=ss_missing'; exit 2; }
          sudo -n true >/dev/null 2>&1 || { echo 'iroomsng_current_blocker=passwordless_sudo_required'; exit 2; }

          nginx_dump="$(mktemp)"
          backups="$(mktemp)"
          alt_ports="$(mktemp)"
          trap 'rm -f "$nginx_dump" "$backups" "$alt_ports"' EXIT
          sudo -n nginx -T >"$nginx_dump" 2>/dev/null || { echo 'iroomsng_current_blocker=nginx_config_read_failed'; exit 2; }

          current_port="$({ python3 - "$nginx_dump" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors='replace')
          def blocks(source):
              out=[]
              for m in re.finditer(r'(?m)^\s*server\s*\{', source):
                  s=source.find('{',m.start()); d=0; e=None
                  if s < 0: continue
                  for i in range(s,len(source)):
                      if source[i]=='{': d+=1
                      elif source[i]=='}':
                          d-=1
                          if d==0: e=i+1; break
                  if e: out.append(source[m.start():e])
              return out
          def ports(domain):
              found=set(); count=0
              for b in blocks(text):
                  if re.search(rf'server_name\s+[^;]*\b{re.escape(domain)}\b', b, re.I):
                      count += 1
                      found.update(re.findall(r'proxy_pass\s+http://127\.0\.0\.1:(\d{1,5})\s*;', b, re.I))
              return count, sorted(found)
          ib, ip = ports('iroomsng.kr')
          gb, gp = ports('geoflow.co.kr')
          print(f'iroomsng_current_iroomsng_server_blocks={ib}', file=sys.stderr)
          print(f'iroomsng_current_iroomsng_upstream_count={len(ip)}', file=sys.stderr)
          print(f'iroomsng_current_geoflow_server_blocks={gb}', file=sys.stderr)
          print(f'iroomsng_current_geoflow_upstream_count={len(gp)}', file=sys.stderr)
          print(f"iroomsng_current_same_upstream_as_geoflow={'yes' if len(ip)==1 and len(gp)==1 and ip[0]==gp[0] else 'no'}", file=sys.stderr)
          if len(ip) != 1: raise SystemExit(3)
          print(ip[0])
          PY
          } 2>/dev/null)" || { echo 'iroomsng_current_blocker=single_iroomsng_upstream_not_proven'; exit 2; }
          printf '%s' "$current_port" | grep -Eq '^[0-9]{1,5}$' || { echo 'iroomsng_current_blocker=invalid_upstream'; exit 2; }

          if ss -ltnH | awk '{print $4}' | grep -Eq "(^|:)${current_port}$"; then
            echo 'iroomsng_current_listener_present=yes'
          else
            echo 'iroomsng_current_listener_present=no'
          fi

          for unit in geoflow-stabilized.service geoflow.service gunicorn.service; do
            present=no; targets=no; state=unknown
            if systemctl cat "$unit" >/dev/null 2>&1; then
              present=yes
              raw="$(systemctl show "$unit" -p ActiveState --value 2>/dev/null || true)"
              case "$raw" in active|inactive|failed|activating|deactivating|reloading|maintenance) state="$raw";; esac
              exec_start="$(systemctl show "$unit" -p ExecStart --value 2>/dev/null || true)"
              if printf '%s' "$exec_start" | grep -Eq "(127\\.0\\.0\\.1|0\\.0\\.0\\.0|localhost):${current_port}([^0-9]|$)"; then targets=yes; fi
            fi
            safe="$(printf '%s' "$unit" | tr '.-' '__')"
            echo "iroomsng_current_${safe}_present=${present}"
            echo "iroomsng_current_${safe}_active_state=${state}"
            echo "iroomsng_current_${safe}_targets_current_port=${targets}"
          done

          find /etc/nginx -type f \( -name '*.bak' -o -name '*.old' -o -name '*.orig' -o -name '*.save' -o -name '*~' -o -name '*.disabled' \) -print 2>/dev/null | sort -u >"$backups"
          echo "iroomsng_current_nginx_backup_file_count=$(wc -l <"$backups" | tr -d ' ')"

          python3 - "$backups" "$current_port" "$alt_ports" <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          paths=Path(sys.argv[1]).read_text().splitlines(); current=sys.argv[2]; out=Path(sys.argv[3])
          ports=set(); matched=0
          for path in paths:
              if not path: continue
              try: cp=subprocess.run(['sudo','-n','cat','--',path],capture_output=True,text=True,timeout=3)
              except Exception: continue
              if cp.returncode != 0 or not re.search(r'\biroomsng\.kr\b', cp.stdout, re.I): continue
              matched += 1
              ports.update(re.findall(r'proxy_pass\s+http://127\.0\.0\.1:(\d{1,5})\s*;', cp.stdout, re.I))
          alts=sorted(p for p in ports if p != current)
          out.write_text('\n'.join(alts) + ('\n' if alts else ''))
          print(f'iroomsng_current_backup_files_with_iroomsng={matched}')
          print(f'iroomsng_current_historical_upstream_count={len(ports)}')
          print(f'iroomsng_current_historical_alternate_port_count={len(alts)}')
          PY

          alt_listener_count=0
          while IFS= read -r alt_port; do
            printf '%s' "$alt_port" | grep -Eq '^[0-9]{1,5}$' || continue
            if ss -ltnH | awk '{print $4}' | grep -Eq "(^|:)${alt_port}$"; then alt_listener_count=$((alt_listener_count + 1)); fi
          done <"$alt_ports"
          echo "iroomsng_current_historical_alternate_listener_count=${alt_listener_count}"
          echo 'iroomsng_upstream_history_current_complete=yes'
          REMOTE

      - name: Verify public iroomsng root
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://iroomsng.kr/ || true)"
          printf '%s' "$code" | grep -Eq '^[0-9]{3}$' || code=000
          echo "iroomsng_current_public_root_code=$code"
