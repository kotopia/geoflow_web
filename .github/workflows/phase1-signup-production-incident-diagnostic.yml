name: Phase 1 signup production incident diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-signup-production-incident-diagnostic.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  signup-incident-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}
      TARGET_EMAIL_SHA256: 48fc1fff8df35cee7cceb0d5d77de62979b781e566c34a44858082df80adc81e

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }
          printf '%s' "$TARGET_EMAIL_SHA256" | grep -Eq '^[0-9a-f]{64}$' || { echo 'invalid_target_hash=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Diagnose signup state without mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "TARGET_EMAIL_SHA256='$TARGET_EMAIL_SHA256' bash -s" <<'REMOTE'
          set -euo pipefail
          web_service='geoflow-stabilized.service'
          fail() { echo "signup_incident_diagnostic_blocker=$1"; exit 2; }

          active="$(systemctl show "$web_service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$web_service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running'

          workdir="$(systemctl show "$web_service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] || fail 'runtime_repo_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'

          cd "$repo"
          TARGET_EMAIL_SHA256="$TARGET_EMAIL_SHA256" DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import hashlib
          import os
          from datetime import timezone as dt_timezone

          import django
          django.setup()

          from django.db import connections
          from django.utils import timezone

          target_hash = os.environ['TARGET_EMAIL_SHA256']
          conn = connections['default']

          def yesno(value):
              return 'yes' if bool(value) else 'no'

          def age_minutes(value):
              if value is None:
                  return 'none'
              now = timezone.now()
              return str(max(0, int((now - value).total_seconds() // 60)))

          with conn.cursor() as cur:
              cur.execute('BEGIN READ ONLY')
              try:
                  cur.execute(
                      """
                      SELECT id::text, email, is_active, email_verified, created_at,
                             password_hash IS NOT NULL AND length(trim(password_hash)) > 0
                        FROM users
                       WHERE created_at >= now() - interval '24 hours'
                       ORDER BY created_at DESC
                       LIMIT 500
                      """
                  )
                  matches = []
                  for row in cur.fetchall():
                      email = (row[1] or '').strip().lower()
                      digest = hashlib.sha256(email.encode('utf-8')).hexdigest()
                      if digest == target_hash:
                          matches.append(row)

                  print(f'signup_incident_user_match_count={len(matches)}')
                  if len(matches) != 1:
                      raise SystemExit(3)

                  user_id, _email, is_active, email_verified, created_at, password_present = matches[0]
                  print(f'signup_incident_user_created_age_minutes={age_minutes(created_at)}')
                  print(f'signup_incident_user_active={yesno(is_active)}')
                  print(f'signup_incident_user_verified={yesno(email_verified)}')
                  print(f'signup_incident_password_hash_present={yesno(password_present)}')

                  cur.execute(
                      """
                      SELECT id::text, status, submitted_at, version, created_at, updated_at
                        FROM signup_requests
                       WHERE user_id=%s
                       ORDER BY created_at DESC, id DESC
                      """,
                      [user_id],
                  )
                  requests = cur.fetchall()
                  print(f'signup_incident_signup_request_count={len(requests)}')

                  if requests:
                      request_id, status, submitted_at, version, req_created_at, req_updated_at = requests[0]
                      print(f'signup_incident_latest_request_status={status}')
                      print(f'signup_incident_request_created_age_minutes={age_minutes(req_created_at)}')
                      print(f'signup_incident_request_version={version}')

                      cur.execute(
                          """
                          SELECT event_type, count(*)
                            FROM signup_request_events
                           WHERE signup_request_id=%s
                           GROUP BY event_type
                           ORDER BY event_type
                          """,
                          [request_id],
                      )
                      events = cur.fetchall()
                      print('signup_incident_event_types=' + (','.join(f'{kind}:{count}' for kind, count in events) if events else 'none'))

                      cur.execute(
                          """
                          SELECT status, attempt_count, last_error_code, created_at,
                                 delivered_at IS NOT NULL
                            FROM signup_verification_delivery_outbox
                           WHERE signup_request_id=%s
                           ORDER BY created_at DESC, id DESC
                          """,
                          [request_id],
                      )
                      outboxes = cur.fetchall()
                      print(f'signup_incident_outbox_count={len(outboxes)}')
                      if outboxes:
                          outbox_status, attempt_count, last_error_code, outbox_created_at, delivered = outboxes[0]
                          print(f'signup_incident_latest_outbox_status={outbox_status}')
                          print(f'signup_incident_outbox_attempt_count={attempt_count}')
                          print(f'signup_incident_outbox_error_code={last_error_code or "none"}')
                          print(f'signup_incident_outbox_created_age_minutes={age_minutes(outbox_created_at)}')
                          print(f'signup_incident_outbox_delivered={yesno(delivered)}')

                      cur.execute(
                          """
                          SELECT count(*),
                                 count(*) FILTER (
                                     WHERE consumed_at IS NULL
                                       AND revoked_at IS NULL
                                       AND expires_at > now()
                                 )
                            FROM signup_email_verification_tokens
                           WHERE signup_request_id=%s
                          """,
                          [request_id],
                      )
                      token_count, live_token_count = cur.fetchone()
                      print(f'signup_incident_token_count={token_count}')
                      print(f'signup_incident_live_token_count={live_token_count}')
                  else:
                      print('signup_incident_event_types=none')
                      print('signup_incident_outbox_count=0')
                      print('signup_incident_token_count=0')
                      print('signup_incident_live_token_count=0')

                  cur.execute(
                      "SELECT count(*) FROM user_group_map WHERE user_id=%s",
                      [user_id],
                  )
                  print(f'signup_incident_membership_count={cur.fetchone()[0]}')
                  print('signup_incident_read_only_complete=yes')
              finally:
                  cur.execute('ROLLBACK')
          PY
          REMOTE
