name: GIS Survey final fields PostGIS tests
on:
  pull_request:
    branches: [release/stabilized-deploy]
  push:
    branches: [release/stabilized-deploy]
permissions:
  contents: read
jobs:
  survey-final-postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: survey_test
          POSTGRES_PASSWORD: survey_test
          POSTGRES_DB: survey_final_test
        ports: [55448:5432]
        options: >-
          --health-cmd "pg_isready -U survey_test -d survey_final_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/ci/test_survey_final_postgis.py
        env:
          GEOFLOW_SURVEY_TEST_PG: '1'
