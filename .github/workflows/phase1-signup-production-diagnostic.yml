name: Phase 1 signup production diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-signup-production-diagnostic.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  signup-production-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Inspect signup readiness without exposing configuration values
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || { echo 'signup_diag_blocker=stabilized_service_not_running'; exit 2; }

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || { echo 'signup_diag_blocker=service_working_directory_missing'; exit 2; }
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || { echo 'signup_diag_blocker=service_repo_missing'; exit 2; }
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || { echo 'signup_diag_blocker=stabilized_venv_python_missing'; exit 2; }

          echo "signup_diag_deployed_sha=$(git -C "$repo" rev-parse HEAD)"
          echo "signup_diag_deployed_branch=$(git -C "$repo" rev-parse --abbrev-ref HEAD)"

          public_signup="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/signup/ || true)"
          public_resend="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/signup/resend/ || true)"
          echo "signup_diag_public_signup_status=$public_signup"
          echo "signup_diag_public_resend_status=$public_resend"

          "$python" - "$repo" <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          from django.conf import settings
          from control.services.production_runtime_preflight import inspect_production_runtime_preflight
          from control.services.signup_runtime_readiness import (
              NAVER_SMTP_HOST,
              NAVER_SMTP_PORT,
              SMTP_BACKEND,
              signup_public_runtime_ready,
          )
          from control.services.signup_verification_outbox_feature import signup_verification_outbox_enabled
          from control.services.signup_verification_outbox_config import load_signup_verification_outbox_config
          from control.services.signup_verification_runtime import load_signup_email_verification_key_ring
          from control.services.signup_verification_service import EmailVerificationConfigurationError
          from control.views_legal import legal_documents_ready
          from control.views_signup import _legal_documents_confirmed, _legal_versions_current

          def yes(value):
              return "yes" if bool(value) else "no"

          def env_or_setting_text(name):
              raw = os.environ.get(name)
              if isinstance(raw, str) and raw.strip():
                  return raw.strip()
              configured = getattr(settings, name, None)
              if isinstance(configured, str) and configured.strip():
                  return configured.strip()
              return ""

          preflight = inspect_production_runtime_preflight()
          print(f"signup_diag_production_runtime_ready={yes(preflight.ready)}")
          for check in preflight.checks:
              if check.code in {
                  "site_origin",
                  "signup_terms_url",
                  "signup_privacy_url",
                  "legal_versions",
                  "legal_confirmation",
                  "signup_runtime",
              }:
                  print(f"signup_diag_preflight_{check.code}={check.status.lower()}")

          outbox_enabled = signup_verification_outbox_enabled()
          print(f"signup_diag_outbox_enabled={yes(outbox_enabled)}")

          try:
              key_ring = load_signup_email_verification_key_ring()
              key_ring_ok = bool(key_ring)
          except (EmailVerificationConfigurationError, ValueError, TypeError):
              key_ring_ok = False
          print(f"signup_diag_key_ring_ready={yes(key_ring_ok)}")

          try:
              outbox = load_signup_verification_outbox_config()
              outbox_ready = True
          except (EmailVerificationConfigurationError, ValueError, TypeError):
              outbox = None
              outbox_ready = False
          print(f"signup_diag_outbox_config_ready={yes(outbox_ready)}")

          site_origin = env_or_setting_text("SITE_ORIGIN")
          site = urlsplit(site_origin)
          site_origin_ok = bool(
              site.scheme == "https"
              and site.netloc.lower() == "geoflow.co.kr"
              and site.path in ("", "/")
              and not site.query
              and not site.fragment
              and not site.username
              and not site.password
          )
          print(f"signup_diag_site_origin_ready={yes(site_origin_ok)}")

          verification_url_ok = False
          if outbox is not None:
              verification = urlsplit(outbox.verification_url)
              verification_url_ok = bool(
                  verification.scheme == "https"
                  and verification.netloc.lower() == "geoflow.co.kr"
                  and verification.path == "/signup/verify/"
                  and not verification.query
                  and not verification.fragment
                  and not verification.username
                  and not verification.password
                  and (verification.scheme.lower(), verification.netloc.lower())
                      == (site.scheme.lower(), site.netloc.lower())
              )
          print(f"signup_diag_verification_url_ready={yes(verification_url_ok)}")

          backend_ok = str(getattr(settings, "EMAIL_BACKEND", "")).strip() == SMTP_BACKEND
          host_ok = str(getattr(settings, "EMAIL_HOST", "")).strip().lower() == NAVER_SMTP_HOST
          port = getattr(settings, "EMAIL_PORT", None)
          port_ok = isinstance(port, int) and not isinstance(port, bool) and port == NAVER_SMTP_PORT
          tls_ok = getattr(settings, "EMAIL_USE_TLS", False) is True
          smtp_user_ok = bool(str(getattr(settings, "EMAIL_HOST_USER", "") or "").strip())
          smtp_password_ok = bool(str(getattr(settings, "EMAIL_HOST_PASSWORD", "") or "").strip())
          sender = env_or_setting_text("DEFAULT_FROM_EMAIL")
          sender_ok = bool(sender and not sender.endswith("@geoflow.local"))
          print(f"signup_diag_smtp_backend_ready={yes(backend_ok)}")
          print(f"signup_diag_smtp_host_ready={yes(host_ok)}")
          print(f"signup_diag_smtp_port_ready={yes(port_ok)}")
          print(f"signup_diag_smtp_tls_ready={yes(tls_ok)}")
          print(f"signup_diag_smtp_user_present={yes(smtp_user_ok)}")
          print(f"signup_diag_smtp_password_present={yes(smtp_password_ok)}")
          print(f"signup_diag_sender_ready={yes(sender_ok)}")

          cooldown = getattr(settings, "SIGNUP_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS", None)
          cooldown_ok = isinstance(cooldown, int) and not isinstance(cooldown, bool) and cooldown > 0
          print(f"signup_diag_resend_cooldown_ready={yes(cooldown_ok)}")

          print(f"signup_diag_legal_documents_ready={yes(legal_documents_ready())}")
          print(f"signup_diag_legal_versions_current={yes(_legal_versions_current())}")
          print(f"signup_diag_legal_confirmation={yes(_legal_documents_confirmed())}")

          try:
              public_runtime = signup_public_runtime_ready()
          except Exception:
              public_runtime = False
              print("signup_diag_signup_runtime_exception=yes")
          else:
              print("signup_diag_signup_runtime_exception=no")
          print(f"signup_diag_signup_public_runtime_ready={yes(public_runtime)}")
          print("phase1_signup_production_diagnostic_complete=yes")
          PY
          REMOTE
