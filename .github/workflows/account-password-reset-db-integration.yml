name: Account password reset DB integration

on:
  push:
    branches:
      - release/stabilized-deploy
  pull_request:
    branches:
      - release/stabilized-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  password-reset-db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geoflow_ci
          POSTGRES_PASSWORD: ci-postgres-placeholder
          POSTGRES_DB: geoflow_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoflow_ci -d geoflow_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: geoflow_project.ci_migration_settings
      DJANGO_SECRET_KEY: ci-password-reset-db-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,geoflow.co.kr
      CENTRAL_DB_NAME: geoflow_control
      CENTRAL_DB_USER: geoflow_ci
      CENTRAL_DB_PASSWORD: ci-postgres-placeholder
      CENTRAL_DB_HOST: 127.0.0.1
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant-unused
      TENANT_DB_USER: geoflow_ci
      TENANT_DB_PASSWORD: ci-postgres-placeholder
      TENANT_DB_HOST: 127.0.0.1
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"
      AWS_REGION: ap-northeast-2
      SITE_ORIGIN: https://geoflow.co.kr
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install database integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -m py_compile scripts/ci/check_account_password_reset_db_integration.py

      - name: Bootstrap disposable central schema
        shell: bash
        env:
          PGPASSWORD: ci-postgres-placeholder
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U geoflow_ci -d geoflow_control \
            -f scripts/ci/bootstrap_central_legacy_schema.sql

      - name: Apply reviewed central migrations
        shell: bash
        run: |
          set -euo pipefail
          python manage.py migrate --database=default --noinput
          python manage.py migrate --check --database=default
          python manage.py check_account_password_reset_schema --strict

      - name: Exercise durable reset flow and roll back fixture data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/check_account_password_reset_db_integration.py
