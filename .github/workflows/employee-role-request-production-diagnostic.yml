name: Employee role request production diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-role-request-500:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Classify recent employee role request failures read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          service='geoflow-stabilized.service'
          command -v journalctl >/dev/null 2>&1 || { echo 'role_request_diagnostic_blocker=journalctl_missing'; exit 2; }
          sudo -n true >/dev/null 2>&1 || { echo 'role_request_diagnostic_blocker=passwordless_sudo_required'; exit 2; }
          [ "$(systemctl is-active "$service" 2>/dev/null || true)" = active ] || { echo 'role_request_diagnostic_blocker=service_not_active'; exit 2; }
          journal_file="$(mktemp)"
          trap 'rm -f "$journal_file"' EXIT
          sudo -n journalctl -u "$service" --since '3 hours ago' --no-pager >"$journal_file" 2>/dev/null || true
          python3 - "$journal_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")
          blocks = re.split(r"(?=Internal Server Error: )", text)
          matches = [block for block in blocks if re.search(r"/employees/[0-9a-f-]+/request-role/", block, re.I)]
          print(f"role_request_diagnostic_matching_500s={len(matches)}")
          if not matches:
              raise SystemExit("role_request_diagnostic_blocker=no_recent_matching_500")
          block = matches[-1]
          frames = re.findall(r'File "([^"]+)", line ([0-9]+), in ([A-Za-z_][A-Za-z0-9_]*)', block)
          repo_frames = [(Path(path).name, line, function) for path, line, function in frames if "geoflow" in path.lower()]
          for index, (name, line, function) in enumerate(repo_frames[-8:], 1):
              print(f"role_request_diagnostic_frame_{index}={name}:{line}:{function}")
          terminal = re.findall(r"(?m)^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception)):\s*(.*)$", block)
          if terminal:
              exception_name = terminal[-1][0].split(".")[-1]
              message = terminal[-1][1]
              message = re.sub(r"[0-9a-f]{8}-[0-9a-f-]{27,}", "<uuid>", message, flags=re.I)
              message = re.sub(r"[^A-Za-z0-9_ .:'()/-]", "?", message)[:240]
              print(f"role_request_diagnostic_exception={exception_name}")
              print(f"role_request_diagnostic_message={message}")
          else:
              print("role_request_diagnostic_exception=unclassified")
          print("role_request_production_diagnostic_complete=yes")
          PY
          REMOTE
