name: Phase 1 SMTP production sync

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-smtp-production-sync.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  smtp-production-sync:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}
      SMTP_USER: ${{ secrets.GEOFLOW_SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.GEOFLOW_SMTP_APP_PASSWORD }}

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate inputs and desired SMTP credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          test -n "$SMTP_USER" || { echo 'missing_secret=GEOFLOW_SMTP_USER'; exit 2; }
          test -n "$SMTP_APP_PASSWORD" || { echo 'missing_secret=GEOFLOW_SMTP_APP_PASSWORD'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

          python - <<'PY'
          import os, smtplib, ssl
          user = os.environ['SMTP_USER'].strip()
          password = os.environ['SMTP_APP_PASSWORD']
          try:
              with smtplib.SMTP('smtp.naver.com', 587, timeout=20) as c:
                  c.ehlo()
                  c.starttls(context=ssl.create_default_context())
                  c.ehlo()
                  c.login(user, password)
          except smtplib.SMTPAuthenticationError as exc:
              print(f"desired_smtp_code={getattr(exc, 'smtp_code', 'unknown')}")
              print('desired_smtp_result=authentication_failed')
              raise SystemExit(2)
          except Exception as exc:
              print(f'desired_smtp_result={exc.__class__.__name__}')
              raise SystemExit(2)
          print('desired_smtp_result=ready')
          PY

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Stage SMTP credentials securely
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s' "$SMTP_USER" > "$tmpdir/user"
          printf '%s' "$SMTP_APP_PASSWORD" > "$tmpdir/password"
          chmod 600 "$tmpdir/user" "$tmpdir/password"
          remote_base="/tmp/geoflow-smtp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scp -q -i "$HOME/.ssh/geoflow_deploy_key" -P "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$tmpdir/user" "$SSH_USER@$SSH_HOST:${remote_base}.user"
          scp -q -i "$HOME/.ssh/geoflow_deploy_key" -P "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$tmpdir/password" "$SSH_USER@$SSH_HOST:${remote_base}.password"
          echo "REMOTE_SECRET_BASE=$remote_base" >> "$GITHUB_ENV"

      - name: Sync server .env, verify SMTP, and restart web service
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "REMOTE_SECRET_BASE='$REMOTE_SECRET_BASE' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077

          web_service='geoflow-stabilized.service'
          user_file="${REMOTE_SECRET_BASE}.user"
          password_file="${REMOTE_SECRET_BASE}.password"
          cleanup() { rm -f "$user_file" "$password_file"; }
          fail() { echo "smtp_sync_blocker=$1"; exit 2; }

          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'
          [ -s "$user_file" ] || fail 'staged_user_missing'
          [ -s "$password_file" ] || fail 'staged_password_missing'

          active="$(systemctl show "$web_service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$web_service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running_before_sync'

          workdir="$(systemctl show "$web_service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'

          backup="$(mktemp "$repo/.env.smtp-sync-backup.XXXXXX")"
          cp -p "$repo/.env" "$backup"
          mutation_started=0

          rollback() {
            set +e
            if [ "$mutation_started" -eq 1 ] && [ -f "$backup" ]; then
              cp -p "$backup" "$repo/.env"
              sudo -n systemctl restart "$web_service" >/dev/null 2>&1 || true
              sleep 2
            fi
            rm -f "$backup"
            cleanup
            echo 'smtp_sync_rollback_completed=yes'
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              rollback
            else
              rm -f "$backup"
              cleanup
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          mutation_started=1
          "$python" - "$repo/.env" "$user_file" "$password_file" <<'PY'
          import os, sys
          from pathlib import Path

          env_path = Path(sys.argv[1])
          user = Path(sys.argv[2]).read_text().strip()
          password = Path(sys.argv[3]).read_text()
          if not user or not password or '\n' in user or '\r' in user or '\n' in password or '\r' in password:
              print('smtp_sync_server_config_valid=no')
              raise SystemExit(2)

          updates = {
              'EMAIL_HOST': 'smtp.naver.com',
              'EMAIL_PORT': '587',
              'EMAIL_USE_TLS': 'true',
              'EMAIL_HOST_USER': user,
              'EMAIL_HOST_PASSWORD': password,
          }
          lines = env_path.read_text().splitlines()
          seen = set()
          out = []
          for line in lines:
              stripped = line.lstrip()
              if not stripped or stripped.startswith('#') or '=' not in line:
                  out.append(line)
                  continue
              key = line.split('=', 1)[0].strip()
              if key in updates:
                  out.append(f'{key}={updates[key]}')
                  seen.add(key)
              else:
                  out.append(line)
          for key, value in updates.items():
              if key not in seen:
                  out.append(f'{key}={value}')
          tmp = env_path.with_name(env_path.name + '.smtp-sync.tmp')
          tmp.write_text('\n'.join(out) + '\n')
          os.chmod(tmp, 0o600)
          os.replace(tmp, env_path)
          print('smtp_sync_env_updated=yes')
          PY

          "$python" - "$repo/.env" <<'PY'
          import smtplib, ssl, sys
          from dotenv import dotenv_values

          values = dotenv_values(sys.argv[1])
          host = (values.get('EMAIL_HOST') or '').strip()
          port = int(values.get('EMAIL_PORT') or '0')
          user = (values.get('EMAIL_HOST_USER') or '').strip()
          password = values.get('EMAIL_HOST_PASSWORD') or ''
          tls = str(values.get('EMAIL_USE_TLS') or '').strip().lower() in {'1','true','yes','on'}
          if host != 'smtp.naver.com' or port != 587 or not user or not password or not tls:
              print('smtp_sync_server_config_valid=no')
              raise SystemExit(2)
          try:
              with smtplib.SMTP(host, port, timeout=20) as c:
                  c.ehlo()
                  c.starttls(context=ssl.create_default_context())
                  c.ehlo()
                  c.login(user, password)
          except smtplib.SMTPAuthenticationError as exc:
              print(f"smtp_sync_smtp_code={getattr(exc, 'smtp_code', 'unknown')}")
              print('smtp_sync_result=authentication_failed')
              raise SystemExit(2)
          print('smtp_sync_result=ready')
          PY

          sudo -n systemctl restart "$web_service"
          sleep 2
          active="$(systemctl show "$web_service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$web_service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running_after_restart'

          mutation_started=0
          rm -f "$backup"
          trap - EXIT
          cleanup
          echo 'smtp_sync_completed=yes'
          REMOTE
