name: Account security regression

on:
  push:
    branches:
      - release/stabilized-deploy
  pull_request:
    branches:
      - release/stabilized-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-account-security-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,geoflow.co.kr
      CENTRAL_DB_NAME: ci-central
      CENTRAL_DB_USER: ci-central-user
      CENTRAL_DB_PASSWORD: ci-nonsecret-placeholder
      CENTRAL_DB_HOST: central.example.internal
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant
      TENANT_DB_USER: ci-tenant-user
      TENANT_DB_PASSWORD: ci-nonsecret-placeholder
      TENANT_DB_HOST: tenant.example.internal
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"
      AWS_REGION: ap-northeast-2
      SITE_ORIGIN: https://geoflow.co.kr

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install exact Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile account security modules
        run: |
          python -m py_compile \
            control/services/central_password_change_service.py \
            control/services/account_password_reset_token_service.py \
            control/services/account_password_reset_delivery.py \
            control/services/account_password_reset_outbox_service.py \
            control/services/account_password_reset_service.py \
            control/services/account_password_reset_schema_readiness.py \
            control/views_account_security.py \
            control/views_password_reset.py \
            control/management/commands/process_account_password_reset_outbox.py \
            control/management/commands/check_account_password_reset_schema.py
          bash -n scripts/ops/account_security_production_rollout.sh

      - name: Run account security regression tests
        run: |
          python manage.py test \
            control.test_account_password_change \
            control.test_account_password_reset \
            control.test_account_password_reset_token_service \
            control.test_account_password_reset_delivery \
            control.test_account_password_reset_schema_readiness \
            control.test_account_security_rollout_contract
