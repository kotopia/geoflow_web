name: Phase 1 signup SMTP DATA diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-signup-smtp-data-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signup-smtp-data-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      TARGET_EMAIL_SHA256: e1b8b40b9a712fb8de657d6adc788db895f0487543b1b22a22bd3b0005458035

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Send one diagnostic email through Django SMTP DATA path
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
            "TARGET_EMAIL_SHA256='$TARGET_EMAIL_SHA256' bash -s" <<'REMOTE'
          set -euo pipefail
          service='geoflow-stabilized.service'
          workdir="$(systemctl show "$service" -p WorkingDirectory --value)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel)"
          python="$repo/.venv/bin/python"
          cd "$repo"

          TARGET_EMAIL_SHA256="$TARGET_EMAIL_SHA256" DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import hashlib
          import os
          import smtplib
          import socket

          import django
          django.setup()

          from django.conf import settings
          from django.core.mail import EmailMessage, get_connection
          from django.db import connections

          target_hash = os.environ['TARGET_EMAIL_SHA256']
          recipient = None

          with connections['default'].cursor() as cur:
              cur.execute('BEGIN READ ONLY')
              try:
                  cur.execute(
                      "SELECT email FROM users "
                      "WHERE created_at >= now() - interval '7 days' "
                      "ORDER BY created_at DESC LIMIT 1000"
                  )
                  matches = []
                  for (email,) in cur.fetchall():
                      normalized = (email or '').strip().lower()
                      if hashlib.sha256(normalized.encode()).hexdigest() == target_hash:
                          matches.append(normalized)
                  print(f'signup_data_diag_recipient_match_count={len(matches)}')
                  if len(matches) != 1:
                      raise SystemExit(3)
                  recipient = matches[0]
              finally:
                  cur.execute('ROLLBACK')

          sender = (
              (os.environ.get('DEFAULT_FROM_EMAIL') or '').strip()
              or str(getattr(settings, 'DEFAULT_FROM_EMAIL', '') or '').strip()
          )
          host = str(getattr(settings, 'EMAIL_HOST', '') or '').strip()
          port = int(getattr(settings, 'EMAIL_PORT', 0) or 0)
          use_tls = bool(getattr(settings, 'EMAIL_USE_TLS', False))
          smtp_user = str(getattr(settings, 'EMAIL_HOST_USER', '') or '').strip()
          smtp_password = str(getattr(settings, 'EMAIL_HOST_PASSWORD', '') or '')

          print('signup_data_diag_sender_present=' + ('yes' if sender else 'no'))
          print('signup_data_diag_smtp_ready=' + ('yes' if (host == 'smtp.naver.com' and port == 587 and use_tls and smtp_user and smtp_password) else 'no'))
          if not recipient or not sender or host != 'smtp.naver.com' or port != 587 or not use_tls or not smtp_user or not smtp_password:
              raise SystemExit(2)

          subject = '[GeoFlow] SMTP 전송 진단'
          body = (
              'GeoFlow 회원가입 이메일 발송 경로를 점검하기 위한 1회 진단 메일입니다.\n\n'
              '이 메일에는 인증 토큰이나 비밀번호가 포함되어 있지 않습니다.\n'
              '별도의 조치는 필요하지 않습니다.\n'
          )

          try:
              connection = get_connection(timeout=20, fail_silently=False)
              message = EmailMessage(
                  subject=subject,
                  body=body,
                  from_email=sender,
                  to=[recipient],
                  connection=connection,
              )
              sent_count = message.send(fail_silently=False)
              print(f'signup_data_diag_sent_count={sent_count}')
              if sent_count != 1:
                  print('signup_data_diag_result=unexpected_send_count')
                  raise SystemExit(4)
              print('signup_data_diag_result=delivered_to_smtp')
          except smtplib.SMTPResponseException as exc:
              print('signup_data_diag_exception=SMTPResponseException')
              print(f'signup_data_diag_smtp_code={getattr(exc, "smtp_code", "unknown")}')
              print('signup_data_diag_result=failed')
              raise SystemExit(5)
          except smtplib.SMTPRecipientsRefused as exc:
              print('signup_data_diag_exception=SMTPRecipientsRefused')
              codes = sorted({getattr(v, 'smtp_code', v[0] if isinstance(v, tuple) and v else 'unknown') for v in exc.recipients.values()})
              print('signup_data_diag_recipient_codes=' + ','.join(str(c) for c in codes))
              print('signup_data_diag_result=failed')
              raise SystemExit(5)
          except (socket.timeout, TimeoutError):
              print('signup_data_diag_exception=timeout')
              print('signup_data_diag_result=failed')
              raise SystemExit(5)
          except Exception as exc:
              print('signup_data_diag_exception=' + exc.__class__.__name__)
              code = getattr(exc, 'smtp_code', None)
              if code is not None:
                  print(f'signup_data_diag_smtp_code={code}')
              print('signup_data_diag_result=failed')
              raise SystemExit(5)
          PY
          REMOTE
