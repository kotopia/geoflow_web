name: iroomsng exception class contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-exception-class-diagnostic.yml
      - control/test_iroomsng_exception_class_contract.py
      - .github/workflows/iroomsng-exception-class-contract.yml
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-exception-class-diagnostic.yml
      - control/test_iroomsng_exception_class_contract.py
      - .github/workflows/iroomsng-exception-class-contract.yml

permissions:
  contents: read

jobs:
  iroomsng-exception-class-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate bounded read-only exception diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest control.test_iroomsng_exception_class_contract
