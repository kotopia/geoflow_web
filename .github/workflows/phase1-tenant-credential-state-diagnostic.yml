name: Phase 1 tenant credential state diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-tenant-credential-state-diagnostic.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  tenant-credential-state-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Read-only tenant credential state diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || { echo 'tenant_credential_diag_blocker=stabilized_service_not_running'; exit 2; }

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || { echo 'tenant_credential_diag_blocker=service_working_directory_missing'; exit 2; }
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || { echo 'tenant_credential_diag_blocker=service_repo_missing'; exit 2; }
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || { echo 'tenant_credential_diag_blocker=stabilized_venv_python_missing'; exit 2; }

          # Never print passwords, AWS keys/tokens, secret payloads, account IDs,
          # ARNs, group IDs/codes/names, DB aliases, usernames, hosts, or DB names.
          "$python" - "$repo" <<'PY'
          import hmac
          import json
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import boto3
          import psycopg2
          from botocore.exceptions import ClientError

          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          alias = "default"
          rows = list(
              GroupDBConfig.objects.using(alias)
              .select_related("group")
              .order_by("group_id")
          )
          if not rows:
              raise SystemExit("tenant_credential_diag_blocker=no_tenant_db_configs")

          def text(value):
              return str(value or "").strip()

          def identity(row):
              return (text(row.db_host).lower(), int(row.db_port), text(row.db_user))

          def connection_works(row, password):
              if not password:
                  return False
              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=row.db_host,
                      port=row.db_port,
                      sslmode="require",
                      connect_timeout=8,
                  )
                  try:
                      with conn.cursor() as cursor:
                          cursor.execute("SELECT 1")
                          value = cursor.fetchone()
                          return bool(value and value[0] == 1)
                  finally:
                      conn.close()
              except Exception:
                  return False

          empty_rows = [r for r in rows if not text(r.db_password)]
          nonempty_rows = [r for r in rows if text(r.db_password)]
          active_rows = [r for r in rows if text(getattr(r.group, "status", "")).lower() == "active"]
          inactive_rows = [r for r in rows if r not in active_rows]
          active_empty = [r for r in empty_rows if r in active_rows]
          inactive_empty = [r for r in empty_rows if r in inactive_rows]

          required_missing = 0
          for row in rows:
              required = (row.db_name, row.db_host, row.db_port, row.db_user)
              if any(value is None or not text(value) for value in required):
                  required_missing += 1

          print(f"tenant_credential_total={len(rows)}")
          print(f"tenant_credential_active={len(active_rows)}")
          print(f"tenant_credential_inactive={len(inactive_rows)}")
          print(f"tenant_credential_password_empty={len(empty_rows)}")
          print(f"tenant_credential_active_password_empty={len(active_empty)}")
          print(f"tenant_credential_inactive_password_empty={len(inactive_empty)}")
          print(f"tenant_credential_required_metadata_missing={required_missing}")
          print(f"tenant_credential_secret_refs={sum(1 for r in rows if is_tenant_db_secret_reference(r.db_password))}")

          # Resolve non-empty credentials in memory only. This supports either plaintext
          # or already-transitioned references without logging any value.
          region = text(os.environ.get("AWS_REGION")) or "ap-northeast-2"
          sm = boto3.client("secretsmanager", region_name=region)
          resolved_nonempty = []
          for row in nonempty_rows:
              try:
                  value = resolve_tenant_db_password(row.db_password, client=sm)
              except Exception:
                  value = ""
              if value:
                  resolved_nonempty.append((row, value))

          # For each empty row, determine whether an existing peer with the exact same
          # host/port/user identity supplies one unambiguous password that actually logs in.
          peer_candidate_rows = 0
          peer_connection_ok = 0
          for row in empty_rows:
              candidates = []
              for peer, password in resolved_nonempty:
                  if identity(peer) == identity(row) and password not in candidates:
                      candidates.append(password)
              if len(candidates) == 1:
                  peer_candidate_rows += 1
                  if connection_works(row, candidates[0]):
                      peer_connection_ok += 1

          print(f"tenant_credential_empty_with_unique_peer_candidate={peer_candidate_rows}")
          print(f"tenant_credential_empty_peer_connection_ok={peer_connection_ok}")

          # Also test existing runtime env credential candidates, values never printed.
          env_candidates = []
          for source in ("TENANT_DB_PASSWORD", "PROVISIONER_DB_PASSWORD", "CENTRAL_DB_PASSWORD"):
              value = text(os.environ.get(source))
              if value and value not in [v for _, v in env_candidates]:
                  env_candidates.append((source, value))

          env_resolvable_rows = 0
          for row in empty_rows:
              if any(connection_works(row, value) for _, value in env_candidates):
                  env_resolvable_rows += 1
          print(f"tenant_credential_empty_env_connection_ok={env_resolvable_rows}")

          # Detect any secrets created by an earlier partial attempt. Read-only only.
          expected_existing = 0
          expected_matching = 0
          expected_mismatch = 0
          expected_missing = 0
          expected_denied = 0
          for row in rows:
              secret_id = f"geoflow/tenant-db/{row.group_id}/password"
              try:
                  response = sm.get_secret_value(SecretId=secret_id)
              except ClientError as exc:
                  code = text(exc.response.get("Error", {}).get("Code"))
                  if code in {"ResourceNotFoundException", "ResourceNotFound"}:
                      expected_missing += 1
                  elif code in {"AccessDeniedException", "AccessDenied", "UnauthorizedException"}:
                      expected_denied += 1
                  continue
              except Exception:
                  continue

              expected_existing += 1
              secret_string = response.get("SecretString")
              try:
                  payload = json.loads(secret_string) if isinstance(secret_string, str) else None
                  secret_password = payload.get("password") if isinstance(payload, dict) else None
              except Exception:
                  secret_password = None

              raw = text(row.db_password)
              if raw and not is_tenant_db_secret_reference(raw) and isinstance(secret_password, str):
                  if hmac.compare_digest(secret_password, raw):
                      expected_matching += 1
                  else:
                      expected_mismatch += 1

          print(f"tenant_credential_expected_secrets_existing={expected_existing}")
          print(f"tenant_credential_expected_secrets_matching_plaintext={expected_matching}")
          print(f"tenant_credential_expected_secrets_mismatch={expected_mismatch}")
          print(f"tenant_credential_expected_secrets_missing={expected_missing}")
          print(f"tenant_credential_expected_secrets_denied={expected_denied}")

          unresolved = 0
          for row in empty_rows:
              peer_passwords = []
              for peer, password in resolved_nonempty:
                  if identity(peer) == identity(row) and password not in peer_passwords:
                      peer_passwords.append(password)
              peer_ok = len(peer_passwords) == 1 and connection_works(row, peer_passwords[0])
              env_ok = any(connection_works(row, value) for _, value in env_candidates)
              if not peer_ok and not env_ok:
                  unresolved += 1
          print(f"tenant_credential_empty_unresolved={unresolved}")
          print("phase1_tenant_credential_state_diagnostic_complete=yes")
          PY
          REMOTE
