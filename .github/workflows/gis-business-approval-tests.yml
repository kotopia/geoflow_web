name: GIS business approval guard

on:
  pull_request:
    branches: [release/stabilized-deploy]
  push:
    branches: [release/stabilized-deploy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-metadata-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geoflow_test
          POSTGRES_PASSWORD: geoflow_test
          POSTGRES_DB: geoflow_forms_test
        ports: [55440:5432]
        options: >-
          --health-cmd "pg_isready -U geoflow_test -d geoflow_forms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary==2.9.10 Django==5.2.4
      - name: Central definition migration and validation guards
        env:
          GEOFLOW_FORMS_ISOLATED_PG: '1'
        run: python -m unittest geoflow_ops.gis.test_central_definitions -v
      - name: Reject retired tenant definition paths
        run: |
          test ! -e geoflow_ops/gis/business_fields.py
          test ! -e geoflow_ops/gis/business_approval.py
          test ! -e scripts/ops/sync_gis_catalog_capability_bindings.py
