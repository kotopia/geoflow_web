name: GIS business approval guard

on:
  pull_request:
    branches: [release/stabilized-deploy]
  push:
    branches: [release/stabilized-deploy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-metadata-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geoflow_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [55439:5432]
        options: >-
          --health-cmd "pg_isready -U geoflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary==2.9.10 PyYAML==6.0.2
      - name: Exact metadata transition and drift guards
        env:
          GEOFLOW_RUN_ISOLATED_POSTGIS: '1'
        run: python scripts/ci/test_business_approval_postgres.py
      - name: Protected workflow and shell contract
        run: python scripts/ci/test_business_deploy_workflow.py
