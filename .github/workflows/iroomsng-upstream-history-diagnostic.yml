name: iroomsng upstream history diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-upstream-history-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iroomsng-upstream-history:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/stabilized-deploy
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Attribute iroomsng upstream history read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v nginx >/dev/null 2>&1 || { echo 'iroomsng_hist_blocker=nginx_missing'; exit 2; }
          command -v python3 >/dev/null 2>&1 || { echo 'iroomsng_hist_blocker=python_missing'; exit 2; }
          command -v ss >/dev/null 2>&1 || { echo 'iroomsng_hist_blocker=ss_missing'; exit 2; }
          sudo -n true >/dev/null 2>&1 || { echo 'iroomsng_hist_blocker=passwordless_sudo_required'; exit 2; }

          nginx_dump="$(mktemp)"
          backup_list="$(mktemp)"
          history_summary="$(mktemp)"
          trap 'rm -f "$nginx_dump" "$backup_list" "$history_summary"' EXIT
          sudo -n nginx -T >"$nginx_dump" 2>/dev/null || { echo 'iroomsng_hist_blocker=nginx_config_read_failed'; exit 2; }

          python3 - "$nginx_dump" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors='replace')

          def server_blocks(source):
              out = []
              for match in re.finditer(r'(?m)^\s*server\s*\{', source):
                  start = source.find('{', match.start())
                  if start < 0:
                      continue
                  depth = 0
                  end = None
                  for i in range(start, len(source)):
                      ch = source[i]
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if end:
                      out.append(source[match.start():end])
              return out

          def ports_for(domain):
              ports = set()
              blocks = 0
              for block in server_blocks(text):
                  if re.search(rf'server_name\s+[^;]*\b{re.escape(domain)}\b', block, re.I):
                      blocks += 1
                      ports.update(re.findall(r'proxy_pass\s+http://127\.0\.0\.1:(\d{1,5})\s*;', block, re.I))
              return blocks, sorted(ports)

          ib, ip = ports_for('iroomsng.kr')
          gb, gp = ports_for('geoflow.co.kr')
          print(f'iroomsng_hist_iroomsng_server_blocks={ib}')
          print(f'iroomsng_hist_iroomsng_upstream_count={len(ip)}')
          print(f'iroomsng_hist_geoflow_server_blocks={gb}')
          print(f'iroomsng_hist_geoflow_upstream_count={len(gp)}')
          same = len(ip) == 1 and len(gp) == 1 and ip[0] == gp[0]
          print(f"iroomsng_hist_same_upstream_as_geoflow={'yes' if same else 'no'}")
          if len(ip) != 1:
              raise SystemExit('iroomsng_hist_blocker=single_iroomsng_upstream_not_proven')
          print(f'IROOMSNG_PORT={ip[0]}')
          PY

          current_port="$(python3 - "$nginx_dump" <<'PY'
          import re, sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(errors='replace')
          blocks=[]
          for m in re.finditer(r'(?m)^\s*server\s*\{', text):
              s=text.find('{',m.start()); d=0; e=None
              for i in range(s,len(text)):
                  if text[i]=='{': d+=1
                  elif text[i]=='}':
                      d-=1
                      if d==0: e=i+1; break
              if e:
                  b=text[m.start():e]
                  if re.search(r'server_name\s+[^;]*\biroomsng\.kr\b',b,re.I): blocks.append(b)
          ports=set()
          for b in blocks: ports.update(re.findall(r'proxy_pass\s+http://127\.0\.0\.1:(\d{1,5})\s*;',b,re.I))
          if len(ports)!=1: raise SystemExit(3)
          print(next(iter(ports)))
          PY
          )" || { echo 'iroomsng_hist_blocker=current_port_parse_failed'; exit 2; }
          printf '%s' "$current_port" | grep -Eq '^[0-9]{1,5}$' || { echo 'iroomsng_hist_blocker=invalid_current_port'; exit 2; }

          if ss -ltnH | awk '{print $4}' | grep -Eq "(^|:)${current_port}$"; then
            echo 'iroomsng_hist_current_listener_present=yes'
          else
            echo 'iroomsng_hist_current_listener_present=no'
          fi

          # Known GeoFlow units are checked only through bounded booleans/state.
          for unit in geoflow-stabilized.service geoflow.service gunicorn.service; do
            present='no'
            targets='no'
            active='unknown'
            if systemctl cat "$unit" >/dev/null 2>&1; then
              present='yes'
              raw_state="$(systemctl show "$unit" -p ActiveState --value 2>/dev/null || true)"
              case "$raw_state" in active|inactive|failed|activating|deactivating|reloading|maintenance) active="$raw_state";; esac
              exec_start="$(systemctl show "$unit" -p ExecStart --value 2>/dev/null || true)"
              if printf '%s' "$exec_start" | grep -Eq "(127\\.0\\.0\\.1|0\\.0\\.0\\.0|localhost):${current_port}([^0-9]|$)"; then targets='yes'; fi
            fi
            safe="$(printf '%s' "$unit" | tr '.-' '__')"
            echo "iroomsng_hist_${safe}_present=${present}"
            echo "iroomsng_hist_${safe}_active_state=${active}"
            echo "iroomsng_hist_${safe}_targets_current_port=${targets}"
          done

          # Search only backup/disabled nginx files; never print file contents or names.
          find /etc/nginx -type f \( -name '*.bak' -o -name '*.old' -o -name '*.orig' -o -name '*.save' -o -name '*~' -o -name '*.disabled' \) -print 2>/dev/null | sort -u >"$backup_list"
          backup_count="$(wc -l <"$backup_list" | tr -d ' ')"
          echo "iroomsng_hist_nginx_backup_file_count=${backup_count}"

          python3 - "$backup_list" "$current_port" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          list_path = Path(sys.argv[1])
          current = sys.argv[2]
          unique_ports = set()
          files_with_iroomsng = 0
          for raw in list_path.read_text().splitlines():
              path = raw.strip()
              if not path:
                  continue
              try:
                  cp = subprocess.run(['sudo','-n','cat','--',path], capture_output=True, text=True, timeout=3)
              except Exception:
                  continue
              if cp.returncode != 0:
                  continue
              text = cp.stdout
              if not re.search(r'\biroomsng\.kr\b', text, re.I):
                  continue
              files_with_iroomsng += 1
              unique_ports.update(re.findall(r'proxy_pass\s+http://127\.0\.0\.1:(\d{1,5})\s*;', text, re.I))
          alternates = sorted(p for p in unique_ports if p != current)
          print(f'iroomsng_hist_backup_files_with_iroomsng={files_with_iroomsng}')
          print(f'iroomsng_hist_historical_upstream_count={len(unique_ports)}')
          print(f'iroomsng_hist_historical_alternate_port_count={len(alternates)}')
          Path('/tmp/iroomsng_hist_alt_ports').write_text('\n'.join(alternates) + ('\n' if alternates else ''))
          PY

          alt_listener_count=0
          if [ -f /tmp/iroomsng_hist_alt_ports ]; then
            while IFS= read -r alt_port; do
              printf '%s' "$alt_port" | grep -Eq '^[0-9]{1,5}$' || continue
              if ss -ltnH | awk '{print $4}' | grep -Eq "(^|:)${alt_port}$"; then
                alt_listener_count=$((alt_listener_count + 1))
              fi
            done </tmp/iroomsng_hist_alt_ports
            rm -f /tmp/iroomsng_hist_alt_ports
          fi
          echo "iroomsng_hist_historical_alternate_listener_count=${alt_listener_count}"

          # Aggregate recent nginx connection-refused evidence without emitting raw logs.
          error_log_path="$(python3 - "$nginx_dump" <<'PY'
          import re, sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(errors='replace')
          vals=re.findall(r'(?m)^\s*error_log\s+([^\s;]+)',text)
          vals=[v for v in vals if v not in ('stderr','syslog:') and not v.startswith('syslog:')]
          print(vals[-1] if vals else '')
          PY
          )"
          refused_count=0
          if [ -n "$error_log_path" ] && sudo -n test -r "$error_log_path"; then
            refused_count="$(sudo -n tail -n 5000 "$error_log_path" 2>/dev/null | python3 - "$current_port" <<'PY'
          import re, sys
          port=sys.argv[1]
          count=0
          for line in sys.stdin:
              if 'connect() failed' in line and ('111: Connection refused' in line or 'Connection refused' in line):
                  if re.search(rf'127\.0\.0\.1:{re.escape(port)}\b', line):
                      count += 1
          print(count)
          PY
          )"
          fi
          printf '%s' "$refused_count" | grep -Eq '^[0-9]+$' || refused_count=0
          echo "iroomsng_hist_recent_current_port_refused_count=${refused_count}"
          echo 'iroomsng_hist_diagnostic_complete=yes'
          REMOTE

      - name: Verify current public root state
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://iroomsng.kr/ || true)"
          printf '%s' "$code" | grep -Eq '^[0-9]{3}$' || code='000'
          echo "iroomsng_hist_public_root_code=$code"
