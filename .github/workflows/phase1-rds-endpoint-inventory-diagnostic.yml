name: Phase 1 RDS endpoint inventory diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-rds-endpoint-inventory-diagnostic.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  rds-endpoint-inventory-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Read-only RDS inventory and tenant endpoint validation
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || { echo 'rds_inventory_diag_blocker=stabilized_service_not_running'; exit 2; }

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || { echo 'rds_inventory_diag_blocker=service_working_directory_missing'; exit 2; }
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || { echo 'rds_inventory_diag_blocker=service_repo_missing'; exit 2; }
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || { echo 'rds_inventory_diag_blocker=stabilized_venv_python_missing'; exit 2; }

          # This diagnostic never prints endpoint strings, DB identifiers/names/users,
          # passwords, secret values, AWS account IDs/ARNs, or group/user identifiers.
          "$python" - "$repo" <<'PY'
          import os
          import socket
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import boto3
          import psycopg2
          from botocore.exceptions import ClientError
          from django.db import connections

          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          def text(value):
              return str(value or "").strip()

          def is_active(row):
              return text(getattr(row.group, "status", "")).lower() == "active"

          def dns_resolves(host, port):
              try:
                  socket.getaddrinfo(text(host), int(port), type=socket.SOCK_STREAM)
                  return True
              except Exception:
                  return False

          def password_for(row):
              raw = text(row.db_password)
              if not raw:
                  return ""
              if is_tenant_db_secret_reference(raw):
                  try:
                      return resolve_tenant_db_password(raw)
                  except Exception:
                      return ""
              return raw

          def try_connect(row, password, host, port):
              if not password or not text(host):
                  return False
              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=host,
                      port=int(port),
                      sslmode="require",
                      connect_timeout=6,
                  )
                  try:
                      with conn.cursor() as cursor:
                          cursor.execute("SELECT 1")
                          value = cursor.fetchone()
                          return bool(value and value[0] == 1)
                  finally:
                      conn.close()
              except Exception:
                  return False

          rows = list(
              GroupDBConfig.objects.using("default")
              .select_related("group")
              .order_by("group_id")
          )
          active_rows = [row for row in rows if is_active(row)]
          failed_rows = [
              row for row in active_rows
              if not dns_resolves(row.db_host, row.db_port)
          ]

          serving_ids = set()
          if failed_rows:
              with connections["default"].cursor() as cursor:
                  for row in failed_rows:
                      cursor.execute(
                          """
                          SELECT EXISTS (
                              SELECT 1
                                FROM user_group_map ugm
                                JOIN users u ON u.id = ugm.user_id
                               WHERE ugm.group_id = %s
                                 AND ugm.status = 'active'
                                 AND u.is_active = TRUE
                                 AND u.email_verified = TRUE
                          )
                          """,
                          [str(row.group_id)],
                      )
                      if bool(cursor.fetchone()[0]):
                          serving_ids.add(str(row.group_id))

          region = text(os.environ.get("AWS_REGION")) or "ap-northeast-2"
          rds = boto3.client("rds", region_name=region)
          candidates = set()
          inventory_hosts = set()
          instance_api = "ok"
          cluster_api = "ok"
          instance_error = "none"
          cluster_error = "none"

          try:
              paginator = rds.get_paginator("describe_db_instances")
              for page in paginator.paginate():
                  for item in page.get("DBInstances", []):
                      engine = text(item.get("Engine")).lower()
                      if engine not in {"postgres", "aurora-postgresql"}:
                          continue
                      endpoint = item.get("Endpoint") or {}
                      host = text(endpoint.get("Address"))
                      port = endpoint.get("Port")
                      if host and port:
                          candidates.add((host, int(port)))
                          inventory_hosts.add(host.lower())
          except ClientError as exc:
              instance_api = "error"
              instance_error = text(exc.response.get("Error", {}).get("Code")) or "ClientError"
          except Exception as exc:
              instance_api = "error"
              instance_error = type(exc).__name__

          try:
              paginator = rds.get_paginator("describe_db_clusters")
              for page in paginator.paginate():
                  for item in page.get("DBClusters", []):
                      engine = text(item.get("Engine")).lower()
                      if engine != "aurora-postgresql":
                          continue
                      port = item.get("Port") or 5432
                      for key in ("Endpoint", "ReaderEndpoint"):
                          host = text(item.get(key))
                          if host:
                              candidates.add((host, int(port)))
                              inventory_hosts.add(host.lower())
          except ClientError as exc:
              cluster_api = "error"
              cluster_error = text(exc.response.get("Error", {}).get("Code")) or "ClientError"
          except Exception as exc:
              cluster_api = "error"
              cluster_error = type(exc).__name__

          exact_inventory_match = sum(
              1 for row in failed_rows
              if text(row.db_host).lower() in inventory_hosts
          )

          unique = 0
          ambiguous = 0
          unresolved = 0
          host_only = 0
          host_and_port = 0
          serving_unique = 0
          serving_unresolved = 0

          for row in failed_rows:
              password = password_for(row)
              successes = []
              for host, port in candidates:
                  if try_connect(row, password, host, port):
                      successes.append((host, port))

              if len(successes) == 1:
                  unique += 1
                  host, port = successes[0]
                  if int(port) == int(row.db_port):
                      host_only += 1
                  else:
                      host_and_port += 1
                  if str(row.group_id) in serving_ids:
                      serving_unique += 1
              elif len(successes) > 1:
                  ambiguous += 1
              else:
                  unresolved += 1
                  if str(row.group_id) in serving_ids:
                      serving_unresolved += 1

          print(f"rds_inventory_diag_active_configs={len(active_rows)}")
          print(f"rds_inventory_diag_dns_failed_configs={len(failed_rows)}")
          print(f"rds_inventory_diag_dns_failed_serving_configs={len(serving_ids)}")
          print(f"rds_inventory_diag_instance_api={instance_api}")
          print(f"rds_inventory_diag_instance_error_code={instance_error}")
          print(f"rds_inventory_diag_cluster_api={cluster_api}")
          print(f"rds_inventory_diag_cluster_error_code={cluster_error}")
          print(f"rds_inventory_diag_postgres_endpoint_candidates={len(candidates)}")
          print(f"rds_inventory_diag_stored_host_exact_inventory_match={exact_inventory_match}")
          print(f"rds_inventory_diag_unique_recoverable={unique}")
          print(f"rds_inventory_diag_unique_host_only={host_only}")
          print(f"rds_inventory_diag_unique_host_and_port={host_and_port}")
          print(f"rds_inventory_diag_ambiguous={ambiguous}")
          print(f"rds_inventory_diag_unresolved={unresolved}")
          print(f"rds_inventory_diag_serving_unique_recoverable={serving_unique}")
          print(f"rds_inventory_diag_serving_unresolved={serving_unresolved}")
          print("phase1_rds_endpoint_inventory_diagnostic_complete=yes")
          PY
          REMOTE
