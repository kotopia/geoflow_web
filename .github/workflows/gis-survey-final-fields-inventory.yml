name: GIS Survey final fields inventory

on:
  push:
    branches: [release/stabilized-deploy]
    paths:
      - .github/workflows/gis-survey-final-fields-inventory.yml

permissions:
  contents: read

jobs:
  inventory-readonly:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Inventory actual production schema read only
        shell: bash
        run: |
          set -euo pipefail
          remote_script="/tmp/geoflow-survey-inventory-${GITHUB_RUN_ID}.py"
          scp -i "$HOME/.ssh/geoflow_deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/ops/inventory_gis_survey_final_fields.py "$SSH_USER@$SSH_HOST:$remote_script"
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$remote_script'" <<'REMOTE'
          set -euo pipefail
          script="$1"
          trap 'rm -f "$script"' EXIT
          workdir="$(systemctl show geoflow-stabilized.service -p WorkingDirectory --value)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel)"
          cd "$repo"
          set -a
          . "$repo/.env"
          set +a
          export PGOPTIONS='-c default_transaction_read_only=on'
          "$repo/.venv/bin/python" "$script"
          REMOTE
