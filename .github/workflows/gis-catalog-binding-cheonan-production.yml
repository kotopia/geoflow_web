name: GIS Catalog binding Cheonan production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SYNC_GIS_CATALOG_BINDINGS:cheonan:cheonan_db
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-catalog-bindings:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/stabilized-deploy'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'gis_catalog_binding_blocker=release_advanced'
            exit 2
          }
          test "$CONFIRMATION" = 'SYNC_GIS_CATALOG_BINDINGS:cheonan:cheonan_db' || {
            echo 'gis_catalog_binding_blocker=confirmation_mismatch'
            exit 2
          }
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Upload reviewed binding sync
        shell: bash
        run: |
          set -euo pipefail
          script="/tmp/geoflow-gis-catalog-binding-$GITHUB_RUN_ID.py"
          trap 'rm -f "$script"' EXIT
          cp scripts/ops/sync_gis_catalog_capability_bindings.py "$script"
          scp \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$script" "$SSH_USER@$SSH_HOST:$script"

      - name: Rehearse then synchronize Cheonan Catalog bindings
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$GITHUB_RUN_ID' '$CONFIRMATION'" <<'REMOTE'
          set -euo pipefail
          run_id="$1"
          confirmation="$2"
          script="/tmp/geoflow-gis-catalog-binding-$run_id.py"
          trap 'rm -f "$script"' EXIT

          fail() {
            echo "gis_catalog_binding_blocker=$1"
            exit 2
          }

          [ "$confirmation" = 'SYNC_GIS_CATALOG_BINDINGS:cheonan:cheonan_db' ] || fail 'remote_confirmation_mismatch'
          [ -f "$script" ] || fail 'sync_script_missing'

          service='geoflow-stabilized.service'
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'service_not_running'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -f "$repo/manage.py" ] || fail 'service_repo_missing'
          [ "$(git -C "$repo" rev-parse HEAD)" = '9cfe158281ae2506cad9e2631edc973dab6deb06' ] || fail 'unexpected_deployed_release'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'venv_python_missing'

          cd "$repo"
          PYTHONPATH="$repo" "$python" "$script" \
            --group-code cheonan \
            --db-alias cheonan_db \
            --confirm "$confirmation"

          code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/gis/ || true)"
          case "$code" in 2??|3??) ;; *) fail 'gis_endpoint_unhealthy' ;; esac
          echo 'RESULT gis_catalog_binding_cheonan_production=SUCCESS'
          REMOTE
