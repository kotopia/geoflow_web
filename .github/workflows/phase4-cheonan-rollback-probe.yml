name: Phase 4 cheonan migration rollback probe

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase4-cheonan-rollback-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: '22'

    steps:
      - name: Checkout exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          echo "phase4_probe_release_sha=$GITHUB_SHA"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Execute exact unresolved tenant path then rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          candidate_sha="$1"
          service='geoflow-stabilized.service'
          migration_path='geoflow_ops/migrations/0024_phase4_workflow_handoff_and_contract_access.py'
          workdir="$(systemctl show "$service" -p WorkingDirectory --value)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel)"
          python="$repo/.venv/bin/python"
          git -C "$repo" fetch --prune origin refs/heads/release/stabilized-deploy >/dev/null
          test "$(git -C "$repo" rev-parse FETCH_HEAD)" = "$candidate_sha"

          "$python" - "$repo" "$candidate_sha" "$migration_path" <<'PY'
          import os
          import subprocess
          import sys
          import types

          repo, candidate_sha, migration_path = sys.argv[1:4]
          sys.path.insert(0, repo)
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'geoflow_project.settings')

          import django
          django.setup()

          import psycopg2
          from django.db import connections, transaction
          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          APP = 'webgisapp'
          DEP = '0023_phase4_configurable_workflow_foundation'
          MIG = '0024_phase4_workflow_handoff_and_contract_access'

          def text(v):
              return str(v or '').strip()

          def scalar(cur, sql, params=None):
              cur.execute(sql, params or [])
              row = cur.fetchone()
              return row[0] if row else None

          source = subprocess.check_output(
              ['git', '-C', repo, 'show', f'{candidate_sha}:{migration_path}'],
              text=True,
          )
          module = types.ModuleType('candidate_0024_probe')
          exec(compile(source, migration_path, 'exec'), module.__dict__)
          migration_sql = list(module.Migration.operations)[0].sql

          with transaction.atomic(using='default'):
              with connections['default'].cursor() as central_cur:
                  central_cur.execute('SET LOCAL TRANSACTION READ ONLY')
                  rows = list(
                      GroupDBConfig.objects.using('default')
                      .select_related('group')
                      .order_by('group_id')
                  )

          targets = [
              row for row in rows
              if text(getattr(row.group, 'status', '')).lower() == 'active'
              and text(getattr(row.group, 'code', '')).lower() == 'cheonan'
          ]
          if len(targets) != 1:
              print(f'phase4_probe_blocker=unexpected_cheonan_target_count count={len(targets)}')
              raise SystemExit(2)

          row = targets[0]
          label = f"{text(getattr(row.group, 'code', ''))}:{text(getattr(row.group, 'name', ''))}"
          raw = text(row.db_password)
          password = resolve_tenant_db_password(raw) if is_tenant_db_secret_reference(raw) else raw
          conn = psycopg2.connect(
              dbname=row.db_name,
              user=row.db_user,
              password=password,
              host=row.db_host,
              port=row.db_port,
              sslmode='require',
              connect_timeout=8,
          )

          stage = 'begin'
          try:
              conn.autocommit = False
              with conn.cursor() as cur:
                  stage = 'timeouts_and_lock'
                  cur.execute("SET LOCAL lock_timeout = '5s'")
                  cur.execute("SET LOCAL statement_timeout = '90s'")
                  cur.execute("SELECT pg_advisory_xact_lock(hashtext(%s))", ['geoflow:webgisapp:0024-probe'])

                  stage = 'dependency_check'
                  dep = bool(scalar(cur, 'SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)', [APP, DEP]))
                  mig = bool(scalar(cur, 'SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)', [APP, MIG]))
                  if not dep:
                      raise RuntimeError('0023 dependency not applied')
                  if mig:
                      raise RuntimeError('0024 already applied unexpectedly')

                  stage = 'before_counts'
                  before = {
                      'contracts': int(scalar(cur, 'SELECT COUNT(*) FROM ctr.contracts')),
                      'projects': int(scalar(cur, 'SELECT COUNT(*) FROM prj.projects')),
                      'members': int(scalar(cur, 'SELECT COUNT(*) FROM prj.project_members')),
                      'scope_items': int(scalar(cur, 'SELECT COUNT(*) FROM prj.scope_item')),
                      'employees': int(scalar(cur, 'SELECT COUNT(*) FROM hr.employee_profile')),
                      'attachments': int(scalar(cur, 'SELECT COUNT(*) FROM ops.attachments')),
                      'events': int(scalar(cur, 'SELECT COUNT(*) FROM ops.process_events')),
                      'departments': int(scalar(cur, 'SELECT COUNT(*) FROM hr.departments')),
                  }

                  stage = 'event_digest_before'
                  cur.execute("SELECT md5(COALESCE(string_agg(id::text || '|' || COALESCE(scope_type,'') || '|' || scope_id::text || '|' || COALESCE(stage,'') || '|' || COALESCE(event_type,'') || '|' || COALESCE(status,'') || '|' || COALESCE(payload::text,''), E'\\n' ORDER BY id::text), '')) FROM ops.process_events")
                  event_digest_before = cur.fetchone()[0]

                  stage = 'missing_departments'
                  missing_departments = int(scalar(cur, """
                      SELECT COUNT(*)
                        FROM ops.my_org_units o
                        CROSS JOIN (VALUES ('관리부'), ('GIS사업부'), ('지적사업부')) seed(name)
                       WHERE NOT EXISTS (
                           SELECT 1 FROM hr.departments d
                            WHERE d.org_unit_id=o.id AND d.name=seed.name
                       )
                  """))

                  stage = 'execute_migration_sql'
                  cur.execute(migration_sql)

                  stage = 'insert_migration_record'
                  cur.execute(
                      """
                      INSERT INTO django_migrations (app, name, applied)
                      SELECT %s, %s, NOW()
                       WHERE NOT EXISTS (
                           SELECT 1 FROM django_migrations WHERE app=%s AND name=%s
                       )
                      """,
                      [APP, MIG, APP, MIG],
                  )

                  stage = 'after_counts'
                  after = {
                      'contracts': int(scalar(cur, 'SELECT COUNT(*) FROM ctr.contracts')),
                      'projects': int(scalar(cur, 'SELECT COUNT(*) FROM prj.projects')),
                      'members': int(scalar(cur, 'SELECT COUNT(*) FROM prj.project_members')),
                      'scope_items': int(scalar(cur, 'SELECT COUNT(*) FROM prj.scope_item')),
                      'employees': int(scalar(cur, 'SELECT COUNT(*) FROM hr.employee_profile')),
                      'attachments': int(scalar(cur, 'SELECT COUNT(*) FROM ops.attachments')),
                      'events': int(scalar(cur, 'SELECT COUNT(*) FROM ops.process_events')),
                      'departments': int(scalar(cur, 'SELECT COUNT(*) FROM hr.departments')),
                  }
                  for key in ('contracts', 'projects', 'members', 'scope_items', 'employees', 'attachments', 'events'):
                      if before[key] != after[key]:
                          raise RuntimeError(f'{key} row count changed')
                  if after['departments'] != before['departments'] + missing_departments:
                      raise RuntimeError('department seed delta unexpected')

                  stage = 'event_digest_after'
                  cur.execute("SELECT md5(COALESCE(string_agg(id::text || '|' || COALESCE(scope_type,'') || '|' || scope_id::text || '|' || COALESCE(stage,'') || '|' || COALESCE(event_type,'') || '|' || COALESCE(status,'') || '|' || COALESCE(payload::text,''), E'\\n' ORDER BY id::text), '')) FROM ops.process_events")
                  if cur.fetchone()[0] != event_digest_before:
                      raise RuntimeError('existing event content changed')

                  stage = 'access_table_check'
                  if not bool(scalar(cur, "SELECT to_regclass('ops.contract_document_access_requests') IS NOT NULL")):
                      raise RuntimeError('contract access request table missing')
                  if int(scalar(cur, 'SELECT COUNT(*) FROM ops.contract_document_access_requests')) != 0:
                      raise RuntimeError('migration created contract access requests')

                  stage = 'migration_record_check'
                  if not bool(scalar(cur, 'SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)', [APP, MIG])):
                      raise RuntimeError('0024 migration record missing')

                  print(
                      f'phase4_probe_tenant={label} result=would_succeed '
                      f'missing_departments={missing_departments} '
                      f'department_rows_before={before["departments"]} '
                      f'department_rows_after={after["departments"]}'
                  )
          except Exception as exc:
              pgcode = getattr(exc, 'pgcode', None) or '-'
              msg = ' '.join(str(exc).split())[:500]
              print(
                  f'phase4_probe_tenant={label} result=would_fail stage={stage} '
                  f'error={exc.__class__.__name__} pgcode={pgcode} message={msg}'
              )
          finally:
              conn.rollback()
              with conn.cursor() as cur:
                  persisted = bool(scalar(cur, 'SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)', [APP, MIG]))
                  access_persisted = bool(scalar(cur, "SELECT to_regclass('ops.contract_document_access_requests') IS NOT NULL"))
                  print(
                      f'phase4_probe_rollback_complete=yes migration_persisted={str(persisted).lower()} '
                      f'access_table_persisted={str(access_persisted).lower()}'
                  )
              conn.rollback()
              conn.close()
          PY
          REMOTE
