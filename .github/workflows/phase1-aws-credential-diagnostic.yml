name: Phase 1 AWS credential diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-aws-credential-diagnostic.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  aws-credential-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Read-only AWS credential diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || { echo 'aws_diag_blocker=stabilized_service_not_running'; exit 2; }

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || { echo 'aws_diag_blocker=service_working_directory_missing'; exit 2; }
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || { echo 'aws_diag_blocker=service_repo_missing'; exit 2; }
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || { echo 'aws_diag_blocker=stabilized_venv_python_missing'; exit 2; }

          # Never print access keys, secret keys, session tokens, secret payloads,
          # DB credentials, account IDs, full ARNs, hosts, or secret identifiers.
          "$python" - "$repo" <<'PY'
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import boto3
          from botocore.exceptions import BotoCoreError, ClientError, NoCredentialsError

          def present(name):
              return "yes" if bool(str(os.environ.get(name) or "").strip()) else "no"

          # Presence only; values are intentionally never printed.
          for name in (
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_SESSION_TOKEN",
              "AWS_PROFILE",
              "AWS_SHARED_CREDENTIALS_FILE",
              "AWS_CONFIG_FILE",
          ):
              print(f"aws_env_{name.lower()}_present={present(name)}")

          session = boto3.Session()
          credentials = session.get_credentials()
          if credentials is None:
              print("aws_credentials_available=no")
              raise SystemExit("aws_diag_blocker=no_aws_credentials")

          print("aws_credentials_available=yes")
          print(f"aws_credential_method={getattr(credentials, 'method', 'unknown') or 'unknown'}")
          print(f"aws_region={session.region_name or os.environ.get('AWS_REGION') or 'ap-northeast-2'}")

          try:
              identity = session.client("sts").get_caller_identity()
              arn = str(identity.get("Arn") or "")
              resource = arn.split(":", 5)[-1] if arn else ""
              kind = "unknown"
              name = "unknown"
              if resource.startswith("user/"):
                  kind = "iam-user"
                  name = resource.split("/", 1)[1].split("/")[-1]
              elif resource.startswith("assumed-role/"):
                  kind = "assumed-role"
                  parts = resource.split("/")
                  name = parts[1] if len(parts) > 1 else "unknown"
              elif resource == "root":
                  kind = "root"
                  name = "root"
              elif resource.startswith("federated-user/"):
                  kind = "federated-user"
                  name = resource.split("/", 1)[1].split("/")[-1]
              print("aws_caller_identity_available=yes")
              print(f"aws_principal_kind={kind}")
              print(f"aws_principal_name={name}")
          except (ClientError, BotoCoreError, NoCredentialsError):
              print("aws_caller_identity_available=no")

          sm = session.client(
              "secretsmanager",
              region_name=str(os.environ.get("AWS_REGION") or "ap-northeast-2").strip(),
          )
          # Read-only permission probe against a deliberately nonexistent identifier.
          # ResourceNotFound means GetSecretValue reached Secrets Manager and was authorized.
          try:
              sm.get_secret_value(SecretId="geoflow/diagnostic/nonexistent-permission-probe")
              print("secretsmanager_get_probe=unexpected_existing_resource")
          except ClientError as exc:
              code = str(exc.response.get("Error", {}).get("Code") or "Unknown")
              if code in {"ResourceNotFoundException", "ResourceNotFound"}:
                  print("secretsmanager_get_probe=authorized")
              elif code in {"AccessDeniedException", "AccessDenied", "UnauthorizedException", "UnrecognizedClientException"}:
                  print("secretsmanager_get_probe=denied")
              else:
                  print("secretsmanager_get_probe=other_error")
              print(f"secretsmanager_get_probe_code={code}")
          except (BotoCoreError, NoCredentialsError):
              print("secretsmanager_get_probe=credential_error")

          print("phase1_aws_credential_diagnostic_complete=yes")
          PY
          REMOTE
