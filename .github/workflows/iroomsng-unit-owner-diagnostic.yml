name: iroomsng unit owner diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-unit-owner-diagnostic.yml

permissions:
  contents: read

jobs:
  iroomsng-unit-owner-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/stabilized-deploy
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Identify iroomsng upstream service owner read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v nginx >/dev/null 2>&1 || { echo 'iroomsng_owner_blocker=nginx_missing'; exit 2; }
          command -v ss >/dev/null 2>&1 || { echo 'iroomsng_owner_blocker=ss_missing'; exit 2; }
          command -v systemctl >/dev/null 2>&1 || { echo 'iroomsng_owner_blocker=systemctl_missing'; exit 2; }
          sudo -n true >/dev/null 2>&1 || { echo 'iroomsng_owner_blocker=passwordless_sudo_required'; exit 2; }

          nginx_dump="$(mktemp)"
          candidate_file="$(mktemp)"
          trap 'rm -f "$nginx_dump" "$candidate_file"' EXIT
          sudo -n nginx -T >"$nginx_dump" 2>/dev/null || { echo 'iroomsng_owner_blocker=nginx_config_read_failed'; exit 2; }

          port="$({ python3 - "$nginx_dump" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")
          blocks = []
          for match in re.finditer(r"(?m)^\s*server\s*\{", text):
              brace_start = text.find("{", match.start())
              if brace_start < 0:
                  continue
              depth = 0
              end = None
              for index in range(brace_start, len(text)):
                  char = text[index]
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  continue
              block = text[match.start():end]
              if re.search(r"server_name\s+[^;]*\biroomsng\.kr\b", block, re.I):
                  blocks.append(block)

          targets = []
          for block in blocks:
              targets.extend(
                  re.findall(
                      r"proxy_pass\s+http://127\.0\.0\.1:(\d{1,5})\s*;",
                      block,
                      re.I,
                  )
              )
          unique = sorted(set(targets))
          if len(unique) != 1:
              raise SystemExit(3)
          print(unique[0])
          PY
          } 2>/dev/null)" || { echo 'iroomsng_owner_blocker=single_loopback_upstream_not_proven'; exit 2; }
          printf '%s' "$port" | grep -Eq '^[0-9]{1,5}$' || { echo 'iroomsng_owner_blocker=invalid_upstream_port'; exit 2; }
          echo 'iroomsng_owner_single_loopback_upstream=yes'

          if ss -ltnH | awk '{print $4}' | grep -Eq "(^|:)${port}$"; then
            echo 'iroomsng_owner_listener_present=yes'
          else
            echo 'iroomsng_owner_listener_present=no'
          fi

          # Search service definitions internally. Only matching service basenames
          # are retained; unit contents, paths, environment and command lines are
          # never emitted to the workflow log.
          while IFS= read -r service_file; do
            [ -f "$service_file" ] || continue
            if sudo -n grep -Eq "(127\\.0\\.0\\.1|0\\.0\\.0\\.0|localhost):${port}([^0-9]|$)|--bind([=[:space:]]+)(127\\.0\\.0\\.1|0\\.0\\.0\\.0|localhost):${port}([^0-9]|$)" "$service_file" 2>/dev/null; then
              basename "$service_file"
            fi
          done < <(
            find /etc/systemd/system /lib/systemd/system /usr/lib/systemd/system \
              -maxdepth 2 -type f -name '*.service' -print 2>/dev/null
          ) | sort -u >"$candidate_file"

          candidate_count="$(wc -l <"$candidate_file" | tr -d ' ')"
          printf '%s' "$candidate_count" | grep -Eq '^[0-9]+$'
          echo "iroomsng_owner_candidate_units=${candidate_count}"

          if [ "$candidate_count" -ne 1 ]; then
            echo 'iroomsng_owner_unique_unit=no'
            echo 'iroomsng_unit_owner_diagnostic_complete=yes'
            exit 0
          fi

          unit="$(cat "$candidate_file")"
          case "$unit" in
            *.service) ;;
            *) echo 'iroomsng_owner_blocker=invalid_unit_basename'; exit 2 ;;
          esac
          case "$unit" in
            geoflow-stabilized.service|geoflow.service|gunicorn.service)
              echo 'iroomsng_owner_forbidden_geoflow_unit=yes'
              echo 'iroomsng_owner_unique_unit=no'
              echo 'iroomsng_unit_owner_diagnostic_complete=yes'
              exit 0
              ;;
          esac

          echo 'iroomsng_owner_unique_unit=yes'
          echo "iroomsng_owner_unit=${unit}"

          active_state="$(systemctl show "$unit" -p ActiveState --value 2>/dev/null || true)"
          sub_state="$(systemctl show "$unit" -p SubState --value 2>/dev/null || true)"
          unit_file_state="$(systemctl show "$unit" -p UnitFileState --value 2>/dev/null || true)"
          case "$active_state" in
            active|inactive|failed|activating|deactivating|reloading|maintenance) ;;
            *) active_state='unknown' ;;
          esac
          case "$sub_state" in
            running|dead|failed|exited|start|stop|auto-restart|listening|mounting|unknown|'') ;;
            *) sub_state='other' ;;
          esac
          case "$unit_file_state" in
            enabled|enabled-runtime|disabled|static|masked|masked-runtime|indirect|generated|transient|bad|'') ;;
            *) unit_file_state='other' ;;
          esac
          echo "iroomsng_owner_active_state=${active_state}"
          echo "iroomsng_owner_sub_state=${sub_state:-unknown}"
          echo "iroomsng_owner_unit_file_state=${unit_file_state:-unknown}"

          working_directory="$(systemctl show "$unit" -p WorkingDirectory --value 2>/dev/null || true)"
          if [ -n "$working_directory" ] && [ -d "$working_directory" ]; then
            echo 'iroomsng_owner_working_directory_exists=yes'
          else
            echo 'iroomsng_owner_working_directory_exists=no'
          fi

          exec_start="$(systemctl show "$unit" -p ExecStart --value 2>/dev/null || true)"
          if printf '%s' "$exec_start" | grep -Eq "(127\\.0\\.0\\.1|0\\.0\\.0\\.0|localhost):${port}([^0-9]|$)"; then
            echo 'iroomsng_owner_execstart_targets_upstream=yes'
          else
            echo 'iroomsng_owner_execstart_targets_upstream=no'
          fi

          if systemctl cat "$unit" 2>/dev/null | grep -Eqi 'iroomsng|webgis'; then
            echo 'iroomsng_owner_unit_has_service_marker=yes'
          else
            echo 'iroomsng_owner_unit_has_service_marker=no'
          fi

          echo 'iroomsng_unit_owner_diagnostic_complete=yes'
          REMOTE

      - name: Verify current public root state
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://iroomsng.kr/ || true)"
          echo "iroomsng_owner_public_root_code=$code"
          echo 'iroomsng_owner_public_probe_complete=yes'
