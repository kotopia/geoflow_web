name: Phase 1 active tenant host recovery diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-active-tenant-host-recovery-diagnostic.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  active-tenant-host-recovery-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Read-only host recovery diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || { echo 'active_tenant_host_diag_blocker=stabilized_service_not_running'; exit 2; }

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || { echo 'active_tenant_host_diag_blocker=service_working_directory_missing'; exit 2; }
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || { echo 'active_tenant_host_diag_blocker=service_repo_missing'; exit 2; }
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || { echo 'active_tenant_host_diag_blocker=stabilized_venv_python_missing'; exit 2; }

          # Never print host strings, passwords, AWS values, DB/user names, aliases,
          # group IDs/codes/names, user identifiers, account IDs, ARNs, or secret payloads.
          "$python" - "$repo" <<'PY'
          import os
          import socket
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import psycopg2
          from django.db import connections

          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          def text(value):
              return str(value or "").strip()

          def active(row):
              return text(getattr(row.group, "status", "")).lower() == "active"

          def resolve_password(row):
              raw = text(row.db_password)
              if not raw:
                  return ""
              if is_tenant_db_secret_reference(raw):
                  try:
                      return resolve_tenant_db_password(raw)
                  except Exception:
                      return ""
              return raw

          def connect_ok(row, password, host):
              if not password or not text(host):
                  return False
              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=host,
                      port=row.db_port,
                      sslmode="require",
                      connect_timeout=8,
                  )
                  try:
                      with conn.cursor() as cursor:
                          cursor.execute("SELECT 1")
                          result = cursor.fetchone()
                          return bool(result and result[0] == 1)
                  finally:
                      conn.close()
              except Exception:
                  return False

          def dns_ok(host):
              try:
                  socket.getaddrinfo(text(host), None)
                  return True
              except Exception:
                  return False

          rows = list(
              GroupDBConfig.objects.using("default")
              .select_related("group")
              .order_by("group_id")
          )
          active_rows = [r for r in rows if active(r)]

          good_rows = []
          failed_rows = []
          for row in active_rows:
              password = resolve_password(row)
              if connect_ok(row, password, row.db_host):
                  good_rows.append(row)
              else:
                  failed_rows.append(row)

          dns_failed = [r for r in failed_rows if not dns_ok(r.db_host)]
          print(f"active_tenant_host_diag_active={len(active_rows)}")
          print(f"active_tenant_host_diag_current_ok={len(good_rows)}")
          print(f"active_tenant_host_diag_current_failed={len(failed_rows)}")
          print(f"active_tenant_host_diag_dns_failed={len(dns_failed)}")

          # Determine which failed rows are actual serving-path tenant groups.
          serving_failed = set()
          with connections["default"].cursor() as cursor:
              for row in failed_rows:
                  cursor.execute(
                      """
                      SELECT EXISTS (
                          SELECT 1
                            FROM user_group_map ugm
                            JOIN users u ON u.id = ugm.user_id
                           WHERE ugm.group_id = %s
                             AND ugm.status = 'active'
                             AND u.is_active = TRUE
                             AND u.email_verified = TRUE
                      )
                      """,
                      [str(row.group_id)],
                  )
                  if bool(cursor.fetchone()[0]):
                      serving_failed.add(str(row.group_id))
          print(f"active_tenant_host_diag_failed_serving={len(serving_failed)}")

          # Candidate hosts are only existing reviewed runtime hosts or hosts already
          # proven by a successful active tenant connection. Values are never printed.
          env_hosts = []
          for key in ("TENANT_DB_HOST", "PROVISIONER_DB_HOST", "CENTRAL_DB_HOST"):
              value = text(os.environ.get(key))
              if value and value not in env_hosts:
                  env_hosts.append(value)

          try:
              central_host = text(connections["default"].settings_dict.get("HOST"))
          except Exception:
              central_host = ""
          if central_host and central_host not in env_hosts:
              env_hosts.append(central_host)

          peer_hosts = []
          for row in good_rows:
              value = text(row.db_host)
              if value and value not in peer_hosts:
                  peer_hosts.append(value)

          all_candidates = []
          for value in env_hosts + peer_hosts:
              if value and value not in all_candidates:
                  all_candidates.append(value)

          print(f"active_tenant_host_diag_env_candidate_hosts={len(env_hosts)}")
          print(f"active_tenant_host_diag_peer_candidate_hosts={len(peer_hosts)}")
          print(f"active_tenant_host_diag_unique_candidate_hosts={len(all_candidates)}")

          env_recoverable = 0
          peer_recoverable = 0
          any_recoverable = 0
          unique_recoverable = 0
          serving_any_recoverable = 0
          serving_unique_recoverable = 0
          same_candidate_for_all = None

          per_row_success_sets = []
          for row in failed_rows:
              password = resolve_password(row)
              env_success = {h for h in env_hosts if connect_ok(row, password, h)}
              peer_success = {h for h in peer_hosts if connect_ok(row, password, h)}
              successes = env_success | peer_success
              per_row_success_sets.append(successes)

              if env_success:
                  env_recoverable += 1
              if peer_success:
                  peer_recoverable += 1
              if successes:
                  any_recoverable += 1
              if len(successes) == 1:
                  unique_recoverable += 1

              serving = str(row.group_id) in serving_failed
              if serving and successes:
                  serving_any_recoverable += 1
              if serving and len(successes) == 1:
                  serving_unique_recoverable += 1

          if per_row_success_sets and all(per_row_success_sets):
              common = set.intersection(*per_row_success_sets)
              same_candidate_for_all = len(common) == 1
          else:
              same_candidate_for_all = False

          print(f"active_tenant_host_diag_failed_env_host_recoverable={env_recoverable}")
          print(f"active_tenant_host_diag_failed_peer_host_recoverable={peer_recoverable}")
          print(f"active_tenant_host_diag_failed_any_host_recoverable={any_recoverable}")
          print(f"active_tenant_host_diag_failed_unique_host_recoverable={unique_recoverable}")
          print(f"active_tenant_host_diag_serving_any_host_recoverable={serving_any_recoverable}")
          print(f"active_tenant_host_diag_serving_unique_host_recoverable={serving_unique_recoverable}")
          print(f"active_tenant_host_diag_one_common_host_for_all_failed={'yes' if same_candidate_for_all else 'no'}")

          # Structural comparison only; never print the strings.
          failed_host_distinct = len({text(r.db_host).lower() for r in failed_rows if text(r.db_host)})
          good_host_distinct = len({text(r.db_host).lower() for r in good_rows if text(r.db_host)})
          failed_hosts_matching_env = sum(
              1 for r in failed_rows if text(r.db_host) in env_hosts
          )
          print(f"active_tenant_host_diag_failed_distinct_hosts={failed_host_distinct}")
          print(f"active_tenant_host_diag_good_distinct_hosts={good_host_distinct}")
          print(f"active_tenant_host_diag_failed_hosts_matching_runtime_env={failed_hosts_matching_env}")
          print("phase1_active_tenant_host_recovery_diagnostic_complete=yes")
          PY
          REMOTE
