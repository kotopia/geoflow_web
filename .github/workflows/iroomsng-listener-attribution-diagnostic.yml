name: iroomsng listener attribution diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-listener-attribution-diagnostic.yml

permissions:
  contents: read

jobs:
  iroomsng-listener-attribution:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/stabilized-deploy
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Attribute current iroomsng listener read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v nginx >/dev/null 2>&1 || { echo 'iroomsng_listener_blocker=nginx_missing'; exit 2; }
          command -v ss >/dev/null 2>&1 || { echo 'iroomsng_listener_blocker=ss_missing'; exit 2; }
          command -v python3 >/dev/null 2>&1 || { echo 'iroomsng_listener_blocker=python_missing'; exit 2; }
          command -v curl >/dev/null 2>&1 || { echo 'iroomsng_listener_blocker=curl_missing'; exit 2; }
          sudo -n true >/dev/null 2>&1 || { echo 'iroomsng_listener_blocker=passwordless_sudo_required'; exit 2; }

          nginx_dump="$(mktemp)"
          ss_dump="$(mktemp)"
          pid_file="$(mktemp)"
          unit_file="$(mktemp)"
          trap 'rm -f "$nginx_dump" "$ss_dump" "$pid_file" "$unit_file"' EXIT

          sudo -n nginx -T >"$nginx_dump" 2>/dev/null || { echo 'iroomsng_listener_blocker=nginx_config_read_failed'; exit 2; }

          port="$({ python3 - "$nginx_dump" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")
          blocks = []
          for match in re.finditer(r"(?m)^\s*server\s*\{", text):
              brace_start = text.find("{", match.start())
              if brace_start < 0:
                  continue
              depth = 0
              end = None
              for index in range(brace_start, len(text)):
                  char = text[index]
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  continue
              block = text[match.start():end]
              if re.search(r"server_name\s+[^;]*\biroomsng\.kr\b", block, re.I):
                  blocks.append(block)

          targets = []
          for block in blocks:
              targets.extend(
                  re.findall(
                      r"proxy_pass\s+http://127\.0\.0\.1:(\d{1,5})\s*;",
                      block,
                      re.I,
                  )
              )
          unique = sorted(set(targets))
          if len(unique) != 1:
              raise SystemExit(3)
          print(unique[0])
          PY
          } 2>/dev/null)" || { echo 'iroomsng_listener_blocker=single_loopback_upstream_not_proven'; exit 2; }
          printf '%s' "$port" | grep -Eq '^[0-9]{1,5}$' || { echo 'iroomsng_listener_blocker=invalid_upstream_port'; exit 2; }
          echo 'iroomsng_listener_single_loopback_upstream=yes'

          sudo -n ss -ltnpH >"$ss_dump" 2>/dev/null || { echo 'iroomsng_listener_blocker=socket_inspection_failed'; exit 2; }
          python3 - "$ss_dump" "$pid_file" "$port" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          pid_path = Path(sys.argv[2])
          port = sys.argv[3]
          matched = []
          pids = set()
          loopback_v4 = False
          wildcard_v4 = False
          loopback_v6 = False
          wildcard_v6 = False

          for line in source.read_text(errors="replace").splitlines():
              parts = line.split()
              if len(parts) < 4:
                  continue
              local = parts[3]
              if not re.search(rf":{re.escape(port)}$", local):
                  continue
              matched.append(line)
              host = local[: -(len(port) + 1)]
              if host == "127.0.0.1":
                  loopback_v4 = True
              elif host == "0.0.0.0" or host == "*":
                  wildcard_v4 = True
              elif host in ("[::1]", "::1"):
                  loopback_v6 = True
              elif host in ("[::]", "::"):
                  wildcard_v6 = True
              for pid in re.findall(r"pid=(\d+)", line):
                  pids.add(pid)

          pid_path.write_text("\n".join(sorted(pids)) + ("\n" if pids else ""))
          print(f"iroomsng_listener_socket_records={len(matched)}")
          print(f"iroomsng_listener_pid_count={len(pids)}")
          print(f"iroomsng_listener_ipv4_loopback={'yes' if loopback_v4 else 'no'}")
          print(f"iroomsng_listener_ipv4_wildcard={'yes' if wildcard_v4 else 'no'}")
          print(f"iroomsng_listener_ipv6_loopback={'yes' if loopback_v6 else 'no'}")
          print(f"iroomsng_listener_ipv6_wildcard={'yes' if wildcard_v6 else 'no'}")
          PY

          python3 - "$pid_file" "$unit_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          pid_path = Path(sys.argv[1])
          unit_path = Path(sys.argv[2])
          units = set()
          for pid in pid_path.read_text().split():
              if not pid.isdigit():
                  continue
              try:
                  text = Path(f"/proc/{pid}/cgroup").read_text(errors="replace")
              except OSError:
                  continue
              for unit in re.findall(r"([A-Za-z0-9_.@:-]+\.service)(?:/|$)", text):
                  units.add(unit)
          unit_path.write_text("\n".join(sorted(units)) + ("\n" if units else ""))
          print(f"iroomsng_listener_cgroup_unit_count={len(units)}")
          PY

          unit_count="$(wc -l <"$unit_file" | tr -d ' ')"
          if [ "$unit_count" = "1" ]; then
            unit="$(cat "$unit_file")"
            case "$unit" in
              *.service) ;;
              *) echo 'iroomsng_listener_blocker=invalid_cgroup_unit'; exit 2 ;;
            esac
            echo "iroomsng_listener_cgroup_unit=${unit}"
            case "$unit" in
              geoflow-stabilized.service|geoflow.service|gunicorn.service)
                echo 'iroomsng_listener_cgroup_unit_is_geoflow=yes'
                ;;
              *)
                echo 'iroomsng_listener_cgroup_unit_is_geoflow=no'
                ;;
            esac
          else
            echo 'iroomsng_listener_cgroup_unit=unresolved'
            echo 'iroomsng_listener_cgroup_unit_is_geoflow=unknown'
          fi

          probe() {
            host_header="$1"
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 3 --max-time 8 \
              -H "Host: ${host_header}" \
              "http://127.0.0.1:${port}/" 2>/dev/null || true)"
            printf '%s' "$code" | grep -Eq '^[0-9]{3}$' || code='000'
            printf '%s\n' "$code"
          }

          echo "iroomsng_listener_direct_iroomsng_code=$(probe 'iroomsng.kr')"
          echo "iroomsng_listener_direct_geoflow_code=$(probe 'geoflow.co.kr')"
          echo 'iroomsng_listener_attribution_complete=yes'
          REMOTE

      - name: Verify current public root state
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://iroomsng.kr/ || true)"
          printf '%s' "$code" | grep -Eq '^[0-9]{3}$' || code='000'
          echo "iroomsng_listener_public_root_code=$code"
          echo 'iroomsng_listener_public_probe_complete=yes'
