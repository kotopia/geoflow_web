name: Account security production rollout launcher

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/account-security-production-rollout-launcher.yml

permissions:
  contents: read

jobs:
  launch-reviewed-current-release:
    uses: ./.github/workflows/account-security-production-rollout.yml
    with:
      release_sha: ${{ github.sha }}
      ssh_port: "22"
    secrets: inherit
