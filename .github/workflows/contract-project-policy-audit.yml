name: Contract project policy read-only audit

on:
  pull_request:
    branches: [release/stabilized-deploy]
    paths:
      - .github/workflows/contract-project-policy-audit.yml
      - scripts/ops/audit_contract_projects.py
      - scripts/ci/test_contract_project_audit.py
      - deploy/contracts/audit-recipient.pem
  push:
    branches: [release/stabilized-deploy]
    paths:
      - .github/workflows/contract-project-policy-audit.yml
      - scripts/ops/audit_contract_projects.py
      - deploy/contracts/audit-recipient.pem
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python scripts/ci/test_contract_project_audit.py
      - run: openssl x509 -in deploy/contracts/audit-recipient.pem -noout -checkend 86400

  audit:
    needs: validate
    if: github.ref_name == 'release/stabilized-deploy' && github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null
      - name: Read-only snapshot and encrypted change preview
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report="$RUNNER_TEMP/contract-project-private.json"
          trap 'rm -f "$report" "$HOME/.ssh/geoflow_deploy_key"' EXIT
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            'workdir="$(systemctl show geoflow-stabilized.service -p WorkingDirectory --value)"; test -n "$workdir" && test -x "$workdir/.venv/bin/python" && exec "$workdir/.venv/bin/python" -' \
            < scripts/ops/audit_contract_projects.py > "$report"
          python - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              report=json.load(source)
          assert report['read_only'] is True
          for index, tenant in enumerate(report['tenants'],1):
              print('tenant_index=' + str(index) + ' classification=' + tenant['classification'])
              for key,value in tenant.get('counts',{}).items():
                  print(key + '=' + str(value))
              for blocker in tenant.get('blockers',[]):
                  print('review_required=' + blocker)
          print('database_writes=no service_restart=no constraints_and_external_references_require_review=yes')
          PY
          openssl cms -encrypt -binary -aes-256-cbc -in "$report" -outform DER \
            -out "$RUNNER_TEMP/contract-project-audit.cms" deploy/contracts/audit-recipient.pem
      - name: Upload encrypted details only
        uses: actions/upload-artifact@v4
        with:
          name: contract-project-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/contract-project-audit.cms
          retention-days: 7
          if-no-files-found: error
