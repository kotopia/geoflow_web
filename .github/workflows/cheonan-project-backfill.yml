name: Cheonan missing project backfill

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/cheonan-project-backfill.yml

permissions:
  contents: read

jobs:
  backfill-cheonan-missing-projects:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Backfill exactly the guarded Cheonan project gap
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          service='geoflow-stabilized.service'
          [ "$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)" = active ] || {
            echo 'cheonan_project_backfill_blocker=stabilized_service_not_active'
            exit 2
          }
          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || { echo 'cheonan_project_backfill_blocker=runtime_python_missing'; exit 2; }

          "$python" - "$repo" <<'PY'
          import json
          import os
          import sys
          import uuid
          from datetime import datetime, timezone

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          from django.conf import settings
          from django.db import connections, transaction

          ALIAS = "cheonan_db"
          EXPECTED_CONTRACTS = 753
          EXPECTED_BEFORE_PROJECTS = 743
          EXPECTED_GAP = 10
          LOCK_KEY = "geoflow:cheonan:contract-project-backfill:v1"

          if ALIAS not in settings.DATABASES:
              raise SystemExit("cheonan_project_backfill_blocker=static_alias_missing")

          def counts(cur):
              cur.execute("SELECT COUNT(*) FROM ctr.contracts")
              contracts = int(cur.fetchone()[0])
              cur.execute("SELECT COUNT(*) FROM prj.projects")
              projects = int(cur.fetchone()[0])
              cur.execute("SELECT COUNT(DISTINCT contract_id) FROM prj.projects WHERE contract_id IS NOT NULL")
              distinct_linked = int(cur.fetchone()[0])
              cur.execute(
                  """
                  SELECT COUNT(*)
                    FROM ctr.contracts c
                   WHERE NOT EXISTS (
                       SELECT 1 FROM prj.projects p WHERE p.contract_id = c.id
                   )
                  """
              )
              missing = int(cur.fetchone()[0])
              cur.execute(
                  """
                  SELECT COUNT(*) FROM (
                      SELECT contract_id
                        FROM prj.projects
                       WHERE contract_id IS NOT NULL
                       GROUP BY contract_id
                      HAVING COUNT(*) > 1
                  ) d
                  """
              )
              duplicate_groups = int(cur.fetchone()[0])
              cur.execute(
                  """
                  SELECT COUNT(*)
                    FROM prj.projects p
                    LEFT JOIN ctr.contracts c ON c.id = p.contract_id
                   WHERE p.contract_id IS NOT NULL AND c.id IS NULL
                  """
              )
              orphans = int(cur.fetchone()[0])
              return contracts, projects, distinct_linked, missing, duplicate_groups, orphans

          with connections[ALIAS].cursor() as cur:
              cur.execute("SELECT 1")
              if cur.fetchone() != (1,):
                  raise SystemExit("cheonan_project_backfill_blocker=tenant_connect_failed")

          inserted = 0
          already_complete = False
          with transaction.atomic(using=ALIAS):
              with connections[ALIAS].cursor() as cur:
                  cur.execute("SELECT pg_advisory_xact_lock(hashtext(%s))", [LOCK_KEY])
                  before = counts(cur)
                  contracts, projects, distinct_linked, missing, duplicate_groups, orphans = before

                  if duplicate_groups or orphans:
                      raise RuntimeError("cheonan_project_backfill_blocker=preexisting_integrity_error")
                  if contracts != EXPECTED_CONTRACTS:
                      raise RuntimeError("cheonan_project_backfill_blocker=unexpected_contract_total")

                  if missing == 0:
                      if projects != EXPECTED_CONTRACTS or distinct_linked != EXPECTED_CONTRACTS:
                          raise RuntimeError("cheonan_project_backfill_blocker=completed_shape_invalid")
                      already_complete = True
                  else:
                      if projects != EXPECTED_BEFORE_PROJECTS or distinct_linked != EXPECTED_BEFORE_PROJECTS:
                          raise RuntimeError("cheonan_project_backfill_blocker=unexpected_project_total")
                      if missing != EXPECTED_GAP:
                          raise RuntimeError("cheonan_project_backfill_blocker=unexpected_gap")

                      cur.execute(
                          """
                          SELECT c.id, c.code, c.name, c.start_date, c.end_date,
                                 c.legacy_id, c.created_at
                            FROM ctr.contracts c
                           WHERE NOT EXISTS (
                               SELECT 1 FROM prj.projects p WHERE p.contract_id = c.id
                           )
                           ORDER BY c.id
                           FOR UPDATE
                          """
                      )
                      rows = cur.fetchall()
                      if len(rows) != EXPECTED_GAP:
                          raise RuntimeError("cheonan_project_backfill_blocker=locked_gap_changed")
                      if any(row[5] is not None for row in rows):
                          raise RuntimeError("cheonan_project_backfill_blocker=legacy_contract_in_gap")

                      cutoff = datetime(2025, 12, 5, tzinfo=timezone.utc)
                      if any(row[6] is None or row[6] < cutoff for row in rows):
                          raise RuntimeError("cheonan_project_backfill_blocker=unexpected_gap_age")

                      now = datetime.now(timezone.utc)
                      for contract_id, code, name, start_date, end_date, _legacy_id, _created_at in rows:
                          cur.execute(
                              "SELECT COUNT(*) FROM prj.projects WHERE contract_id = %s",
                              [contract_id],
                          )
                          if int(cur.fetchone()[0]) != 0:
                              raise RuntimeError("cheonan_project_backfill_blocker=project_appeared_during_lock")

                          clean_code = str(code or "").strip()
                          project_code = f"C{clean_code.replace('-', '')}" if clean_code else None
                          cur.execute(
                              """
                              INSERT INTO prj.projects (
                                  id, contract_id, code, name, start_date, end_date,
                                  status, ext, created_at, updated_at
                              ) VALUES (%s, %s, %s, %s, %s, %s, %s, %s::jsonb, %s, %s)
                              """,
                              [
                                  uuid.uuid4(), contract_id, project_code, name,
                                  start_date, end_date, "active", json.dumps({}), now, now,
                              ],
                          )
                          inserted += 1

                  after = counts(cur)
                  if after != (EXPECTED_CONTRACTS, EXPECTED_CONTRACTS, EXPECTED_CONTRACTS, 0, 0, 0):
                      raise RuntimeError("cheonan_project_backfill_blocker=postcondition_failed")

          print("cheonan_project_backfill_connection=yes")
          print(f"cheonan_project_backfill_already_complete={'yes' if already_complete else 'no'}")
          print(f"cheonan_project_backfill_inserted={inserted}")
          print("cheonan_project_backfill_contracts=753")
          print("cheonan_project_backfill_projects=753")
          print("cheonan_project_backfill_missing=0")
          print("cheonan_project_backfill_duplicates=0")
          print("cheonan_project_backfill_orphans=0")
          print("cheonan_project_backfill_complete=yes")
          PY
          REMOTE
