name: Role assignment PostgreSQL integration

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - control/views_user_assignment.py
      - control/test_user_assignment_schema_compat.py
      - control/test_role_assignment_sql_safety.py
      - control/test_role_assignment_postgres_contract.py
      - scripts/ci/bootstrap_role_assignment_schema.sql
      - scripts/ci/exercise_role_assignment_postgres.py
      - .github/workflows/role-assignment-postgres-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-assignment-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geoflow_ci
          POSTGRES_PASSWORD: ci-postgres-placeholder
          POSTGRES_DB: geoflow_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoflow_ci -d geoflow_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GITHUB_ACTIONS: "true"
      DJANGO_SETTINGS_MODULE: geoflow_project.ci_migration_settings
      DJANGO_SECRET_KEY: ci-role-assignment-integration-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,localhost
      CENTRAL_DB_NAME: geoflow_control
      CENTRAL_DB_USER: geoflow_ci
      CENTRAL_DB_PASSWORD: ci-postgres-placeholder
      CENTRAL_DB_HOST: 127.0.0.1
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: geoflow_control
      TENANT_DB_USER: geoflow_ci
      TENANT_DB_PASSWORD: ci-postgres-placeholder
      TENANT_DB_HOST: 127.0.0.1
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"
      AWS_REGION: ap-northeast-2
      SITE_ORIGIN: https://example.invalid

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install integration dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate integration contract
        run: python -m unittest control.test_role_assignment_postgres_contract

      - name: Bootstrap legacy assignment schema without membership unique index
        env:
          PGPASSWORD: ci-postgres-placeholder
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U geoflow_ci \
            -d geoflow_control \
            -f scripts/ci/bootstrap_role_assignment_schema.sql

      - name: Exercise first insert and idempotent role update through Django handler
        run: python scripts/ci/exercise_role_assignment_postgres.py
