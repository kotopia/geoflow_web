name: Phase 2 proxy activation contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase2-proxy-security-staged-activation.yml
      - .github/workflows/phase2-proxy-security-activation-contract.yml
      - control/test_phase2_proxy_security_activation_contract.py
      - docs/ops/phase2-proxy-security-staged-activation.md
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase2-proxy-security-staged-activation.yml
      - .github/workflows/phase2-proxy-security-activation-contract.yml
      - control/test_phase2_proxy_security_activation_contract.py
      - docs/ops/phase2-proxy-security-staged-activation.md

permissions:
  contents: read

jobs:
  phase2-proxy-activation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify staged activation safety contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest control.test_phase2_proxy_security_activation_contract
