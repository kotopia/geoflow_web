name: Cheonan metadata remediation contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/cheonan-central-metadata-remediation.yml
      - .github/workflows/cheonan-metadata-remediation-contract.yml
      - control/test_cheonan_metadata_remediation_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cheonan-metadata-remediation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate remediation safety contract
        run: python -m unittest control.test_cheonan_metadata_remediation_contract
