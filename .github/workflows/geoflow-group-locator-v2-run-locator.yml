name: GeoFlow group locator v2 run locator

on:
  pull_request:
    paths:
      - .github/workflows/geoflow-group-locator-v2-run-locator.yml

permissions:
  contents: read
  actions: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate latest GeoFlow tenant group locator release run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 2a16c6ed2addd6bc983f3752d138ca1ebdf0cf4f
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['REPOSITORY']
          target_sha = os.environ['TARGET_SHA']
          endpoint = f"repos/{repo}/actions/workflows/geoflow-tenant-group-locator.yml/runs?branch=release/stabilized-deploy&per_page=10"
          payload = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          runs = payload.get('workflow_runs', [])
          print(f'geoflow_group_locator_v2_total={len(runs)}')
          for run in runs[:10]:
              print(
                  'geoflow_group_locator_v2_run '
                  f"id={run.get('id')} number={run.get('run_number')} attempt={run.get('run_attempt')} "
                  f"status={run.get('status')} conclusion={run.get('conclusion')} head_sha={run.get('head_sha')}"
              )
          matches = [run for run in runs if run.get('head_sha') == target_sha]
          print(f'geoflow_group_locator_v2_matches={len(matches)}')
          for run in matches:
              print(
                  'geoflow_group_locator_v2_target '
                  f"id={run.get('id')} number={run.get('run_number')} attempt={run.get('run_attempt')} "
                  f"status={run.get('status')} conclusion={run.get('conclusion')} html_url={run.get('html_url')}"
              )
          PY
