name: Confirmed project name repair

on:
  pull_request:
    branches: [release/stabilized-deploy]
    paths:
      - .github/workflows/confirmed-project-name-repair.yml
      - scripts/ops/repair_confirmed_project_names.py
      - scripts/ci/test_confirmed_project_names.py
      - deploy/contracts/confirmed-project-names.json
  push:
    branches: [release/stabilized-deploy]
    paths:
      - .github/workflows/confirmed-project-name-repair.yml
      - scripts/ops/repair_confirmed_project_names.py
      - deploy/contracts/confirmed-project-names.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confirmed-project-name-repair
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geoflow_name_repair_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d geoflow_name_repair_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.10'
      - run: pip install psycopg2-binary==2.9.10
      - run: python scripts/ci/test_confirmed_project_names.py
        env:
          NAME_REPAIR_TEST_DB: '1'
      - run: openssl x509 -in deploy/contracts/audit-recipient.pem -noout -checkend 86400

  repair:
    needs: validate
    if: github.ref_name == 'release/stabilized-deploy' && github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare reviewed correction and strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null
          python scripts/ops/repair_confirmed_project_names.py "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/repair.py"
          python -m py_compile "$RUNNER_TEMP/repair.py"
      - name: Back up then correct and verify exactly four confirmed names
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$HOME/.ssh/geoflow_deploy_key" "$RUNNER_TEMP/repair.py"' EXIT
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            'workdir="$(systemctl show geoflow-stabilized.service -p WorkingDirectory --value)"; test -n "$workdir" && test -x "$workdir/.venv/bin/python" && exec "$workdir/.venv/bin/python" -' \
            < "$RUNNER_TEMP/repair.py"
      - name: Remove transient credentials
        if: always()
        run: rm -f "$HOME/.ssh/geoflow_deploy_key" "$RUNNER_TEMP/repair.py"
