name: Phase 1 application deploy

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-application-deploy.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  application-deploy:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate reviewed candidate and connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          candidate_sha="$(git rev-parse HEAD)"
          test "$candidate_sha" = "$GITHUB_SHA"
          printf 'candidate_sha=%s\n' "$candidate_sha"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Deploy exact candidate with rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          candidate_sha="$1"
          service='geoflow-stabilized.service'
          expected_branch='release/stabilized-deploy'

          fail() {
            echo "deploy_blocker=$1"
            exit 2
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'stabilized_service_not_running_before_deploy'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'

          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/requirements.txt" ] || fail 'requirements_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'

          origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
          case "$origin" in
            https://github.com/kotopia/geoflow_web|https://github.com/kotopia/geoflow_web.git|git@github.com:kotopia/geoflow_web.git)
              ;;
            *) fail 'unexpected_repository_origin' ;;
          esac

          dirty_count="$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')"
          [ "$dirty_count" = '0' ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'
          [ -x "$repo/.venv/bin/gunicorn" ] || fail 'stabilized_gunicorn_missing'

          exec_raw="$(systemctl show "$service" -p ExecStart --value 2>/dev/null || true)"
          printf '%s' "$exec_raw" | grep -Fq "$repo/.venv/bin/gunicorn" || fail 'service_exec_not_stabilized_venv'
          printf '%s' "$exec_raw" | grep -Fq 'geoflow_project.wsgi:application' || fail 'service_wsgi_target_unexpected'

          before_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/ || true)"
          case "$before_code" in 2??|3??) ;; *) fail 'port_8011_not_healthy_before_deploy' ;; esac

          previous_sha="$(git -C "$repo" rev-parse HEAD)"
          previous_branch="$(git -C "$repo" symbolic-ref --short -q HEAD || true)"
          echo "previous_sha=$previous_sha"
          echo "candidate_sha=$candidate_sha"
          echo "deployment_target_service=$service"
          echo 'deployment_target_port=8011'

          rollback_needed=0
          rollback() {
            set +e
            if [ "$rollback_needed" -eq 1 ]; then
              echo 'rollback_started=yes'
              if [ -n "$previous_branch" ]; then
                git -C "$repo" checkout -B "$previous_branch" "$previous_sha" >/dev/null 2>&1
              else
                git -C "$repo" checkout --detach "$previous_sha" >/dev/null 2>&1
              fi
              "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt" >/dev/null 2>&1
              "$python" "$repo/manage.py" collectstatic --noinput >/dev/null 2>&1
              sudo -n systemctl restart "$service"
              sleep 3
              echo "rollback_service_state=$(systemctl is-active "$service" 2>/dev/null || true)"
              echo 'rollback_completed=yes'
            fi
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              rollback
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          rollback_needed=1

          git -C "$repo" fetch --prune origin refs/heads/release/stabilized-deploy
          fetched_sha="$(git -C "$repo" rev-parse FETCH_HEAD)"
          [ "$fetched_sha" = "$candidate_sha" ] || fail 'candidate_sha_not_current_release_head'

          git -C "$repo" checkout -B "$expected_branch" "$candidate_sha"
          [ "$(git -C "$repo" rev-parse HEAD)" = "$candidate_sha" ] || fail 'candidate_checkout_failed'

          "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt"
          "$python" -m pip check
          "$python" "$repo/manage.py" check
          "$python" "$repo/manage.py" collectstatic --noinput

          sudo -n systemctl restart "$service"

          ready=no
          for _ in $(seq 1 30); do
            active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
            sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/ || true)"
            if [ "$active" = 'active' ] && [ "$sub" = 'running' ]; then
              case "$code" in
                2??|3??) ready=yes; break ;;
              esac
            fi
            sleep 2
          done
          [ "$ready" = yes ] || fail 'stabilized_service_failed_post_restart_healthcheck'

          root_code="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/ || true)"
          terms_code="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/terms/ || true)"
          privacy_code="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/privacy/ || true)"

          echo "public_root_status=$root_code"
          echo "public_terms_status=$terms_code"
          echo "public_privacy_status=$privacy_code"

          case "$root_code" in 2??|3??) ;; *) fail 'public_root_unhealthy_after_deploy' ;; esac
          [ "$terms_code" = '200' ] || fail 'public_terms_not_200_after_deploy'
          [ "$privacy_code" = '200' ] || fail 'public_privacy_not_200_after_deploy'

          rollback_needed=0
          trap - EXIT
          echo "deployed_sha=$(git -C "$repo" rev-parse HEAD)"
          echo "deployed_branch=$(git -C "$repo" rev-parse --abbrev-ref HEAD)"
          echo 'phase1_application_deploy_ready=yes'
          REMOTE
