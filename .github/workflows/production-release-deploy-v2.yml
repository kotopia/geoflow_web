name: Production release deploy v2

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/production-release-deploy-v2.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  deploy-current-release:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/stabilized-deploy'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo 'production_deploy_v2_blocker=release_advanced'; exit 2; }
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Deploy current release and migrate tenant databases
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          candidate_sha="$1"
          service='geoflow-stabilized.service'
          expected_branch='release/stabilized-deploy'

          fail() { echo "production_deploy_v2_blocker=$1"; exit 2; }

          for cmd in git systemctl curl sudo; do command -v "$cmd" >/dev/null 2>&1 || fail "${cmd}_missing"; done
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'service_not_running_before_deploy'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/requirements.txt" ] || fail 'requirements_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'

          origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
          case "$origin" in
            https://github.com/kotopia/geoflow_web|https://github.com/kotopia/geoflow_web.git|git@github.com:kotopia/geoflow_web.git) ;;
            *) fail 'unexpected_repository_origin' ;;
          esac
          [ "$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')" = 0 ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'venv_python_missing'
          [ -x "$repo/.venv/bin/gunicorn" ] || fail 'gunicorn_missing'

          before_code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/login/ || true)"
          case "$before_code" in 2??|3??) ;; *) fail 'local_login_unhealthy_before_deploy' ;; esac

          previous_sha="$(git -C "$repo" rev-parse HEAD)"
          previous_branch="$(git -C "$repo" symbolic-ref --short -q HEAD || true)"
          echo "production_deploy_v2_previous_sha=$previous_sha"
          echo "production_deploy_v2_candidate_sha=$candidate_sha"

          rollback_needed=0
          rollback_code() {
            set +e
            if [ "$rollback_needed" -eq 1 ]; then
              echo 'production_deploy_v2_code_rollback_started=yes'
              if [ -n "$previous_branch" ]; then
                git -C "$repo" checkout -B "$previous_branch" "$previous_sha" >/dev/null 2>&1
              else
                git -C "$repo" checkout --detach "$previous_sha" >/dev/null 2>&1
              fi
              "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt" >/dev/null 2>&1
              "$python" "$repo/manage.py" collectstatic --noinput >/dev/null 2>&1
              sudo -n systemctl restart "$service"
              echo 'production_deploy_v2_code_rollback_completed=yes'
            fi
          }
          on_exit() { rc=$?; if [ "$rc" -ne 0 ]; then rollback_code; fi; exit "$rc"; }
          trap on_exit EXIT

          git -C "$repo" fetch --prune origin refs/heads/release/stabilized-deploy
          fetched_sha="$(git -C "$repo" rev-parse FETCH_HEAD)"
          [ "$fetched_sha" = "$candidate_sha" ] || fail 'candidate_not_current_release_head'
          git -C "$repo" checkout -B "$expected_branch" "$candidate_sha"
          rollback_needed=1

          "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt"
          "$python" -m pip check
          "$python" "$repo/manage.py" check

          "$python" - "$repo" <<'PY'
          import importlib.util
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'geoflow_project.settings')

          import django
          django.setup()

          import psycopg2
          from django.db import connections, transaction
          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import is_tenant_db_secret_reference, resolve_tenant_db_password

          APP = 'webgisapp'
          TARGETS = [
              ('0030_finance_phase1', '0029_unified_settings_registry'),
              ('0031_finance_registry_system_keys', '0030_finance_phase1'),
              ('0032_finance_edit_delete_import_v2', '0031_finance_registry_system_keys'),
              ('0033_finance_org_unit_cards', '0032_finance_edit_delete_import_v2'),
              ('0034_finance_account_card_trash', '0033_finance_org_unit_cards'),
              ('0035_employee_education_career_settings', '0034_finance_account_card_trash'),
          ]
          TENANT_MARKERS = ('ctr.contracts', 'prj.projects', 'hr.employee_profile', 'ops.settings_nodes')

          def txt(value):
              return str(value or '').strip()

          def load_sql(name):
              path = os.path.join(repo, 'geoflow_ops', 'migrations', name + '.py')
              spec = importlib.util.spec_from_file_location('deploy_' + name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              operations = list(module.Migration.operations)
              if len(operations) != 1 or not hasattr(operations[0], 'sql'):
                  raise RuntimeError(f'unexpected migration shape: {name}')
              sql = operations[0].sql
              if not isinstance(sql, str) or not sql.strip():
                  raise RuntimeError(f'empty migration sql: {name}')
              lowered = sql.lower()
              for forbidden in ('drop table fin.', 'truncate table fin.', 'delete from ctr.contracts', 'delete from hr.employee_profile'):
                  if forbidden in lowered:
                      raise RuntimeError(f'destructive migration rejected: {name}')
              return sql

          MIGRATION_SQL = {name: load_sql(name) for name, _ in TARGETS}

          with transaction.atomic(using='default'):
              rows = list(GroupDBConfig.objects.using('default').select_related('group').order_by('group_id'))
          active_rows = [row for row in rows if txt(getattr(row.group, 'status', '')).lower() == 'active']
          if not active_rows:
              raise RuntimeError('no active database configurations')

          def connect(row):
              raw = txt(row.db_password)
              password = resolve_tenant_db_password(raw) if is_tenant_db_secret_reference(raw) else raw
              if not password:
                  raise RuntimeError(f'empty database password: {row.db_name}')
              return psycopg2.connect(dbname=row.db_name, user=row.db_user, password=password, host=row.db_host, port=row.db_port, sslmode='require', connect_timeout=10)

          def migration_applied(cur, name):
              cur.execute('SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)', [APP, name])
              return bool(cur.fetchone()[0])

          def is_real_tenant(row):
              conn = connect(row)
              try:
                  with conn.cursor() as cur:
                      cur.execute('SELECT ' + ', '.join(['to_regclass(%s) IS NOT NULL'] * len(TENANT_MARKERS)), list(TENANT_MARKERS))
                      markers = tuple(bool(v) for v in cur.fetchone())
                  if not any(markers):
                      print(f'production_deploy_v2_skipped_non_tenant={row.db_name}')
                      return False
                  if not all(markers):
                      raise RuntimeError(f'{row.db_name}: partial tenant schema markers={markers}')
                  return True
              finally:
                  conn.close()

          tenant_rows = [row for row in active_rows if is_real_tenant(row)]
          if not tenant_rows:
              raise RuntimeError('no active tenant databases after schema classification')

          def validate(cur):
              cur.execute("SELECT to_regclass('fin.accounts'), to_regclass('fin.cards'), to_regclass('hr.employee_career')")
              if not all(cur.fetchone()):
                  raise RuntimeError('required finance/employee relations missing')
              for table, cols in (
                  ('fin.accounts', {'my_org_unit_id','is_deleted','deleted_at','deleted_by'}),
                  ('fin.cards', {'my_org_unit_id','is_deleted','deleted_at','deleted_by'}),
                  ('hr.employee_career', {'certificate_no'}),
              ):
                  schema, rel = table.split('.', 1)
                  cur.execute('SELECT column_name FROM information_schema.columns WHERE table_schema=%s AND table_name=%s', [schema, rel])
                  found = {r[0] for r in cur.fetchall()}
                  missing = cols - found
                  if missing:
                      raise RuntimeError(f'{table} missing columns: {sorted(missing)}')
              cur.execute("SELECT field_ref FROM ops.settings_nodes WHERE field_ref IN ('employee.education_degree','employee.education_status')")
              if {r[0] for r in cur.fetchall()} != {'employee.education_degree','employee.education_status'}:
                  raise RuntimeError('education settings categories missing')
              if not migration_applied(cur, '0035_employee_education_career_settings'):
                  raise RuntimeError('0035 migration history missing')

          def run_tenant(row, commit):
              conn = connect(row)
              try:
                  conn.autocommit = False
                  with conn.cursor() as cur:
                      cur.execute("SET LOCAL lock_timeout='8s'")
                      cur.execute("SET LOCAL statement_timeout='120s'")
                      cur.execute('SELECT pg_advisory_xact_lock(hashtext(%s))', ['geoflow:webgisapp:0030-0035'])
                      if not migration_applied(cur, '0029_unified_settings_registry'):
                          raise RuntimeError(f'{row.db_name}: dependency 0029 not applied')
                      for name, dependency in TARGETS:
                          if migration_applied(cur, name):
                              continue
                          if not migration_applied(cur, dependency):
                              raise RuntimeError(f'{row.db_name}: missing dependency {dependency} for {name}')
                          cur.execute(MIGRATION_SQL[name])
                          cur.execute('INSERT INTO django_migrations(app,name,applied) SELECT %s,%s,NOW() WHERE NOT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)', [APP, name, APP, name])
                      validate(cur)
                  conn.commit() if commit else conn.rollback()
              except Exception:
                  conn.rollback()
                  raise
              finally:
                  conn.close()

          for row in tenant_rows:
              run_tenant(row, commit=False)
              print(f'production_deploy_v2_tenant_dry_run_ok={row.db_name}')

          for row in tenant_rows:
              run_tenant(row, commit=True)
              print(f'production_deploy_v2_tenant_migrated={row.db_name}')

          print(f'production_deploy_v2_tenant_count={len(tenant_rows)}')
          PY

          "$python" "$repo/manage.py" collectstatic --noinput
          sudo -n systemctl restart "$service"

          ready=no
          for _ in $(seq 1 30); do
            active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
            sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
            code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/login/ || true)"
            if [ "$active" = active ] && [ "$sub" = running ]; then
              case "$code" in 2??|3??) ready=yes; break ;; esac
            fi
            sleep 2
          done
          [ "$ready" = yes ] || fail 'service_failed_post_restart_healthcheck'

          public_login="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/login/ || true)"
          echo "production_deploy_v2_public_login_status=$public_login"
          [ "$public_login" = 200 ] || fail 'public_login_not_200_after_deploy'

          rollback_needed=0
          trap - EXIT
          echo "production_deploy_v2_deployed_sha=$(git -C "$repo" rev-parse HEAD)"
          echo "production_deploy_v2_deployed_branch=$(git -C "$repo" rev-parse --abbrev-ref HEAD)"
          echo 'production_deploy_v2_complete=yes'
          REMOTE
