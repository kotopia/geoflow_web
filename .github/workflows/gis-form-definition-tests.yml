name: GIS form definition tests
on:
  pull_request:
    branches: [release/stabilized-deploy]
  push:
    branches: [release/stabilized-deploy]
permissions:
  contents: read
jobs:
  form-definition-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geoflow_test
          POSTGRES_PASSWORD: geoflow_test
          POSTGRES_DB: geoflow_forms_test
        ports: [55440:5432]
        options: >-
          --health-cmd "pg_isready -U geoflow_test -d geoflow_forms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary==2.9.10 Django==5.2.4
      - run: python -m unittest geoflow_ops.gis.test_form_definitions geoflow_ops.gis.test_central_definitions geoflow_ops.gis.test_definition_visibility control.test_gis_schema_manager -v
        env:
          GEOFLOW_FORMS_ISOLATED_PG: '1'
      - name: Validate remote deployment shell without executing it
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import subprocess
          import textwrap
          workflow = Path('.github/workflows/gis-definition-code-deploy.yml').read_text()
          marker = "<<'REMOTE'\n"
          assert workflow.count(marker) == 1
          remote = workflow.split(marker, 1)[1].split('          REMOTE\n', 1)[0]
          remote = textwrap.dedent(remote)
          subprocess.run(['bash', '-n'], input=remote, text=True, check=True)
          # Prove the validator catches the exact defect previously missed by outer bash -n.
          broken = remote.replace(') ;;', ' ;;', 1)
          assert broken != remote
          result = subprocess.run(['bash', '-n'], input=broken, text=True, capture_output=True)
          assert result.returncode != 0, 'Missing case terminator must fail validation'
          print('Remote deployment syntax OK; missing-terminator regression rejected')
          PYCODE
