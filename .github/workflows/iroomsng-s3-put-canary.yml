name: iroomsng S3 zero-byte put canary

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-s3-put-canary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iroomsng-s3-put-canary:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact triggering release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Execute one zero-byte legacy S3 put canary and cleanup
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          primary='geoflow.service'
          stable='geoflow-stabilized.service'

          fail() {
            echo "iroomsng_s3_canary_blocker=$1"
            exit 2
          }

          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'
          systemctl cat "$primary" >/dev/null 2>&1 || fail 'legacy_primary_unit_missing'
          [ "$(systemctl is-active "$stable" 2>/dev/null || true)" = active ] || fail 'stabilized_service_not_active'

          wd="$(systemctl show "$primary" -p WorkingDirectory --value 2>/dev/null || true)"
          unit_user="$(systemctl show "$primary" -p User --value 2>/dev/null || true)"
          exec_raw="$(systemctl show "$primary" -p ExecStart --value 2>/dev/null || true)"
          [ -n "$wd" ] && [ -d "$wd" ] || fail 'legacy_working_directory_missing'
          [ -n "$unit_user" ] || fail 'legacy_unit_user_missing'
          exec_path="$(printf '%s' "$exec_raw" | sed -n 's/.*path=\([^ ;]*\).*/\1/p' | head -n1)"
          [ -n "$exec_path" ] && [ -f "$exec_path" ] || fail 'legacy_exec_path_unresolved'
          first_line="$(head -n1 "$exec_path" 2>/dev/null || true)"
          case "$first_line" in
            '#!'*) runtime_python="$(printf '%s' "${first_line#\#!}" | awk '{print $1}')" ;;
            *) fail 'legacy_runtime_python_unresolved' ;;
          esac
          [ -x "$runtime_python" ] || fail 'legacy_runtime_python_missing'
          settings_module="$(systemctl cat "$primary" 2>/dev/null | sed -n 's/^[[:space:]]*Environment=.*DJANGO_SETTINGS_MODULE=\([^"[:space:]]*\).*/\1/p' | head -n1)"
          [ -n "$settings_module" ] || fail 'legacy_settings_module_unresolved'

          cd "$wd"
          sudo -u "$unit_user" env DJANGO_SETTINGS_MODULE="$settings_module" "$runtime_python" - <<'PY'
          import re
          import uuid

          import boto3
          from botocore.exceptions import BotoCoreError, ClientError
          from django.conf import settings

          def safe_code(value):
              value = str(value or "unknown")
              return value if re.fullmatch(r"[A-Za-z0-9_.-]{1,80}", value) else "unknown"

          access_key = getattr(settings, "AWS_ACCESS_KEY_ID", None)
          secret_key = getattr(settings, "AWS_SECRET_ACCESS_KEY", None)
          bucket = getattr(settings, "AWS_STORAGE_BUCKET_NAME", None)
          region = getattr(settings, "AWS_S3_REGION_NAME", None) or "ap-northeast-2"
          if not all((access_key, secret_key, bucket, region)):
              raise SystemExit("iroomsng_s3_canary_blocker=legacy_aws_settings_incomplete")

          session = boto3.Session(
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name=region,
          )
          s3 = session.client("s3", region_name=region)
          key = f"__iroomsng_diagnostic__/zero-byte-put-canary-{uuid.uuid4().hex}.bin"
          put_succeeded = False
          cleanup_required = False

          try:
              s3.put_object(
                  Bucket=bucket,
                  Key=key,
                  Body=b"",
                  ContentType="application/octet-stream",
              )
              put_succeeded = True
              cleanup_required = True
              print("iroomsng_s3_canary_put_success=yes")
              print("iroomsng_s3_canary_put_error_code=none")
          except ClientError as exc:
              code = exc.response.get("Error", {}).get("Code", "unknown")
              print("iroomsng_s3_canary_put_success=no")
              print(f"iroomsng_s3_canary_put_error_code={safe_code(code)}")
          except BotoCoreError as exc:
              print("iroomsng_s3_canary_put_success=no")
              print(f"iroomsng_s3_canary_put_exception_class={safe_code(type(exc).__name__)}")

          if put_succeeded:
              try:
                  s3.head_object(Bucket=bucket, Key=key)
                  print("iroomsng_s3_canary_head_after_put=yes")
              except Exception:
                  print("iroomsng_s3_canary_head_after_put=no")

              try:
                  s3.delete_object(Bucket=bucket, Key=key)
                  cleanup_required = False
                  print("iroomsng_s3_canary_cleanup_delete_success=yes")
              except ClientError as exc:
                  code = exc.response.get("Error", {}).get("Code", "unknown")
                  print("iroomsng_s3_canary_cleanup_delete_success=no")
                  print(f"iroomsng_s3_canary_cleanup_delete_error_code={safe_code(code)}")
              except BotoCoreError as exc:
                  print("iroomsng_s3_canary_cleanup_delete_success=no")
                  print(f"iroomsng_s3_canary_cleanup_delete_exception_class={safe_code(type(exc).__name__)}")

          print(f"iroomsng_s3_canary_cleanup_required={'yes' if cleanup_required else 'no'}")
          print("iroomsng_s3_zero_byte_put_canary_complete=yes")
          PY
          REMOTE
