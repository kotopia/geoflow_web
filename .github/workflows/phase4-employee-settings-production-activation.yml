name: Phase 4 employee settings production activation

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase4-employee-settings-production-activation.yml
      - geoflow_ops/migrations/0021_phase4_employee_settings_foundation.py
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  employee-settings-production-activation:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'employee_settings_activation_blocker=release_advanced'
            exit 2
          }
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || {
            echo 'employee_settings_activation_blocker=invalid_ssh_port'
            exit 2
          }
          echo 'employee_settings_activation_exact_release=yes'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Apply 0021 employee settings schema and deploy exact release
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          candidate_sha="$1"
          service='geoflow-stabilized.service'
          expected_branch='release/stabilized-deploy'

          fail() {
            echo "employee_settings_activation_blocker=$1"
            exit 2
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'stabilized_service_not_running_before_activation'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/requirements.txt" ] || fail 'requirements_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'

          origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
          case "$origin" in
            https://github.com/kotopia/geoflow_web|https://github.com/kotopia/geoflow_web.git|git@github.com:kotopia/geoflow_web.git) ;;
            *) fail 'unexpected_repository_origin' ;;
          esac

          dirty_count="$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')"
          [ "$dirty_count" = '0' ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'
          [ -x "$repo/.venv/bin/gunicorn" ] || fail 'stabilized_gunicorn_missing'

          exec_raw="$(systemctl show "$service" -p ExecStart --value 2>/dev/null || true)"
          printf '%s' "$exec_raw" | grep -Fq "$repo/.venv/bin/gunicorn" || fail 'service_exec_not_stabilized_venv'
          printf '%s' "$exec_raw" | grep -Fq 'geoflow_project.wsgi:application' || fail 'service_wsgi_target_unexpected'

          before_code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/login/ || true)"
          case "$before_code" in
            2??|3??) ;;
            *) fail 'local_login_unhealthy_before_activation' ;;
          esac

          previous_sha="$(git -C "$repo" rev-parse HEAD)"
          previous_branch="$(git -C "$repo" symbolic-ref --short -q HEAD || true)"
          echo "employee_settings_activation_previous_sha=$previous_sha"
          echo "employee_settings_activation_candidate_sha=$candidate_sha"

          "$python" - "$repo" <<'PY'
          from collections import Counter
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import psycopg2
          from django.db import connections, transaction

          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          APP = "webgisapp"
          DEPENDENCY = "0020_phase4_project_task_execution"
          MIGRATION = "0021_phase4_employee_settings_foundation"
          REQUIRED_TABLES = {
              "ops.settings_nodes",
              "hr.employee_education",
              "hr.employee_qualification",
              "hr.employee_technical_grade",
              "hr.employee_career",
          }

          def text(value):
              return str(value or "").strip()

          def scalar(cur, sql, params=None):
              cur.execute(sql, params or [])
              row = cur.fetchone()
              return row[0] if row else None

          def relation_exists(cur, relation):
              return bool(scalar(cur, "SELECT to_regclass(%s) IS NOT NULL", [relation]))

          def execute_0021(cur):
              cur.execute("CREATE SCHEMA IF NOT EXISTS ops")
              cur.execute("CREATE SCHEMA IF NOT EXISTS hr")
              cur.execute("""
                  CREATE TABLE IF NOT EXISTS ops.settings_nodes (
                      id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                      parent_id uuid NULL REFERENCES ops.settings_nodes(id) ON DELETE RESTRICT,
                      code varchar(100) NOT NULL,
                      name varchar(200) NOT NULL,
                      node_type varchar(20) NOT NULL DEFAULT 'value',
                      value text NULL,
                      description text NULL,
                      ord integer NOT NULL DEFAULT 0,
                      active boolean NOT NULL DEFAULT true,
                      system_key varchar(200) NULL,
                      locked boolean NOT NULL DEFAULT false,
                      created_at timestamptz NOT NULL DEFAULT now(),
                      updated_at timestamptz NOT NULL DEFAULT now(),
                      CONSTRAINT settings_nodes_type_ck CHECK (node_type IN ('group', 'category', 'value'))
                  )
              """)
              cur.execute("CREATE UNIQUE INDEX IF NOT EXISTS ux_settings_nodes_system_key ON ops.settings_nodes (system_key) WHERE system_key IS NOT NULL")
              cur.execute("CREATE UNIQUE INDEX IF NOT EXISTS ux_settings_nodes_parent_code ON ops.settings_nodes ((COALESCE(parent_id, '00000000-0000-0000-0000-000000000000'::uuid)), lower(code))")
              cur.execute("CREATE INDEX IF NOT EXISTS idx_settings_nodes_parent_ord ON ops.settings_nodes (parent_id, active, ord, name)")

              cur.execute("""
                  CREATE TABLE IF NOT EXISTS hr.employee_education (
                      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), employee_id uuid NOT NULL,
                      school_name text NOT NULL, school_type text NULL, degree text NULL, major text NULL,
                      admission_date date NULL, graduation_date date NULL, education_status text NULL,
                      note text NULL, ord integer NOT NULL DEFAULT 0, active boolean NOT NULL DEFAULT true,
                      created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now()
                  )
              """)
              cur.execute("CREATE INDEX IF NOT EXISTS idx_employee_education_employee ON hr.employee_education (employee_id, active, ord, admission_date)")
              cur.execute("""
                  CREATE TABLE IF NOT EXISTS hr.employee_qualification (
                      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), employee_id uuid NOT NULL,
                      qualification_name text NOT NULL, issuer text NULL, license_no text NULL,
                      acquired_date date NULL, expiry_date date NULL, note text NULL,
                      ord integer NOT NULL DEFAULT 0, active boolean NOT NULL DEFAULT true,
                      created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now()
                  )
              """)
              cur.execute("CREATE INDEX IF NOT EXISTS idx_employee_qualification_employee ON hr.employee_qualification (employee_id, active, ord, acquired_date)")
              cur.execute("""
                  CREATE TABLE IF NOT EXISTS hr.employee_technical_grade (
                      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), employee_id uuid NOT NULL,
                      field_name text NULL, grade_code text NOT NULL, recognized_date date NULL,
                      issuer text NULL, note text NULL, ord integer NOT NULL DEFAULT 0,
                      active boolean NOT NULL DEFAULT true, created_at timestamptz NOT NULL DEFAULT now(),
                      updated_at timestamptz NOT NULL DEFAULT now()
                  )
              """)
              cur.execute("CREATE INDEX IF NOT EXISTS idx_employee_technical_grade_employee ON hr.employee_technical_grade (employee_id, active, ord, recognized_date)")
              cur.execute("""
                  CREATE TABLE IF NOT EXISTS hr.employee_career (
                      id uuid PRIMARY KEY DEFAULT gen_random_uuid(), employee_id uuid NOT NULL,
                      company_name text NOT NULL, department text NULL, position_title text NULL,
                      started_on date NULL, ended_on date NULL, duties text NULL, note text NULL,
                      ord integer NOT NULL DEFAULT 0, active boolean NOT NULL DEFAULT true,
                      created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now()
                  )
              """)
              cur.execute("CREATE INDEX IF NOT EXISTS idx_employee_career_employee ON hr.employee_career (employee_id, active, ord, started_on)")

              cur.execute("""
                  INSERT INTO ops.settings_nodes (code, name, node_type, system_key, ord, locked)
                  VALUES
                      ('hr', '인사', 'group', 'domain.hr', 10, true),
                      ('contract', '계약', 'group', 'domain.contract', 20, true),
                      ('project', '프로젝트', 'group', 'domain.project', 30, true),
                      ('event', '업무 이벤트', 'group', 'domain.event', 40, true),
                      ('gis', 'GIS', 'group', 'domain.gis', 50, true)
                  ON CONFLICT DO NOTHING
              """)
              cur.execute("""
                  INSERT INTO ops.settings_nodes (parent_id, code, name, node_type, system_key, ord, locked)
                  SELECT root.id, seed.code, seed.name, 'category', seed.system_key, seed.ord, true
                    FROM ops.settings_nodes root
                    CROSS JOIN (VALUES
                        ('position_grade', '직급', 'hr.position_grade', 10),
                        ('position_title', '직위/직책', 'hr.position_title', 20),
                        ('employment_type', '고용형태', 'hr.employment_type', 30),
                        ('employment_status', '재직상태', 'hr.status', 40),
                        ('technical_grade', '기술등급', 'hr.technical_grade', 50)
                    ) AS seed(code, name, system_key, ord)
                   WHERE root.system_key = 'domain.hr'
                  ON CONFLICT DO NOTHING
              """)
              leaf_sets = (
                  ("hr.position_grade", (("임원","임원",10),("부장","부장",20),("차장","차장",30),("과장","과장",40),("대리","대리",50),("주임","주임",60),("사원","사원",70),("인턴","인턴",80))),
                  ("hr.position_title", (("대표","대표",10),("본부장","본부장",20),("팀장","팀장",30),("팀원","팀원",40))),
                  ("hr.employment_type", (("정규직","정규직",10),("계약직","계약직",20),("파견","파견",30),("용역","용역",40),("프리랜서","프리랜서",50),("인턴","인턴",60))),
                  ("hr.status", (("재직","재직",10),("휴직","휴직",20),("퇴사","퇴사",30))),
                  ("hr.technical_grade", (("초급","초급",10),("중급","중급",20),("고급","고급",30),("특급","특급",40))),
              )
              for system_key, leaves in leaf_sets:
                  for code, name, ord_value in leaves:
                      cur.execute("""
                          INSERT INTO ops.settings_nodes (parent_id, code, name, node_type, value, ord)
                          SELECT category.id, %s, %s, 'value', %s, %s
                            FROM ops.settings_nodes category
                           WHERE category.system_key=%s
                          ON CONFLICT DO NOTHING
                      """, [code, name, code, ord_value, system_key])

          with transaction.atomic(using="default"):
              with connections["default"].cursor() as central_cur:
                  central_cur.execute("SET LOCAL TRANSACTION READ ONLY")
                  rows = list(
                      GroupDBConfig.objects.using("default")
                      .select_related("group")
                      .order_by("group_id")
                  )

          active_rows = [row for row in rows if text(getattr(row.group, "status", "")).lower() == "active"]
          totals = Counter()
          totals["configs"] = len(rows)
          totals["active_tenants"] = len(active_rows)

          for row in active_rows:
              raw = text(row.db_password)
              try:
                  password = resolve_tenant_db_password(raw) if is_tenant_db_secret_reference(raw) else raw
              except Exception:
                  totals["secret_resolution_failed"] += 1
                  continue
              if not password:
                  totals["secret_resolution_failed"] += 1
                  continue
              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name, user=row.db_user, password=password,
                      host=row.db_host, port=row.db_port, sslmode="require", connect_timeout=8,
                  )
              except Exception:
                  totals["connection_failed"] += 1
                  continue

              try:
                  conn.autocommit = False
                  with conn.cursor() as cur:
                      cur.execute("SET LOCAL lock_timeout = '5s'")
                      cur.execute("SET LOCAL statement_timeout = '60s'")
                      cur.execute("SELECT pg_advisory_xact_lock(hashtext(%s))", ["geoflow:webgisapp:0021"])

                      employee_present = relation_exists(cur, "hr.employee_profile")
                      scope_present = relation_exists(cur, "prj.scope_item")
                      attachments_present = relation_exists(cur, "ops.attachments")
                      if not employee_present and not scope_present and not attachments_present:
                          conn.rollback()
                          totals["schema_absent_skipped"] += 1
                          continue
                      if not employee_present or not scope_present or not attachments_present:
                          raise RuntimeError("partial tenant employee/project schema cannot be skipped")

                      dep_applied = bool(scalar(
                          cur,
                          "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                          [APP, DEPENDENCY],
                      ))
                      if not dep_applied:
                          raise RuntimeError("0020 dependency not applied")

                      already_applied = bool(scalar(
                          cur,
                          "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                          [APP, MIGRATION],
                      ))
                      employee_before = int(scalar(cur, "SELECT COUNT(*) FROM hr.employee_profile"))
                      attachments_before = int(scalar(cur, "SELECT COUNT(*) FROM ops.attachments"))

                      if not already_applied:
                          execute_0021(cur)
                          cur.execute("""
                              INSERT INTO django_migrations (app, name, applied)
                              SELECT %s, %s, NOW()
                               WHERE NOT EXISTS (
                                   SELECT 1 FROM django_migrations WHERE app=%s AND name=%s
                               )
                          """, [APP, MIGRATION, APP, MIGRATION])

                      for relation in REQUIRED_TABLES:
                          if not relation_exists(cur, relation):
                              raise RuntimeError(f"0021 required table missing: {relation}")

                      employee_after = int(scalar(cur, "SELECT COUNT(*) FROM hr.employee_profile"))
                      attachments_after = int(scalar(cur, "SELECT COUNT(*) FROM ops.attachments"))
                      if employee_after != employee_before:
                          raise RuntimeError("employee profile row count changed")
                      if attachments_after != attachments_before:
                          raise RuntimeError("attachment row count changed")

                      missing_roots = int(scalar(cur, """
                          SELECT COUNT(*)
                            FROM (VALUES ('domain.hr'), ('domain.contract'), ('domain.project'), ('domain.event'), ('domain.gis')) v(system_key)
                           WHERE NOT EXISTS (
                               SELECT 1 FROM ops.settings_nodes n WHERE n.system_key=v.system_key AND n.active=true
                           )
                      """))
                      if missing_roots:
                          raise RuntimeError("platform settings roots missing")

                      migration_recorded = bool(scalar(
                          cur,
                          "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                          [APP, MIGRATION],
                      ))
                      if not migration_recorded:
                          raise RuntimeError("0021 migration record missing")

                  conn.commit()
                  totals["already_applied" if already_applied else "migrated"] += 1
                  totals["employee_rows_verified"] += employee_before
                  totals["attachment_rows_verified"] += attachments_before
              except Exception:
                  conn.rollback()
                  totals["migration_failed"] += 1
              finally:
                  conn.close()

          for key in (
              "configs", "active_tenants", "migrated", "already_applied", "schema_absent_skipped",
              "secret_resolution_failed", "connection_failed", "migration_failed",
              "employee_rows_verified", "attachment_rows_verified",
          ):
              print(f"employee_settings_activation_{key}={int(totals[key])}")

          accounted = totals["migrated"] + totals["already_applied"] + totals["schema_absent_skipped"]
          if accounted != totals["active_tenants"]:
              raise SystemExit("employee_settings_activation_blocker=not_all_active_tenants_accounted")
          if totals["secret_resolution_failed"] or totals["connection_failed"] or totals["migration_failed"]:
              raise SystemExit("employee_settings_activation_blocker=tenant_migration_failure")
          print("employee_settings_activation_db_complete=yes")
          PY

          git -C "$repo" fetch --prune origin refs/heads/release/stabilized-deploy
          fetched_sha="$(git -C "$repo" rev-parse FETCH_HEAD)"
          [ "$fetched_sha" = "$candidate_sha" ] || fail 'candidate_sha_not_current_release_head'

          rollback_needed=0
          rollback_code() {
            set +e
            if [ "$rollback_needed" -eq 1 ]; then
              echo 'employee_settings_activation_code_rollback_started=yes'
              if [ -n "$previous_branch" ]; then
                git -C "$repo" checkout -B "$previous_branch" "$previous_sha" >/dev/null 2>&1
              else
                git -C "$repo" checkout --detach "$previous_sha" >/dev/null 2>&1
              fi
              "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt" >/dev/null 2>&1
              "$python" "$repo/manage.py" collectstatic --noinput >/dev/null 2>&1
              sudo -n systemctl restart "$service"
              sleep 3
              echo "employee_settings_activation_rollback_service_state=$(systemctl is-active "$service" 2>/dev/null || true)"
              echo 'employee_settings_activation_code_rollback_completed=yes'
            fi
          }
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then rollback_code; fi
            exit "$rc"
          }
          trap on_exit EXIT
          rollback_needed=1

          git -C "$repo" checkout -B "$expected_branch" "$candidate_sha"
          [ "$(git -C "$repo" rev-parse HEAD)" = "$candidate_sha" ] || fail 'candidate_checkout_failed'

          "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt"
          "$python" -m pip check
          "$python" "$repo/manage.py" check
          "$python" "$repo/manage.py" collectstatic --noinput
          sudo -n systemctl restart "$service"

          ready=no
          for _ in $(seq 1 30); do
            active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
            sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
            code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/login/ || true)"
            if [ "$active" = 'active' ] && [ "$sub" = 'running' ]; then
              case "$code" in
                2??|3??) ready=yes; break ;;
              esac
            fi
            sleep 2
          done
          [ "$ready" = yes ] || fail 'stabilized_service_failed_post_restart_healthcheck'

          public_login="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/login/ || true)"
          echo "employee_settings_activation_public_login_status=$public_login"
          [ "$public_login" = '200' ] || fail 'public_login_not_200_after_activation'

          rollback_needed=0
          trap - EXIT
          echo "employee_settings_activation_deployed_sha=$(git -C "$repo" rev-parse HEAD)"
          echo "employee_settings_activation_deployed_branch=$(git -C "$repo" rev-parse --abbrev-ref HEAD)"
          echo 'employee_settings_production_activation_complete=yes'
          REMOTE
