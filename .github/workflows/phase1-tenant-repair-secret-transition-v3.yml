name: Phase 1 tenant repair and secret transition v3

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-tenant-repair-secret-transition-v3.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  tenant-repair-secret-transition-v3:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Repair serving tenant, quarantine stale tenant, and enforce secret references
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'

          fail() {
            echo "tenant_repair_transition_v3_blocker=$1"
            exit 2
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'stabilized_service_not_running'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          [ -f "$repo/control/services/tenant_db_secret_resolver.py" ] || fail 'tenant_secret_resolver_missing'

          dirty_count="$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')"
          [ "$dirty_count" = '0' ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'

          before_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/ || true)"
          case "$before_code" in 2??|3??) ;; *) fail 'port_8011_not_healthy_before_transition' ;; esac

          # No credentials, DB identifiers, hosts, group/user identifiers, secret IDs,
          # AWS account IDs or ARNs are printed. Only aggregate safety markers leave process memory.
          "$python" - "$repo" <<'PY'
          import hmac
          import json
          import os
          import socket
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import boto3
          import psycopg2
          from botocore.exceptions import ClientError
          from django.conf import settings
          from django.db import connections, transaction
          from django.utils import timezone

          from control.models import Group, GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          alias = "default"

          def text(value):
              return str(value or "").strip()

          def active_group(row):
              return text(getattr(row.group, "status", "")).lower() == "active"

          def dns_resolves(host, port):
              try:
                  socket.getaddrinfo(text(host), int(port), type=socket.SOCK_STREAM)
                  return True
              except Exception:
                  return False

          def password_for(row, sm=None):
              raw = text(row.db_password)
              if not raw:
                  return ""
              if is_tenant_db_secret_reference(raw):
                  try:
                      return resolve_tenant_db_password(raw, client=sm) if sm else resolve_tenant_db_password(raw)
                  except Exception:
                      return ""
              return raw

          def can_connect(row, password, host, port):
              if not password or not text(host):
                  return False
              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=host,
                      port=int(port),
                      sslmode="require",
                      connect_timeout=8,
                  )
                  try:
                      with conn.cursor() as cursor:
                          cursor.execute("SELECT 1")
                          value = cursor.fetchone()
                          return bool(value and value[0] == 1)
                  finally:
                      conn.close()
              except Exception:
                  return False

          rows = list(
              GroupDBConfig.objects.using(alias)
              .select_related("group")
              .order_by("group_id")
          )
          if len(rows) != 5:
              raise SystemExit("tenant_repair_transition_v3_blocker=unexpected_config_count")

          active_before = [row for row in rows if active_group(row)]
          inactive_before = [row for row in rows if not active_group(row)]
          failed = [row for row in active_before if not dns_resolves(row.db_host, row.db_port)]
          healthy = [row for row in active_before if dns_resolves(row.db_host, row.db_port)]

          print(f"tenant_repair_v3_total_before={len(rows)}")
          print(f"tenant_repair_v3_active_before={len(active_before)}")
          print(f"tenant_repair_v3_inactive_before={len(inactive_before)}")
          print(f"tenant_repair_v3_dns_failed_before={len(failed)}")
          print(f"tenant_repair_v3_dns_healthy_before={len(healthy)}")

          if len(active_before) != 4 or len(inactive_before) != 1 or len(failed) != 2 or len(healthy) != 2:
              raise SystemExit("tenant_repair_transition_v3_blocker=production_shape_changed")

          inactive_statuses = {
              text(row.group.status)
              for row in inactive_before
              if text(row.group.status) and text(row.group.status).lower() != "active"
          }
          if len(inactive_statuses) != 1:
              raise SystemExit("tenant_repair_transition_v3_blocker=inactive_status_not_unambiguous")
          quarantine_status = next(iter(inactive_statuses))

          central_cfg = settings.DATABASES[alias]
          central_host = text(central_cfg.get("HOST"))
          central_port = int(central_cfg.get("PORT") or 5432)
          if not central_host:
              raise SystemExit("tenant_repair_transition_v3_blocker=central_host_missing")

          serving = {}
          db_exists = {}
          role_exists = {}
          verified_users = {}
          pending_joins = {}
          owner_active_verified = {}

          with connections[alias].cursor() as cursor:
              cursor.execute(
                  "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='join_requests')"
              )
              has_join_requests = bool(cursor.fetchone()[0])
              cursor.execute(
                  "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='groups' AND column_name='owner_user_id')"
              )
              has_owner_column = bool(cursor.fetchone()[0])

              for row in failed:
                  gid = str(row.group_id)
                  cursor.execute(
                      """
                      SELECT COUNT(*) FILTER (
                                 WHERE ugm.status='active'
                                   AND u.is_active=TRUE
                                   AND u.email_verified=TRUE
                             )::int,
                             COUNT(*) FILTER (WHERE u.email_verified=TRUE)::int
                        FROM user_group_map ugm
                        JOIN users u ON u.id=ugm.user_id
                       WHERE ugm.group_id=%s
                      """,
                      [gid],
                  )
                  vals = cursor.fetchone()
                  serving[gid] = int(vals[0] or 0)
                  verified_users[gid] = int(vals[1] or 0)

                  cursor.execute("SELECT EXISTS (SELECT 1 FROM pg_database WHERE datname=%s)", [row.db_name])
                  db_exists[gid] = bool(cursor.fetchone()[0])
                  cursor.execute("SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=%s)", [row.db_user])
                  role_exists[gid] = bool(cursor.fetchone()[0])

                  pending_joins[gid] = 0
                  if has_join_requests:
                      cursor.execute(
                          """
                          SELECT COUNT(*) FILTER (
                                     WHERE status IN ('pending','pending_approval','pending_email_verification')
                                 )::int
                            FROM join_requests WHERE group_id=%s
                          """,
                          [gid],
                      )
                      pending_joins[gid] = int(cursor.fetchone()[0] or 0)

                  owner_active_verified[gid] = False
                  if has_owner_column:
                      cursor.execute(
                          """
                          SELECT COALESCE(u.is_active,FALSE) AND COALESCE(u.email_verified,FALSE)
                            FROM groups g LEFT JOIN users u ON u.id=g.owner_user_id
                           WHERE g.id=%s
                          """,
                          [gid],
                      )
                      owner = cursor.fetchone()
                      owner_active_verified[gid] = bool(owner and owner[0])

          A_rows = [
              row for row in failed
              if serving[str(row.group_id)] > 0
              and db_exists[str(row.group_id)]
              and role_exists[str(row.group_id)]
          ]
          B_rows = [row for row in failed if row not in A_rows]
          if len(A_rows) != 1 or len(B_rows) != 1:
              raise SystemExit("tenant_repair_transition_v3_blocker=unable_to_classify_A_B")
          A = A_rows[0]
          B = B_rows[0]
          b_gid = str(B.group_id)

          if serving[b_gid] != 0 or verified_users[b_gid] != 0:
              raise SystemExit("tenant_repair_transition_v3_blocker=B_has_verified_serving_user")
          if db_exists[b_gid] or role_exists[b_gid]:
              raise SystemExit("tenant_repair_transition_v3_blocker=B_database_or_role_now_exists")
          if pending_joins[b_gid] != 0:
              raise SystemExit("tenant_repair_transition_v3_blocker=B_has_pending_join")
          if owner_active_verified[b_gid]:
              raise SystemExit("tenant_repair_transition_v3_blocker=B_has_active_verified_owner")

          region = text(os.environ.get("AWS_REGION")) or "ap-northeast-2"
          sm = boto3.client("secretsmanager", region_name=region)

          def ensure_secret(secret_id, value):
              payload = json.dumps({"password": value}, separators=(",", ":"))
              try:
                  sm.create_secret(Name=secret_id, SecretString=payload)
              except ClientError as exc:
                  code = text(exc.response.get("Error", {}).get("Code"))
                  if code not in {"ResourceExistsException", "ResourceExists"}:
                      raise SystemExit("tenant_repair_transition_v3_blocker=secretsmanager_create_failed") from exc
              try:
                  response = sm.get_secret_value(SecretId=secret_id)
                  secret_string = response.get("SecretString")
                  parsed = json.loads(secret_string) if isinstance(secret_string, str) else None
                  roundtrip = parsed.get("password") if isinstance(parsed, dict) else None
              except Exception as exc:
                  raise SystemExit("tenant_repair_transition_v3_blocker=secretsmanager_roundtrip_failed") from exc
              if not isinstance(roundtrip, str) or not hmac.compare_digest(roundtrip, value):
                  raise SystemExit("tenant_repair_transition_v3_blocker=existing_secret_mismatch")
              return f"aws-secretsmanager:{secret_id}#password", roundtrip

          # A: never rotate its PostgreSQL role. Reuse a credential that already proves login.
          a_current = password_for(A, sm=sm)
          a_password = ""
          a_reference = ""
          a_recovery_source = "none"

          if a_current and can_connect(A, a_current, central_host, central_port):
              if is_tenant_db_secret_reference(A.db_password):
                  a_reference = text(A.db_password)
                  a_password = a_current
              else:
                  secret_id = f"geoflow/tenant-db/{A.group_id}/password"
                  a_reference, a_password = ensure_secret(secret_id, a_current)
              a_recovery_source = "current"
          else:
              candidates = {}
              for name in ("TENANT_DB_PASSWORD", "PROVISIONER_DB_PASSWORD", "CENTRAL_DB_PASSWORD"):
                  value = text(os.environ.get(name))
                  if value:
                      candidates.setdefault(value, set()).add("env")
              for peer in rows:
                  if str(peer.group_id) == str(A.group_id):
                      continue
                  value = password_for(peer, sm=sm)
                  if value:
                      candidates.setdefault(value, set()).add("peer")

              successes = []
              for value, sources in candidates.items():
                  if can_connect(A, value, central_host, central_port):
                      successes.append((value, sources))
              if len(successes) != 1:
                  raise SystemExit("tenant_repair_transition_v3_blocker=A_working_credential_not_unique")
              a_password, sources = successes[0]
              secret_id = f"geoflow/tenant-db/{A.group_id}/password-recovered-v1"
              a_reference, a_password = ensure_secret(secret_id, a_password)
              a_recovery_source = "env_peer" if {"env", "peer"}.issubset(sources) else ("env" if "env" in sources else "peer")

          if not can_connect(A, a_password, central_host, central_port):
              raise SystemExit("tenant_repair_transition_v3_blocker=A_planned_connection_failed")

          # Healthy serving tenants: preserve their DB identity and move only passwords to refs.
          healthy_plans = []
          for row in healthy:
              raw = text(row.db_password)
              if not raw:
                  raise SystemExit("tenant_repair_transition_v3_blocker=healthy_password_empty")
              if is_tenant_db_secret_reference(raw):
                  password = password_for(row, sm=sm)
                  reference = raw
                  if not password:
                      raise SystemExit("tenant_repair_transition_v3_blocker=healthy_reference_unresolvable")
              else:
                  secret_id = f"geoflow/tenant-db/{row.group_id}/password"
                  reference, password = ensure_secret(secret_id, raw)
              if not can_connect(row, password, row.db_host, row.db_port):
                  raise SystemExit("tenant_repair_transition_v3_blocker=healthy_connection_validation_failed")
              healthy_plans.append((row, reference, password))

          print("tenant_repair_v3_A_classified=yes")
          print(f"tenant_repair_v3_A_recovery_source={a_recovery_source}")
          print("tenant_repair_v3_A_role_password_rotated=no")
          print("tenant_repair_v3_A_planned_connection=yes")
          print("tenant_repair_v3_B_classified=yes")
          print("tenant_repair_v3_B_quarantine_safe=yes")
          print(f"tenant_repair_v3_healthy_validated={len(healthy_plans)}")

          # One atomic central-DB mutation: repair A; quarantine B; convert healthy passwords.
          with transaction.atomic(using=alias):
              a_updated = (
                  GroupDBConfig.objects.using(alias)
                  .filter(
                      group_id=A.group_id,
                      db_host=A.db_host,
                      db_port=A.db_port,
                      db_password=A.db_password,
                  )
                  .update(
                      db_host=central_host,
                      db_port=central_port,
                      db_password=a_reference,
                  )
              )
              if a_updated != 1:
                  raise RuntimeError("A concurrent config change detected")

              b_config_updated = (
                  GroupDBConfig.objects.using(alias)
                  .filter(group_id=B.group_id, db_password=B.db_password)
                  .update(db_password="")
              )
              if b_config_updated != 1:
                  raise RuntimeError("B concurrent config change detected")

              b_group_updated = (
                  Group.objects.using(alias)
                  .filter(id=B.group_id, status=B.group.status)
                  .update(status=quarantine_status, updated_at=timezone.now())
              )
              if b_group_updated != 1:
                  raise RuntimeError("B concurrent group status change detected")

              for row, reference, _password in healthy_plans:
                  if text(row.db_password) == reference:
                      continue
                  updated = (
                      GroupDBConfig.objects.using(alias)
                      .filter(group_id=row.group_id, db_password=row.db_password)
                      .update(db_password=reference)
                  )
                  if updated != 1:
                      raise RuntimeError("healthy concurrent config change detected")

          after = list(
              GroupDBConfig.objects.using(alias)
              .select_related("group")
              .order_by("group_id")
          )
          if len(after) != 5:
              raise SystemExit("tenant_repair_transition_v3_blocker=config_count_changed_after")

          active_after = [row for row in after if active_group(row)]
          inactive_after = [row for row in after if not active_group(row)]
          refs_after = 0
          inactive_empty_after = 0
          plaintext_after = 0
          active_validated_after = 0

          for row in after:
              raw = text(row.db_password)
              if not raw:
                  if active_group(row):
                      raise SystemExit("tenant_repair_transition_v3_blocker=active_password_empty_after")
                  inactive_empty_after += 1
                  continue
              if not is_tenant_db_secret_reference(raw):
                  plaintext_after += 1
                  continue
              password = password_for(row, sm=sm)
              if not password:
                  raise SystemExit("tenant_repair_transition_v3_blocker=post_reference_unresolvable")
              refs_after += 1
              if active_group(row):
                  if not can_connect(row, password, row.db_host, row.db_port):
                      raise SystemExit("tenant_repair_transition_v3_blocker=active_connection_failed_after")
                  active_validated_after += 1

          if len(active_after) != 3 or len(inactive_after) != 2:
              raise SystemExit("tenant_repair_transition_v3_blocker=unexpected_active_inactive_after")
          if refs_after != 3 or inactive_empty_after != 2 or plaintext_after != 0:
              raise SystemExit("tenant_repair_transition_v3_blocker=secret_reference_policy_not_satisfied")
          if active_validated_after != 3:
              raise SystemExit("tenant_repair_transition_v3_blocker=active_validation_count_after")

          print("tenant_repair_v3_A_repaired=yes")
          print("tenant_repair_v3_B_quarantined=yes")
          print(f"tenant_repair_v3_active_after={len(active_after)}")
          print(f"tenant_repair_v3_inactive_after={len(inactive_after)}")
          print(f"tenant_repair_v3_refs_after={refs_after}")
          print(f"tenant_repair_v3_inactive_empty_after={inactive_empty_after}")
          print(f"tenant_repair_v3_active_validated_after={active_validated_after}")
          print("tenant_repair_v3_plaintext_after=0")
          print("tenant_repair_v3_central_db_ready=yes")
          PY

          env_backup="$(mktemp)"
          chmod 600 "$env_backup"
          cp "$repo/.env" "$env_backup"
          cleanup_backup() { rm -f "$env_backup"; }
          trap cleanup_backup EXIT

          "$python" - "$repo/.env" <<'PY'
          from pathlib import Path
          import os
          import sys
          import tempfile

          path = Path(sys.argv[1])
          original = path.read_text(encoding="utf-8")
          lines = original.splitlines()
          key = "TENANT_DB_REQUIRE_SECRET_REFERENCES"
          out = []
          replaced = False
          for line in lines:
              stripped = line.lstrip()
              if stripped.startswith(key + "="):
                  if not replaced:
                      out.append(f"{key}=1")
                      replaced = True
                  continue
              out.append(line)
          if not replaced:
              out.append(f"{key}=1")
          new_text = "\n".join(out) + "\n"
          fd, tmp = tempfile.mkstemp(prefix=".env.phase1.", dir=str(path.parent))
          try:
              os.fchmod(fd, 0o600)
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  handle.write(new_text)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp, path)
          finally:
              if os.path.exists(tmp):
                  os.unlink(tmp)
          PY

          restart_ok=no
          if sudo -n systemctl restart "$service"; then
            for _ in $(seq 1 30); do
              active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
              sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
              code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/ || true)"
              if [ "$active" = 'active' ] && [ "$sub" = 'running' ]; then
                case "$code" in 2??|3??) restart_ok=yes; break ;; esac
              fi
              sleep 2
            done
          fi

          if [ "$restart_ok" != yes ]; then
            cp "$env_backup" "$repo/.env"
            sudo -n systemctl restart "$service" || true
            fail 'service_failed_with_strict_secret_references'
          fi

          # Post-restart inline audit; does not depend on deploying the newer management command.
          "$python" - "$repo" <<'PY'
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import psycopg2
          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          def text(value):
              return str(value or "").strip()

          rows = list(
              GroupDBConfig.objects.using("default")
              .select_related("group")
              .order_by("group_id")
          )
          active = 0
          active_refs = 0
          active_validated = 0
          inactive_empty = 0
          plaintext = 0

          for row in rows:
              group_active = text(row.group.status).lower() == "active"
              raw = text(row.db_password)
              if group_active:
                  active += 1
              if not raw:
                  if group_active:
                      raise SystemExit("tenant_repair_transition_v3_blocker=post_restart_active_empty")
                  inactive_empty += 1
                  continue
              if not is_tenant_db_secret_reference(raw):
                  plaintext += 1
                  continue
              password = resolve_tenant_db_password(raw)
              if not password:
                  raise SystemExit("tenant_repair_transition_v3_blocker=post_restart_reference_unresolvable")
              if group_active:
                  active_refs += 1
                  try:
                      conn = psycopg2.connect(
                          dbname=row.db_name,
                          user=row.db_user,
                          password=password,
                          host=row.db_host,
                          port=row.db_port,
                          sslmode="require",
                          connect_timeout=8,
                      )
                      try:
                          with conn.cursor() as cursor:
                              cursor.execute("SELECT 1")
                              value = cursor.fetchone()
                              if not value or value[0] != 1:
                                  raise RuntimeError("unexpected SELECT 1 result")
                      finally:
                          conn.close()
                  except Exception as exc:
                      raise SystemExit("tenant_repair_transition_v3_blocker=post_restart_active_connection_failed") from exc
                  active_validated += 1

          if len(rows) != 5 or active != 3 or active_refs != 3 or active_validated != 3 or inactive_empty != 2 or plaintext != 0:
              raise SystemExit("tenant_repair_transition_v3_blocker=post_restart_policy_mismatch")

          print(f"tenant_repair_v3_post_total={len(rows)}")
          print(f"tenant_repair_v3_post_active={active}")
          print(f"tenant_repair_v3_post_active_refs={active_refs}")
          print(f"tenant_repair_v3_post_active_validated={active_validated}")
          print(f"tenant_repair_v3_post_inactive_empty={inactive_empty}")
          print("tenant_repair_v3_post_plaintext=0")
          print("tenant_repair_v3_post_audit_ready=yes")
          PY

          terms_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/terms/ || true)"
          privacy_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/privacy/ || true)"
          [ "$terms_code" = '200' ] || fail 'public_terms_not_200'
          [ "$privacy_code" = '200' ] || fail 'public_privacy_not_200'

          echo 'tenant_db_secret_references_enforced=yes'
          echo 'phase1_tenant_repair_secret_transition_v3_ready=yes'
          REMOTE
