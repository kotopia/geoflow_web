name: Phase 2 IAM policy contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - docs/phase2-runtime-iam-policy-template.json
      - docs/phase2-ec2-trust-policy-template.json
      - control/test_phase2_iam_policy_contract.py
      - .github/workflows/phase2-iam-policy-contract.yml
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - docs/phase2-runtime-iam-policy-template.json
      - docs/phase2-ec2-trust-policy-template.json
      - control/test_phase2_iam_policy_contract.py
      - .github/workflows/phase2-iam-policy-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-iam-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate least-privilege IAM templates
        run: python -m unittest control.test_phase2_iam_policy_contract
