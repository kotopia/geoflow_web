name: Catalog board authorization regression

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - geoflow_ops/security_views.py
      - geoflow_ops/test_catalog_board_authorization.py
      - .github/workflows/catalog-board-authz-regression.yml
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - geoflow_ops/security_views.py
      - geoflow_ops/test_catalog_board_authorization.py
      - .github/workflows/catalog-board-authz-regression.yml

permissions:
  contents: read

jobs:
  catalog-board-authz-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify catalog board authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest geoflow_ops.test_catalog_board_authorization
