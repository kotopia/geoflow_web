name: Temporary contract list API production deploy v2

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/temp-contract-list-api-production-deploy-v2.yml
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed release/stabilized-deploy commit to deploy
        required: false
        type: string
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"
        type: string

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-temp-contract-list-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,geoflow.co.kr
      CENTRAL_DB_NAME: ci-central
      CENTRAL_DB_USER: ci-central-user
      CENTRAL_DB_PASSWORD: ci-nonsecret-placeholder
      CENTRAL_DB_HOST: central.example.internal
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant
      TENANT_DB_USER: ci-tenant-user
      TENANT_DB_PASSWORD: ci-nonsecret-placeholder
      TENANT_DB_HOST: tenant.example.internal
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"
      AWS_REGION: ap-northeast-2
      SITE_ORIGIN: https://geoflow.co.kr
      TEMP_CONTRACT_LIST_API_ENABLED: "0"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/stabilized-deploy
          fetch-depth: 0

      - name: Validate exact release and temporary API files
        shell: bash
        env:
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$REQUESTED_RELEASE_SHA" || {
            echo 'temp_contract_api_v2_blocker=release_sha_not_current_head'
            exit 2
          }
          test -f geoflow_ops/temp_contract_list_api.py
          grep -Fq 'api/temp/contracts/' geoflow_ops/urls.py
          echo "temp_contract_api_v2_reviewed_sha=$actual_sha"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate temporary API
        shell: bash
        run: |
          set -euo pipefail
          python manage.py check
          python manage.py test geoflow_ops.test_temp_contract_list_api

  deploy-production-disabled:
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}
      REQUESTED_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/stabilized-deploy
          fetch-depth: 0

      - name: Validate reviewed head and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_RELEASE_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Deploy exact release with restart readiness wait
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$REQUESTED_RELEASE_SHA'" <<'REMOTE'
          set -euo pipefail

          candidate_sha="$1"
          service='geoflow-stabilized.service'
          expected_branch='release/stabilized-deploy'

          fail() {
            echo "temp_contract_api_v2_blocker=$1"
            exit 2
          }

          wait_for_login() {
            ready=no
            for attempt in $(seq 1 20); do
              active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
              sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
              code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/login/ 2>/dev/null || true)"
              echo "temp_contract_api_v2_health attempt=$attempt active=$active sub=$sub code=$code"
              if [ "$active" = 'active' ] && [ "$sub" = 'running' ]; then
                case "$code" in 2??|3??) ready=yes; break ;; esac
              fi
              sleep 2
            done
            [ "$ready" = yes ]
          }

          rollback_code() {
            previous_sha="$1"
            previous_branch="$2"
            if [ -n "$previous_branch" ]; then
              git -C "$repo" switch "$previous_branch" >/dev/null 2>&1 || true
              git -C "$repo" reset --hard "$previous_sha" >/dev/null
            else
              git -C "$repo" checkout --detach "$previous_sha" >/dev/null 2>&1
            fi
            "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt" >/dev/null 2>&1 || true
            "$python" "$repo/manage.py" collectstatic --noinput >/dev/null 2>&1 || true
            sudo -n systemctl restart "$service" || true
            wait_for_login || true
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'service_not_running_before_deploy'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          [ "$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')" = '0' ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'venv_python_missing'

          before_code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/login/ || true)"
          case "$before_code" in 2??|3??) ;; *) fail 'login_unhealthy_before_deploy' ;; esac

          previous_sha="$(git -C "$repo" rev-parse HEAD)"
          previous_branch="$(git -C "$repo" symbolic-ref --short -q HEAD || true)"
          [ -n "$previous_branch" ] || fail 'production_repo_detached'

          git -C "$repo" fetch --prune origin refs/heads/$expected_branch
          [ "$(git -C "$repo" rev-parse FETCH_HEAD)" = "$candidate_sha" ] || fail 'candidate_not_current_release_head'
          git -C "$repo" cat-file -e "$candidate_sha:geoflow_ops/temp_contract_list_api.py" || fail 'candidate_api_missing'

          candidate_dir="$(mktemp -d /tmp/geoflow-temp-contract-api.XXXXXX)"
          cleanup_candidate() {
            git -C "$repo" worktree remove --force "$candidate_dir" >/dev/null 2>&1 || true
            rm -rf "$candidate_dir" >/dev/null 2>&1 || true
          }
          trap cleanup_candidate EXIT
          git -C "$repo" worktree add --detach "$candidate_dir" "$candidate_sha" >/dev/null
          ln -sfn "$repo/.env" "$candidate_dir/.env"
          (cd "$candidate_dir" && "$python" manage.py check)
          echo 'temp_contract_api_v2_candidate_check=yes'

          git -C "$repo" switch "$expected_branch"
          git -C "$repo" merge --ff-only "$candidate_sha"
          [ "$(git -C "$repo" rev-parse HEAD)" = "$candidate_sha" ] || fail 'deploy_head_mismatch'

          "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt" >/dev/null
          "$python" "$repo/manage.py" collectstatic --noinput >/dev/null

          if ! sudo -n systemctl restart "$service"; then
            rollback_code "$previous_sha" "$previous_branch"
            fail 'service_restart_failed'
          fi

          if ! wait_for_login; then
            echo "temp_contract_api_v2_service_active=$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
            echo "temp_contract_api_v2_service_sub=$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
            echo "temp_contract_api_v2_exec_status=$(systemctl show "$service" -p ExecMainStatus --value 2>/dev/null || true)"
            rollback_code "$previous_sha" "$previous_branch"
            fail 'login_unhealthy_after_deploy'
          fi

          # The production runtime redirects plain HTTP to HTTPS. Simulate the
          # trusted reverse proxy so SecurityMiddleware reaches the disabled
          # endpoint itself; a plain HTTP probe would only see a 301 redirect.
          api_code="$(curl -sS -H 'Host: geoflow.co.kr' -H 'X-Forwarded-Proto: https' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 http://127.0.0.1:8011/api/temp/contracts/ || true)"
          echo "temp_contract_api_v2_disabled_probe_code=$api_code"
          [ "$api_code" = '404' ] || {
            rollback_code "$previous_sha" "$previous_branch"
            fail 'temporary_api_not_disabled_after_deploy'
          }

          echo "temp_contract_api_v2_deployed_sha=$candidate_sha"
          echo 'temp_contract_api_v2_enabled=no'
          REMOTE
