name: Phase 2 proxy SSL redirect launcher

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase2-proxy-security-ssl-redirect-launcher.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-reviewed-current-release:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact release merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release has not advanced
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'phase2_proxy_ssl_redirect_launcher_blocker=release_advanced'
            exit 2
          }
          echo 'phase2_proxy_ssl_redirect_launcher_exact_release=yes'

      - name: Dispatch reviewed SSL redirect stage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/phase2-proxy-security-staged-activation.yml/dispatches" \
            -f ref='release/stabilized-deploy' \
            -F 'inputs[stage]=ssl-redirect' \
            -F 'inputs[confirm_activation]=PHASE2_PROXY_ACTIVATE' \
            -F 'inputs[ssh_port]=22'
          echo 'phase2_proxy_ssl_redirect_launcher_dispatched=yes'
