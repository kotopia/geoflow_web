name: Legacy email verification backfill contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/legacy-email-verification-backfill.yml
      - .github/workflows/legacy-email-verification-backfill-contract.yml
      - control/test_legacy_email_verification_backfill_contract.py

permissions:
  contents: read

jobs:
  legacy-email-verification-backfill-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run static safety contract
        run: python -m unittest control.test_legacy_email_verification_backfill_contract
