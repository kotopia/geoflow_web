name: iroomsng Django PostgreSQL runtime diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-django-postgres-runtime-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iroomsng-django-postgres-runtime:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact triggering release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Correlate Django and PostgreSQL compatibility read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v python3 >/dev/null 2>&1 || { echo 'iroomsng_runtime_blocker=python_missing'; exit 2; }
          command -v systemctl >/dev/null 2>&1 || { echo 'iroomsng_runtime_blocker=systemctl_missing'; exit 2; }
          command -v journalctl >/dev/null 2>&1 || { echo 'iroomsng_runtime_blocker=journalctl_missing'; exit 2; }
          sudo -n true >/dev/null 2>&1 || { echo 'iroomsng_runtime_blocker=passwordless_sudo_required'; exit 2; }

          inspect_unit() {
            unit="$1"
            key="$2"
            journal_file="$(mktemp)"
            sudo -n journalctl -u "$unit" -n 1500 --no-pager >"$journal_file" 2>/dev/null || true

            python3 - "$journal_file" "$key" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")
          key = sys.argv[2]

          def flag(name, pattern):
              print(f"iroomsng_runtime_{key}_{name}={'yes' if re.search(pattern, text, re.I) else 'no'}")

          flag("postgresql_14_minimum_error", r"PostgreSQL\s+14\s+or later is required")
          flag("django_database_version_check_frame", r"check_database_version_supported|django[/\\]db[/\\]backends[/\\]base[/\\]base\.py")
          flag("postgis_minimum_error", r"PostGIS[^\n]{0,100}(?:or later|minimum|not supported)")
          flag("sqlite_minimum_error", r"SQLite[^\n]{0,100}(?:or later|minimum|not supported)")
          flag("mysql_mariadb_minimum_error", r"(?:MySQL|MariaDB)[^\n]{0,100}(?:or later|minimum|not supported)")

          found = re.search(r"PostgreSQL\s+14\s+or later is required\s*\(found\s+(\d+)(?:\.\d+)*", text, re.I)
          print(f"iroomsng_runtime_{key}_postgresql_found_major={found.group(1) if found else 'unknown'}")
          print(f"iroomsng_runtime_{key}_not_supported_count={len(re.findall(r'NotSupportedError', text))}")
          PY

            exec_raw="$(systemctl show "$unit" -p ExecStart --value 2>/dev/null || true)"
            exec_path="$(printf '%s' "$exec_raw" | sed -n 's/.*path=\([^ ;]*\).*/\1/p' | head -n1)"
            runtime_python=""
            if [ -n "$exec_path" ] && [ -f "$exec_path" ]; then
              first_line="$(head -n1 "$exec_path" 2>/dev/null || true)"
              case "$first_line" in
                '#!'*) runtime_python="$(printf '%s' "${first_line#\#!}" | awk '{print $1}')" ;;
              esac
              case "$exec_path" in
                */.venv/*|*/venv/*|*/virtualenv/*) echo "iroomsng_runtime_${key}_exec_virtualenv=yes" ;;
                *) echo "iroomsng_runtime_${key}_exec_virtualenv=no" ;;
              esac
            else
              echo "iroomsng_runtime_${key}_exec_virtualenv=unknown"
            fi

            if [ -n "$runtime_python" ] && [ -x "$runtime_python" ]; then
              version="$($runtime_python -c 'import django; print(django.get_version())' 2>/dev/null || true)"
              if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
                echo "iroomsng_runtime_${key}_django_version=$version"
                echo "iroomsng_runtime_${key}_django_probe=yes"
              else
                echo "iroomsng_runtime_${key}_django_version=unknown"
                echo "iroomsng_runtime_${key}_django_probe=no"
              fi
            else
              echo "iroomsng_runtime_${key}_django_version=unknown"
              echo "iroomsng_runtime_${key}_django_probe=no"
            fi
            rm -f "$journal_file"
          }

          inspect_unit geoflow.service geoflow
          inspect_unit gunicorn.service gunicorn
          echo 'iroomsng_django_postgres_runtime_diagnostic_complete=yes'
          REMOTE

      - name: Verify public iroomsng root
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://iroomsng.kr/ || true)"
          printf '%s' "$code" | grep -Eq '^[0-9]{3}$' || code=000
          echo "iroomsng_runtime_public_root_code=$code"
