name: Phase 1 signup production activation

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-signup-production-activation.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  signup-production-activation:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          candidate_sha="$(git rev-parse HEAD)"
          test "$candidate_sha" = "$GITHUB_SHA"
          printf 'candidate_sha=%s\n' "$candidate_sha"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Activate signup runtime with rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          umask 077

          candidate_sha="$1"
          web_service='geoflow-stabilized.service'
          worker_service='geoflow-signup-outbox.service'
          worker_timer='geoflow-signup-outbox.timer'
          worker_service_path="/etc/systemd/system/$worker_service"
          worker_timer_path="/etc/systemd/system/$worker_timer"

          fail() {
            echo "signup_activation_blocker=$1"
            exit 2
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$web_service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$web_service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'web_service_not_running'

          workdir="$(systemctl show "$web_service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'

          case "$repo $python" in
            *$'\n'*|*$'\t'*|*' '*) fail 'runtime_path_contains_whitespace' ;;
          esac

          origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
          case "$origin" in
            https://github.com/kotopia/geoflow_web|https://github.com/kotopia/geoflow_web.git|git@github.com:kotopia/geoflow_web.git) ;;
            *) fail 'unexpected_repository_origin' ;;
          esac

          dirty_count="$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')"
          [ "$dirty_count" = '0' ] || fail 'production_worktree_dirty'

          deployed_sha="$(git -C "$repo" rev-parse HEAD)"
          echo "signup_activation_deployed_sha=$deployed_sha"
          echo "signup_activation_candidate_sha=$candidate_sha"

          git -C "$repo" fetch --quiet origin refs/heads/release/stabilized-deploy
          fetched_sha="$(git -C "$repo" rev-parse FETCH_HEAD)"
          [ "$fetched_sha" = "$candidate_sha" ] || fail 'candidate_sha_not_current_release_head'
          git -C "$repo" merge-base --is-ancestor "$deployed_sha" "$candidate_sha" || fail 'deployed_sha_not_release_ancestor'

          signup_paths=(
            control/views_signup.py
            control/views_legal.py
            control/forms_signup.py
            control/legal_policy.py
            control/services/signup_runtime_readiness.py
            control/services/signup_verification_runtime.py
            control/services/signup_verification_outbox_config.py
            control/services/signup_verification_outbox_feature.py
            control/services/signup_verification_signup_outbox_service.py
            control/services/signup_verification_outbox_runtime.py
            control/services/signup_verification_outbox_worker.py
            control/services/signup_verification_email_delivery.py
            control/services/signup_verification_token_service.py
            control/services/signup_verification_outbox_repository.py
            control/management/commands/check_production_runtime.py
            control/management/commands/check_signup_launch_schema.py
            control/management/commands/check_signup_verification_outbox.py
            control/management/commands/process_signup_verification_outbox.py
            geoflow_project/settings.py
          )
          git -C "$repo" diff --quiet "$deployed_sha" "$candidate_sha" -- "${signup_paths[@]}" || fail 'signup_code_drift_requires_application_deploy'
          echo 'signup_activation_signup_code_matches_release=yes'

          service_environment="$(systemctl show "$web_service" -p Environment --value 2>/dev/null || true)"
          for key in \
            SITE_ORIGIN SIGNUP_TERMS_URL SIGNUP_PRIVACY_URL SIGNUP_LEGAL_DOCUMENTS_CONFIRMED \
            ENABLE_SIGNUP_EMAIL_VERIFICATION_OUTBOX SIGNUP_EMAIL_VERIFICATION_URL \
            SIGNUP_EMAIL_VERIFICATION_ACTIVE_KEY_ID SIGNUP_EMAIL_VERIFICATION_HMAC_KEYS_JSON \
            SIGNUP_EMAIL_VERIFICATION_TTL_SECONDS SIGNUP_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS \
            SIGNUP_EMAIL_VERIFICATION_OUTBOX_LEASE_SECONDS SIGNUP_EMAIL_VERIFICATION_OUTBOX_RETRY_SECONDS \
            SIGNUP_EMAIL_VERIFICATION_OUTBOX_MAX_ATTEMPTS EMAIL_TIMEOUT USE_SMTP_EMAIL EMAIL_HOST \
            EMAIL_PORT EMAIL_USE_TLS DEFAULT_FROM_EMAIL; do
            case " $service_environment " in
              *" $key="*) fail 'systemd_environment_override_requires_review' ;;
            esac
          done
          unset service_environment

          if sudo test -e "$worker_service_path" || sudo test -e "$worker_timer_path"; then
            fail 'existing_signup_worker_units_require_review'
          fi

          worker_user="$(systemctl show "$web_service" -p User --value 2>/dev/null || true)"
          [ -n "$worker_user" ] || worker_user='root'
          if sudo crontab -u "$worker_user" -l 2>/dev/null | grep -Fq 'process_signup_verification_outbox'; then
            fail 'existing_signup_worker_cron_requires_review'
          fi
          if sudo grep -R -F -q 'process_signup_verification_outbox' /etc/crontab /etc/cron.d 2>/dev/null; then
            fail 'existing_signup_worker_cron_requires_review'
          fi

          signup_before="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/signup/ || true)"
          resend_before="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/signup/resend/ || true)"
          echo "signup_activation_public_signup_before=$signup_before"
          echo "signup_activation_public_resend_before=$resend_before"
          [ "$signup_before" = '503' ] || fail 'signup_endpoint_not_expected_fail_closed_state'
          [ "$resend_before" = '503' ] || fail 'resend_endpoint_not_expected_fail_closed_state'

          "$python" "$repo/manage.py" check_signup_launch_schema --strict

          pending_outbox="$($python - "$repo" <<'PY'
          import os
          import sys
          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'geoflow_project.settings')
          import django
          django.setup()
          from django.conf import settings
          from django.db import connections
          alias = getattr(settings, 'CENTRAL_DB_ALIAS', 'default')
          with connections[alias].cursor() as cursor:
              cursor.execute("""
                  SELECT COUNT(*)
                    FROM signup_verification_delivery_outbox
                   WHERE status IN ('pending', 'processing')
              """)
              print(int(cursor.fetchone()[0]))
          PY
          )"
          printf '%s' "$pending_outbox" | grep -Eq '^[0-9]+$' || fail 'pending_outbox_count_invalid'
          echo "signup_activation_existing_live_outbox=$pending_outbox"
          [ "$pending_outbox" = '0' ] || fail 'existing_live_outbox_requires_review'

          env_file="$repo/.env"
          env_backup="$(mktemp "$repo/.env.signup-activation-backup.XXXXXX")"
          cp -p "$env_file" "$env_backup"
          mutation_started=0
          units_installed=0

          rollback() {
            set +e
            if [ "$units_installed" -eq 1 ]; then
              sudo -n systemctl disable --now "$worker_timer" >/dev/null 2>&1 || true
              sudo -n rm -f "$worker_timer_path" "$worker_service_path"
              sudo -n systemctl daemon-reload >/dev/null 2>&1 || true
            fi
            if [ "$mutation_started" -eq 1 ] && [ -f "$env_backup" ]; then
              cp -p "$env_backup" "$env_file"
              sudo -n systemctl restart "$web_service" >/dev/null 2>&1 || true
              sleep 2
            fi
            rm -f "$env_backup"
            echo 'signup_activation_rollback_completed=yes'
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              rollback
            else
              rm -f "$env_backup"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          mutation_started=1
          "$python" - "$env_file" <<'PY'
          import base64
          import json
          import os
          import re
          import secrets
          import sys
          from pathlib import Path
          from dotenv import dotenv_values

          env_path = Path(sys.argv[1])
          values = dotenv_values(env_path)

          smtp_user = values.get('EMAIL_HOST_USER')
          smtp_password = values.get('EMAIL_HOST_PASSWORD')
          if not isinstance(smtp_user, str) or not smtp_user.strip():
              print('signup_activation_env_blocker=smtp_user_missing')
              raise SystemExit(2)
          if not isinstance(smtp_password, str) or not smtp_password.strip():
              print('signup_activation_env_blocker=smtp_password_missing')
              raise SystemExit(2)
          smtp_user = smtp_user.strip()

          active_key = values.get('SIGNUP_EMAIL_VERIFICATION_ACTIVE_KEY_ID')
          key_json = values.get('SIGNUP_EMAIL_VERIFICATION_HMAC_KEYS_JSON')
          generated = False
          if active_key or key_json:
              if not isinstance(active_key, str) or not active_key.strip() or not isinstance(key_json, str) or not key_json.strip():
                  print('signup_activation_env_blocker=partial_hmac_configuration')
                  raise SystemExit(2)
              try:
                  parsed = json.loads(key_json)
                  encoded = parsed[active_key]
                  decoded = base64.b64decode(encoded.encode('ascii'), altchars=b'-_', validate=True)
              except Exception:
                  print('signup_activation_env_blocker=invalid_existing_hmac_configuration')
                  raise SystemExit(2)
              if not isinstance(parsed, dict) or len(decoded) < 32:
                  print('signup_activation_env_blocker=invalid_existing_hmac_configuration')
                  raise SystemExit(2)
              active_key = active_key.strip()
              key_json = key_json.strip()
          else:
              active_key = 'prod-signup-v1'
              encoded = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode('ascii')
              key_json = json.dumps({active_key: encoded}, separators=(',', ':'), sort_keys=True)
              generated = True

          updates = {
              'SITE_ORIGIN': 'https://geoflow.co.kr',
              'SIGNUP_TERMS_URL': 'https://geoflow.co.kr/terms/',
              'SIGNUP_PRIVACY_URL': 'https://geoflow.co.kr/privacy/',
              'SIGNUP_LEGAL_DOCUMENTS_CONFIRMED': '1',
              'ENABLE_SIGNUP_EMAIL_VERIFICATION_OUTBOX': '1',
              'SIGNUP_EMAIL_VERIFICATION_URL': 'https://geoflow.co.kr/signup/verify/',
              'SIGNUP_EMAIL_VERIFICATION_ACTIVE_KEY_ID': active_key,
              'SIGNUP_EMAIL_VERIFICATION_HMAC_KEYS_JSON': key_json,
              'SIGNUP_EMAIL_VERIFICATION_TTL_SECONDS': '86400',
              'SIGNUP_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS': '300',
              'SIGNUP_EMAIL_VERIFICATION_OUTBOX_LEASE_SECONDS': '120',
              'SIGNUP_EMAIL_VERIFICATION_OUTBOX_RETRY_SECONDS': '300',
              'SIGNUP_EMAIL_VERIFICATION_OUTBOX_MAX_ATTEMPTS': '5',
              'EMAIL_TIMEOUT': '20',
              'USE_SMTP_EMAIL': '1',
              'EMAIL_HOST': 'smtp.naver.com',
              'EMAIL_PORT': '587',
              'EMAIL_USE_TLS': 'true',
              'DEFAULT_FROM_EMAIL': smtp_user,
          }

          for key, value in updates.items():
              if not isinstance(value, str) or '\n' in value or '\r' in value or "'" in value:
                  print('signup_activation_env_blocker=unsafe_value_shape')
                  raise SystemExit(2)

          original = env_path.read_text(encoding='utf-8').splitlines(keepends=True)
          key_re = re.compile(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=')
          seen = set()
          output = []
          for line in original:
              match = key_re.match(line)
              key = match.group(1) if match else None
              if key in updates:
                  if key not in seen:
                      output.append(f"{key}='{updates[key]}'\n")
                      seen.add(key)
                  continue
              output.append(line)
          if output and not output[-1].endswith('\n'):
              output[-1] += '\n'
          for key in updates:
              if key not in seen:
                  output.append(f"{key}='{updates[key]}'\n")

          tmp = env_path.with_name(env_path.name + '.signup-activation.tmp')
          tmp.write_text(''.join(output), encoding='utf-8')
          os.chmod(tmp, env_path.stat().st_mode & 0o777)
          os.replace(tmp, env_path)
          print('signup_activation_env_updated=yes')
          print(f"signup_activation_hmac_key_generated={'yes' if generated else 'no'}")
          PY

          "$python" "$repo/manage.py" check_production_runtime --strict
          "$python" "$repo/manage.py" check_signup_launch_schema --strict
          "$python" "$repo/manage.py" check_signup_verification_outbox

          "$python" - "$repo" <<'PY'
          import os
          import smtplib
          import ssl
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'geoflow_project.settings')
          import django
          django.setup()
          from django.conf import settings

          try:
              with smtplib.SMTP(settings.EMAIL_HOST, settings.EMAIL_PORT, timeout=20) as client:
                  client.ehlo()
                  client.starttls(context=ssl.create_default_context())
                  client.ehlo()
                  client.login(settings.EMAIL_HOST_USER, settings.EMAIL_HOST_PASSWORD)
          except Exception:
              print('signup_activation_smtp_auth_ready=no')
              raise SystemExit(2)
          print('signup_activation_smtp_auth_ready=yes')
          PY

          sudo -n systemctl restart "$web_service"
          ready=no
          for _ in $(seq 1 30); do
            active="$(systemctl show "$web_service" -p ActiveState --value 2>/dev/null || true)"
            sub="$(systemctl show "$web_service" -p SubState --value 2>/dev/null || true)"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/ || true)"
            if [ "$active" = 'active' ] && [ "$sub" = 'running' ]; then
              case "$code" in 2??|3??) ready=yes; break ;; esac
            fi
            sleep 2
          done
          [ "$ready" = yes ] || fail 'web_service_failed_after_signup_activation'

          signup_after="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/signup/ || true)"
          resend_after="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/signup/resend/ || true)"
          echo "signup_activation_public_signup_after=$signup_after"
          echo "signup_activation_public_resend_after=$resend_after"
          [ "$signup_after" = '200' ] || fail 'signup_endpoint_not_200_after_activation'
          [ "$resend_after" = '200' ] || fail 'resend_endpoint_not_200_after_activation'

          worker_group="$(systemctl show "$web_service" -p Group --value 2>/dev/null || true)"
          service_tmp="$(mktemp)"
          timer_tmp="$(mktemp)"
          {
            echo '[Unit]'
            echo 'Description=GeoFlow signup verification outbox processor'
            echo "After=network-online.target $web_service"
            echo 'Wants=network-online.target'
            echo
            echo '[Service]'
            echo 'Type=oneshot'
            echo "User=$worker_user"
            if [ -n "$worker_group" ]; then echo "Group=$worker_group"; fi
            echo "WorkingDirectory=$repo"
            echo "ExecStart=$python $repo/manage.py process_signup_verification_outbox --limit 20"
            echo 'NoNewPrivileges=true'
            echo 'PrivateTmp=true'
          } > "$service_tmp"
          cat > "$timer_tmp" <<'TIMER'
          [Unit]
          Description=Run GeoFlow signup verification outbox every minute

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=60s
          AccuracySec=10s
          Persistent=true
          Unit=geoflow-signup-outbox.service

          [Install]
          WantedBy=timers.target
          TIMER

          sudo -n install -o root -g root -m 0644 "$service_tmp" "$worker_service_path"
          sudo -n install -o root -g root -m 0644 "$timer_tmp" "$worker_timer_path"
          rm -f "$service_tmp" "$timer_tmp"
          units_installed=1
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now "$worker_timer"
          sudo -n systemctl start "$worker_service"

          [ "$(systemctl is-enabled "$worker_timer" 2>/dev/null || true)" = 'enabled' ] || fail 'signup_worker_timer_not_enabled'
          [ "$(systemctl is-active "$worker_timer" 2>/dev/null || true)" = 'active' ] || fail 'signup_worker_timer_not_active'
          worker_result="$(systemctl show "$worker_service" -p Result --value 2>/dev/null || true)"
          [ "$worker_result" = 'success' ] || fail 'signup_worker_initial_run_failed'

          "$python" "$repo/manage.py" check_production_runtime --strict
          "$python" "$repo/manage.py" check_signup_verification_outbox

          mutation_started=0
          trap - EXIT
          rm -f "$env_backup"
          echo 'signup_activation_runtime_ready=yes'
          echo 'signup_activation_outbox_timer_ready=yes'
          echo 'phase1_signup_production_activation_complete=yes'
          REMOTE
