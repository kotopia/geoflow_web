name: iroomsng S3 policy shape contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-s3-policy-shape-diagnostic.yml
      - .github/workflows/iroomsng-s3-policy-shape-contract.yml
      - control/test_iroomsng_s3_policy_shape_contract.py

permissions:
  contents: read

jobs:
  iroomsng-s3-policy-shape-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install minimal contract dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input Django==5.2.16

      - name: Validate bounded read-only S3 policy-shape diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m django test control.test_iroomsng_s3_policy_shape_contract --settings=geoflow_project.settings
