name: Phase 2 proxy security readiness diagnostic

on:
  workflow_call:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"
        type: string
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"
        type: string

permissions:
  contents: read

jobs:
  proxy-security-readiness:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate reviewed branch and connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST" || { echo 'phase2_proxy_diag_blocker=missing_ssh_host'; exit 2; }
          test -n "$SSH_USER" || { echo 'phase2_proxy_diag_blocker=missing_ssh_user'; exit 2; }
          test -n "$SSH_KEY" || { echo 'phase2_proxy_diag_blocker=missing_ssh_key'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'phase2_proxy_diag_blocker=missing_known_hosts'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'phase2_proxy_diag_blocker=invalid_ssh_port'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Inspect proxy and Django TLS boundary read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || {
            echo 'phase2_proxy_diag_blocker=stabilized_service_not_running'
            exit 2
          }

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || {
            echo 'phase2_proxy_diag_blocker=service_working_directory_missing'
            exit 2
          }
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || {
            echo 'phase2_proxy_diag_blocker=runtime_repo_missing'
            exit 2
          }
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || {
            echo 'phase2_proxy_diag_blocker=runtime_python_missing'
            exit 2
          }

          cd "$repo"
          "$python" - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")
          import django
          django.setup()
          from django.conf import settings

          proxy_header = getattr(settings, "SECURE_PROXY_SSL_HEADER", None)
          expected_proxy_header = ("HTTP_X_FORWARDED_PROTO", "https")
          print(
              "phase2_proxy_diag_django_proxy_header="
              + ("expected" if proxy_header == expected_proxy_header else "not_expected")
          )
          print(
              "phase2_proxy_diag_ssl_redirect="
              + ("enabled" if getattr(settings, "SECURE_SSL_REDIRECT", False) is True else "disabled")
          )
          hsts_seconds = getattr(settings, "SECURE_HSTS_SECONDS", 0)
          hsts_enabled = isinstance(hsts_seconds, int) and not isinstance(hsts_seconds, bool) and hsts_seconds > 0
          print("phase2_proxy_diag_hsts=" + ("enabled" if hsts_enabled else "disabled"))
          print(
              "phase2_proxy_diag_csrf_cookie_secure="
              + ("yes" if getattr(settings, "CSRF_COOKIE_SECURE", False) is True else "no")
          )
          print(
              "phase2_proxy_diag_session_cookie_secure="
              + ("yes" if getattr(settings, "SESSION_COOKIE_SECURE", False) is True else "no")
          )
          PY

          command -v nginx >/dev/null 2>&1 || {
            echo 'phase2_proxy_diag_blocker=nginx_command_missing'
            exit 2
          }
          sudo -n true >/dev/null 2>&1 || {
            echo 'phase2_proxy_diag_blocker=passwordless_sudo_required_for_read_only_nginx_dump'
            exit 2
          }
          nginx_dump="$(mktemp)"
          trap 'rm -f "$nginx_dump"' EXIT
          sudo -n nginx -T >"$nginx_dump" 2>/dev/null || {
            echo 'phase2_proxy_diag_blocker=nginx_config_read_failed'
            exit 2
          }
          if grep -Eqi 'proxy_set_header[[:space:]]+X-Forwarded-Proto[[:space:]]+(\$scheme|https)[[:space:]]*;' "$nginx_dump"; then
            echo 'phase2_proxy_diag_forwarded_proto_configured=yes'
          else
            echo 'phase2_proxy_diag_forwarded_proto_configured=no'
            echo 'phase2_proxy_diag_blocker=forwarded_proto_not_proven'
            exit 2
          fi
          echo 'phase2_proxy_diag_remote_read_only_complete=yes'
          REMOTE

      - name: Verify canonical public HTTP and HTTPS boundary
        shell: bash
        run: |
          set -euo pipefail
          http_headers="$(mktemp)"
          https_headers="$(mktemp)"
          trap 'rm -f "$http_headers" "$https_headers"' EXIT

          http_code="$(curl --silent --show-error --output /dev/null --dump-header "$http_headers" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 http://geoflow.co.kr/)"
          echo "phase2_proxy_diag_public_http_code=$http_code"
          case "$http_code" in
            301|302|307|308) ;;
            *) echo 'phase2_proxy_diag_blocker=http_not_redirecting'; exit 2 ;;
          esac
          grep -Eqi '^location:[[:space:]]*https://geoflow\.co\.kr(/|[[:space:]]*$)' "$http_headers" || {
            echo 'phase2_proxy_diag_blocker=http_redirect_not_canonical_https'
            exit 2
          }
          echo 'phase2_proxy_diag_public_http_redirect_https=yes'

          https_code="$(curl --proto '=https' --silent --show-error --output /dev/null --dump-header "$https_headers" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://geoflow.co.kr/login/)"
          echo "phase2_proxy_diag_public_https_login_code=$https_code"
          case "$https_code" in
            2??|3??) ;;
            *) echo 'phase2_proxy_diag_blocker=https_login_unhealthy'; exit 2 ;;
          esac

          if grep -qi '^strict-transport-security:' "$https_headers"; then
            echo 'phase2_proxy_diag_public_hsts_header=present'
          else
            echo 'phase2_proxy_diag_public_hsts_header=missing'
          fi
          echo 'phase2_proxy_security_readiness_diagnostic_complete=yes'
