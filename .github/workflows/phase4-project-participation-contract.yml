name: Phase 4 project participation contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
  push:
    branches:
      - release/stabilized-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase4-project-participation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-phase4-project-participation-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,geoflow.co.kr
      DJANGO_CSRF_TRUSTED_ORIGINS: https://geoflow.co.kr
      CENTRAL_DB_NAME: ci-central
      CENTRAL_DB_USER: ci-central-user
      CENTRAL_DB_PASSWORD: ci-nonsecret-placeholder
      CENTRAL_DB_HOST: central.example.internal
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant
      TENANT_DB_USER: ci-tenant-user
      TENANT_DB_PASSWORD: ci-nonsecret-placeholder
      TENANT_DB_HOST: tenant.example.internal
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"
      TENANT_DB_REQUIRE_SECRET_REFERENCES: "1"
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET: geoflow-ci-nonexistent

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install exact Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile project participation boundary
        run: |
          python -m py_compile \
            geoflow_ops/services/project_access.py \
            geoflow_ops/services/entity_access.py \
            geoflow_ops/views_project_members.py \
            geoflow_ops/views_projects.py \
            geoflow_ops/security_views.py \
            control/services/route_security_preflight.py \
            geoflow_ops/migrations/0022_phase4_project_participation_scope.py \
            geoflow_ops/test_phase4_project_participation_scope.py \
            geoflow_ops/test_phase4_project_participation_production_activation_contract.py

      - name: Run project participation regressions
        run: |
          python manage.py test \
            geoflow_ops.test_phase4_project_participation_scope \
            geoflow_ops.test_phase4_project_participation_production_activation_contract \
            control.test_route_security_preflight \
            geoflow_ops.test_tenant_route_authorization_contract \
            geoflow_ops.test_event_upload_route_boundaries
