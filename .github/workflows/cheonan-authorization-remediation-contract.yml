name: Cheonan authorization remediation contract

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/cheonan-authorization-remediation.yml
      - .github/workflows/cheonan-authorization-remediation-contract.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate guarded remediation contract
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/cheonan-authorization-remediation.yml
          test -f "$f"
          grep -Fq 'environment: production' "$f"
          grep -Fq 'TARGET_ALIAS = "cheonan_db"' "$f"
          grep -Fq 'static_alias_not_connectable' "$f"
          grep -Fq 'stored_password_not_static_password' "$f"
          grep -Fq 'permissionless_active_membership' "$f"
          grep -Fq "SET status='active', updated_at=now()" "$f"
          grep -Fq 'db_name=%s' "$f"
          grep -Fq 'db_user=%s' "$f"
          grep -Fq 'transaction.atomic(using="default")' "$f"
          grep -Fq 'post_config_not_connectable' "$f"
          grep -Fq 'cheonan_authorization_remediation_complete=yes' "$f"
          ! grep -Eq 'print\([^)]*(PASSWORD|password|SECRET|secret|HOST|host|USER|user|NAME|name)' "$f"
