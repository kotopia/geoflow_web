name: DEPRECATED - Phase 1 tenant secret transition v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block retired one-shot transition
        shell: bash
        run: |
          echo "deprecated_workflow=yes"
          echo "replacement=phase1-tenant-runtime-audit.yml"
          echo "reason=transition_completed_and_historical_mutation_path_retired"
          exit 1
