name: Phase 1 tenant secret transition v2

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-tenant-secret-transition-v2.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  tenant-secret-transition-v2:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Move active tenant DB passwords to Secrets Manager and enable strict references
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'

          fail() {
            echo "tenant_secret_transition_v2_blocker=$1"
            exit 2
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'stabilized_service_not_running'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          [ -f "$repo/control/services/tenant_db_secret_resolver.py" ] || fail 'tenant_secret_resolver_missing'

          dirty_count="$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')"
          [ "$dirty_count" = '0' ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'

          before_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/ || true)"
          case "$before_code" in 2??|3??) ;; *) fail 'port_8011_not_healthy_before_transition' ;; esac

          # Values and identifiers remain private. Only aggregate state is printed.
          "$python" - "$repo" <<'PY'
          import hmac
          import json
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import boto3
          import psycopg2
          from botocore.exceptions import ClientError
          from django.db import transaction

          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          alias = "default"

          def text(value):
              return str(value or "").strip()

          def is_active(row):
              return text(getattr(row.group, "status", "")).lower() == "active"

          rows = list(
              GroupDBConfig.objects.using(alias)
              .select_related("group")
              .order_by("group_id")
          )
          if not rows:
              raise SystemExit("tenant_secret_transition_v2_blocker=no_tenant_db_configs")

          active_rows = [row for row in rows if is_active(row)]
          inactive_empty = [row for row in rows if not is_active(row) and not text(row.db_password)]
          active_empty = [row for row in rows if is_active(row) and not text(row.db_password)]
          existing_refs = [row for row in rows if is_tenant_db_secret_reference(row.db_password)]
          legacy_nonempty = [
              row for row in rows
              if text(row.db_password) and not is_tenant_db_secret_reference(row.db_password)
          ]

          print(f"tenant_secret_v2_total={len(rows)}")
          print(f"tenant_secret_v2_active={len(active_rows)}")
          print(f"tenant_secret_v2_active_empty={len(active_empty)}")
          print(f"tenant_secret_v2_inactive_empty={len(inactive_empty)}")
          print(f"tenant_secret_v2_legacy_nonempty_before={len(legacy_nonempty)}")
          print(f"tenant_secret_v2_refs_before={len(existing_refs)}")

          if active_empty:
              raise SystemExit("tenant_secret_transition_v2_blocker=active_password_empty")

          region = text(os.environ.get("AWS_REGION")) or "ap-northeast-2"
          sm = boto3.client("secretsmanager", region_name=region)

          planned = []
          for row in rows:
              raw = text(row.db_password)
              if not raw:
                  # Only inactive configs may be empty. They remain fail-closed if activated
                  # until a credential is provisioned.
                  if is_active(row):
                      raise SystemExit("tenant_secret_transition_v2_blocker=active_password_empty")
                  continue

              if is_tenant_db_secret_reference(raw):
                  resolved = resolve_tenant_db_password(raw, client=sm)
                  if not resolved:
                      raise SystemExit("tenant_secret_transition_v2_blocker=existing_reference_unresolvable")
                  planned.append((row, raw, resolved))
                  continue

              secret_id = f"geoflow/tenant-db/{row.group_id}/password"
              reference = f"aws-secretsmanager:{secret_id}#password"
              payload = json.dumps({"password": raw}, separators=(",", ":"))

              try:
                  sm.create_secret(Name=secret_id, SecretString=payload)
              except ClientError as exc:
                  code = text(exc.response.get("Error", {}).get("Code"))
                  if code not in {"ResourceExistsException", "ResourceExists"}:
                      raise SystemExit("tenant_secret_transition_v2_blocker=secretsmanager_create_failed") from exc

              try:
                  response = sm.get_secret_value(SecretId=secret_id)
                  secret_string = response.get("SecretString")
                  parsed = json.loads(secret_string) if isinstance(secret_string, str) else None
                  roundtrip = parsed.get("password") if isinstance(parsed, dict) else None
              except Exception as exc:
                  raise SystemExit("tenant_secret_transition_v2_blocker=secretsmanager_roundtrip_failed") from exc

              if not isinstance(roundtrip, str) or not hmac.compare_digest(roundtrip, raw):
                  raise SystemExit("tenant_secret_transition_v2_blocker=existing_secret_mismatch")

              planned.append((row, reference, roundtrip))

          # Only active tenants are serving-path credentials and must prove DB login now.
          active_validated = 0
          for row, _reference, password in planned:
              if not is_active(row):
                  continue
              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=row.db_host,
                      port=row.db_port,
                      sslmode="require",
                      connect_timeout=10,
                  )
                  try:
                      with conn.cursor() as cursor:
                          cursor.execute("SELECT 1")
                          value = cursor.fetchone()
                          if not value or value[0] != 1:
                              raise RuntimeError("unexpected SELECT 1 result")
                  finally:
                      conn.close()
              except Exception as exc:
                  raise SystemExit("tenant_secret_transition_v2_blocker=active_tenant_connection_validation_failed") from exc
              active_validated += 1

          if active_validated != len(active_rows):
              raise SystemExit("tenant_secret_transition_v2_blocker=active_tenant_validation_count_mismatch")

          changed = 0
          with transaction.atomic(using=alias):
              for row, reference, _password in planned:
                  if text(row.db_password) == reference:
                      continue
                  updated = (
                      GroupDBConfig.objects.using(alias)
                      .filter(group_id=row.group_id, db_password=row.db_password)
                      .update(db_password=reference)
                  )
                  if updated != 1:
                      raise RuntimeError("concurrent tenant DB config change detected")
                  changed += 1

          after = list(
              GroupDBConfig.objects.using(alias)
              .select_related("group")
              .order_by("group_id")
          )
          if len(after) != len(rows):
              raise SystemExit("tenant_secret_transition_v2_blocker=tenant_config_count_changed")

          refs_after = 0
          inactive_empty_after = 0
          active_refs_after = 0
          for row in after:
              raw = text(row.db_password)
              if not raw:
                  if is_active(row):
                      raise SystemExit("tenant_secret_transition_v2_blocker=active_password_empty_after_update")
                  inactive_empty_after += 1
                  continue
              if not is_tenant_db_secret_reference(raw):
                  raise SystemExit("tenant_secret_transition_v2_blocker=plaintext_reference_remains")
              resolved = resolve_tenant_db_password(raw, client=sm)
              if not resolved:
                  raise SystemExit("tenant_secret_transition_v2_blocker=post_update_reference_unresolvable")
              refs_after += 1
              if is_active(row):
                  active_refs_after += 1

          if active_refs_after != len(active_rows):
              raise SystemExit("tenant_secret_transition_v2_blocker=active_reference_count_mismatch")

          print(f"tenant_secret_v2_rows_changed={changed}")
          print(f"tenant_secret_v2_active_validated={active_validated}")
          print(f"tenant_secret_v2_refs_after={refs_after}")
          print(f"tenant_secret_v2_active_refs_after={active_refs_after}")
          print(f"tenant_secret_v2_inactive_empty_after={inactive_empty_after}")
          print("tenant_secret_v2_plaintext_after=0")
          print("tenant_secret_reference_transition_v2_ready=yes")
          PY

          env_backup="$(mktemp)"
          chmod 600 "$env_backup"
          cp "$repo/.env" "$env_backup"
          cleanup_backup() { rm -f "$env_backup"; }
          trap cleanup_backup EXIT

          "$python" - "$repo/.env" <<'PY'
          from pathlib import Path
          import os
          import sys
          import tempfile

          path = Path(sys.argv[1])
          original = path.read_text(encoding="utf-8")
          lines = original.splitlines()
          key = "TENANT_DB_REQUIRE_SECRET_REFERENCES"
          out = []
          replaced = False
          for line in lines:
              stripped = line.lstrip()
              if stripped.startswith(key + "="):
                  if not replaced:
                      out.append(f"{key}=1")
                      replaced = True
                  continue
              out.append(line)
          if not replaced:
              out.append(f"{key}=1")
          text = "\n".join(out) + "\n"
          fd, tmp = tempfile.mkstemp(prefix=".env.phase1.", dir=str(path.parent))
          try:
              os.fchmod(fd, 0o600)
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  handle.write(text)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp, path)
          finally:
              if os.path.exists(tmp):
                  os.unlink(tmp)
          PY

          restart_ok=no
          if sudo -n systemctl restart "$service"; then
            for _ in $(seq 1 30); do
              active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
              sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
              code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/ || true)"
              if [ "$active" = 'active' ] && [ "$sub" = 'running' ]; then
                case "$code" in 2??|3??) restart_ok=yes; break ;; esac
              fi
              sleep 2
            done
          fi

          if [ "$restart_ok" != yes ]; then
            cp "$env_backup" "$repo/.env"
            sudo -n systemctl restart "$service" || true
            fail 'service_failed_with_strict_secret_references'
          fi

          # Post-restart audit uses the deployed resolver but does not depend on a newly
          # deployed management command. Inactive empty configs remain intentionally valid.
          "$python" - "$repo" <<'PY'
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          def text(value):
              return str(value or "").strip()

          rows = list(
              GroupDBConfig.objects.using("default")
              .select_related("group")
              .order_by("group_id")
          )
          active_refs = 0
          inactive_empty = 0
          for row in rows:
              active = text(getattr(row.group, "status", "")).lower() == "active"
              raw = text(row.db_password)
              if not raw:
                  if active:
                      raise SystemExit("tenant_secret_transition_v2_blocker=post_restart_active_password_empty")
                  inactive_empty += 1
                  continue
              if not is_tenant_db_secret_reference(raw):
                  raise SystemExit("tenant_secret_transition_v2_blocker=post_restart_plaintext_reference")
              if not resolve_tenant_db_password(raw):
                  raise SystemExit("tenant_secret_transition_v2_blocker=post_restart_reference_unresolvable")
              if active:
                  active_refs += 1

          print(f"tenant_secret_v2_post_restart_active_refs={active_refs}")
          print(f"tenant_secret_v2_post_restart_inactive_empty={inactive_empty}")
          print("tenant_secret_v2_post_restart_audit=yes")
          PY

          "$python" "$repo/manage.py" check_release_preflight --strict

          terms_code="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/terms/ || true)"
          privacy_code="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/privacy/ || true)"
          [ "$terms_code" = '200' ] || fail 'public_terms_not_200_after_secret_transition'
          [ "$privacy_code" = '200' ] || fail 'public_privacy_not_200_after_secret_transition'

          echo 'tenant_db_secret_references_enforced=yes'
          echo 'phase1_tenant_secret_transition_v2_ready=yes'
          REMOTE
