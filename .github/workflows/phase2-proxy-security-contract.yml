name: Phase 2 proxy security contract

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase2-proxy-security-readiness-diagnostic.yml
      - .github/workflows/phase2-proxy-security-contract.yml
      - control/test_phase2_proxy_security_readiness_contract.py
      - control/test_proxy_security_settings.py
      - geoflow_project/proxy_security_settings.py
      - geoflow_project/settings.py
      - docs/phase2-proxy-security-rollout.md
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase2-proxy-security-readiness-diagnostic.yml
      - .github/workflows/phase2-proxy-security-contract.yml
      - control/test_phase2_proxy_security_readiness_contract.py
      - control/test_proxy_security_settings.py
      - geoflow_project/proxy_security_settings.py
      - geoflow_project/settings.py
      - docs/phase2-proxy-security-rollout.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-proxy-security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate trusted-proxy diagnostics and settings contracts
        run: |
          python -m unittest \
            control.test_phase2_proxy_security_readiness_contract \
            control.test_proxy_security_settings
