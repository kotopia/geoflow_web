name: iroomsng worker boot cause diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-worker-boot-cause-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iroomsng-worker-boot-cause:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact triggering release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Classify worker boot failure read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v python3 >/dev/null 2>&1 || { echo 'iroomsng_worker_blocker=python_missing'; exit 2; }
          command -v systemctl >/dev/null 2>&1 || { echo 'iroomsng_worker_blocker=systemctl_missing'; exit 2; }
          command -v journalctl >/dev/null 2>&1 || { echo 'iroomsng_worker_blocker=journalctl_missing'; exit 2; }
          sudo -n true >/dev/null 2>&1 || { echo 'iroomsng_worker_blocker=passwordless_sudo_required'; exit 2; }

          geo_journal="$(mktemp)"
          gun_journal="$(mktemp)"
          trap 'rm -f "$geo_journal" "$gun_journal"' EXIT

          classify_unit() {
            unit="$1"
            journal_file="$2"
            key="$3"

            if ! systemctl cat "$unit" >/dev/null 2>&1; then
              echo "iroomsng_worker_${key}_present=no"
              return
            fi
            echo "iroomsng_worker_${key}_present=yes"

            sudo -n journalctl -u "$unit" -n 1000 --no-pager >"$journal_file" 2>/dev/null || true
            python3 - "$journal_file" "$key" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")
          key = sys.argv[2]
          patterns = (
              ("worker_boot", r"Worker failed to boot|HaltServer"),
              ("worker_timeout", r"WORKER TIMEOUT|Worker timeout"),
              ("traceback", r"Traceback \(most recent call last\)"),
              ("django_improperly_configured", r"ImproperlyConfigured"),
              ("django_app_registry", r"AppRegistryNotReady"),
              ("django_system_check", r"SystemCheckError"),
              ("database_operational", r"OperationalError"),
              ("database_programming", r"ProgrammingError"),
              ("database_integrity", r"IntegrityError"),
              ("database_missing_relation", r"UndefinedTable|relation .* does not exist"),
              ("database_connection", r"connection refused|could not connect to server|password authentication failed|no pg_hba\.conf entry"),
              ("module_import", r"ModuleNotFoundError|ImportError"),
              ("python_syntax", r"SyntaxError"),
              ("python_attribute", r"AttributeError"),
              ("python_type", r"TypeError"),
              ("python_value", r"ValueError"),
              ("python_key", r"KeyError"),
              ("python_name", r"NameError"),
              ("python_runtime", r"RuntimeError"),
              ("os_error", r"OSError"),
              ("ssl_error", r"SSLError|CERTIFICATE_VERIFY_FAILED"),
              ("aws_credentials", r"NoCredentialsError|PartialCredentialsError|Unable to locate credentials"),
              ("permission_denied", r"Permission denied"),
              ("no_such_file", r"No such file or directory"),
              ("address_in_use", r"Address already in use"),
          )
          counts = {}
          for label, pattern in patterns:
              counts[label] = len(re.findall(pattern, text, flags=re.IGNORECASE))
              print(f"iroomsng_worker_{key}_{label}={counts[label]}")

          priority = (
              "django_improperly_configured",
              "django_app_registry",
              "django_system_check",
              "database_connection",
              "database_operational",
              "database_missing_relation",
              "database_programming",
              "database_integrity",
              "module_import",
              "python_syntax",
              "permission_denied",
              "no_such_file",
              "address_in_use",
              "aws_credentials",
              "ssl_error",
              "python_attribute",
              "python_type",
              "python_value",
              "python_key",
              "python_name",
              "python_runtime",
              "os_error",
              "worker_timeout",
          )
          primary = next((label for label in priority if counts[label] > 0), "unclassified")
          print(f"iroomsng_worker_{key}_primary_category={primary}")
          PY

            wd="$(systemctl show "$unit" -p WorkingDirectory --value 2>/dev/null || true)"
            unit_user="$(systemctl show "$unit" -p User --value 2>/dev/null || true)"
            exec_start="$(systemctl show "$unit" -p ExecStart --value 2>/dev/null || true)"

            if [ -n "$wd" ] && [ -d "$wd" ]; then
              echo "iroomsng_worker_${key}_working_directory_exists=yes"
            else
              echo "iroomsng_worker_${key}_working_directory_exists=no"
            fi
            if [ -n "$unit_user" ]; then
              echo "iroomsng_worker_${key}_explicit_user=yes"
            else
              echo "iroomsng_worker_${key}_explicit_user=no"
            fi
            if printf '%s' "$exec_start" | grep -Eqi '/(\.venv|venv)/|virtualenv'; then
              echo "iroomsng_worker_${key}_exec_uses_virtualenv_marker=yes"
            else
              echo "iroomsng_worker_${key}_exec_uses_virtualenv_marker=no"
            fi
            if systemctl cat "$unit" 2>/dev/null | grep -Fq 'DJANGO_SETTINGS_MODULE='; then
              echo "iroomsng_worker_${key}_has_django_settings_module=yes"
            else
              echo "iroomsng_worker_${key}_has_django_settings_module=no"
            fi
            if systemctl cat "$unit" 2>/dev/null | grep -Eq '^[[:space:]]*EnvironmentFile='; then
              echo "iroomsng_worker_${key}_has_environment_file=yes"
            else
              echo "iroomsng_worker_${key}_has_environment_file=no"
            fi
          }

          classify_unit geoflow.service "$geo_journal" geoflow
          classify_unit gunicorn.service "$gun_journal" gunicorn

          geo_wd="$(systemctl show geoflow.service -p WorkingDirectory --value 2>/dev/null || true)"
          gun_wd="$(systemctl show gunicorn.service -p WorkingDirectory --value 2>/dev/null || true)"
          if [ -n "$geo_wd" ] && [ "$geo_wd" = "$gun_wd" ]; then
            echo 'iroomsng_worker_units_same_working_directory=yes'
          else
            echo 'iroomsng_worker_units_same_working_directory=no'
          fi

          geo_user="$(systemctl show geoflow.service -p User --value 2>/dev/null || true)"
          gun_user="$(systemctl show gunicorn.service -p User --value 2>/dev/null || true)"
          if [ -n "$geo_user" ] && [ "$geo_user" = "$gun_user" ]; then
            echo 'iroomsng_worker_units_same_user=yes'
          else
            echo 'iroomsng_worker_units_same_user=no'
          fi

          if ss -ltnH | awk '{print $4}' | grep -Eq '127\.0\.0\.1:[0-9]+$'; then
            echo 'iroomsng_worker_loopback_listener_any=yes'
          else
            echo 'iroomsng_worker_loopback_listener_any=no'
          fi
          echo 'iroomsng_worker_boot_cause_diagnostic_complete=yes'
          REMOTE

      - name: Verify public iroomsng root
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://iroomsng.kr/ || true)"
          printf '%s' "$code" | grep -Eq '^[0-9]{3}$' || code=000
          echo "iroomsng_worker_public_root_code=$code"
