name: Phase 1 signup verification CSRF hotfix

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-signup-verification-csrf-hotfix.yml
      - control/views_signup.py
      - control/test_signup_email_verification_route.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-signup-csrf-hotfix-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,geoflow.co.kr
      DJANGO_CSRF_TRUSTED_ORIGINS: https://geoflow.co.kr
      DJANGO_CSRF_COOKIE_SECURE: "1"
      DJANGO_SESSION_COOKIE_SECURE: "1"
      CENTRAL_DB_NAME: ci-central
      CENTRAL_DB_USER: ci-central-user
      CENTRAL_DB_PASSWORD: ci-nonsecret-placeholder
      CENTRAL_DB_HOST: central.example.internal
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant
      TENANT_DB_USER: ci-tenant-user
      TENANT_DB_PASSWORD: ci-nonsecret-placeholder
      TENANT_DB_HOST: tenant.example.internal
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"
      USE_SMTP_EMAIL: "1"
      EMAIL_HOST: smtp.naver.com
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "true"
      EMAIL_HOST_USER: ci-user
      EMAIL_HOST_PASSWORD: ci-nonsecret-placeholder
      SITE_ORIGIN: https://geoflow.co.kr
      SIGNUP_TERMS_URL: https://geoflow.co.kr/terms/
      SIGNUP_PRIVACY_URL: https://geoflow.co.kr/privacy/
      SIGNUP_TERMS_VERSION: 2026-08-08-v2
      SIGNUP_PRIVACY_VERSION: 2026-08-08-v2
      SIGNUP_LEGAL_DOCUMENTS_CONFIRMED: "1"
      SIGNUP_EMAIL_VERIFICATION_ACTIVE_KEY_ID: ci
      SIGNUP_EMAIL_VERIFICATION_HMAC_KEYS_JSON: '{"ci":"QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="}'
      SIGNUP_EMAIL_VERIFICATION_TTL_SECONDS: "86400"
      SIGNUP_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: "600"

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GeoDjango system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate CSRF exception boundary
        shell: bash
        run: |
          set -euo pipefail
          python manage.py test control.test_signup_email_verification_route

  deploy-hotfix:
    needs: validate-hotfix
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Checkout exact reviewed release head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate reviewed head and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          python -m py_compile control/views_signup.py

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Stage reviewed signup view only
        shell: bash
        run: |
          set -euo pipefail
          remote_stage="/tmp/geoflow-signup-csrf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          scp -q \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -P 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            control/views_signup.py \
            "$SSH_USER@$SSH_HOST:$remote_stage"
          echo "REMOTE_STAGE=$remote_stage" >> "$GITHUB_ENV"

      - name: Apply one-file hotfix with rollback and public boundary smoke
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "REMOTE_STAGE='$REMOTE_STAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077

          service='geoflow-stabilized.service'
          expected_base_blob='16f206561383b0074ee2a199708f228a399e8b8a'
          fail() { echo "signup_csrf_hotfix_blocker=$1"; exit 2; }

          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'
          [ -s "$REMOTE_STAGE" ] || fail 'staged_view_missing'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running_before_hotfix'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] || fail 'runtime_repo_missing'
          target="$repo/control/views_signup.py"
          [ -f "$target" ] || fail 'runtime_signup_view_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'runtime_python_missing'

          current_blob="$(git -C "$repo" hash-object "$target")"
          if [ "$current_blob" = "$expected_base_blob" ]; then
            echo 'signup_csrf_hotfix_existing_view_matches_reviewed_base=yes'
          else
            echo 'signup_csrf_hotfix_existing_view_matches_reviewed_base=no'
            fail 'runtime_signup_view_diverged'
          fi

          "$python" -m py_compile "$REMOTE_STAGE"
          backup="$(mktemp "$repo/control/.views_signup.csrf-backup.XXXXXX")"
          cp -p "$target" "$backup"
          mutation_started=0

          rollback() {
            set +e
            if [ "$mutation_started" -eq 1 ] && [ -f "$backup" ]; then
              cp -p "$backup" "$target"
              sudo -n systemctl restart "$service" >/dev/null 2>&1 || true
              sleep 2
            fi
            rm -f "$backup" "$REMOTE_STAGE"
            echo 'signup_csrf_hotfix_rollback_completed=yes'
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              rollback
            else
              rm -f "$backup" "$REMOTE_STAGE"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          mutation_started=1
          cp -p "$REMOTE_STAGE" "$target"
          "$python" -m py_compile "$target"

          cd "$repo"
          DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" manage.py check >/dev/null

          sudo -n systemctl restart "$service"
          sleep 2
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running_after_hotfix'

          verify_get="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://geoflow.co.kr/signup/verify/)"
          echo "signup_csrf_hotfix_verify_get=$verify_get"
          [ "$verify_get" = 200 ] || fail 'verification_get_not_200'

          verify_post="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 -X POST --data-urlencode 'token=invalid-hotfix-probe' https://geoflow.co.kr/signup/verify/)"
          echo "signup_csrf_hotfix_verify_post_without_csrf=$verify_post"
          [ "$verify_post" = 400 ] || fail 'verification_post_did_not_reach_token_rejection'

          signup_post="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 -X POST https://geoflow.co.kr/signup/)"
          echo "signup_csrf_hotfix_signup_post_without_csrf=$signup_post"
          [ "$signup_post" = 403 ] || fail 'signup_csrf_boundary_regressed'

          resend_post="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 -X POST https://geoflow.co.kr/signup/resend/)"
          echo "signup_csrf_hotfix_resend_post_without_csrf=$resend_post"
          [ "$resend_post" = 403 ] || fail 'resend_csrf_boundary_regressed'

          mutation_started=0
          rm -f "$backup" "$REMOTE_STAGE"
          trap - EXIT
          echo 'signup_csrf_hotfix_complete=yes'
          REMOTE
