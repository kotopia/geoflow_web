name: GeoFlow tenant group run locator

on:
  pull_request:
    paths:
      - .github/workflows/geoflow-tenant-group-run-locator.yml

permissions:
  contents: read
  actions: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate latest GeoFlow tenant group locator release run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['REPOSITORY']
          endpoint = f"repos/{repo}/actions/workflows/geoflow-tenant-group-locator.yml/runs?branch=release/stabilized-deploy&per_page=10"
          payload = json.loads(subprocess.check_output(['gh','api',endpoint], text=True))
          runs = payload.get('workflow_runs', [])
          print(f'geoflow_tenant_group_run_count={len(runs)}')
          for run in runs:
              print(
                  'geoflow_tenant_group_run '
                  f"id={run.get('id')} "
                  f"number={run.get('run_number')} "
                  f"attempt={run.get('run_attempt')} "
                  f"status={run.get('status')} "
                  f"conclusion={run.get('conclusion')} "
                  f"head_sha={run.get('head_sha')} "
                  f"event={run.get('event')} "
                  f"created_at={run.get('created_at')} "
                  f"updated_at={run.get('updated_at')} "
                  f"html_url={run.get('html_url')}"
              )
          PY
