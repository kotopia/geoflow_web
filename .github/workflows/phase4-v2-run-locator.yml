name: Phase 4 v2 diagnostic run locator

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  locate:
    if: github.event.issue.title == '[phase4-v2-run-locate]'
    runs-on: ubuntu-latest
    steps:
      - name: Locate exact v2 diagnostic run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: fab75e3a2bb10f2ace633f0e68612429997d461b
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/phase4-tenant-migration-readonly-diagnostic-v2.yml/runs?per_page=20")"
          run="$(printf '%s' "$runs" | jq -c --arg sha "$EXPECTED_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.id) | reverse | .[0] // empty')"
          test -n "$run" || { echo 'phase4_v2_locator=no_matching_run'; exit 2; }
          id="$(printf '%s' "$run" | jq -r '.id')"
          num="$(printf '%s' "$run" | jq -r '.run_number')"
          status="$(printf '%s' "$run" | jq -r '.status')"
          conclusion="$(printf '%s' "$run" | jq -r '.conclusion // "none"')"
          actor="$(printf '%s' "$run" | jq -r '.actor.login')"
          pending="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/pending_deployments")"
          env_name="$(printf '%s' "$pending" | jq -r '[.[] | select(.environment.name == "production")][0].environment.name // "none"')"
          reviewers="$(printf '%s' "$pending" | jq -r '[.[] | select(.environment.name == "production")][0].reviewers // [] | map(.type + ":" + .reviewer.login) | join(",")')"
          body="phase4_v2_diag_locator run_id=${id} run_number=${num} expected_sha=${EXPECTED_SHA} status=${status} conclusion=${conclusion} actor=${actor} pending_env=${env_name} reviewers=${reviewers:-none}"
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/175/comments" -f body="$body" >/dev/null
