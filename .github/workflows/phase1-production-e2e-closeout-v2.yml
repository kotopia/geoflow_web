name: Phase 1 production E2E closeout v2

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-production-e2e-closeout-v2.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  phase1-production-e2e-closeout:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Run rollback-only production signup E2E
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          umask 077

          candidate_sha="$1"
          web_service='geoflow-stabilized.service'
          worker_service='geoflow-signup-outbox.service'
          worker_timer='geoflow-signup-outbox.timer'

          fail() {
            echo "phase1_e2e_blocker=$1"
            exit 2
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'

          active="$(systemctl show "$web_service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$web_service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running'

          workdir="$(systemctl show "$web_service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'

          dirty_count="$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')"
          [ "$dirty_count" = 0 ] || fail 'production_worktree_dirty'

          deployed_sha="$(git -C "$repo" rev-parse HEAD)"
          git -C "$repo" fetch --quiet origin refs/heads/release/stabilized-deploy
          fetched_sha="$(git -C "$repo" rev-parse FETCH_HEAD)"
          [ "$fetched_sha" = "$candidate_sha" ] || fail 'candidate_sha_not_current_release_head'
          git -C "$repo" merge-base --is-ancestor "$deployed_sha" "$candidate_sha" || fail 'deployed_sha_not_release_ancestor'

          signup_paths=(
            control/views_signup.py
            control/views_legal.py
            control/forms_signup.py
            control/legal_policy.py
            control/services/signup_service.py
            control/services/signup_runtime_readiness.py
            control/services/signup_verification_runtime.py
            control/services/signup_verification_service.py
            control/services/signup_verification_token_service.py
            control/services/signup_verification_delivery.py
            control/services/signup_verification_outbox_config.py
            control/services/signup_verification_outbox_feature.py
            control/services/signup_verification_signup_outbox_service.py
            control/services/signup_verification_outbox_service.py
            control/services/signup_verification_outbox_repository.py
            control/services/signup_verification_outbox_worker.py
            control/services/signup_verification_email_delivery.py
            control/management/commands/check_production_runtime.py
            control/management/commands/check_signup_launch_schema.py
            control/management/commands/check_signup_verification_outbox.py
            control/management/commands/process_signup_verification_outbox.py
            geoflow_project/settings.py
          )
          git -C "$repo" diff --quiet "$deployed_sha" "$candidate_sha" -- "${signup_paths[@]}" || fail 'signup_code_drift_requires_application_deploy'
          echo 'phase1_e2e_signup_code_matches_release=yes'

          signup_code="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/signup/ || true)"
          resend_code="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/signup/resend/ || true)"
          [ "$signup_code" = 200 ] || fail 'signup_endpoint_not_200'
          [ "$resend_code" = 200 ] || fail 'resend_endpoint_not_200'
          echo 'phase1_e2e_public_signup_ready=yes'

          [ "$(systemctl is-enabled "$worker_timer" 2>/dev/null || true)" = enabled ] || fail 'signup_worker_timer_not_enabled'
          [ "$(systemctl is-active "$worker_timer" 2>/dev/null || true)" = active ] || fail 'signup_worker_timer_not_active'
          worker_result="$(systemctl show "$worker_service" -p Result --value 2>/dev/null || true)"
          [ "$worker_result" = success ] || fail 'signup_worker_last_result_not_success'
          echo 'phase1_e2e_outbox_timer_ready=yes'

          "$python" "$repo/manage.py" check_production_runtime --strict
          "$python" "$repo/manage.py" check_signup_launch_schema --strict
          "$python" "$repo/manage.py" check_signup_verification_outbox

          "$python" - "$repo" <<'PY'
          import os
          import sys
          import uuid
          from contextlib import nullcontext
          from urllib.parse import parse_qs, urlsplit

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'geoflow_project.settings')

          import django
          django.setup()

          from django.conf import settings
          from django.db import connections, transaction
          from django.utils import timezone

          from control.services.signup_service import SignupRequestInput
          from control.services.signup_verification_signup_outbox_service import (
              create_signup_request_with_verification_outbox,
          )
          from control.services.signup_verification_outbox_config import (
              load_signup_verification_outbox_config,
          )
          from control.services.signup_verification_outbox_service import (
              claim_next_signup_email_verification_delivery,
          )
          from control.services.signup_verification_outbox_worker import (
              process_signup_verification_delivery_claim,
          )
          from control.services.signup_verification_runtime import (
              load_signup_email_verification_key_ring,
          )
          from control.services.signup_verification_token_service import (
              verify_signup_email_with_database_token,
          )
          from control.services.signup_verification_service import EmailVerificationRejected

          alias = getattr(settings, 'CENTRAL_DB_ALIAS', 'default')
          connection = connections[alias]
          config = load_signup_verification_outbox_config()
          test_email = f"phase1-e2e-{uuid.uuid4().hex}@example.invalid"
          fixed_secret = 'A' * 43
          captured = {}
          failure = None

          with connection.cursor() as cursor:
              cursor.execute(
                  """
                  SELECT COUNT(*)
                    FROM signup_verification_delivery_outbox
                   WHERE status IN ('pending', 'processing')
                  """
              )
              existing_live_outbox = int(cursor.fetchone()[0])
          print(f'phase1_e2e_existing_live_outbox={existing_live_outbox}')
          if existing_live_outbox != 0:
              print('phase1_e2e_result=blocked_existing_live_outbox')
              raise SystemExit(2)

          def capture_delivery(*, to_email, verification_link, expires_at, **kwargs):
              if to_email != test_email:
                  raise AssertionError('delivery target mismatch')
              if expires_at <= timezone.now():
                  raise AssertionError('verification expiry is not in the future')
              captured['link'] = verification_link

          try:
              with transaction.atomic(using=alias):
                  receipt = create_signup_request_with_verification_outbox(
                      SignupRequestInput(
                          email=test_email,
                          password='Phase1-E2E-Only!9x7Q',
                          name_display='Phase 1 E2E',
                          contact_phone='',
                          organization_name='GeoFlow Phase 1 E2E',
                          signup_purpose='Phase 1 rollback-only production verification',
                          terms_agreed=True,
                          privacy_agreed=True,
                      ),
                      alias=alias,
                      atomic_context=nullcontext(),
                  )

                  with connection.cursor() as cursor:
                      cursor.execute(
                          """
                          SELECT u.is_active, u.email_verified, r.status,
                                 (SELECT COUNT(*) FROM signup_request_events e WHERE e.signup_request_id=r.id),
                                 (SELECT COUNT(*) FROM signup_verification_delivery_outbox o WHERE o.signup_request_id=r.id)
                            FROM users u
                            JOIN signup_requests r ON r.user_id=u.id
                           WHERE lower(u.email)=lower(%s)
                          """,
                          [test_email],
                      )
                      row = cursor.fetchone()
                  if row != (False, False, 'pending_email_verification', 1, 1):
                      raise AssertionError('initial signup state mismatch')

                  claim = claim_next_signup_email_verification_delivery(
                      lease_for=config.lease_for,
                      alias=alias,
                      atomic_context=nullcontext(),
                  )
                  if claim is None or claim.signup_request_id != receipt.signup_request_id:
                      raise AssertionError('verification outbox claim mismatch')

                  key_ring = load_signup_email_verification_key_ring()
                  outcome = process_signup_verification_delivery_claim(
                      claim,
                      verification_url=config.verification_url,
                      ttl=config.token_ttl,
                      retry_at=timezone.now() + config.retry_delay,
                      key_ring=key_ring,
                      alias=alias,
                      atomic_context=nullcontext(),
                      token_factory=lambda _n: fixed_secret,
                      deliver=capture_delivery,
                      email_timeout_seconds=int(config.email_timeout.total_seconds()),
                      max_attempts=config.max_attempts,
                  )
                  if outcome.status != 'delivered':
                      raise AssertionError('verification delivery outcome mismatch')

                  link = captured.get('link')
                  if not isinstance(link, str) or not link:
                      raise AssertionError('verification link was not produced')
                  parts = urlsplit(link)
                  token_values = parse_qs(parts.fragment).get('token', [])
                  if len(token_values) != 1:
                      raise AssertionError('verification token fragment mismatch')
                  token = token_values[0]

                  verify_signup_email_with_database_token(
                      token,
                      key_ring=key_ring,
                      alias=alias,
                      atomic_context=nullcontext(),
                  )

                  with connection.cursor() as cursor:
                      cursor.execute(
                          """
                          SELECT u.is_active, u.email_verified, r.status,
                                 (SELECT COUNT(*) FROM signup_request_events e WHERE e.signup_request_id=r.id),
                                 (SELECT COUNT(*) FROM signup_email_verification_tokens t WHERE t.signup_request_id=r.id AND t.consumed_at IS NOT NULL),
                                 (SELECT COUNT(*) FROM signup_verification_delivery_outbox o WHERE o.signup_request_id=r.id AND o.status='delivered')
                            FROM users u
                            JOIN signup_requests r ON r.user_id=u.id
                           WHERE lower(u.email)=lower(%s)
                          """,
                          [test_email],
                      )
                      verified = cursor.fetchone()
                  if verified != (False, True, 'pending_approval', 2, 1, 1):
                      raise AssertionError('verified signup state mismatch')

                  replay_rejected = False
                  try:
                      verify_signup_email_with_database_token(
                          token,
                          key_ring=key_ring,
                          alias=alias,
                          atomic_context=nullcontext(),
                      )
                  except EmailVerificationRejected:
                      replay_rejected = True
                  if not replay_rejected:
                      raise AssertionError('verification token replay was not rejected')

                  transaction.set_rollback(True, using=alias)
          except Exception as exc:
              failure = exc

          with connection.cursor() as cursor:
              cursor.execute("SELECT COUNT(*) FROM users WHERE lower(email)=lower(%s)", [test_email])
              residue = int(cursor.fetchone()[0])
          if residue != 0:
              print('phase1_e2e_rollback_clean=no')
              raise SystemExit(2)
          print('phase1_e2e_rollback_clean=yes')

          if failure is not None:
              print(f'phase1_e2e_failure_type={failure.__class__.__name__}')
              print('phase1_e2e_result=failed')
              raise SystemExit(2)

          print('phase1_e2e_signup_created=yes')
          print('phase1_e2e_outbox_claimed=yes')
          print('phase1_e2e_delivery_path_exercised=yes')
          print('phase1_e2e_email_verified=yes')
          print('phase1_e2e_pending_approval=yes')
          print('phase1_e2e_token_replay_rejected=yes')
          print('phase1_e2e_result=ready')
          PY

          "$python" "$repo/manage.py" check_signup_verification_outbox

          signup_code_after="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/signup/ || true)"
          resend_code_after="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/signup/resend/ || true)"
          [ "$signup_code_after" = 200 ] || fail 'signup_endpoint_not_200_after_e2e'
          [ "$resend_code_after" = 200 ] || fail 'resend_endpoint_not_200_after_e2e'

          echo 'phase1_production_e2e_closeout_complete=yes'
          REMOTE
