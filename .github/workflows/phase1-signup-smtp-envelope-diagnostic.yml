name: Phase 1 signup SMTP sender diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-signup-smtp-envelope-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signup-smtp-sender-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Diagnose effective sender and SMTP envelope without sending mail
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          service='geoflow-stabilized.service'
          workdir="$(systemctl show "$service" -p WorkingDirectory --value)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel)"
          python="$repo/.venv/bin/python"
          cd "$repo"
          DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import os
          import smtplib
          import ssl
          import django
          django.setup()
          from django.conf import settings

          def yn(v):
              return 'yes' if bool(v) else 'no'

          sender = (os.environ.get('DEFAULT_FROM_EMAIL') or '').strip() or str(getattr(settings, 'DEFAULT_FROM_EMAIL', '') or '').strip()
          smtp_user = str(getattr(settings, 'EMAIL_HOST_USER', '') or '').strip()
          smtp_password = str(getattr(settings, 'EMAIL_HOST_PASSWORD', '') or '')
          smtp_host = str(getattr(settings, 'EMAIL_HOST', '') or '').strip()
          smtp_port = int(getattr(settings, 'EMAIL_PORT', 0) or 0)
          use_tls = bool(getattr(settings, 'EMAIL_USE_TLS', False))

          normalized_account = smtp_user.lower()
          if normalized_account and '@' not in normalized_account:
              normalized_account = normalized_account + '@naver.com'
          sender_lower = sender.lower()

          print('signup_sender_effective_present=' + yn(sender))
          print('signup_sender_is_geoflow_local=' + yn(sender_lower.endswith('@geoflow.local')))
          print('signup_sender_is_naver_address=' + yn(sender_lower.endswith('@naver.com')))
          print('signup_sender_matches_smtp_account=' + yn(bool(sender_lower and normalized_account and sender_lower == normalized_account)))
          print('signup_smtp_host_is_naver=' + yn(smtp_host == 'smtp.naver.com'))
          print('signup_smtp_tls_enabled=' + yn(use_tls))
          print('signup_smtp_credentials_present=' + yn(bool(smtp_user and smtp_password)))

          if not sender or smtp_host != 'smtp.naver.com' or smtp_port != 587 or not use_tls or not smtp_user or not smtp_password:
              print('signup_sender_diagnostic_result=config_not_ready')
              raise SystemExit(2)

          try:
              with smtplib.SMTP(smtp_host, smtp_port, timeout=20) as client:
                  client.ehlo()
                  client.starttls(context=ssl.create_default_context())
                  client.ehlo()
                  client.login(smtp_user, smtp_password)
                  print('signup_sender_smtp_auth=ready')
                  mail_code, _ = client.mail(sender)
                  print(f'signup_sender_mail_from_code={mail_code}')
                  if mail_code == 250 and normalized_account:
                      rcpt_code, _ = client.rcpt(normalized_account)
                      print(f'signup_sender_rcpt_probe_code={rcpt_code}')
                  client.rset()
          except smtplib.SMTPAuthenticationError as exc:
              print(f'signup_sender_smtp_auth_code={getattr(exc, "smtp_code", "unknown")}')
              print('signup_sender_smtp_auth=failed')
              raise SystemExit(2)
          except Exception as exc:
              print('signup_sender_probe_exception=' + exc.__class__.__name__)
              raise SystemExit(2)

          print('signup_sender_probe_sent_mail=no')
          print('signup_sender_diagnostic_result=complete')
          PY
          REMOTE
