name: Phase 4 current production run locator

on:
  issues:
    types:
      - opened

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  locate-current-production-run:
    if: github.event.issue.title == '[phase4-current-run-locate-3a7bedd]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RELEASE_SHA: 3a7bedd67b7e36607642a7952e90f3e75e10c7d1
      REPORT_ISSUE: '158'

    steps:
      - name: Locate exact current Phase 4 production run
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/phase4-workflow-handoff-production-activation.yml/runs?per_page=30")"
          target_run="$(printf '%s' "$runs" | jq -r --arg sha "$EXPECTED_RELEASE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.id) | reverse | .[0].id // empty')"
          test -n "$target_run" || {
            gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/${REPORT_ISSUE}/comments" -f body="phase4_current_run_locator_no_match expected_release_sha=${EXPECTED_RELEASE_SHA}" >/dev/null || true
            exit 2
          }
          run_json="$(printf '%s' "$runs" | jq -c --argjson id "$target_run" '[.workflow_runs[] | select(.id == $id)][0]')"
          status="$(printf '%s' "$run_json" | jq -r '.status // "unknown"')"
          conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // "none"')"
          run_number="$(printf '%s' "$run_json" | jq -r '.run_number // "unknown"')"
          actor="$(printf '%s' "$run_json" | jq -r '.actor.login // "unknown"')"
          triggering_actor="$(printf '%s' "$run_json" | jq -r '.triggering_actor.login // "unknown"')"
          pending="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${target_run}/pending_deployments" || printf '[]')"
          pending_env="$(printf '%s' "$pending" | jq -r '[.[] | select(.environment.name == "production")][0].environment.name // "none"')"
          can_approve="$(printf '%s' "$pending" | jq -r '[.[] | select(.environment.name == "production")][0].current_user_can_approve // false')"
          reviewers="$(printf '%s' "$pending" | jq -r '[.[] | select(.environment.name == "production")][0].reviewers // [] | map((.type // "?") + ":" + (.reviewer.login // .reviewer.name // "?")) | join(",")')"
          body="phase4_current_run_locator target_run_id=${target_run} run_number=${run_number} expected_release_sha=${EXPECTED_RELEASE_SHA} status=${status} conclusion=${conclusion} actor=${actor} triggering_actor=${triggering_actor} pending_env=${pending_env} current_token_can_approve=${can_approve} reviewers=${reviewers:-none}"
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/${REPORT_ISSUE}/comments" -f body="$body" >/dev/null
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -f body="$body" >/dev/null
