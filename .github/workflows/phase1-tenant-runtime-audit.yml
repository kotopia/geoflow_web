name: Phase 1 tenant runtime audit

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-tenant-runtime-audit.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  tenant-runtime-audit:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Audit tenant runtime without mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'

          fail() {
            echo "tenant_runtime_audit_blocker=$1"
            exit 2
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'stabilized_service_not_running'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'

          code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/ || true)"
          case "$code" in 2??|3??) ;; *) fail 'port_8011_not_healthy' ;; esac

          # This audit is intentionally read-only. It prints only aggregate markers.
          # It never prints credentials, secret identifiers, tenant/group/user identifiers,
          # DB names, DB users, hosts, ARNs, AWS account IDs, or exception text.
          "$python" - "$repo" <<'PY'
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import psycopg2

          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              SECRET_REFERENCE_PREFIX,
              TenantDBCredentialError,
              parse_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          def text(value):
              return str(value or "").strip()

          def enabled(name):
              return text(os.environ.get(name)).lower() in {"1", "true", "yes", "y", "on"}

          rows = list(
              GroupDBConfig.objects.using("default")
              .select_related("group")
              .order_by("group_id")
          )

          total = len(rows)
          active = 0
          inactive = 0
          refs = 0
          active_empty = 0
          inactive_empty = 0
          plaintext = 0
          malformed_ref = 0
          ref_resolve_fail = 0
          active_connect_ok = 0
          active_connect_fail = 0

          for row in rows:
              group_active = text(getattr(row.group, "status", "")).lower() == "active"
              if group_active:
                  active += 1
              else:
                  inactive += 1

              raw = text(row.db_password)
              if not raw:
                  if group_active:
                      active_empty += 1
                  else:
                      inactive_empty += 1
                  continue

              if not raw.startswith(SECRET_REFERENCE_PREFIX):
                  plaintext += 1
                  continue

              try:
                  parse_tenant_db_secret_reference(raw)
              except TenantDBCredentialError:
                  malformed_ref += 1
                  continue

              refs += 1
              try:
                  password = resolve_tenant_db_password(raw)
              except Exception:
                  ref_resolve_fail += 1
                  continue

              if not group_active:
                  continue

              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=row.db_host,
                      port=row.db_port,
                      sslmode="require",
                      connect_timeout=8,
                  )
                  try:
                      with conn.cursor() as cursor:
                          cursor.execute("SELECT 1")
                          value = cursor.fetchone()
                          if not value or value[0] != 1:
                              raise RuntimeError("unexpected SELECT 1 result")
                  finally:
                      conn.close()
                  active_connect_ok += 1
              except Exception:
                  active_connect_fail += 1

          strict = enabled("TENANT_DB_REQUIRE_SECRET_REFERENCES")
          ready = (
              total > 0
              and strict
              and active_empty == 0
              and plaintext == 0
              and malformed_ref == 0
              and ref_resolve_fail == 0
              and active_connect_fail == 0
              and active_connect_ok == active
          )

          print(f"tenant_runtime_audit_total={total}")
          print(f"tenant_runtime_audit_active={active}")
          print(f"tenant_runtime_audit_inactive={inactive}")
          print(f"tenant_runtime_audit_refs={refs}")
          print(f"tenant_runtime_audit_active_empty={active_empty}")
          print(f"tenant_runtime_audit_inactive_empty={inactive_empty}")
          print(f"tenant_runtime_audit_plaintext={plaintext}")
          print(f"tenant_runtime_audit_malformed_refs={malformed_ref}")
          print(f"tenant_runtime_audit_ref_resolve_fail={ref_resolve_fail}")
          print(f"tenant_runtime_audit_active_connect_ok={active_connect_ok}")
          print(f"tenant_runtime_audit_active_connect_fail={active_connect_fail}")
          print(f"tenant_runtime_audit_strict_references={'yes' if strict else 'no'}")
          print(f"tenant_runtime_audit_ready={'yes' if ready else 'no'}")

          if not ready:
              raise SystemExit(2)
          PY

          terms_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/terms/ || true)"
          privacy_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/privacy/ || true)"
          [ "$terms_code" = '200' ] || fail 'public_terms_not_200'
          [ "$privacy_code" = '200' ] || fail 'public_privacy_not_200'

          echo 'phase1_tenant_runtime_audit_complete=yes'
          REMOTE
