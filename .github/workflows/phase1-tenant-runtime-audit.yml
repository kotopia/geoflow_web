name: Phase 1 tenant runtime audit

on:
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  registry-placeholder:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Require reviewed release branch definition
        shell: bash
        run: |
          echo 'registry_placeholder=yes'
          echo 'use_ref=release/stabilized-deploy'
          echo 'The production audit implementation is defined on the reviewed release branch.'
