name: Phase 1 role assignment 500 hotfix v2

on:
  pull_request:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-role-assignment-500-hotfix.yml
      - scripts/ops/patch_role_assignment_legacy_runtime.py
      - control/test_role_assignment_runtime_patch.py
      - control/test_role_assignment_sql_safety.py
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-role-assignment-500-hotfix.yml
      - scripts/ops/patch_role_assignment_legacy_runtime.py
      - control/test_role_assignment_runtime_patch.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate minimal runtime patch contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/ops/patch_role_assignment_legacy_runtime.py
          python -m unittest control.test_role_assignment_runtime_patch

          tmp_view="$(mktemp)"
          cp control/views_users_admin.py "$tmp_view"
          python scripts/ops/patch_role_assignment_legacy_runtime.py "$tmp_view"
          python -m py_compile "$tmp_view"
          python scripts/ops/patch_role_assignment_legacy_runtime.py "$tmp_view" \
            | grep -Fx 'role_assignment_runtime_patch_status=already_safe'
          rm -f "$tmp_view"
          echo 'role_assignment_hotfix_v2_candidate_ready=yes'

  deploy-hotfix:
    needs: validate-hotfix
    if: github.event_name != 'pull_request' && github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Checkout exact reviewed release head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate reviewed head and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          python -m py_compile scripts/ops/patch_role_assignment_legacy_runtime.py
          python -m unittest control.test_role_assignment_runtime_patch
          patch_blob="$(git hash-object scripts/ops/patch_role_assignment_legacy_runtime.py)"
          test -n "$patch_blob"
          echo "PATCH_BLOB=$patch_blob" >> "$GITHUB_ENV"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Stage reviewed runtime patch only
        shell: bash
        run: |
          set -euo pipefail
          remote_stage="/tmp/geoflow-role-assignment-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          scp -q \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -P 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            scripts/ops/patch_role_assignment_legacy_runtime.py \
            "$SSH_USER@$SSH_HOST:$remote_stage"
          echo "REMOTE_STAGE=$remote_stage" >> "$GITHUB_ENV"

      - name: Patch legacy runtime assignment with rollback and smoke
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "REMOTE_STAGE='$REMOTE_STAGE' EXPECTED_PATCH_BLOB='$PATCH_BLOB' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077

          service='geoflow-stabilized.service'
          expected_base_blob='c4574fb48347c9d194593efd007a2b00c19ad8f5'
          expected_prior_hotfix_blob='9349d96eb87241b02a93f480efc99a4ccaa4e499'
          fail() { echo "role_assignment_hotfix_v2_blocker=$1"; exit 2; }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'
          [ -s "$REMOTE_STAGE" ] || fail 'staged_patch_missing'
          [ "$(git hash-object "$REMOTE_STAGE")" = "$EXPECTED_PATCH_BLOB" ] \
            || fail 'staged_patch_not_reviewed'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] \
            || fail 'web_service_not_running_before_hotfix'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'runtime_repo_missing'
          target="$repo/control/views_users_admin.py"
          [ -f "$target" ] || fail 'runtime_users_admin_view_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'runtime_python_missing'

          current_blob="$(git -C "$repo" hash-object "$target")"
          known_legacy=no
          case "$current_blob" in
            "$expected_base_blob"|"$expected_prior_hotfix_blob") known_legacy=yes ;;
          esac

          if [ "$known_legacy" != yes ]; then
            probe="$(mktemp /tmp/geoflow-role-assignment-probe.XXXXXX.py)"
            cp -p "$target" "$probe"
            probe_output="$($python "$REMOTE_STAGE" "$probe" 2>/dev/null || true)"
            if [ "$probe_output" = 'role_assignment_runtime_patch_status=already_safe' ] \
              && cmp -s "$target" "$probe"; then
              rm -f "$probe" "$REMOTE_STAGE"
              "$python" -m py_compile "$target"
              cd "$repo"
              DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" manage.py check >/dev/null
              echo 'role_assignment_hotfix_v2_runtime_already_safe=yes'
              exit 0
            fi
            rm -f "$probe"
            fail 'runtime_users_admin_view_diverged'
          fi

          backup="$(mktemp "$repo/control/.views_users_admin.role-v2-backup.XXXXXX")"
          cp -p "$target" "$backup"
          mutation_started=0

          rollback() {
            set +e
            if [ "$mutation_started" -eq 1 ] && [ -f "$backup" ]; then
              cp -p "$backup" "$target"
              sudo -n systemctl restart "$service" >/dev/null 2>&1 || true
              sleep 2
            fi
            rm -f "$backup" "$REMOTE_STAGE"
            echo 'role_assignment_hotfix_v2_rollback_completed=yes'
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              rollback
            else
              rm -f "$backup" "$REMOTE_STAGE"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          mutation_started=1
          patch_output="$($python "$REMOTE_STAGE" "$target")"
          [ "$patch_output" = 'role_assignment_runtime_patch_status=patched' ] \
            || fail 'runtime_patch_did_not_apply'
          second_output="$($python "$REMOTE_STAGE" "$target")"
          [ "$second_output" = 'role_assignment_runtime_patch_status=already_safe' ] \
            || fail 'runtime_patch_not_idempotent'
          "$python" -m py_compile "$target"

          cd "$repo"
          DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" manage.py check >/dev/null

          sudo -n systemctl restart "$service"
          ready=no
          for _ in $(seq 1 15); do
            active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
            sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
            if [ "$active" = active ] && [ "$sub" = running ]; then
              ready=yes
              break
            fi
            sleep 1
          done
          [ "$ready" = yes ] || fail 'web_service_not_running_after_hotfix'

          login_get="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://geoflow.co.kr/login/)"
          echo "role_assignment_hotfix_v2_login_get=$login_get"
          [ "$login_get" = 200 ] || fail 'login_get_not_200'

          mutation_started=0
          rm -f "$backup" "$REMOTE_STAGE"
          trap - EXIT
          echo 'role_assignment_hotfix_v2_complete=yes'
          REMOTE
