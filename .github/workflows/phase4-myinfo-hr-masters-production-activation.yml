name: Phase 4 my company HR masters production activation

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase4-myinfo-hr-masters-production-activation.yml
      - geoflow_ops/migrations/0025_myinfo_hr_masters.py
      - geoflow_ops/services/hr_masters.py
      - geoflow_ops/views_myinfo.py
      - geoflow_ops/myinfo_security_views.py
      - geoflow_ops/employee_security_views.py
      - geoflow_ops/templates/geoflow_ops/myinfo/orgunit_detail.html
      - geoflow_ops/templates/geoflow_ops/settings/settings_page.html
      - geoflow_ops/urls.py
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"
        type: string

permissions:
  contents: read

jobs:
  classify-myinfo-hr-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      requires_contract_workflow_activation: ${{ steps.classify.outputs.requires_contract_workflow_activation }}
    steps:
      - name: Checkout exact triggering release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Defer to contract workflow activation when 0026 is present
        id: classify
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          requires=false
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            before="$BEFORE_SHA"
            if [ -n "$before" ] && ! printf '%s' "$before" | grep -Eq '^0+$'; then
              git diff --name-only "$before" "$GITHUB_SHA" > /tmp/geoflow_myinfo_changed.txt
            else
              git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > /tmp/geoflow_myinfo_changed.txt
            fi
            if grep -Fxq 'geoflow_ops/migrations/0026_contract_completion_event_backfill.py' /tmp/geoflow_myinfo_changed.txt; then
              requires=true
            fi
          fi
          echo "requires_contract_workflow_activation=$requires" >> "$GITHUB_OUTPUT"
          echo "myinfo_hr_requires_contract_workflow_activation=$requires"

  myinfo-hr-masters-production-activation:
    needs: classify-myinfo-hr-activation
    if: >-
      github.ref_name == 'release/stabilized-deploy' &&
      needs.classify-myinfo-hr-activation.outputs.requires_contract_workflow_activation != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'myinfo_hr_activation_blocker=release_advanced'
            exit 2
          }
          test -n "$SSH_HOST" || { echo 'myinfo_hr_activation_blocker=missing_ssh_host'; exit 2; }
          test -n "$SSH_USER" || { echo 'myinfo_hr_activation_blocker=missing_ssh_user'; exit 2; }
          test -n "$SSH_KEY" || { echo 'myinfo_hr_activation_blocker=missing_ssh_key'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'myinfo_hr_activation_blocker=missing_known_hosts'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || {
            echo 'myinfo_hr_activation_blocker=invalid_ssh_port'
            exit 2
          }
          echo 'myinfo_hr_activation_exact_release=yes'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Apply 0025 HR masters migration and deploy exact release
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          candidate_sha="$1"
          service='geoflow-stabilized.service'
          expected_branch='release/stabilized-deploy'
          migration_path='geoflow_ops/migrations/0025_myinfo_hr_masters.py'

          fail() {
            echo "myinfo_hr_activation_blocker=$1"
            exit 2
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'stabilized_service_not_running_before_activation'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/requirements.txt" ] || fail 'requirements_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'

          origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
          case "$origin" in
            https://github.com/kotopia/geoflow_web|https://github.com/kotopia/geoflow_web.git|git@github.com:kotopia/geoflow_web.git) ;;
            *) fail 'unexpected_repository_origin' ;;
          esac
          [ "$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')" = '0' ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'
          [ -x "$repo/.venv/bin/gunicorn" ] || fail 'stabilized_gunicorn_missing'
          exec_raw="$(systemctl show "$service" -p ExecStart --value 2>/dev/null || true)"
          printf '%s' "$exec_raw" | grep -Fq "$repo/.venv/bin/gunicorn" || fail 'service_exec_not_stabilized_venv'
          printf '%s' "$exec_raw" | grep -Fq 'geoflow_project.wsgi:application' || fail 'service_wsgi_target_unexpected'

          before_code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/login/ || true)"
          case "$before_code" in 2??|3??) ;; *) fail 'local_login_unhealthy_before_activation' ;; esac

          previous_sha="$(git -C "$repo" rev-parse HEAD)"
          previous_branch="$(git -C "$repo" symbolic-ref --short -q HEAD || true)"
          echo "myinfo_hr_activation_previous_sha=$previous_sha"
          echo "myinfo_hr_activation_candidate_sha=$candidate_sha"

          git -C "$repo" fetch --prune origin refs/heads/release/stabilized-deploy
          [ "$(git -C "$repo" rev-parse FETCH_HEAD)" = "$candidate_sha" ] || fail 'candidate_sha_not_current_release_head'
          git -C "$repo" cat-file -e "$candidate_sha:$migration_path" || fail 'candidate_migration_missing'

          "$python" - "$repo" "$candidate_sha" "$migration_path" <<'PY'
          from collections import Counter
          import os
          import subprocess
          import sys
          import types

          repo, candidate_sha, migration_path = sys.argv[1:4]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import psycopg2
          from django.db import connections, transaction
          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          APP = "webgisapp"
          DEPENDENCY = "0024_phase4_workflow_handoff_and_contract_access"
          MIGRATION = "0025_myinfo_hr_masters"
          REQUIRED_RELATIONS = {
              "hr.employee_profile",
              "hr.departments",
              "ops.my_org_units",
              "ops.settings_nodes",
          }
          DEFAULT_GRADES = ("임원", "부장", "차장", "과장", "대리", "주임", "사원", "인턴")
          DEFAULT_POSITIONS = ("대표", "대표이사", "본부장", "부문장", "실장", "팀장", "파트장", "팀원")

          def text(value):
              return str(value or "").strip()

          def scalar(cur, sql, params=None):
              cur.execute(sql, params or [])
              row = cur.fetchone()
              return row[0] if row else None

          def relation_exists(cur, relation):
              return bool(scalar(cur, "SELECT to_regclass(%s) IS NOT NULL", [relation]))

          def relation_digest(cur, relation):
              cur.execute(
                  f"SELECT md5(COALESCE(string_agg(to_jsonb(t)::text, E'\\n' ORDER BY t.id::text), '')) FROM {relation} t"
              )
              return cur.fetchone()[0]

          source = subprocess.check_output(
              ["git", "-C", repo, "show", f"{candidate_sha}:{migration_path}"],
              text=True,
          )
          lowered = source.lower()
          for forbidden in (
              "delete from hr.employee_profile",
              "update hr.employee_profile",
              "truncate hr.employee_profile",
              "drop table hr.employee_profile",
              "delete from hr.departments",
              "update hr.departments",
              "truncate hr.departments",
              "drop table hr.departments",
              "delete from ops.settings_nodes",
              "update ops.settings_nodes",
              "truncate ops.settings_nodes",
              "drop table ops.settings_nodes",
          ):
              if forbidden in lowered:
                  raise SystemExit("myinfo_hr_activation_blocker=destructive_candidate_migration")

          module = types.ModuleType("candidate_0025")
          exec(compile(source, migration_path, "exec"), module.__dict__)
          operations = list(module.Migration.operations)
          if len(operations) != 1 or not hasattr(operations[0], "sql"):
              raise SystemExit("myinfo_hr_activation_blocker=unexpected_migration_shape")
          migration_sql = operations[0].sql

          with transaction.atomic(using="default"):
              with connections["default"].cursor() as central_cur:
                  central_cur.execute("SET LOCAL TRANSACTION READ ONLY")
                  configs = list(
                      GroupDBConfig.objects.using("default")
                      .select_related("group")
                      .order_by("group_id")
                  )
          active_rows = [row for row in configs if text(getattr(row.group, "status", "")).lower() == "active"]
          totals = Counter(configs=len(configs), active_tenants=len(active_rows))

          for row in active_rows:
              tenant_code = text(getattr(row.group, "code", "")) or "tenant"
              raw = text(row.db_password)
              try:
                  password = resolve_tenant_db_password(raw) if is_tenant_db_secret_reference(raw) else raw
              except Exception as exc:
                  totals["secret_resolution_failed"] += 1
                  print(f"myinfo_hr_activation_tenant={tenant_code} result=secret_resolution_failed error={exc.__class__.__name__}")
                  continue
              if not password:
                  totals["secret_resolution_failed"] += 1
                  print(f"myinfo_hr_activation_tenant={tenant_code} result=secret_resolution_failed error=empty_password")
                  continue
              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=row.db_host,
                      port=row.db_port,
                      sslmode="require",
                      connect_timeout=8,
                  )
              except Exception as exc:
                  totals["connection_failed"] += 1
                  print(f"myinfo_hr_activation_tenant={tenant_code} result=connection_failed error={exc.__class__.__name__}")
                  continue

              already_applied = False
              before = None
              try:
                  conn.autocommit = False
                  with conn.cursor() as cur:
                      cur.execute("SET LOCAL lock_timeout = '5s'")
                      cur.execute("SET LOCAL statement_timeout = '90s'")
                      cur.execute("SELECT pg_advisory_xact_lock(hashtext(%s))", ["geoflow:webgisapp:0025"])

                      present = {rel: relation_exists(cur, rel) for rel in REQUIRED_RELATIONS}
                      if not any(present.values()):
                          conn.rollback()
                          totals["schema_absent_skipped"] += 1
                          print(f"myinfo_hr_activation_tenant={tenant_code} result=schema_absent_skipped")
                          continue
                      if not all(present.values()):
                          missing = ",".join(sorted(rel for rel, ok in present.items() if not ok))
                          raise RuntimeError(f"partial HR schema missing={missing}")

                      dependency_applied = bool(
                          scalar(
                              cur,
                              "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                              [APP, DEPENDENCY],
                          )
                      )
                      if not dependency_applied:
                          raise RuntimeError("0024 dependency not applied")

                      already_applied = bool(
                          scalar(
                              cur,
                              "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                              [APP, MIGRATION],
                          )
                      )

                      before = {
                          "employees": int(scalar(cur, "SELECT COUNT(*) FROM hr.employee_profile")),
                          "departments": int(scalar(cur, "SELECT COUNT(*) FROM hr.departments")),
                          "settings_nodes": int(scalar(cur, "SELECT COUNT(*) FROM ops.settings_nodes")),
                          "employee_digest": relation_digest(cur, "hr.employee_profile"),
                          "department_digest": relation_digest(cur, "hr.departments"),
                          "settings_digest": relation_digest(cur, "ops.settings_nodes"),
                      }

                      if not already_applied:
                          cur.execute(migration_sql)
                          cur.execute(
                              """
                              INSERT INTO django_migrations (app, name, applied)
                              SELECT %s, %s, NOW()
                               WHERE NOT EXISTS (
                                   SELECT 1 FROM django_migrations WHERE app=%s AND name=%s
                               )
                              """,
                              [APP, MIGRATION, APP, MIGRATION],
                          )

                      after = {
                          "employees": int(scalar(cur, "SELECT COUNT(*) FROM hr.employee_profile")),
                          "departments": int(scalar(cur, "SELECT COUNT(*) FROM hr.departments")),
                          "settings_nodes": int(scalar(cur, "SELECT COUNT(*) FROM ops.settings_nodes")),
                          "employee_digest": relation_digest(cur, "hr.employee_profile"),
                          "department_digest": relation_digest(cur, "hr.departments"),
                          "settings_digest": relation_digest(cur, "ops.settings_nodes"),
                      }
                      for key in ("employees", "departments", "settings_nodes"):
                          if before[key] != after[key]:
                              raise RuntimeError(f"protected row count changed: {key}")
                      for key in ("employee_digest", "department_digest", "settings_digest"):
                          if before[key] != after[key]:
                              raise RuntimeError(f"protected content changed: {key}")

                      if not relation_exists(cur, "hr.job_grades"):
                          raise RuntimeError("job_grades table missing")
                      if not relation_exists(cur, "hr.job_positions"):
                          raise RuntimeError("job_positions table missing")

                      cur.execute(
                          "SELECT COUNT(DISTINCT name) FROM hr.job_grades WHERE system_default=true AND name = ANY(%s)",
                          [list(DEFAULT_GRADES)],
                      )
                      if int(cur.fetchone()[0] or 0) != len(DEFAULT_GRADES):
                          raise RuntimeError("default grade set incomplete")

                      cur.execute(
                          "SELECT COUNT(DISTINCT name) FROM hr.job_positions WHERE system_default=true AND name = ANY(%s)",
                          [list(DEFAULT_POSITIONS)],
                      )
                      if int(cur.fetchone()[0] or 0) != len(DEFAULT_POSITIONS):
                          raise RuntimeError("default position set incomplete")

                      unmatched_grades = int(
                          scalar(
                              cur,
                              """
                              SELECT COUNT(*)
                                FROM hr.employee_profile employee
                               WHERE btrim(COALESCE(employee.position_grade, '')) <> ''
                                 AND NOT EXISTS (
                                     SELECT 1 FROM hr.job_grades master
                                      WHERE master.active=true
                                        AND lower(btrim(master.name)) = lower(btrim(employee.position_grade))
                                 )
                              """,
                          )
                      )
                      if unmatched_grades:
                          raise RuntimeError("existing employee grade not represented by active master")

                      unmatched_positions = int(
                          scalar(
                              cur,
                              """
                              SELECT COUNT(*)
                                FROM hr.employee_profile employee
                               WHERE btrim(COALESCE(employee.title, '')) <> ''
                                 AND NOT EXISTS (
                                     SELECT 1 FROM hr.job_positions master
                                      WHERE master.active=true
                                        AND lower(btrim(master.name)) = lower(btrim(employee.title))
                                 )
                              """,
                          )
                      )
                      if unmatched_positions:
                          raise RuntimeError("existing employee position not represented by active master")

                      missing_settings_grades = int(
                          scalar(
                              cur,
                              """
                              SELECT COUNT(*)
                                FROM ops.settings_nodes category
                                JOIN ops.settings_nodes child ON child.parent_id=category.id
                               WHERE category.system_key='hr.position_grade'
                                 AND btrim(COALESCE(child.name, '')) <> ''
                                 AND NOT EXISTS (
                                     SELECT 1 FROM hr.job_grades master
                                      WHERE lower(btrim(master.name))=lower(btrim(child.name))
                                 )
                              """,
                          )
                      )
                      if missing_settings_grades:
                          raise RuntimeError("legacy settings grade missing from master")

                      missing_settings_positions = int(
                          scalar(
                              cur,
                              """
                              SELECT COUNT(*)
                                FROM ops.settings_nodes category
                                JOIN ops.settings_nodes child ON child.parent_id=category.id
                               WHERE category.system_key='hr.position_title'
                                 AND btrim(COALESCE(child.name, '')) <> ''
                                 AND NOT EXISTS (
                                     SELECT 1 FROM hr.job_positions master
                                      WHERE lower(btrim(master.name))=lower(btrim(child.name))
                                 )
                              """,
                          )
                      )
                      if missing_settings_positions:
                          raise RuntimeError("legacy settings position missing from master")

                      migration_record = bool(
                          scalar(
                              cur,
                              "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                              [APP, MIGRATION],
                          )
                      )
                      if not migration_record:
                          raise RuntimeError("0025 migration record missing")

                      grade_count = int(scalar(cur, "SELECT COUNT(*) FROM hr.job_grades"))
                      position_count = int(scalar(cur, "SELECT COUNT(*) FROM hr.job_positions"))

                  conn.commit()
                  totals["already_applied" if already_applied else "migrated"] += 1
                  totals["employee_rows_verified"] += before["employees"]
                  totals["department_rows_verified"] += before["departments"]
                  totals["settings_rows_verified"] += before["settings_nodes"]
                  totals["grade_rows_after"] += grade_count
                  totals["position_rows_after"] += position_count
                  print(
                      f"myinfo_hr_activation_tenant={tenant_code} result={'already_applied' if already_applied else 'migrated'} "
                      f"employees={before['employees']} departments={before['departments']} "
                      f"grades={grade_count} positions={position_count}"
                  )
              except Exception as exc:
                  conn.rollback()
                  totals["migration_failed"] += 1
                  pgcode = getattr(exc, "pgcode", None) or "-"
                  message = " ".join(str(exc).split())[:300]
                  print(
                      f"myinfo_hr_activation_tenant={tenant_code} result=migration_failed "
                      f"error={exc.__class__.__name__} pgcode={pgcode} message={message}"
                  )
              finally:
                  conn.close()

          for key in (
              "configs",
              "active_tenants",
              "migrated",
              "already_applied",
              "schema_absent_skipped",
              "secret_resolution_failed",
              "connection_failed",
              "migration_failed",
              "employee_rows_verified",
              "department_rows_verified",
              "settings_rows_verified",
              "grade_rows_after",
              "position_rows_after",
          ):
              print(f"myinfo_hr_activation_{key}={int(totals[key])}")

          if totals["secret_resolution_failed"] or totals["connection_failed"] or totals["migration_failed"]:
              raise SystemExit("myinfo_hr_activation_blocker=tenant_migration_failure")
          accounted = totals["migrated"] + totals["already_applied"] + totals["schema_absent_skipped"]
          if accounted != totals["active_tenants"]:
              raise SystemExit("myinfo_hr_activation_blocker=not_all_active_tenants_accounted")
          print("myinfo_hr_activation_db_complete=yes")
          PY

          rollback_needed=0
          rollback_code() {
            set +e
            if [ "$rollback_needed" -eq 1 ]; then
              echo 'myinfo_hr_activation_code_rollback_started=yes'
              if [ -n "$previous_branch" ]; then
                git -C "$repo" checkout -B "$previous_branch" "$previous_sha" >/dev/null 2>&1
              else
                git -C "$repo" checkout --detach "$previous_sha" >/dev/null 2>&1
              fi
              "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt" >/dev/null 2>&1
              "$python" "$repo/manage.py" collectstatic --noinput >/dev/null 2>&1
              sudo -n systemctl restart "$service"
              sleep 3
              echo "myinfo_hr_activation_rollback_service_state=$(systemctl is-active "$service" 2>/dev/null || true)"
              echo 'myinfo_hr_activation_code_rollback_completed=yes'
            fi
          }
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then rollback_code; fi
            exit "$rc"
          }
          trap on_exit EXIT
          rollback_needed=1

          git -C "$repo" checkout -B "$expected_branch" "$candidate_sha"
          [ "$(git -C "$repo" rev-parse HEAD)" = "$candidate_sha" ] || fail 'candidate_checkout_failed'
          "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt"
          "$python" -m pip check
          "$python" "$repo/manage.py" check
          "$python" "$repo/manage.py" collectstatic --noinput
          sudo -n systemctl restart "$service"

          ready=no
          for _ in $(seq 1 30); do
            active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
            sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
            code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/login/ || true)"
            if [ "$active" = 'active' ] && [ "$sub" = 'running' ]; then
              case "$code" in 2??|3??) ready=yes; break ;;
              esac
            fi
            sleep 2
          done
          [ "$ready" = yes ] || fail 'stabilized_service_failed_post_restart_healthcheck'

          public_login="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/login/ || true)"
          echo "myinfo_hr_activation_public_login_status=$public_login"
          [ "$public_login" = '200' ] || fail 'public_login_not_200_after_activation'

          rollback_needed=0
          trap - EXIT
          echo "myinfo_hr_activation_deployed_sha=$(git -C "$repo" rev-parse HEAD)"
          echo "myinfo_hr_activation_deployed_branch=$(git -C "$repo" rev-parse --abbrev-ref HEAD)"
          echo 'myinfo_hr_production_activation_complete=yes'
          REMOTE
