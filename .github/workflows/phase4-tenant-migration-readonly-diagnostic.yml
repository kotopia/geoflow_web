name: Phase 4 tenant migration read-only diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase4-tenant-migration-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: '22'

    steps:
      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          echo "phase4_diag_release_sha=$GITHUB_SHA"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Inspect active tenant migration prerequisites read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          service='geoflow-stabilized.service'
          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          test -n "$workdir" && test -d "$workdir"
          repo="$(git -C "$workdir" rev-parse --show-toplevel)"
          python="$repo/.venv/bin/python"
          test -x "$python"

          "$python" - "$repo" <<'PY'
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'geoflow_project.settings')

          import django
          django.setup()

          import psycopg2
          from django.db import connections, transaction
          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          REQUIRED = [
              'ctr.contracts', 'prj.projects', 'prj.project_members', 'prj.scope_item',
              'hr.employee_profile', 'hr.departments', 'ops.my_org_units',
              'ops.attachments', 'ops.process_events', 'ops.settings_nodes',
          ]
          APP = 'webgisapp'
          DEP = '0023_phase4_configurable_workflow_foundation'
          MIG = '0024_phase4_workflow_handoff_and_contract_access'

          def text(v):
              return str(v or '').strip()

          def scalar(cur, sql, params=None):
              cur.execute(sql, params or [])
              row = cur.fetchone()
              return row[0] if row else None

          with transaction.atomic(using='default'):
              with connections['default'].cursor() as c:
                  c.execute('SET LOCAL TRANSACTION READ ONLY')
                  rows = list(
                      GroupDBConfig.objects.using('default')
                      .select_related('group')
                      .order_by('group_id')
                  )

          active = [r for r in rows if text(getattr(r.group, 'status', '')).lower() == 'active']
          print(f'phase4_diag_active_tenants={len(active)}')

          for idx, row in enumerate(active, 1):
              group_code = text(getattr(row.group, 'code', '')) or '-'
              group_name = text(getattr(row.group, 'name', '')) or '-'
              label = f'{idx}:{group_code}:{group_name}'
              raw = text(row.db_password)
              try:
                  password = resolve_tenant_db_password(raw) if is_tenant_db_secret_reference(raw) else raw
              except Exception as exc:
                  print(f'phase4_diag_tenant={label} classification=secret_resolution_failed error={exc.__class__.__name__}')
                  continue

              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=row.db_host,
                      port=row.db_port,
                      sslmode='require',
                      connect_timeout=8,
                      options='-c default_transaction_read_only=on',
                  )
              except Exception as exc:
                  print(f'phase4_diag_tenant={label} classification=connection_failed error={exc.__class__.__name__}')
                  continue

              try:
                  conn.autocommit = False
                  with conn.cursor() as cur:
                      present = {}
                      for rel in REQUIRED:
                          present[rel] = bool(scalar(cur, 'SELECT to_regclass(%s) IS NOT NULL', [rel]))
                      any_present = any(present.values())
                      all_present = all(present.values())
                      missing = [rel for rel, ok in present.items() if not ok]

                      migrations_table = bool(scalar(cur, "SELECT to_regclass('public.django_migrations') IS NOT NULL"))
                      dep = False
                      mig = False
                      if migrations_table:
                          dep = bool(scalar(cur, 'SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)', [APP, DEP]))
                          mig = bool(scalar(cur, 'SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)', [APP, MIG]))

                      access_exists = bool(scalar(cur, "SELECT to_regclass('ops.contract_document_access_requests') IS NOT NULL"))
                      access_missing_cols = []
                      if access_exists:
                          cur.execute("""
                              SELECT column_name
                                FROM information_schema.columns
                               WHERE table_schema='ops' AND table_name='contract_document_access_requests'
                          """)
                          access_cols = {r[0] for r in cur.fetchall()}
                          expected_access = {
                              'id', 'contract_id', 'requester_employee_id', 'reason', 'status',
                              'reviewed_by_employee_id', 'requested_at', 'reviewed_at'
                          }
                          access_missing_cols = sorted(expected_access - access_cols)

                      dept_missing_cols = []
                      dept_extra_required = []
                      missing_departments = None
                      create_ops = None
                      insert_dept = None
                      insert_migrations = None
                      uuid_fn = bool(scalar(cur, "SELECT to_regprocedure('gen_random_uuid()') IS NOT NULL"))

                      if present.get('hr.departments'):
                          cur.execute("""
                              SELECT column_name, is_nullable, column_default, is_identity
                                FROM information_schema.columns
                               WHERE table_schema='hr' AND table_name='departments'
                          """)
                          dept_rows = cur.fetchall()
                          dept_cols = {r[0] for r in dept_rows}
                          dept_missing_cols = sorted({'org_unit_id', 'name', 'active'} - dept_cols)
                          dept_extra_required = sorted(
                              r[0] for r in dept_rows
                              if r[1] == 'NO' and r[2] is None and r[3] != 'YES'
                              and r[0] not in {'org_unit_id', 'name', 'active'}
                          )
                          insert_dept = bool(scalar(cur, "SELECT has_table_privilege(current_user, 'hr.departments', 'INSERT')"))

                      if present.get('ops.my_org_units') and present.get('hr.departments') and not dept_missing_cols:
                          missing_departments = int(scalar(cur, """
                              SELECT COUNT(*)
                                FROM ops.my_org_units o
                                CROSS JOIN (VALUES ('관리부'), ('GIS사업부'), ('지적사업부')) seed(name)
                               WHERE NOT EXISTS (
                                   SELECT 1 FROM hr.departments d
                                    WHERE d.org_unit_id=o.id AND d.name=seed.name
                               )
                          """))

                      if bool(scalar(cur, "SELECT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='ops')")):
                          create_ops = bool(scalar(cur, "SELECT has_schema_privilege(current_user, 'ops', 'CREATE')"))
                      if migrations_table:
                          insert_migrations = bool(scalar(cur, "SELECT has_table_privilege(current_user, 'django_migrations', 'INSERT')"))

                      if not any_present:
                          classification = 'schema_absent'
                      elif not all_present:
                          classification = 'partial_schema'
                      elif not dep:
                          classification = 'dependency_0023_missing'
                      elif mig:
                          classification = 'already_applied'
                      elif not uuid_fn:
                          classification = 'gen_random_uuid_missing'
                      elif create_ops is False or insert_dept is False or insert_migrations is False:
                          classification = 'insufficient_db_privilege'
                      elif dept_missing_cols or dept_extra_required:
                          classification = 'departments_shape_incompatible'
                      elif access_exists and access_missing_cols:
                          classification = 'preexisting_access_table_incompatible'
                      else:
                          classification = 'prerequisites_look_compatible'

                      print(
                          'phase4_diag_tenant=' + label
                          + f' classification={classification}'
                          + f' dep0023={str(dep).lower()} mig0024={str(mig).lower()}'
                          + f' access_table={str(access_exists).lower()}'
                          + f' missing_relations={"|".join(missing) if missing else "-"}'
                          + f' dept_missing_cols={"|".join(dept_missing_cols) if dept_missing_cols else "-"}'
                          + f' dept_extra_required={"|".join(dept_extra_required) if dept_extra_required else "-"}'
                          + f' access_missing_cols={"|".join(access_missing_cols) if access_missing_cols else "-"}'
                          + f' missing_departments={missing_departments if missing_departments is not None else "-"}'
                          + f' create_ops={create_ops if create_ops is not None else "-"}'
                          + f' insert_departments={insert_dept if insert_dept is not None else "-"}'
                          + f' insert_migrations={insert_migrations if insert_migrations is not None else "-"}'
                      )
                  conn.rollback()
              except Exception as exc:
                  conn.rollback()
                  msg = ' '.join(str(exc).split())[:240]
                  print(f'phase4_diag_tenant={label} classification=diagnostic_query_failed error={exc.__class__.__name__} message={msg}')
              finally:
                  conn.close()

          print('phase4_diag_complete=yes')
          PY
          REMOTE
