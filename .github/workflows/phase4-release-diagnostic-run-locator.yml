name: Phase 4 release diagnostic run locator

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  locate:
    if: github.event.issue.title == '[phase4-cheonan-rollback-probe-locate]'
    runs-on: ubuntu-latest
    steps:
      - name: Locate cheonan rollback probe run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='f2132dd83e87f717adfeba65eac0dfa3c94ed175'
          runs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/workflows/phase4-cheonan-rollback-probe.yml/runs?event=push&per_page=20")"
          row="$(printf '%s' "$runs" | jq -c --arg sha "$expected_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.id) | reverse | .[0] // empty')"
          test -n "$row" || { echo 'phase4_cheonan_probe_locator=no_matching_run'; exit 2; }
          run_id="$(printf '%s' "$row" | jq -r '.id')"
          run_number="$(printf '%s' "$row" | jq -r '.run_number')"
          status="$(printf '%s' "$row" | jq -r '.status')"
          conclusion="$(printf '%s' "$row" | jq -r '.conclusion // "none"')"
          actor="$(printf '%s' "$row" | jq -r '.actor.login // "unknown"')"
          pending="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/pending_deployments" || printf '[]')"
          env_name="$(printf '%s' "$pending" | jq -r '.[0].environment.name // "none"')"
          reviewers="$(printf '%s' "$pending" | jq -r '[.[0].reviewers[]? | (.type + ":" + (.reviewer.login // .reviewer.name // "unknown"))] | join(",")')"
          body="phase4_cheonan_probe_locator run_id=${run_id} run_number=${run_number} expected_sha=${expected_sha} status=${status} conclusion=${conclusion} actor=${actor} pending_env=${env_name} reviewers=${reviewers:-none}"
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/158/comments" -f body="$body" >/dev/null
          gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" -f body="$body" >/dev/null
