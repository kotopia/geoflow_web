name: Temporary contract list API production activate

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/temp-contract-list-api-production-activate.yml
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed release/stabilized-deploy commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-temp-contract-activation-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,geoflow.co.kr
      CENTRAL_DB_NAME: ci-central
      CENTRAL_DB_USER: ci-central-user
      CENTRAL_DB_PASSWORD: ci-nonsecret-placeholder
      CENTRAL_DB_HOST: central.example.internal
      CENTRAL_DB_PORT: "5432"
      TENANT_DB_NAME: ci-tenant
      TENANT_DB_USER: ci-tenant-user
      TENANT_DB_PASSWORD: ci-nonsecret-placeholder
      TENANT_DB_HOST: tenant.example.internal
      TENANT_DB_PORT: "5432"
      ENABLE_TENANT_PROVISIONING: "0"
      AWS_REGION: ap-northeast-2
      SITE_ORIGIN: https://geoflow.co.kr
      TEMP_CONTRACT_LIST_API_ENABLED: "0"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/stabilized-deploy
          fetch-depth: 0

      - name: Validate exact release and activation contract
        shell: bash
        env:
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = 'release/stabilized-deploy'
          test "$(git rev-parse HEAD)" = "$REQUESTED_RELEASE_SHA"
          test -f geoflow_ops/temp_contract_list_api.py
          grep -Fq 'api/temp/contracts/' geoflow_ops/urls.py
          grep -Fq 'TEMP_CONTRACT_LIST_GROUP_CODE' geoflow_ops/temp_contract_list_api.py
          grep -Fq 'X-GeoFlow-Temp-Key' geoflow_ops/temp_contract_list_api.py
          echo "temp_contract_activation_reviewed_sha=$REQUESTED_RELEASE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate temporary API tests
        shell: bash
        run: |
          set -euo pipefail
          python manage.py check
          python manage.py test geoflow_ops.test_temp_contract_list_api

  activate-production:
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"
      TEMP_API_KEY: ${{ secrets.TEMP_CONTRACT_LIST_API_KEY }}
      REQUESTED_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      TARGET_GROUP_CODE: cheonan
      TARGET_DB_ALIAS: cheonan_db

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/stabilized-deploy
          fetch-depth: 0

      - name: Validate protected activation inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_RELEASE_SHA"
          test "$TARGET_GROUP_CODE" = 'cheonan'
          test "$TARGET_DB_ALIAS" = 'cheonan_db'
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$TEMP_API_KEY" || {
            echo 'temp_contract_activation_blocker=production_api_key_secret_missing'
            exit 2
          }
          [ "${#TEMP_API_KEY}" -ge 32 ] || {
            echo 'temp_contract_activation_blocker=production_api_key_secret_too_short'
            exit 2
          }
          echo 'temp_contract_activation_inputs=yes'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Activate exact tenant with rollback and secret cleanup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          local_key="$RUNNER_TEMP/temp_contract_api_key"
          remote_key="/tmp/geoflow-temp-contract-api-key-$GITHUB_RUN_ID"
          printf '%s' "$TEMP_API_KEY" > "$local_key"
          chmod 600 "$local_key"

          cleanup_runner_and_remote() {
            rm -f "$local_key"
            ssh \
              -i "$HOME/.ssh/geoflow_deploy_key" \
              -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              "$SSH_USER@$SSH_HOST" "rm -f '$remote_key'" >/dev/null 2>&1 || true
          }
          trap cleanup_runner_and_remote EXIT

          scp \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$local_key" \
            "$SSH_USER@$SSH_HOST:$remote_key"

          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$REQUESTED_RELEASE_SHA' '$GITHUB_RUN_ID' '$TARGET_GROUP_CODE' '$TARGET_DB_ALIAS' '$remote_key'" <<'REMOTE'
          set -euo pipefail

          reviewed_sha="$1"
          run_id="$2"
          target_group_code="$3"
          target_db_alias="$4"
          key_file="$5"
          service='geoflow-stabilized.service'
          expected_branch='release/stabilized-deploy'
          response_file="/tmp/geoflow-temp-contract-api-response-$run_id.json"
          backup_env=''
          mutation_started=no
          success=no

          fail() {
            echo "temp_contract_activation_blocker=$1"
            exit 2
          }

          wait_for_login() {
            local ready=no
            for attempt in $(seq 1 20); do
              active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
              sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
              code="$(curl -sS -H 'Host: geoflow.co.kr' -H 'X-Forwarded-Proto: https' -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/login/ 2>/dev/null || true)"
              echo "temp_contract_activation_health attempt=$attempt active=$active sub=$sub code=$code"
              if [ "$active" = 'active' ] && [ "$sub" = 'running' ]; then
                case "$code" in 2??|3??) ready=yes; break ;; esac
              fi
              sleep 2
            done
            [ "$ready" = yes ]
          }

          restore_env() {
            if [ "$mutation_started" = yes ] && [ -n "$backup_env" ] && [ -f "$backup_env" ]; then
              cp -p "$backup_env" "$repo/.env" || true
              sudo -n systemctl restart "$service" || true
              wait_for_login || true
              restored_code="$(curl -sS -H 'Host: geoflow.co.kr' -H 'X-Forwarded-Proto: https' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/api/temp/contracts/ 2>/dev/null || true)"
              echo "temp_contract_activation_rollback_api_code=$restored_code"
            fi
          }

          cleanup_remote() {
            if [ "$success" != yes ]; then
              restore_env
            fi
            rm -f "$key_file" "$response_file"
            if [ -n "$backup_env" ]; then
              rm -f "$backup_env"
            fi
          }
          trap cleanup_remote EXIT

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'
          [ -f "$key_file" ] || fail 'staged_api_key_missing'
          api_key="$(cat "$key_file")"
          [ "${#api_key}" -ge 32 ] || fail 'staged_api_key_invalid'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'service_not_running_before_activation'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          [ "$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')" = '0' ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'venv_python_missing'

          git -C "$repo" fetch --prune origin "refs/heads/$expected_branch"
          [ "$(git -C "$repo" rev-parse FETCH_HEAD)" = "$reviewed_sha" ] || fail 'reviewed_release_not_current_head'
          git -C "$repo" cat-file -e "$reviewed_sha:geoflow_ops/temp_contract_list_api.py" || fail 'reviewed_api_missing'
          git -C "$repo" merge-base --is-ancestor "$(git -C "$repo" rev-parse HEAD)" "$reviewed_sha" || fail 'production_head_not_ancestor_of_reviewed_release'
          grep -Fq 'api/temp/contracts/' "$repo/geoflow_ops/urls.py" || fail 'production_api_route_missing'

          before_api_code="$(curl -sS -H 'Host: geoflow.co.kr' -H 'X-Forwarded-Proto: https' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/api/temp/contracts/ 2>/dev/null || true)"
          [ "$before_api_code" = '404' ] || fail 'temporary_api_not_disabled_before_activation'

          cd "$repo"
          TARGET_GROUP_CODE="$target_group_code" TARGET_DB_ALIAS="$target_db_alias" "$python" - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'geoflow_project.settings')
          os.environ['TEMP_CONTRACT_LIST_GROUP_CODE'] = os.environ['TARGET_GROUP_CODE']

          import django
          django.setup()

          from django.db import connections, transaction
          from geoflow_ops.models import Contract
          from geoflow_ops.temp_contract_list_api import _ensure_configured_tenant_connection

          alias = _ensure_configured_tenant_connection()
          if alias != os.environ['TARGET_DB_ALIAS']:
              raise SystemExit('target db alias mismatch')

          with transaction.atomic(using=alias):
              with connections[alias].cursor() as cur:
                  cur.execute('SET LOCAL TRANSACTION READ ONLY')
                  count = Contract.objects.using(alias).count()
          print(f'temp_contract_activation_preflight_contract_count={count}')
          PY

          backup_env="$(mktemp /tmp/geoflow-env-backup.XXXXXX)"
          chmod 600 "$backup_env"
          cp -p "$repo/.env" "$backup_env"

          ENV_FILE="$repo/.env" API_KEY_FILE="$key_file" TARGET_GROUP_CODE="$target_group_code" "$python" - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(os.environ['ENV_FILE'])
          key_path = Path(os.environ['API_KEY_FILE'])
          group_code = os.environ['TARGET_GROUP_CODE']
          api_key = key_path.read_text(encoding='utf-8')
          if len(api_key) < 32:
              raise SystemExit('invalid api key')

          replacements = {
              'TEMP_CONTRACT_LIST_API_ENABLED': '1',
              'TEMP_CONTRACT_LIST_GROUP_CODE': group_code,
              'TEMP_CONTRACT_LIST_API_KEY': api_key,
          }
          original = env_path.read_text(encoding='utf-8')
          output = []
          seen = set()
          for line in original.splitlines():
              stripped = line.lstrip()
              replaced = False
              for key, value in replacements.items():
                  if stripped.startswith(key + '='):
                      output.append(f'{key}={value}')
                      seen.add(key)
                      replaced = True
                      break
              if not replaced:
                  output.append(line)
          for key, value in replacements.items():
              if key not in seen:
                  output.append(f'{key}={value}')
          env_path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          mutation_started=yes

          if ! sudo -n systemctl restart "$service"; then
            fail 'service_restart_failed'
          fi
          wait_for_login || fail 'login_unhealthy_after_activation'

          no_key_code="$(curl -sS -H 'Host: geoflow.co.kr' -H 'X-Forwarded-Proto: https' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/api/temp/contracts/ 2>/dev/null || true)"
          [ "$no_key_code" = '403' ] || fail 'missing_key_not_forbidden'

          invalid_key_code="$(curl -sS -H 'Host: geoflow.co.kr' -H 'X-Forwarded-Proto: https' -H 'X-GeoFlow-Temp-Key: definitely-invalid-key' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/api/temp/contracts/ 2>/dev/null || true)"
          [ "$invalid_key_code" = '403' ] || fail 'invalid_key_not_forbidden'

          api_code="$(curl -sS -H 'Host: geoflow.co.kr' -H 'X-Forwarded-Proto: https' -H "X-GeoFlow-Temp-Key: $api_key" -o "$response_file" -w '%{http_code}' --connect-timeout 5 --max-time 30 http://127.0.0.1:8011/api/temp/contracts/ 2>/dev/null || true)"
          [ "$api_code" = '200' ] || fail 'authorized_api_not_healthy'
          chmod 600 "$response_file"

          RESPONSE_FILE="$response_file" "$python" - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ['RESPONSE_FILE']).read_text(encoding='utf-8'))
          if not isinstance(payload, list):
              raise SystemExit('response is not a list')
          print(f'temp_contract_activation_api_rows={len(payload)}')
          PY

          success=yes
          rm -f "$backup_env"
          backup_env=''
          echo 'temp_contract_activation_complete=yes'
          echo "temp_contract_activation_group_code=$target_group_code"
          echo "temp_contract_activation_db_alias=$target_db_alias"
          REMOTE
