name: Phase 1 signup recipient probe

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-signup-recipient-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signup-recipient-probe:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      TARGET_EMAIL_SHA256: e1b8b40b9a712fb8de657d6adc788db895f0487543b1b22a22bd3b0005458035

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Probe signup recipient without sending mail
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
            "TARGET_EMAIL_SHA256='$TARGET_EMAIL_SHA256' bash -s" <<'REMOTE'
          set -euo pipefail
          service='geoflow-stabilized.service'
          workdir="$(systemctl show "$service" -p WorkingDirectory --value)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel)"
          python="$repo/.venv/bin/python"
          cd "$repo"
          TARGET_EMAIL_SHA256="$TARGET_EMAIL_SHA256" DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import hashlib
          import os
          import smtplib
          import ssl
          import django
          django.setup()
          from django.conf import settings
          from django.db import connections

          target_hash = os.environ['TARGET_EMAIL_SHA256']
          recipient = None
          with connections['default'].cursor() as cur:
              cur.execute('BEGIN READ ONLY')
              try:
                  cur.execute("SELECT email FROM users WHERE created_at >= now() - interval '7 days' ORDER BY created_at DESC LIMIT 1000")
                  matches = []
                  for (email,) in cur.fetchall():
                      normalized = (email or '').strip().lower()
                      if hashlib.sha256(normalized.encode()).hexdigest() == target_hash:
                          matches.append(normalized)
                  print(f'signup_recipient_match_count={len(matches)}')
                  if len(matches) != 1:
                      raise SystemExit(3)
                  recipient = matches[0]
              finally:
                  cur.execute('ROLLBACK')

          sender = (os.environ.get('DEFAULT_FROM_EMAIL') or '').strip() or str(getattr(settings, 'DEFAULT_FROM_EMAIL', '') or '').strip()
          host = str(getattr(settings, 'EMAIL_HOST', '') or '').strip()
          port = int(getattr(settings, 'EMAIL_PORT', 0) or 0)
          user = str(getattr(settings, 'EMAIL_HOST_USER', '') or '').strip()
          password = str(getattr(settings, 'EMAIL_HOST_PASSWORD', '') or '')
          use_tls = bool(getattr(settings, 'EMAIL_USE_TLS', False))

          if not recipient or not sender or host != 'smtp.naver.com' or port != 587 or not user or not password or not use_tls:
              print('signup_recipient_probe_result=config_not_ready')
              raise SystemExit(2)

          with smtplib.SMTP(host, port, timeout=20) as client:
              client.ehlo()
              client.starttls(context=ssl.create_default_context())
              client.ehlo()
              client.login(user, password)
              print('signup_recipient_smtp_auth=ready')
              mail_code, _ = client.mail(sender)
              print(f'signup_recipient_mail_from_code={mail_code}')
              rcpt_code, _ = client.rcpt(recipient)
              print(f'signup_recipient_rcpt_code={rcpt_code}')
              client.rset()

          print('signup_recipient_probe_sent_mail=no')
          print('signup_recipient_probe_result=complete')
          PY
          REMOTE
