name: Phase 2 AWS role-only runtime cutover

on:
  workflow_dispatch:
    inputs:
      confirm_cutover:
        description: Type ROLE_ONLY_CUTOVER to confirm the guarded production cutover
        required: true
        type: string
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"
        type: string

permissions:
  contents: read

jobs:
  role-only-runtime-cutover:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}
      CONFIRM_CUTOVER: ${{ inputs.confirm_cutover }}

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate reviewed cutover inputs and files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$CONFIRM_CUTOVER" = "ROLE_ONLY_CUTOVER" || { echo 'phase2_cutover_blocker=confirmation_mismatch'; exit 2; }
          test -n "$SSH_HOST" || { echo 'phase2_cutover_blocker=missing_ssh_host'; exit 2; }
          test -n "$SSH_USER" || { echo 'phase2_cutover_blocker=missing_ssh_user'; exit 2; }
          test -n "$SSH_KEY" || { echo 'phase2_cutover_blocker=missing_ssh_key'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'phase2_cutover_blocker=missing_known_hosts'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'phase2_cutover_blocker=invalid_ssh_port'; exit 2; }
          python -m py_compile \
            control/services/object_storage_runtime_preflight.py \
            scripts/ops/phase2_role_runtime_probe.py
          test "$(git hash-object control/services/object_storage_runtime_preflight.py)" = "9076b9f5f1d4ddac964b5f8e27be0834f31bb070" || {
            echo 'phase2_cutover_blocker=reviewed_guard_blob_changed'; exit 2;
          }
          test "$(git hash-object scripts/ops/phase2_role_runtime_probe.py)" = "a5298148bcb711a237335b5fa7bbcc76b78d8d2e" || {
            echo 'phase2_cutover_blocker=reviewed_probe_blob_changed'; exit 2;
          }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Stage reviewed role guard and probe
        shell: bash
        run: |
          set -euo pipefail
          remote_guard="/tmp/geoflow-phase2-role-guard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          remote_probe="/tmp/geoflow-phase2-role-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          scp -q -i "$HOME/.ssh/geoflow_deploy_key" -P "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            control/services/object_storage_runtime_preflight.py \
            "$SSH_USER@$SSH_HOST:$remote_guard"
          scp -q -i "$HOME/.ssh/geoflow_deploy_key" -P "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/ops/phase2_role_runtime_probe.py \
            "$SSH_USER@$SSH_HOST:$remote_probe"
          echo "REMOTE_GUARD=$remote_guard" >> "$GITHUB_ENV"
          echo "REMOTE_PROBE=$remote_probe" >> "$GITHUB_ENV"

      - name: Apply guarded role-only runtime cutover
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
            "REMOTE_GUARD='$REMOTE_GUARD' REMOTE_PROBE='$REMOTE_PROBE' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077

          service='geoflow-stabilized.service'
          expected_guard_base_blob='c5543bf2dace16c4227ffcef7512e6c4da6bb3c5'
          expected_guard_cutover_blob='9076b9f5f1d4ddac964b5f8e27be0834f31bb070'
          expected_probe_blob='a5298148bcb711a237335b5fa7bbcc76b78d8d2e'
          expected_secret_resolver_blob='e36057251ce9e38fa7ea5cf4a7058eeafbc2f171'
          expected_s3_service_blob='ba61bf02cfea81e3fd0a29e1a2730bf265054c4c'
          fail() { echo "phase2_cutover_blocker=$1"; exit 2; }
          run_clean_aws_env() {
            env \
              -u AWS_ACCESS_KEY_ID \
              -u AWS_SECRET_ACCESS_KEY \
              -u AWS_SESSION_TOKEN \
              -u AWS_PROFILE \
              -u AWS_DEFAULT_PROFILE \
              -u AWS_SHARED_CREDENTIALS_FILE \
              -u AWS_CONFIG_FILE \
              -u AWS_EC2_METADATA_DISABLED \
              "$@"
          }

          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'
          [ -s "$REMOTE_GUARD" ] || fail 'staged_guard_missing'
          [ -s "$REMOTE_PROBE" ] || fail 'staged_probe_missing'
          [ "$(git hash-object "$REMOTE_GUARD")" = "$expected_guard_cutover_blob" ] || fail 'staged_guard_not_reviewed'
          [ "$(git hash-object "$REMOTE_PROBE")" = "$expected_probe_blob" ] || fail 'staged_probe_not_reviewed'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running_before_cutover'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'runtime_repo_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'runtime_python_missing'

          guard_file="$repo/control/services/object_storage_runtime_preflight.py"
          secret_resolver="$repo/control/services/tenant_db_secret_resolver.py"
          s3_service="$repo/geoflow_ops/services/s3_service.py"
          [ -f "$guard_file" ] || fail 'runtime_guard_file_missing'
          [ -f "$secret_resolver" ] || fail 'runtime_secret_resolver_missing'
          [ -f "$s3_service" ] || fail 'runtime_s3_service_missing'
          [ "$(git -C "$repo" hash-object "$secret_resolver")" = "$expected_secret_resolver_blob" ] || fail 'runtime_secret_resolver_not_reviewed'
          [ "$(git -C "$repo" hash-object "$s3_service")" = "$expected_s3_service_blob" ] || fail 'runtime_s3_service_not_reviewed'
          current_guard_blob="$(git -C "$repo" hash-object "$guard_file")"
          case "$current_guard_blob" in
            "$expected_guard_base_blob"|"$expected_guard_cutover_blob") ;;
            *) fail 'runtime_guard_file_diverged' ;;
          esac

          # Never echo the systemd Environment value; it may contain credentials.
          service_environment="$(systemctl show "$service" -p Environment --value 2>/dev/null || true)"
          if printf '%s' "$service_environment" | grep -Eq '(^|[[:space:]"])(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_PROFILE|AWS_DEFAULT_PROFILE|AWS_SHARED_CREDENTIALS_FILE|AWS_CONFIG_FILE|AWS_EC2_METADATA_DISABLED)='; then
            fail 'systemd_direct_aws_credential_source_present'
          fi
          unset service_environment

          # Inspect EnvironmentFile directives without printing paths or contents. The
          # repository .env is allowed because this cutover edits that exact file.
          unit_dump="$(mktemp)"
          systemctl cat "$service" > "$unit_dump" 2>/dev/null || fail 'systemd_unit_read_failed'
          unit_rc=0
          "$python" - "$unit_dump" "$repo/.env" <<'PY' || unit_rc=$?
          import re
          import shlex
          import sys
          from pathlib import Path

          unit_path = Path(sys.argv[1])
          allowed_env = Path(sys.argv[2]).resolve()
          forbidden = re.compile(
              r"^\s*(?:export\s+)?(?:AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_PROFILE|AWS_DEFAULT_PROFILE|AWS_SHARED_CREDENTIALS_FILE|AWS_CONFIG_FILE|AWS_EC2_METADATA_DISABLED)\s*="
          )
          for raw in unit_path.read_text(errors="replace").splitlines():
              line = raw.strip()
              if not line.startswith("EnvironmentFile="):
                  continue
              spec = line.split("=", 1)[1].strip()
              try:
                  items = shlex.split(spec)
              except ValueError:
                  raise SystemExit(3)
              for item in items:
                  optional = item.startswith("-")
                  candidate = item[1:] if optional else item
                  if not candidate or any(ch in candidate for ch in ("%", "*", "?", "[")):
                      raise SystemExit(3)
                  path = Path(candidate)
                  if not path.is_absolute():
                      raise SystemExit(3)
                  try:
                      resolved = path.resolve()
                  except OSError:
                      raise SystemExit(3)
                  if resolved == allowed_env:
                      continue
                  if not resolved.is_file():
                      if optional:
                          continue
                      raise SystemExit(3)
                  for env_line in resolved.read_text(errors="replace").splitlines():
                      if forbidden.match(env_line):
                          raise SystemExit(4)
          print("phase2_cutover_systemd_environment_files_safe=yes")
          PY
          rm -f "$unit_dump"
          [ "$unit_rc" -eq 0 ] || fail 'systemd_environment_file_not_safe'

          cd "$repo"
          "$python" "$REMOTE_PROBE" "$repo" precutover
          echo 'phase2_cutover_precheck_complete=yes'

          env_backup="$(mktemp "$repo/.env.phase2-role-backup.XXXXXX")"
          guard_backup="$(mktemp "$repo/control/services/.object-storage-preflight-backup.XXXXXX")"
          cp -p "$repo/.env" "$env_backup"
          cp -p "$guard_file" "$guard_backup"
          mutation_started=0

          rollback() {
            set +e
            if [ "$mutation_started" -eq 1 ]; then
              [ -f "$env_backup" ] && cp -p "$env_backup" "$repo/.env"
              [ -f "$guard_backup" ] && cp -p "$guard_backup" "$guard_file"
              sudo -n systemctl restart "$service" >/dev/null 2>&1 || true
              sleep 2
            fi
            rm -f "$env_backup" "$guard_backup" "$REMOTE_GUARD" "$REMOTE_PROBE"
            echo 'phase2_cutover_rollback_completed=yes'
          }
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$mutation_started" -eq 1 ]; then
              rollback
            else
              rm -f "$env_backup" "$guard_backup" "$REMOTE_GUARD" "$REMOTE_PROBE"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          mutation_started=1
          cp -p "$REMOTE_GUARD" "$guard_file"
          "$python" -m py_compile "$guard_file"

          "$python" - "$repo/.env" <<'PY'
          import os
          import sys
          from pathlib import Path

          env_path = Path(sys.argv[1])
          remove = {
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_SESSION_TOKEN",
              "AWS_PROFILE",
              "AWS_DEFAULT_PROFILE",
              "AWS_SHARED_CREDENTIALS_FILE",
              "AWS_CONFIG_FILE",
              "AWS_EC2_METADATA_DISABLED",
          }
          out = []
          for line in env_path.read_text().splitlines():
              stripped = line.lstrip()
              if stripped.startswith("#") or "=" not in line:
                  out.append(line)
                  continue
              key = line.split("=", 1)[0].strip()
              if key in remove or key == "AWS_REQUIRE_ROLE_CREDENTIALS":
                  continue
              out.append(line)
          out.append("AWS_REQUIRE_ROLE_CREDENTIALS=1")
          tmp = env_path.with_name(env_path.name + ".phase2-role.tmp")
          tmp.write_text("\n".join(out) + "\n")
          os.chmod(tmp, 0o600)
          os.replace(tmp, env_path)
          print("phase2_cutover_runtime_env_updated=yes")
          PY

          run_clean_aws_env "$python" manage.py check_release_preflight --strict >/dev/null
          sudo -n systemctl restart "$service"
          sleep 3
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running_after_cutover'

          # Remove SSH-shell credential sources so this validates the updated .env plus
          # EC2/container role rather than the operator's shell profile.
          run_clean_aws_env "$python" "$REMOTE_PROBE" "$repo" postcutover

          login_get="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://geoflow.co.kr/login/)"
          echo "phase2_cutover_public_login_get=$login_get"
          [ "$login_get" = 200 ] || fail 'public_login_not_200_after_cutover'

          mutation_started=0
          rm -f "$env_backup" "$guard_backup" "$REMOTE_GUARD" "$REMOTE_PROBE"
          trap - EXIT
          echo 'phase2_cutover_s3_put_probe=not_performed'
          echo 'phase2_role_only_runtime_cutover_complete=yes'
          REMOTE
