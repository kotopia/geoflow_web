name: Phase 2 AWS role-only runtime cutover

on:
  workflow_dispatch:
    inputs:
      confirm_cutover:
        description: Type ROLE_ONLY_CUTOVER to confirm the guarded production cutover
        required: true
        type: string
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"
        type: string

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  role-only-runtime-cutover:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate temporary owner-approved relay
        env:
          CONFIRM_CUTOVER: ${{ inputs.confirm_cutover }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_CUTOVER" = "ROLE_ONLY_CUTOVER" || {
            echo 'phase4_breakglass_relay_blocker=confirmation_mismatch'
            exit 2
          }
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/issues/158/comments" \
            -f body="phase4_breakglass_relay_started
run_id=${GITHUB_RUN_ID}
ref=${GITHUB_REF_NAME}
sha=${GITHUB_SHA}" >/dev/null
          echo 'phase4_breakglass_relay_validated=yes'

      - name: Dispatch owner-approved Phase 4 activation from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"report_issue":"158"}}'
          if printf '%s' "$payload" | gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --input - \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/phase4-owner-approved-breakglass-main.yml/dispatches"; then
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/issues/158/comments" \
              -f body="phase4_breakglass_relay_dispatched
run_id=${GITHUB_RUN_ID}" >/dev/null
            echo 'phase4_breakglass_relay_dispatched=yes'
          else
            rc=$?
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/issues/158/comments" \
              -f body="phase4_breakglass_relay_failed
run_id=${GITHUB_RUN_ID}
exit_code=${rc}" >/dev/null || true
            exit "$rc"
          fi
