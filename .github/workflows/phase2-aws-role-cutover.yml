name: Phase 2 AWS role-only runtime cutover

on:
  workflow_dispatch:
    inputs:
      confirm_cutover:
        description: Type ROLE_ONLY_CUTOVER to confirm the guarded production cutover
        required: true
        type: string
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"
        type: string

permissions:
  contents: read

jobs:
  role-only-runtime-cutover:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}
      CONFIRM_CUTOVER: ${{ inputs.confirm_cutover }}

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate reviewed cutover inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$CONFIRM_CUTOVER" = "ROLE_ONLY_CUTOVER" || { echo 'phase2_cutover_blocker=confirmation_mismatch'; exit 2; }
          test -n "$SSH_HOST" || { echo 'phase2_cutover_blocker=missing_ssh_host'; exit 2; }
          test -n "$SSH_USER" || { echo 'phase2_cutover_blocker=missing_ssh_user'; exit 2; }
          test -n "$SSH_KEY" || { echo 'phase2_cutover_blocker=missing_ssh_key'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'phase2_cutover_blocker=missing_known_hosts'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'phase2_cutover_blocker=invalid_ssh_port'; exit 2; }
          python -m py_compile control/services/object_storage_runtime_preflight.py
          test "$(git hash-object control/services/object_storage_runtime_preflight.py)" = "602fd0c6dc2b2ba8180837a5413aac16e0e55c6e" || {
            echo 'phase2_cutover_blocker=reviewed_guard_blob_changed'
            exit 2
          }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Stage reviewed role-only guard
        shell: bash
        run: |
          set -euo pipefail
          remote_stage="/tmp/geoflow-phase2-role-guard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          scp -q \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            control/services/object_storage_runtime_preflight.py \
            "$SSH_USER@$SSH_HOST:$remote_stage"
          echo "REMOTE_STAGE=$remote_stage" >> "$GITHUB_ENV"

      - name: Apply guarded role-only runtime cutover
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "REMOTE_STAGE='$REMOTE_STAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077

          service='geoflow-stabilized.service'
          expected_guard_base_blob='c5543bf2dace16c4227ffcef7512e6c4da6bb3c5'
          expected_guard_cutover_blob='602fd0c6dc2b2ba8180837a5413aac16e0e55c6e'
          expected_secret_resolver_blob='e36057251ce9e38fa7ea5cf4a7058eeafbc2f171'
          expected_s3_service_blob='ba61bf02cfea81e3fd0a29e1a2730bf265054c4c'
          fail() { echo "phase2_cutover_blocker=$1"; exit 2; }

          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'
          [ -s "$REMOTE_STAGE" ] || fail 'staged_guard_missing'
          [ "$(git hash-object "$REMOTE_STAGE")" = "$expected_guard_cutover_blob" ] || fail 'staged_guard_not_reviewed'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running_before_cutover'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'runtime_repo_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'runtime_python_missing'

          guard_file="$repo/control/services/object_storage_runtime_preflight.py"
          secret_resolver="$repo/control/services/tenant_db_secret_resolver.py"
          s3_service="$repo/geoflow_ops/services/s3_service.py"
          [ -f "$guard_file" ] || fail 'runtime_guard_file_missing'
          [ -f "$secret_resolver" ] || fail 'runtime_secret_resolver_missing'
          [ -f "$s3_service" ] || fail 'runtime_s3_service_missing'
          [ "$(git -C "$repo" hash-object "$secret_resolver")" = "$expected_secret_resolver_blob" ] || fail 'runtime_secret_resolver_not_reviewed'
          [ "$(git -C "$repo" hash-object "$s3_service")" = "$expected_s3_service_blob" ] || fail 'runtime_s3_service_not_reviewed'

          current_guard_blob="$(git -C "$repo" hash-object "$guard_file")"
          case "$current_guard_blob" in
            "$expected_guard_base_blob"|"$expected_guard_cutover_blob") ;;
            *) fail 'runtime_guard_file_diverged' ;;
          esac

          cd "$repo"

          # Read-only fail-closed readiness probe. It deliberately removes static/profile
          # credential sources only inside this Python process and never prints identifiers.
          DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import os
          import django

          django.setup()

          for name in (
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_SESSION_TOKEN",
              "AWS_PROFILE",
              "AWS_DEFAULT_PROFILE",
              "AWS_SHARED_CREDENTIALS_FILE",
              "AWS_CONFIG_FILE",
          ):
              os.environ.pop(name, None)
          os.environ.pop("AWS_EC2_METADATA_DISABLED", None)

          import boto3
          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              TenantDBCredentialError,
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          region = str(os.environ.get("AWS_REGION") or "ap-northeast-2").strip()
          session = boto3.Session(region_name=region)
          credentials = session.get_credentials()
          if credentials is None:
              print("phase2_cutover_role_credentials=no")
              raise SystemExit(2)
          method = str(getattr(credentials, "method", "") or "unknown")
          role_method = method in {"iam-role", "container-role"}
          print("phase2_cutover_role_credentials=" + ("yes" if role_method else "no"))
          if not role_method:
              raise SystemExit(2)

          configs = list(
              GroupDBConfig.objects.select_related("group")
              .filter(group__status="active")
              .only("db_password")
          )
          print(f"phase2_cutover_active_tenant_configs={len(configs)}")
          if not configs:
              raise SystemExit(2)

          sm = session.client("secretsmanager", region_name=region)
          resolved_count = 0
          non_reference_count = 0
          failed_count = 0
          for config in configs:
              stored = str(config.db_password or "").strip()
              if not is_tenant_db_secret_reference(stored):
                  non_reference_count += 1
                  continue
              try:
                  value = resolve_tenant_db_password(stored, environ=os.environ, client=sm)
                  if value:
                      resolved_count += 1
                  else:
                      failed_count += 1
              except TenantDBCredentialError:
                  failed_count += 1
          print(f"phase2_cutover_secret_refs_resolved={resolved_count}")
          print(f"phase2_cutover_non_reference_tenant_configs={non_reference_count}")
          print(f"phase2_cutover_secret_resolution_failures={failed_count}")
          if non_reference_count or failed_count or resolved_count != len(configs):
              raise SystemExit(2)

          bucket = str(os.environ.get("AWS_S3_BUCKET") or "").strip()
          if not bucket:
              print("phase2_cutover_s3_configured=no")
              raise SystemExit(2)
          s3 = session.client("s3", region_name=region)
          try:
              s3.head_bucket(Bucket=bucket)
              listed = s3.list_objects_v2(Bucket=bucket, Prefix="tenants/", MaxKeys=1)
              contents = listed.get("Contents") or []
              if contents:
                  key = str(contents[0].get("Key") or "")
                  if key:
                      response = s3.get_object(Bucket=bucket, Key=key, Range="bytes=0-0")
                      body = response.get("Body")
                      if body is not None:
                          body.read(1)
                          body.close()
              print("phase2_cutover_s3_readiness=yes")
          except Exception:
              print("phase2_cutover_s3_readiness=no")
              raise SystemExit(2)
          print("phase2_cutover_readiness_precheck=yes")
          PY

          env_backup="$(mktemp "$repo/.env.phase2-role-backup.XXXXXX")"
          guard_backup="$(mktemp "$repo/control/services/.object-storage-preflight-backup.XXXXXX")"
          cp -p "$repo/.env" "$env_backup"
          cp -p "$guard_file" "$guard_backup"
          mutation_started=0

          rollback() {
            set +e
            if [ "$mutation_started" -eq 1 ]; then
              [ -f "$env_backup" ] && cp -p "$env_backup" "$repo/.env"
              [ -f "$guard_backup" ] && cp -p "$guard_backup" "$guard_file"
              sudo -n systemctl restart "$service" >/dev/null 2>&1 || true
              sleep 2
            fi
            rm -f "$env_backup" "$guard_backup" "$REMOTE_STAGE"
            echo 'phase2_cutover_rollback_completed=yes'
          }
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$mutation_started" -eq 1 ]; then
              rollback
            else
              rm -f "$env_backup" "$guard_backup" "$REMOTE_STAGE"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          mutation_started=1
          cp -p "$REMOTE_STAGE" "$guard_file"
          "$python" -m py_compile "$guard_file"

          "$python" - "$repo/.env" <<'PY'
          import os
          import sys
          from pathlib import Path

          env_path = Path(sys.argv[1])
          remove = {
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_SESSION_TOKEN",
              "AWS_PROFILE",
              "AWS_DEFAULT_PROFILE",
              "AWS_SHARED_CREDENTIALS_FILE",
              "AWS_CONFIG_FILE",
          }
          lines = env_path.read_text().splitlines()
          out = []
          for line in lines:
              stripped = line.lstrip()
              if stripped.startswith("#") or "=" not in line:
                  out.append(line)
                  continue
              key = line.split("=", 1)[0].strip()
              if key in remove or key == "AWS_REQUIRE_ROLE_CREDENTIALS":
                  continue
              out.append(line)
          out.append("AWS_REQUIRE_ROLE_CREDENTIALS=1")
          tmp = env_path.with_name(env_path.name + ".phase2-role.tmp")
          tmp.write_text("\n".join(out) + "\n")
          os.chmod(tmp, 0o600)
          os.replace(tmp, env_path)
          print("phase2_cutover_runtime_env_updated=yes")
          PY

          DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" manage.py check_release_preflight --strict >/dev/null

          sudo -n systemctl restart "$service"
          sleep 3
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running_after_cutover'

          # Verify the restarted runtime sees role-only configuration and still resolves
          # tenant secrets and private S3 reads through the default provider chain.
          DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import os
          import django
          django.setup()

          forbidden = (
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_SESSION_TOKEN",
              "AWS_PROFILE",
              "AWS_DEFAULT_PROFILE",
              "AWS_SHARED_CREDENTIALS_FILE",
              "AWS_CONFIG_FILE",
          )
          present = sum(bool(str(os.environ.get(name) or "").strip()) for name in forbidden)
          guard = str(os.environ.get("AWS_REQUIRE_ROLE_CREDENTIALS") or "").strip().lower()
          print(f"phase2_cutover_forbidden_runtime_sources={present}")
          print("phase2_cutover_role_guard_enabled=" + ("yes" if guard in {"1","true","yes","y","on"} else "no"))
          if present or guard not in {"1","true","yes","y","on"}:
              raise SystemExit(2)

          import boto3
          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import resolve_tenant_db_password

          region = str(os.environ.get("AWS_REGION") or "ap-northeast-2").strip()
          session = boto3.Session(region_name=region)
          credentials = session.get_credentials()
          method = str(getattr(credentials, "method", "") or "") if credentials else ""
          role_method = method in {"iam-role", "container-role"}
          print("phase2_cutover_runtime_role_credentials=" + ("yes" if role_method else "no"))
          if not role_method:
              raise SystemExit(2)

          configs = list(
              GroupDBConfig.objects.select_related("group")
              .filter(group__status="active")
              .only("db_password")
          )
          sm = session.client("secretsmanager", region_name=region)
          ok = 0
          for config in configs:
              value = resolve_tenant_db_password(config.db_password, environ=os.environ, client=sm)
              if value:
                  ok += 1
          print(f"phase2_cutover_runtime_secret_resolve_ok={ok}")
          if not configs or ok != len(configs):
              raise SystemExit(2)

          bucket = str(os.environ.get("AWS_S3_BUCKET") or "").strip()
          s3 = session.client("s3", region_name=region)
          try:
              s3.head_bucket(Bucket=bucket)
              s3.list_objects_v2(Bucket=bucket, Prefix="tenants/", MaxKeys=1)
              print("phase2_cutover_runtime_s3_readiness=yes")
          except Exception:
              print("phase2_cutover_runtime_s3_readiness=no")
              raise SystemExit(2)
          PY

          https_code="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://geoflow.co.kr/login/)"
          echo "phase2_cutover_public_login_get=$https_code"
          [ "$https_code" = 200 ] || fail 'public_login_not_200_after_cutover'

          mutation_started=0
          rm -f "$env_backup" "$guard_backup" "$REMOTE_STAGE"
          trap - EXIT
          echo 'phase2_cutover_s3_put_probe=not_performed'
          echo 'phase2_role_only_runtime_cutover_complete=yes'
          REMOTE
