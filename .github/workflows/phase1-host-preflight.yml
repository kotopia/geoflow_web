name: Phase 1 host preflight

on:
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  host-preflight:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port }}

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate reviewed candidate and connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          candidate_sha="$(git rev-parse HEAD)"
          test "$candidate_sha" = "$GITHUB_SHA"
          printf 'candidate_sha=%s\n' "$candidate_sha"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Read-only adaptive host discovery
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service=geoflow
          discovery_ok=1

          echo 'host_preflight=yes'
          printf 'kernel='; uname -srm

          for cmd in git python3 systemctl nginx; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "command_${cmd}=yes"
            else
              echo "command_${cmd}=no"
              discovery_ok=0
            fi
          done

          load_state="$(systemctl show "$service" -p LoadState --value 2>/dev/null || true)"
          active_state="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub_state="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          result_state="$(systemctl show "$service" -p Result --value 2>/dev/null || true)"
          exec_main_code="$(systemctl show "$service" -p ExecMainCode --value 2>/dev/null || true)"
          exec_main_status="$(systemctl show "$service" -p ExecMainStatus --value 2>/dev/null || true)"
          restart_count="$(systemctl show "$service" -p NRestarts --value 2>/dev/null || true)"
          fragment="$(systemctl show "$service" -p FragmentPath --value 2>/dev/null || true)"
          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          env_files="$(systemctl show "$service" -p EnvironmentFiles --value 2>/dev/null || true)"

          echo "geoflow_service_load_state=${load_state:-unknown}"
          echo "geoflow_service_active_state=${active_state:-unknown}"
          echo "geoflow_service_sub_state=${sub_state:-unknown}"
          echo "geoflow_service_result=${result_state:-unknown}"
          echo "geoflow_service_exec_main_code=${exec_main_code:-unknown}"
          echo "geoflow_service_exec_main_status=${exec_main_status:-unknown}"
          echo "geoflow_service_restart_count=${restart_count:-unknown}"
          echo "geoflow_service_fragment=${fragment:-unknown}"
          echo "geoflow_service_working_directory=${workdir:-unknown}"

          if [ "$load_state" != "loaded" ]; then
            echo 'geoflow_service_loaded=no'
            discovery_ok=0
          else
            echo 'geoflow_service_loaded=yes'
          fi

          if [ "$active_state" = "active" ] && [ "$sub_state" = "running" ]; then
            echo 'geoflow_service_stable=yes'
          else
            echo 'geoflow_service_stable=no'
            discovery_ok=0
          fi

          if [ -n "$workdir" ] && [ -d "$workdir" ]; then
            echo 'service_working_directory_present=yes'
          else
            echo 'service_working_directory_present=no'
            discovery_ok=0
          fi

          repo_root=''
          if [ -n "$workdir" ] && repo_root="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null)"; then
            echo 'repo_present=yes'
            echo "repo_root=$repo_root"
            printf 'deployed_sha='; git -C "$repo_root" rev-parse HEAD
            printf 'deployed_branch='; git -C "$repo_root" rev-parse --abbrev-ref HEAD
            dirty_count="$(git -C "$repo_root" status --porcelain | wc -l | tr -d ' ')"
            echo "deployed_worktree_dirty_count=$dirty_count"

            origin="$(git -C "$repo_root" remote get-url origin 2>/dev/null || true)"
            case "$origin" in
              https://github.com/kotopia/geoflow_web*|git@github.com:kotopia/geoflow_web*)
                echo 'origin_matches_geoflow_repo=yes'
                ;;
              *)
                echo 'origin_matches_geoflow_repo=no'
                discovery_ok=0
                ;;
            esac

            if [ -f "$repo_root/manage.py" ]; then
              echo 'manage_py_present=yes'
            else
              echo 'manage_py_present=no'
              discovery_ok=0
            fi
          else
            echo 'repo_present=no'
            discovery_ok=0
          fi

          exec_raw="$(systemctl show "$service" -p ExecStart --value 2>/dev/null || true)"
          exec_path="$(printf '%s\n' "$exec_raw" | sed -n 's/.*path=\([^ ;]*\).*/\1/p' | head -n 1)"
          if [ -n "$exec_path" ]; then
            echo "service_exec_path=$exec_path"
          else
            echo 'service_exec_path=unknown'
          fi

          venv_python=''
          if [ -n "$exec_path" ] && printf '%s' "$exec_path" | grep -q '/bin/'; then
            exec_venv="${exec_path%/bin/*}"
            if [ -x "$exec_venv/bin/python" ]; then
              venv_python="$exec_venv/bin/python"
            fi
          fi

          if [ -z "$venv_python" ] && [ -n "$workdir" ]; then
            parent_dir="$(dirname "$workdir")"
            for candidate in \
              "$workdir/.venv/bin/python" \
              "$workdir/venv/bin/python" \
              "$parent_dir/.venv/bin/python" \
              "$parent_dir/venv/bin/python"; do
              if [ -x "$candidate" ]; then
                venv_python="$candidate"
                break
              fi
            done
          fi

          if [ -n "$venv_python" ]; then
            echo 'venv_python_present=yes'
            echo "venv_python_path=$venv_python"
            printf 'venv_python_version='; "$venv_python" -c 'import platform; print(platform.python_version())'
          else
            echo 'venv_python_present=no'
            discovery_ok=0
          fi

          if [ -n "$env_files" ]; then
            echo 'service_environment_files_configured=yes'
          else
            echo 'service_environment_files_configured=no'
          fi

          if [ -n "$workdir" ] && [ -f "$workdir/.env" ]; then
            echo 'working_directory_dotenv_present=yes'
          else
            echo 'working_directory_dotenv_present=no'
          fi

          if command -v nginx >/dev/null 2>&1; then
            nginx -v 2>&1 || true
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n nginx -t
              echo 'nginx_config_test=yes'
            elif nginx -t >/dev/null 2>&1; then
              echo 'nginx_config_test=yes'
            else
              echo 'nginx_config_test=permission_or_config_attention'
            fi
          fi

          if [ "$discovery_ok" -eq 1 ]; then
            echo 'adaptive_host_discovery_ready=yes'
          else
            echo 'adaptive_host_discovery_ready=no'
            exit 2
          fi
          REMOTE
