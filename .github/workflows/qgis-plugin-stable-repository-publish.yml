name: QGIS plugin stable repository publish

on:
  # Register this release-branch workflow; publishing still requires manual dispatch.
  push:
    branches: [release/stabilized-deploy]
    paths: [.github/workflows/qgis-plugin-stable-repository-publish.yml]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_QGIS_PLUGIN:stable:geoflow-upload:qgis-plugins
        required: true
        type: string

concurrency:
  group: geoflow-qgis-stable-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-stable-repository:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate exact release and target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/stabilized-deploy'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRMATION" = 'PUBLISH_QGIS_PLUGIN:stable:geoflow-upload:qgis-plugins'
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Build pinned immutable stable plugin repository
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,pathlib,subprocess,sys
          root=pathlib.Path.cwd()
          plan=json.loads((root/'docs/operations/qgis-plugin-stable-release.json').read_text())
          manifest=root/plan['manifest']; inventory=root/plan['inventory']
          release=json.loads(manifest.read_text())
          for key in ('version','zip_filename','size_bytes','sha256'):
              if plan[key]!=release[key]: raise SystemExit('stable_release_descriptor_mismatch')
          subprocess.run(['git','merge-base','--is-ancestor',plan['source_commit'],'HEAD'],check=True)
          import os
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'qgis-plugin-repository'
          subprocess.run([sys.executable,'scripts/qgis/build_plugin_repository.py',
              '--source','integrations/qgis/geoflow_connector','--output',str(output),
              '--release-manifest',str(manifest),'--inventory',str(inventory),
              '--base-url','https://geoflow.co.kr/gis/qgis/plugins/packages'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('PLUGIN_VERSION='+plan['version']+'\n')
          PY

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Upload reviewed publisher and artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$PLUGIN_VERSION"
          remote_dir="/tmp/geoflow-qgis-plugin-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "mkdir -m 700 '$remote_dir'"
          scp -i "$HOME/.ssh/geoflow_deploy_key" -P "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/ops/publish_qgis_plugin_repository.py \
            "$RUNNER_TEMP/qgis-plugin-repository/plugins.xml" \
            "$RUNNER_TEMP/qgis-plugin-repository/releases/geoflow_connector-${version}.zip" \
            "$SSH_USER@$SSH_HOST:$remote_dir/"

      - name: Publish exact stable repository prefix
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$GITHUB_RUN_ID' '$CONFIRMATION' '$PLUGIN_VERSION'" <<'REMOTE'
          set -euo pipefail
          run_id="$1"
          confirmation="$2"
          version="$3"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          remote_dir="/tmp/geoflow-qgis-plugin-$run_id"
          trap 'find "$remote_dir" -mindepth 1 -maxdepth 1 -type f -delete 2>/dev/null || true; rmdir "$remote_dir" 2>/dev/null || true' EXIT

          fail() {
            echo "qgis_plugin_repository_blocker=$1"
            exit 2
          }

          [ "$confirmation" = 'PUBLISH_QGIS_PLUGIN:stable:geoflow-upload:qgis-plugins' ] || fail 'remote_confirmation_mismatch'
          service='geoflow-stabilized.service'
          [ "$(systemctl is-active "$service" 2>/dev/null || true)" = active ] || fail 'service_not_running'
          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -f "$repo/manage.py" ] || fail 'service_repo_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'venv_python_missing'
          [ -f "$remote_dir/publish_qgis_plugin_repository.py" ] || fail 'publisher_missing'
          [ -f "$remote_dir/plugins.xml" ] || fail 'repository_missing'
          [ -f "$remote_dir/geoflow_connector-${version}.zip" ] || fail 'package_missing'

          exec 9>/tmp/geoflow-qgis-stable-publish.lock
          flock -x 9
          cd "$repo"
          PYTHONPATH="$repo" "$python" "$remote_dir/publish_qgis_plugin_repository.py" \
            --channel stable \
            --repository "$remote_dir/plugins.xml" \
            --package "$remote_dir/geoflow_connector-${version}.zip" \
            --confirm "$confirmation" --verify-http
          REMOTE
