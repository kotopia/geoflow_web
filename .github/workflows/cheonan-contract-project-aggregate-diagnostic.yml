name: Cheonan contract project aggregate diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/cheonan-contract-project-aggregate-diagnostic.yml

permissions:
  contents: read

jobs:
  cheonan-contract-project-aggregate:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/stabilized-deploy
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Inspect Cheonan contract project integrity aggregate only
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          service='geoflow-stabilized.service'
          [ "$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)" = active ] || {
            echo 'cheonan_cp_blocker=stabilized_service_not_active'
            exit 2
          }
          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || { echo 'cheonan_cp_blocker=runtime_python_missing'; exit 2; }

          "$python" - "$repo" <<'PY'
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          from django.conf import settings
          from django.db import connections, transaction

          alias = "cheonan_db"
          if alias not in settings.DATABASES:
              raise SystemExit("cheonan_cp_blocker=static_alias_missing")

          with transaction.atomic(using=alias):
              with connections[alias].cursor() as cur:
                  cur.execute("SET LOCAL TRANSACTION READ ONLY")
                  cur.execute("SELECT COUNT(*) FROM ctr.contracts")
                  contract_total = int(cur.fetchone()[0])
                  cur.execute("SELECT COUNT(*) FROM prj.projects")
                  project_total = int(cur.fetchone()[0])
                  cur.execute("SELECT COUNT(DISTINCT contract_id) FROM prj.projects WHERE contract_id IS NOT NULL")
                  distinct_linked = int(cur.fetchone()[0])
                  cur.execute("SELECT COUNT(*) FROM prj.projects WHERE contract_id IS NULL")
                  null_contract_projects = int(cur.fetchone()[0])
                  cur.execute('''
                      SELECT COUNT(*)
                        FROM ctr.contracts c
                       WHERE NOT EXISTS (
                             SELECT 1 FROM prj.projects p WHERE p.contract_id = c.id
                       )
                  ''')
                  missing_count = int(cur.fetchone()[0])
                  cur.execute('''
                      SELECT COUNT(*)
                        FROM (
                          SELECT contract_id
                            FROM prj.projects
                           WHERE contract_id IS NOT NULL
                           GROUP BY contract_id
                          HAVING COUNT(*) > 1
                        ) d
                  ''')
                  duplicate_contract_links = int(cur.fetchone()[0])
                  cur.execute('''
                      WITH missing AS (
                        SELECT c.*
                          FROM ctr.contracts c
                         WHERE NOT EXISTS (
                               SELECT 1 FROM prj.projects p WHERE p.contract_id = c.id
                         )
                      )
                      SELECT
                        COUNT(*) FILTER (WHERE legacy_id IS NOT NULL),
                        COUNT(*) FILTER (WHERE legacy_id IS NULL),
                        COUNT(*) FILTER (WHERE created_at IS NULL),
                        COUNT(*) FILTER (WHERE created_at < TIMESTAMPTZ '2025-12-05 06:49:24+00'),
                        COUNT(*) FILTER (WHERE created_at >= TIMESTAMPTZ '2025-12-05 06:49:24+00'),
                        MIN(created_at),
                        MAX(created_at)
                      FROM missing
                  ''')
                  legacy_yes, legacy_no, created_null, before_repo, after_repo, min_created, max_created = cur.fetchone()
                  cur.execute('''
                      WITH ranked AS (
                        SELECT c.id,
                               ROW_NUMBER() OVER (ORDER BY c.created_at DESC NULLS LAST, c.id) AS rn
                          FROM ctr.contracts c
                      )
                      SELECT
                        COUNT(*) FILTER (WHERE r.rn <= 10),
                        COUNT(*) FILTER (WHERE r.rn <= 20),
                        COUNT(*) FILTER (WHERE r.rn <= 50)
                        FROM ranked r
                       WHERE NOT EXISTS (SELECT 1 FROM prj.projects p WHERE p.contract_id = r.id)
                  ''')
                  missing_newest_10, missing_newest_20, missing_newest_50 = cur.fetchone()
                  cur.execute('''
                      SELECT COUNT(*)
                        FROM pg_trigger t
                        JOIN pg_class cls ON cls.oid = t.tgrelid
                        JOIN pg_namespace ns ON ns.oid = cls.relnamespace
                       WHERE NOT t.tgisinternal
                         AND ns.nspname = 'ctr'
                         AND cls.relname = 'contracts'
                  ''')
                  contract_trigger_count = int(cur.fetchone()[0])
                  cur.execute('''
                      SELECT EXISTS (
                        SELECT 1
                          FROM pg_constraint c
                          JOIN pg_class cls ON cls.oid = c.conrelid
                          JOIN pg_namespace ns ON ns.oid = cls.relnamespace
                         WHERE ns.nspname = 'prj'
                           AND cls.relname = 'projects'
                           AND c.contype = 'f'
                           AND pg_get_constraintdef(c.oid) ILIKE '%contract_id%contracts%'
                      )
                  ''')
                  project_contract_fk = bool(cur.fetchone()[0])
                  cur.execute('''
                      SELECT EXISTS (
                        SELECT 1
                          FROM pg_constraint c
                          JOIN pg_class cls ON cls.oid = c.conrelid
                          JOIN pg_namespace ns ON ns.oid = cls.relnamespace
                         WHERE ns.nspname = 'prj'
                           AND cls.relname = 'projects'
                           AND c.contype = 'u'
                           AND pg_get_constraintdef(c.oid) ILIKE '%contract_id%'
                      )
                  ''')
                  project_contract_unique = bool(cur.fetchone()[0])
                  cur.execute('''
                      SELECT is_nullable
                        FROM information_schema.columns
                       WHERE table_schema = 'prj'
                         AND table_name = 'projects'
                         AND column_name = 'contract_id'
                  ''')
                  nullable_row = cur.fetchone()
                  project_contract_nullable = (nullable_row[0] if nullable_row else 'unknown')

          def yes(v): return 'yes' if v else 'no'
          def day(v): return v.date().isoformat() if v else 'none'

          print(f"cheonan_cp_contract_total={contract_total}")
          print(f"cheonan_cp_project_total={project_total}")
          print(f"cheonan_cp_distinct_linked_contracts={distinct_linked}")
          print(f"cheonan_cp_missing_contracts={missing_count}")
          print(f"cheonan_cp_projects_without_contract={null_contract_projects}")
          print(f"cheonan_cp_contracts_with_multiple_projects={duplicate_contract_links}")
          print(f"cheonan_cp_missing_legacy_id_present={int(legacy_yes or 0)}")
          print(f"cheonan_cp_missing_legacy_id_absent={int(legacy_no or 0)}")
          print(f"cheonan_cp_missing_created_at_null={int(created_null or 0)}")
          print(f"cheonan_cp_missing_created_before_repo_init={int(before_repo or 0)}")
          print(f"cheonan_cp_missing_created_on_or_after_repo_init={int(after_repo or 0)}")
          print(f"cheonan_cp_missing_created_min_date={day(min_created)}")
          print(f"cheonan_cp_missing_created_max_date={day(max_created)}")
          print(f"cheonan_cp_missing_among_newest_10={int(missing_newest_10 or 0)}")
          print(f"cheonan_cp_missing_among_newest_20={int(missing_newest_20 or 0)}")
          print(f"cheonan_cp_missing_among_newest_50={int(missing_newest_50 or 0)}")
          print(f"cheonan_cp_contract_insert_trigger_present={yes(contract_trigger_count > 0)}")
          print(f"cheonan_cp_contract_trigger_count={contract_trigger_count}")
          print(f"cheonan_cp_project_contract_fk_present={yes(project_contract_fk)}")
          print(f"cheonan_cp_project_contract_unique_present={yes(project_contract_unique)}")
          print(f"cheonan_cp_project_contract_nullable={project_contract_nullable}")
          print('cheonan_cp_diagnostic_complete=yes')
          PY
          REMOTE
