name: Cheonan contract project backfill

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cheonan-contract-project-backfill:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Backfill exactly the missing Cheonan projects transactionally
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          candidate_sha="$1"
          service='geoflow-stabilized.service'

          fail() {
            echo "cheonan_project_backfill_blocker=$1"
            exit 2
          }

          [ "$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)" = active ] || fail 'stabilized_service_not_active'
          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ "$(git -C "$repo" rev-parse HEAD 2>/dev/null || true)" = "$candidate_sha" ] || fail 'runtime_release_sha_mismatch'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'runtime_python_missing'

          "$python" - "$repo" <<'PY'
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          from django.db import connections, transaction
          from django.db.models import Count
          from django.utils import timezone

          from geoflow_ops.models import Contract, Project
          from geoflow_ops.services.contract_project_creation import create_project_for_contract

          ALIAS = "cheonan_db"
          EXPECTED_CONTRACTS = 753
          EXPECTED_PROJECTS_BEFORE = 743
          EXPECTED_MISSING = 10

          def counts():
              contracts = Contract.objects.using(ALIAS).count()
              projects = Project.objects.using(ALIAS).count()
              distinct_linked = (
                  Project.objects.using(ALIAS)
                  .exclude(contract_id__isnull=True)
                  .values("contract_id")
                  .distinct()
                  .count()
              )
              missing = Contract.objects.using(ALIAS).filter(project_set__isnull=True).count()
              duplicate_groups = (
                  Project.objects.using(ALIAS)
                  .exclude(contract_id__isnull=True)
                  .values("contract_id")
                  .annotate(n=Count("id"))
                  .filter(n__gt=1)
                  .count()
              )
              with connections[ALIAS].cursor() as cur:
                  cur.execute(
                      """
                      SELECT COUNT(*)
                        FROM prj.projects p
                        LEFT JOIN ctr.contracts c ON c.id = p.contract_id
                       WHERE c.id IS NULL
                      """
                  )
                  orphan = int(cur.fetchone()[0])
              return contracts, projects, distinct_linked, missing, duplicate_groups, orphan

          before = counts()
          print(f"cheonan_project_backfill_before_contracts={before[0]}")
          print(f"cheonan_project_backfill_before_projects={before[1]}")
          print(f"cheonan_project_backfill_before_distinct_links={before[2]}")
          print(f"cheonan_project_backfill_before_missing={before[3]}")
          print(f"cheonan_project_backfill_before_duplicate_groups={before[4]}")
          print(f"cheonan_project_backfill_before_orphans={before[5]}")
          if before != (EXPECTED_CONTRACTS, EXPECTED_PROJECTS_BEFORE, EXPECTED_PROJECTS_BEFORE, EXPECTED_MISSING, 0, 0):
              raise SystemExit("cheonan_project_backfill_blocker=unexpected_precondition")

          with transaction.atomic(using=ALIAS):
              locked = list(
                  Contract.objects.using(ALIAS)
                  .select_for_update()
                  .filter(project_set__isnull=True)
                  .order_by("id")
              )
              if len(locked) != EXPECTED_MISSING:
                  raise RuntimeError("missing contract set changed while locking")

              locked_ids = [contract.id for contract in locked]
              existing_for_locked = Project.objects.using(ALIAS).filter(contract_id__in=locked_ids).count()
              if existing_for_locked != 0:
                  raise RuntimeError("a missing contract gained a project before backfill")

              timestamp = timezone.now()
              for contract in locked:
                  create_project_for_contract(ALIAS, contract, now=timestamp)

              inside = counts()
              if inside != (EXPECTED_CONTRACTS, EXPECTED_CONTRACTS, EXPECTED_CONTRACTS, 0, 0, 0):
                  raise RuntimeError("post-insert verification failed; transaction will roll back")

          after = counts()
          print(f"cheonan_project_backfill_after_contracts={after[0]}")
          print(f"cheonan_project_backfill_after_projects={after[1]}")
          print(f"cheonan_project_backfill_after_distinct_links={after[2]}")
          print(f"cheonan_project_backfill_after_missing={after[3]}")
          print(f"cheonan_project_backfill_after_duplicate_groups={after[4]}")
          print(f"cheonan_project_backfill_after_orphans={after[5]}")
          if after != (EXPECTED_CONTRACTS, EXPECTED_CONTRACTS, EXPECTED_CONTRACTS, 0, 0, 0):
              raise SystemExit("cheonan_project_backfill_blocker=post_commit_verification_failed")
          print("cheonan_project_backfill_complete=yes")
          PY
          REMOTE
