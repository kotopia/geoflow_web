name: Phase 1 signup SMTP sender recovery

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-signup-smtp-sender-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signup-smtp-sender-recovery:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      TARGET_EMAIL_SHA256: e1b8b40b9a712fb8de657d6adc788db895f0487543b1b22a22bd3b0005458035

    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$TARGET_EMAIL_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Align sender and recover verification delivery
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
            "TARGET_EMAIL_SHA256='$TARGET_EMAIL_SHA256' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          web_service='geoflow-stabilized.service'
          outbox_timer='geoflow-signup-outbox.timer'
          fail() { echo "signup_sender_recovery_blocker=$1"; exit 2; }

          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$web_service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$web_service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running'
          systemctl is-active --quiet "$outbox_timer" || fail 'outbox_timer_not_active'
          systemctl is-enabled --quiet "$outbox_timer" || fail 'outbox_timer_not_enabled'

          workdir="$(systemctl show "$web_service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'
          cd "$repo"

          # Read-only incident preflight. No identifiers, email values, or tokens are printed.
          TARGET_EMAIL_SHA256="$TARGET_EMAIL_SHA256" DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import hashlib, os
          import django
          django.setup()
          from django.db import connections

          target = os.environ['TARGET_EMAIL_SHA256']
          conn = connections['default']
          with conn.cursor() as cur:
              cur.execute('BEGIN READ ONLY')
              try:
                  cur.execute("""
                      SELECT id::text,email,is_active,email_verified
                      FROM users
                      WHERE created_at >= now() - interval '7 days'
                      ORDER BY created_at DESC LIMIT 1000
                  """)
                  matches=[]
                  for row in cur.fetchall():
                      normalized=(row[1] or '').strip().lower()
                      if hashlib.sha256(normalized.encode()).hexdigest()==target:
                          matches.append(row)
                  print(f'signup_sender_recovery_user_match_count={len(matches)}')
                  if len(matches)!=1:
                      raise SystemExit(3)
                  uid,_email,active,verified=matches[0]
                  print('signup_sender_recovery_user_inactive=' + ('yes' if not active else 'no'))
                  print('signup_sender_recovery_user_unverified=' + ('yes' if not verified else 'no'))
                  if active or verified:
                      raise SystemExit(3)

                  cur.execute("""
                      SELECT id::text,status
                      FROM signup_requests
                      WHERE user_id=%s
                      ORDER BY created_at DESC,id DESC LIMIT 1
                  """, [uid])
                  req=cur.fetchone()
                  print('signup_sender_recovery_request_found=' + ('yes' if req else 'no'))
                  if not req or req[1] != 'pending_email_verification':
                      raise SystemExit(3)
                  rid=req[0]
                  print('signup_sender_recovery_request_pending_email_verification=yes')

                  cur.execute("""
                      SELECT status,attempt_count,last_error_code
                      FROM signup_verification_delivery_outbox
                      WHERE signup_request_id=%s
                      ORDER BY created_at DESC,id DESC LIMIT 1
                  """, [rid])
                  outbox=cur.fetchone()
                  expected = bool(outbox and outbox[0]=='cancelled' and outbox[1]>=5 and outbox[2]=='mail.max_attempts_exceeded')
                  print('signup_sender_recovery_failed_outbox_matches_incident=' + ('yes' if expected else 'no'))
                  if not expected:
                      raise SystemExit(3)

                  cur.execute("""
                      SELECT count(*)
                      FROM signup_verification_delivery_outbox
                      WHERE status IN ('pending','processing')
                  """)
                  live_count=cur.fetchone()[0]
                  print(f'signup_sender_recovery_existing_live_outbox={live_count}')
                  if live_count != 0:
                      raise SystemExit(3)
              finally:
                  cur.execute('ROLLBACK')
          PY

          backup="$(mktemp "$repo/.env.sender-recovery-backup.XXXXXX")"
          cp -p "$repo/.env" "$backup"
          mutation_started=0

          rollback() {
            set +e
            if [ "$mutation_started" -eq 1 ] && [ -f "$backup" ]; then
              cp -p "$backup" "$repo/.env"
              sudo -n systemctl restart "$web_service" >/dev/null 2>&1 || true
              sleep 2
            fi
            rm -f "$backup"
            echo 'signup_sender_recovery_rollback_completed=yes'
          }
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$mutation_started" -eq 1 ]; then
              rollback
            else
              rm -f "$backup"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          mutation_started=1
          "$python" - "$repo/.env" <<'PY'
          import os, sys
          from pathlib import Path
          from dotenv import dotenv_values

          env_path=Path(sys.argv[1])
          values=dotenv_values(env_path)
          smtp_user=(values.get('EMAIL_HOST_USER') or '').strip()
          if not smtp_user or '\n' in smtp_user or '\r' in smtp_user:
              print('signup_sender_recovery_smtp_user_valid=no')
              raise SystemExit(2)
          sender=smtp_user if '@' in smtp_user else smtp_user + '@naver.com'
          if not sender.lower().endswith('@naver.com'):
              print('signup_sender_recovery_smtp_user_naver=no')
              raise SystemExit(2)

          lines=env_path.read_text().splitlines()
          out=[]
          seen=False
          for line in lines:
              if line.lstrip().startswith('#') or '=' not in line:
                  out.append(line); continue
              key=line.split('=',1)[0].strip()
              if key=='DEFAULT_FROM_EMAIL':
                  out.append('DEFAULT_FROM_EMAIL=' + sender)
                  seen=True
              else:
                  out.append(line)
          if not seen:
              out.append('DEFAULT_FROM_EMAIL=' + sender)
          tmp=env_path.with_name(env_path.name + '.sender-recovery.tmp')
          tmp.write_text('\n'.join(out)+'\n')
          os.chmod(tmp,0o600)
          os.replace(tmp,env_path)
          print('signup_sender_recovery_env_updated=yes')
          PY

          sudo -n systemctl restart "$web_service"
          sleep 2
          active="$(systemctl show "$web_service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$web_service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'web_service_not_running_after_restart'

          DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import django
          django.setup()
          from django.conf import settings
          sender=str(getattr(settings,'DEFAULT_FROM_EMAIL','') or '').strip().lower()
          user=str(getattr(settings,'EMAIL_HOST_USER','') or '').strip().lower()
          if user and '@' not in user:
              user=user+'@naver.com'
          print('signup_sender_recovery_sender_matches_smtp_account=' + ('yes' if sender and sender==user else 'no'))
          if not sender or sender != user:
              raise SystemExit(2)
          PY

          # Sender alignment is now validated; keep it even if downstream resend still needs investigation.
          mutation_started=0
          rm -f "$backup"
          trap - EXIT

          # Queue resend through the production service using the configured cooldown.
          TARGET_EMAIL_SHA256="$TARGET_EMAIL_SHA256" DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import hashlib, os
          from datetime import timedelta
          import django
          django.setup()
          from django.conf import settings
          from django.db import connections
          from control.services.signup_verification_resend_outbox_service import queue_signup_email_verification_resend

          target=os.environ['TARGET_EMAIL_SHA256']
          recipient=None
          with connections['default'].cursor() as cur:
              cur.execute("SELECT email FROM users WHERE created_at >= now() - interval '7 days' ORDER BY created_at DESC LIMIT 1000")
              matches=[]
              for (email,) in cur.fetchall():
                  normalized=(email or '').strip().lower()
                  if hashlib.sha256(normalized.encode()).hexdigest()==target:
                      matches.append(normalized)
              if len(matches)!=1:
                  print(f'signup_sender_recovery_resend_match_count={len(matches)}')
                  raise SystemExit(3)
              recipient=matches[0]

          cooldown=getattr(settings,'SIGNUP_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS',None)
          if not isinstance(cooldown,int) or isinstance(cooldown,bool) or cooldown<=0:
              print('signup_sender_recovery_cooldown_ready=no')
              raise SystemExit(2)
          queued=queue_signup_email_verification_resend(recipient,cooldown=timedelta(seconds=cooldown))
          print('signup_sender_recovery_resend_queued=' + ('yes' if queued else 'no'))
          if not queued:
              raise SystemExit(4)
          PY

          # Let the installed production timer process the resend through the normal worker path.
          delivered=0
          for i in $(seq 1 12); do
            sleep 10
            if TARGET_EMAIL_SHA256="$TARGET_EMAIL_SHA256" DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import hashlib, os
          import django
          django.setup()
          from django.db import connections
          target=os.environ['TARGET_EMAIL_SHA256']
          with connections['default'].cursor() as cur:
              cur.execute("SELECT id::text,email FROM users WHERE created_at >= now() - interval '7 days' ORDER BY created_at DESC LIMIT 1000")
              matches=[]
              for uid,email in cur.fetchall():
                  normalized=(email or '').strip().lower()
                  if hashlib.sha256(normalized.encode()).hexdigest()==target:
                      matches.append(uid)
              if len(matches)!=1:
                  raise SystemExit(1)
              cur.execute("SELECT id::text FROM signup_requests WHERE user_id=%s ORDER BY created_at DESC,id DESC LIMIT 1",[matches[0]])
              req=cur.fetchone()
              if not req:
                  raise SystemExit(1)
              cur.execute("SELECT status,attempt_count,last_error_code,delivered_at IS NOT NULL FROM signup_verification_delivery_outbox WHERE signup_request_id=%s ORDER BY created_at DESC,id DESC LIMIT 1",[req[0]])
              out=cur.fetchone()
              if out and out[0]=='delivered' and out[3]:
                  raise SystemExit(0)
              if out and out[0]=='cancelled':
                  raise SystemExit(2)
              raise SystemExit(1)
          PY
            then
              delivered=1
              break
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                echo 'signup_sender_recovery_resend_cancelled=yes'
                exit 5
              fi
            fi
          done
          [ "$delivered" -eq 1 ] || fail 'resend_delivery_timeout'

          TARGET_EMAIL_SHA256="$TARGET_EMAIL_SHA256" DJANGO_SETTINGS_MODULE=geoflow_project.settings "$python" - <<'PY'
          import hashlib, os
          import django
          django.setup()
          from django.db import connections
          target=os.environ['TARGET_EMAIL_SHA256']
          with connections['default'].cursor() as cur:
              cur.execute("SELECT id::text,email,is_active,email_verified FROM users WHERE created_at >= now() - interval '7 days' ORDER BY created_at DESC LIMIT 1000")
              matches=[]
              for row in cur.fetchall():
                  normalized=(row[1] or '').strip().lower()
                  if hashlib.sha256(normalized.encode()).hexdigest()==target:
                      matches.append(row)
              if len(matches)!=1:
                  raise SystemExit(3)
              uid,_email,active,verified=matches[0]
              cur.execute("SELECT id::text,status FROM signup_requests WHERE user_id=%s ORDER BY created_at DESC,id DESC LIMIT 1",[uid])
              req=cur.fetchone()
              cur.execute("SELECT status,attempt_count,last_error_code,delivered_at IS NOT NULL FROM signup_verification_delivery_outbox WHERE signup_request_id=%s ORDER BY created_at DESC,id DESC LIMIT 1",[req[0]])
              out=cur.fetchone()
              cur.execute("SELECT count(*) FROM signup_email_verification_tokens WHERE signup_request_id=%s AND consumed_at IS NULL AND revoked_at IS NULL AND expires_at>now()",[req[0]])
              live_tokens=cur.fetchone()[0]
              print('signup_sender_recovery_latest_outbox_delivered=' + ('yes' if out and out[0]=='delivered' and out[3] else 'no'))
              print(f'signup_sender_recovery_latest_outbox_attempt_count={out[1] if out else -1}')
              print('signup_sender_recovery_request_status=' + (req[1] if req else 'missing'))
              print('signup_sender_recovery_user_active=' + ('yes' if active else 'no'))
              print('signup_sender_recovery_user_verified=' + ('yes' if verified else 'no'))
              print(f'signup_sender_recovery_live_token_count={live_tokens}')
              if not out or out[0]!='delivered' or not out[3] or req[1]!='pending_email_verification' or active or verified or live_tokens!=1:
                  raise SystemExit(4)
          print('signup_sender_recovery_complete=yes')
          PY
          REMOTE
