name: iroomsng exception class diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/iroomsng-exception-class-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iroomsng-exception-class:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact triggering release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Classify terminal exception classes read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v python3 >/dev/null 2>&1 || { echo 'iroomsng_exception_blocker=python_missing'; exit 2; }
          command -v systemctl >/dev/null 2>&1 || { echo 'iroomsng_exception_blocker=systemctl_missing'; exit 2; }
          command -v journalctl >/dev/null 2>&1 || { echo 'iroomsng_exception_blocker=journalctl_missing'; exit 2; }
          sudo -n true >/dev/null 2>&1 || { echo 'iroomsng_exception_blocker=passwordless_sudo_required'; exit 2; }

          classify_unit() {
            unit="$1"
            key="$2"
            journal_file="$(mktemp)"
            if ! systemctl cat "$unit" >/dev/null 2>&1; then
              echo "iroomsng_exception_${key}_present=no"
              rm -f "$journal_file"
              return
            fi
            echo "iroomsng_exception_${key}_present=yes"
            sudo -n journalctl -u "$unit" -n 1500 --no-pager >"$journal_file" 2>/dev/null || true
            python3 - "$journal_file" "$key" <<'PY'
          import re
          import sys
          from collections import Counter
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")
          key = sys.argv[2]

          allow = {
              "AssertionError", "AppImportError", "AppRegistryNotReady", "AttributeError",
              "ClientError", "ConnectionError", "ConnectionRefusedError", "DataError",
              "DatabaseError", "DisallowedHost", "EndpointConnectionError", "FieldError",
              "FileNotFoundError", "HaltServer", "ImproperlyConfigured", "IndexError",
              "IntegrityError", "InterfaceError", "InternalError", "IsADirectoryError",
              "KeyError", "LookupError", "MemoryError", "MiddlewareNotUsed",
              "ModuleNotFoundError", "MultipleObjectsReturned", "NameError", "NoCredentialsError",
              "NoRegionError", "NotADirectoryError", "NotImplementedError", "NotSupportedError",
              "ObjectDoesNotExist", "OperationalError", "OSError", "PartialCredentialsError",
              "PermissionDenied", "PermissionError", "ProgrammingError", "RequestDataTooBig",
              "RuntimeError", "SSLError", "StopIteration", "SuspiciousOperation", "SyntaxError",
              "SystemCheckError", "SystemExit", "TimeoutError", "TypeError", "UnicodeDecodeError",
              "UnicodeEncodeError", "ValidationError", "ValueError", "ViewDoesNotExist",
              "ZeroDivisionError",
          }
          token_re = re.compile(
              r"(?m)(?:^|:\s+)(?:[A-Za-z_][A-Za-z0-9_]*\.)*"
              r"([A-Za-z_][A-Za-z0-9_]*(?:Error|Exception|Warning|Exit)|HaltServer)\s*:"
          )
          tokens = token_re.findall(text)
          counts = Counter(token for token in tokens if token in allow)
          other = sum(1 for token in tokens if token not in allow)
          for token in sorted(allow):
              count = counts.get(token, 0)
              if count:
                  print(f"iroomsng_exception_{key}_{token}={count}")
          print(f"iroomsng_exception_{key}_recognized_total={sum(counts.values())}")
          print(f"iroomsng_exception_{key}_other_terminal_exception={other}")
          if counts:
              top = sorted(counts.items(), key=lambda item: (-item[1], item[0]))[0][0]
          elif other:
              top = "other_terminal_exception"
          else:
              top = "none_detected"
          print(f"iroomsng_exception_{key}_dominant_class={top}")
          chained = len(re.findall(r"During handling of the above exception|direct cause of the following exception", text, re.I))
          print(f"iroomsng_exception_{key}_exception_chain_markers={chained}")
          print(f"iroomsng_exception_{key}_traceback_count={text.count('Traceback (most recent call last)')}")
          PY
            rm -f "$journal_file"
          }

          classify_unit geoflow.service geoflow
          classify_unit gunicorn.service gunicorn
          echo 'iroomsng_exception_class_diagnostic_complete=yes'
          REMOTE

      - name: Verify public iroomsng root
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://iroomsng.kr/ || true)"
          printf '%s' "$code" | grep -Eq '^[0-9]{3}$' || code=000
          echo "iroomsng_exception_public_root_code=$code"
