name: Phase 4 owner-approved break-glass from main

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  owner-approved-breakglass:
    if: github.event.issue.title == 'RUN PHASE4 OWNER APPROVED BREAKGLASS 2026-08-18'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"
      TARGET_WORKFLOW: .github/workflows/phase4-workflow-handoff-production-activation.yml
      REVIEWED_TARGET_BLOB: d58776a5f1a079ec56ea8e130f31f335b0b6b14f

    steps:
      - name: Checkout exact current release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/stabilized-deploy
          fetch-depth: 1

      - name: Validate release, reviewed workflow, and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$release_sha" || {
            echo 'breakglass_blocker=release_advanced'
            exit 2
          }
          test -f "$TARGET_WORKFLOW"
          test "$(git hash-object "$TARGET_WORKFLOW")" = "$REVIEWED_TARGET_BLOB" || {
            echo 'breakglass_blocker=reviewed_production_workflow_changed'
            exit 2
          }
          test -n "$SSH_HOST" || { echo 'breakglass_blocker=missing_ssh_host'; exit 2; }
          test -n "$SSH_USER" || { echo 'breakglass_blocker=missing_ssh_user'; exit 2; }
          test -n "$SSH_KEY" || { echo 'breakglass_blocker=missing_ssh_key'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'breakglass_blocker=missing_known_hosts'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'breakglass_blocker=invalid_ssh_port'; exit 2; }
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "breakglass_release_sha=$release_sha"

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Execute exact reviewed 0024 production activation body
        shell: bash
        run: |
          set -euo pipefail
          python - "$TARGET_WORKFLOW" "$RUNNER_TEMP/activation.sh" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text().splitlines()
          output = Path(sys.argv[2])
          step_name = "      - name: Apply 0024 workflow handoff migration and deploy exact release"
          step_index = source.index(step_name)
          run_index = None
          for idx in range(step_index + 1, len(source)):
              if source[idx] == "        run: |":
                  run_index = idx
                  break
              if source[idx].startswith("      - name:"):
                  break
          if run_index is None:
              raise SystemExit("breakglass_blocker=reviewed_activation_run_block_missing")
          body = []
          for line in source[run_index + 1:]:
              if line and not line.startswith("          "):
                  break
              body.append(line[10:] if line.startswith("          ") else "")
          if not body or body[0].strip() != "set -euo pipefail":
              raise SystemExit("breakglass_blocker=reviewed_activation_body_unexpected")
          output.write_text("\n".join(body) + "\n")
          PY
          chmod 700 "$RUNNER_TEMP/activation.sh"
          export GITHUB_SHA="$RELEASE_SHA"
          set -o pipefail
          bash "$RUNNER_TEMP/activation.sh" 2>&1 | tee "$RUNNER_TEMP/activation.log"

      - name: Report owner-approved activation result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_STATUS: ${{ job.status }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          markers=''
          if [ -f "$RUNNER_TEMP/activation.log" ]; then
            markers="$(grep -E '^(workflow_handoff_|breakglass_)' "$RUNNER_TEMP/activation.log" | tail -n 80 || true)"
          fi
          body="phase4_owner_approved_breakglass_result
          run_id=${GITHUB_RUN_ID}
          release_sha=${RELEASE_SHA:-unknown}
          status=${RESULT_STATUS}"
          if [ -n "$markers" ]; then
            body="${body}

markers:
${markers}"
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="$body" >/dev/null
