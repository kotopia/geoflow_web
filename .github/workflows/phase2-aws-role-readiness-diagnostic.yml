name: Phase 2 AWS role readiness diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase2-aws-role-readiness-diagnostic.yml
      - scripts/ops/phase2_aws_role_readiness_probe.py
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  aws-role-readiness-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs and reviewed probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }
          python -m py_compile scripts/ops/phase2_aws_role_readiness_probe.py
          test "$(git hash-object scripts/ops/phase2_aws_role_readiness_probe.py)" = "b16552fb04502c9c5a9572b6691c079ee4699a54" || {
            echo 'phase2_role_diag_blocker=reviewed_probe_blob_changed'
            exit 2
          }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Stage reviewed read-only probe
        shell: bash
        run: |
          set -euo pipefail
          remote_probe="/tmp/geoflow-phase2-role-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          scp -q \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            scripts/ops/phase2_aws_role_readiness_probe.py \
            "$SSH_USER@$SSH_HOST:$remote_probe"
          echo "REMOTE_PROBE=$remote_probe" >> "$GITHUB_ENV"

      - name: Read-only role-only runtime diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "REMOTE_PROBE='$REMOTE_PROBE' bash -s" <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'
          expected_probe_blob='b16552fb04502c9c5a9572b6691c079ee4699a54'
          expected_secret_resolver_blob='e36057251ce9e38fa7ea5cf4a7058eeafbc2f171'
          fail() { echo "phase2_role_diag_blocker=$1"; exit 2; }

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'stabilized_service_not_running'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'
          [ -s "$REMOTE_PROBE" ] || fail 'staged_probe_missing'
          [ "$(git hash-object "$REMOTE_PROBE")" = "$expected_probe_blob" ] || fail 'staged_probe_not_reviewed'

          resolver="$repo/control/services/tenant_db_secret_resolver.py"
          [ -f "$resolver" ] || fail 'runtime_secret_resolver_missing'
          [ "$(git -C "$repo" hash-object "$resolver")" = "$expected_secret_resolver_blob" ] || fail 'runtime_secret_resolver_not_reviewed'

          # The staged probe prints only bounded status/cause categories,
          # fallback-vs-role read results, and read-only policy inventory counts.
          # It never prints credentials, secret identifiers, ARNs, account IDs,
          # bucket names, object keys, DB hosts/names, tenant identifiers, policy
          # names, or policy documents.
          "$python" "$REMOTE_PROBE" "$repo"
          REMOTE

      - name: Remove staged probe
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${REMOTE_PROBE:-}" ]; then
            ssh \
              -i "$HOME/.ssh/geoflow_deploy_key" \
              -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" \
              "rm -f '$REMOTE_PROBE'" >/dev/null 2>&1
          fi
