name: Phase 1 active tenant connection diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase1-active-tenant-connection-diagnostic.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  active-tenant-connection-diagnostic:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST" || { echo 'missing_secret=GEOFLOW_DEPLOY_HOST'; exit 2; }
          test -n "$SSH_USER" || { echo 'missing_secret=GEOFLOW_DEPLOY_USER'; exit 2; }
          test -n "$SSH_KEY" || { echo 'missing_secret=GEOFLOW_DEPLOY_SSH_KEY'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'missing_secret=GEOFLOW_DEPLOY_KNOWN_HOSTS'; exit 2; }
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || { echo 'invalid_ssh_port=yes'; exit 2; }

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Read-only active tenant DB connection diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          service='geoflow-stabilized.service'
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || { echo 'active_tenant_diag_blocker=stabilized_service_not_running'; exit 2; }

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || { echo 'active_tenant_diag_blocker=service_working_directory_missing'; exit 2; }
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || { echo 'active_tenant_diag_blocker=service_repo_missing'; exit 2; }
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || { echo 'active_tenant_diag_blocker=stabilized_venv_python_missing'; exit 2; }

          # No password, AWS key/token, secret payload, account/ARN, group/user ID,
          # alias, host, username, or database name is printed by this process.
          "$python" - "$repo" <<'PY'
          import hmac
          import json
          import os
          import sys
          from collections import Counter

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import boto3
          import psycopg2
          from botocore.exceptions import ClientError
          from django.db import connections

          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          def text(value):
              return str(value or "").strip()

          def is_active(row):
              return text(getattr(row.group, "status", "")).lower() == "active"

          def classify_db_error(exc):
              code = text(getattr(exc, "pgcode", None))
              if code == "28P01":
                  return "authentication"
              if code == "3D000":
                  return "database_missing"
              if code.startswith("08"):
                  return "connection"
              message = text(exc).lower()
              if "password authentication failed" in message or "authentication failed" in message:
                  return "authentication"
              if "does not exist" in message and "database" in message:
                  return "database_missing"
              if "timeout" in message or "timed out" in message:
                  return "timeout"
              if "could not translate host name" in message or "name or service not known" in message:
                  return "dns"
              if "connection refused" in message:
                  return "connection_refused"
              if "no pg_hba.conf entry" in message:
                  return "pg_hba"
              if "ssl" in message or "certificate" in message:
                  return "ssl"
              return "other"

          def try_connect(row, password):
              if not password:
                  return False, "empty_password"
              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=row.db_host,
                      port=row.db_port,
                      sslmode="require",
                      connect_timeout=8,
                  )
                  try:
                      with conn.cursor() as cursor:
                          cursor.execute("SELECT 1")
                          value = cursor.fetchone()
                          if not value or value[0] != 1:
                              return False, "unexpected_result"
                  finally:
                      conn.close()
                  return True, "ok"
              except Exception as exc:
                  return False, classify_db_error(exc)

          rows = list(
              GroupDBConfig.objects.using("default")
              .select_related("group")
              .order_by("group_id")
          )
          active_rows = [r for r in rows if is_active(r)]
          print(f"active_tenant_diag_total_configs={len(rows)}")
          print(f"active_tenant_diag_active_configs={len(active_rows)}")

          # Count which active groups are actually selectable by at least one active,
          # verified central user membership. No user/group identifiers are emitted.
          serving_membership_groups = 0
          serving_membership_total = 0
          with connections["default"].cursor() as cursor:
              for row in active_rows:
                  cursor.execute(
                      """
                      SELECT COUNT(*)
                        FROM user_group_map ugm
                        JOIN users u ON u.id = ugm.user_id
                       WHERE ugm.group_id = %s
                         AND ugm.status = 'active'
                         AND u.is_active = TRUE
                         AND u.email_verified = TRUE
                      """,
                      [str(row.group_id)],
                  )
                  count = int(cursor.fetchone()[0])
                  serving_membership_total += count
                  if count > 0:
                      serving_membership_groups += 1
          print(f"active_tenant_diag_groups_with_serving_membership={serving_membership_groups}")
          print(f"active_tenant_diag_serving_memberships={serving_membership_total}")

          stored_results = Counter()
          failed_rows = []
          for row in active_rows:
              raw = text(row.db_password)
              if is_tenant_db_secret_reference(raw):
                  try:
                      raw = resolve_tenant_db_password(raw)
                  except Exception:
                      raw = ""
              ok, category = try_connect(row, raw)
              stored_results[category] += 1
              if not ok:
                  failed_rows.append(row)

          print(f"active_tenant_diag_stored_ok={stored_results['ok']}")
          for category in (
              "authentication", "database_missing", "timeout", "dns",
              "connection_refused", "connection", "pg_hba", "ssl",
              "empty_password", "unexpected_result", "other"
          ):
              print(f"active_tenant_diag_stored_fail_{category}={stored_results[category]}")

          # Determine whether failed rows are serving-path groups.
          failed_serving_groups = 0
          with connections["default"].cursor() as cursor:
              for row in failed_rows:
                  cursor.execute(
                      """
                      SELECT EXISTS (
                          SELECT 1
                            FROM user_group_map ugm
                            JOIN users u ON u.id = ugm.user_id
                           WHERE ugm.group_id = %s
                             AND ugm.status = 'active'
                             AND u.is_active = TRUE
                             AND u.email_verified = TRUE
                      )
                      """,
                      [str(row.group_id)],
                  )
                  if bool(cursor.fetchone()[0]):
                      failed_serving_groups += 1
          print(f"active_tenant_diag_failed_configs={len(failed_rows)}")
          print(f"active_tenant_diag_failed_serving_groups={failed_serving_groups}")

          # Test existing runtime env password candidates only against failed rows.
          # Values and source names are not printed.
          env_values = []
          for key in ("TENANT_DB_PASSWORD", "PROVISIONER_DB_PASSWORD", "CENTRAL_DB_PASSWORD"):
              value = text(os.environ.get(key))
              if value and value not in env_values:
                  env_values.append(value)
          env_recoverable = 0
          for row in failed_rows:
              if any(try_connect(row, candidate)[0] for candidate in env_values):
                  env_recoverable += 1
          print(f"active_tenant_diag_failed_env_recoverable={env_recoverable}")

          # Test one unambiguous peer password with identical host/port/user, if any.
          resolved_rows = []
          for row in active_rows:
              raw = text(row.db_password)
              if not raw:
                  continue
              try:
                  value = resolve_tenant_db_password(raw) if is_tenant_db_secret_reference(raw) else raw
              except Exception:
                  continue
              if value:
                  resolved_rows.append((row, value))

          def identity(row):
              return (text(row.db_host).lower(), int(row.db_port), text(row.db_user))

          peer_recoverable = 0
          for row in failed_rows:
              candidates = []
              for peer, password in resolved_rows:
                  if peer.group_id == row.group_id:
                      continue
                  if identity(peer) == identity(row) and password not in candidates:
                      candidates.append(password)
              if len(candidates) == 1 and try_connect(row, candidates[0])[0]:
                  peer_recoverable += 1
          print(f"active_tenant_diag_failed_peer_recoverable={peer_recoverable}")

          # Check Secrets Manager state left by previous transition attempts.
          region = text(os.environ.get("AWS_REGION")) or "ap-northeast-2"
          sm = boto3.client("secretsmanager", region_name=region)
          secret_existing = 0
          secret_matching = 0
          secret_mismatch = 0
          secret_missing = 0
          secret_denied = 0
          for row in active_rows:
              secret_id = f"geoflow/tenant-db/{row.group_id}/password"
              try:
                  response = sm.get_secret_value(SecretId=secret_id)
              except ClientError as exc:
                  code = text(exc.response.get("Error", {}).get("Code"))
                  if code in {"ResourceNotFoundException", "ResourceNotFound"}:
                      secret_missing += 1
                  elif code in {"AccessDeniedException", "AccessDenied", "UnauthorizedException"}:
                      secret_denied += 1
                  continue
              except Exception:
                  continue

              secret_existing += 1
              try:
                  parsed = json.loads(response.get("SecretString"))
                  secret_password = parsed.get("password") if isinstance(parsed, dict) else None
              except Exception:
                  secret_password = None

              raw = text(row.db_password)
              if is_tenant_db_secret_reference(raw):
                  try:
                      raw = resolve_tenant_db_password(raw, client=sm)
                  except Exception:
                      raw = ""
              if raw and isinstance(secret_password, str):
                  if hmac.compare_digest(raw, secret_password):
                      secret_matching += 1
                  else:
                      secret_mismatch += 1

          print(f"active_tenant_diag_secrets_existing={secret_existing}")
          print(f"active_tenant_diag_secrets_matching_stored={secret_matching}")
          print(f"active_tenant_diag_secrets_mismatch={secret_mismatch}")
          print(f"active_tenant_diag_secrets_missing={secret_missing}")
          print(f"active_tenant_diag_secrets_denied={secret_denied}")
          print("phase1_active_tenant_connection_diagnostic_complete=yes")
          PY
          REMOTE
