name: Phase 4 event production activation

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase4-event-production-activation.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"

permissions:
  contents: read

jobs:
  event-production-activation:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact release and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'phase4_event_activation_blocker=release_advanced'
            exit 2
          }
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || {
            echo 'phase4_event_activation_blocker=invalid_ssh_port'
            exit 2
          }
          echo 'phase4_event_activation_exact_release=yes'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Apply 0019 to existing tenant event schemas and deploy exact release
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          candidate_sha="$1"
          service='geoflow-stabilized.service'
          expected_branch='release/stabilized-deploy'

          fail() {
            echo "phase4_event_activation_blocker=$1"
            exit 2
          }

          command -v git >/dev/null 2>&1 || fail 'git_missing'
          command -v systemctl >/dev/null 2>&1 || fail 'systemctl_missing'
          command -v curl >/dev/null 2>&1 || fail 'curl_missing'
          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'

          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = 'active' ] && [ "$sub" = 'running' ] || fail 'stabilized_service_not_running_before_activation'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'service_repo_missing'
          [ -f "$repo/manage.py" ] || fail 'manage_py_missing'
          [ -f "$repo/requirements.txt" ] || fail 'requirements_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'

          origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
          case "$origin" in
            https://github.com/kotopia/geoflow_web|https://github.com/kotopia/geoflow_web.git|git@github.com:kotopia/geoflow_web.git)
              ;;
            *) fail 'unexpected_repository_origin' ;;
          esac

          dirty_count="$(git -C "$repo" status --porcelain | wc -l | tr -d ' ')"
          [ "$dirty_count" = '0' ] || fail 'production_worktree_dirty'

          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'stabilized_venv_python_missing'
          [ -x "$repo/.venv/bin/gunicorn" ] || fail 'stabilized_gunicorn_missing'

          exec_raw="$(systemctl show "$service" -p ExecStart --value 2>/dev/null || true)"
          printf '%s' "$exec_raw" | grep -Fq "$repo/.venv/bin/gunicorn" || fail 'service_exec_not_stabilized_venv'
          printf '%s' "$exec_raw" | grep -Fq 'geoflow_project.wsgi:application' || fail 'service_wsgi_target_unexpected'

          before_code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/login/ || true)"
          echo "phase4_event_activation_local_login_before=$before_code"
          case "$before_code" in
            2??|3??) ;;
            *) fail 'local_login_unhealthy_before_activation' ;;
          esac

          previous_sha="$(git -C "$repo" rev-parse HEAD)"
          previous_branch="$(git -C "$repo" symbolic-ref --short -q HEAD || true)"
          echo "phase4_event_activation_previous_sha=$previous_sha"
          echo "phase4_event_activation_candidate_sha=$candidate_sha"

          # Apply exactly the additive/data-normalizing database effects of
          # webgisapp.0019. Existing business rows are never deleted. Each tenant
          # is committed independently only after postconditions pass.
          "$python" - "$repo" <<'PY'
          from collections import Counter
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import psycopg2
          from django.db import connections, transaction

          from control.models import GroupDBConfig
          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          APP = "webgisapp"
          DEPENDENCY = "0018_processevent_processeventattachment"
          MIGRATION = "0019_phase4_event_workflow_foundation"
          REQUIRED_COLUMNS = {
              "contract_id", "project_id", "owner_department_id",
              "assignee_employee_id", "payload",
          }

          def text(value):
              return str(value or "").strip()

          def scalar(cur, sql, params=None):
              cur.execute(sql, params or [])
              row = cur.fetchone()
              return row[0] if row else None

          with transaction.atomic(using="default"):
              with connections["default"].cursor() as central_cur:
                  central_cur.execute("SET LOCAL TRANSACTION READ ONLY")
                  rows = list(
                      GroupDBConfig.objects.using("default")
                      .select_related("group")
                      .order_by("group_id")
                  )

          active_rows = [
              row for row in rows
              if text(getattr(row.group, "status", "")).lower() == "active"
          ]
          totals = Counter()
          totals["configs"] = len(rows)
          totals["active_tenants"] = len(active_rows)

          for row in active_rows:
              raw = text(row.db_password)
              try:
                  password = (
                      resolve_tenant_db_password(raw)
                      if is_tenant_db_secret_reference(raw)
                      else raw
                  )
              except Exception:
                  totals["secret_resolution_failed"] += 1
                  continue
              if not password:
                  totals["secret_resolution_failed"] += 1
                  continue

              try:
                  conn = psycopg2.connect(
                      dbname=row.db_name,
                      user=row.db_user,
                      password=password,
                      host=row.db_host,
                      port=row.db_port,
                      sslmode="require",
                      connect_timeout=8,
                  )
              except Exception:
                  totals["connection_failed"] += 1
                  continue

              try:
                  conn.autocommit = False
                  with conn.cursor() as cur:
                      cur.execute("SET LOCAL lock_timeout = '5s'")
                      cur.execute("SET LOCAL statement_timeout = '60s'")
                      cur.execute("SELECT pg_advisory_xact_lock(hashtext(%s))", ["geoflow:webgisapp:0019"])

                      events_present = bool(scalar(cur, "SELECT to_regclass('ops.process_events') IS NOT NULL"))
                      projects_present = bool(scalar(cur, "SELECT to_regclass('prj.projects') IS NOT NULL"))
                      contracts_present = bool(scalar(cur, "SELECT to_regclass('ctr.contracts') IS NOT NULL"))

                      if not events_present:
                          # The read-only audit found one active but not-yet-initialized
                          # tenant. Only a fully schema-absent tenant may be skipped.
                          if projects_present or contracts_present:
                              raise RuntimeError("partial tenant business schema cannot be skipped")
                          conn.rollback()
                          totals["schema_absent_skipped"] += 1
                          continue

                      if not projects_present or not contracts_present:
                          raise RuntimeError("event tenant missing project/contract schema")

                      dep_applied = bool(scalar(
                          cur,
                          "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                          [APP, DEPENDENCY],
                      ))
                      if not dep_applied:
                          raise RuntimeError("0018 dependency not applied")

                      already_applied = bool(scalar(
                          cur,
                          "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                          [APP, MIGRATION],
                      ))

                      before_count = int(scalar(cur, "SELECT COUNT(*) FROM ops.process_events"))

                      if not already_applied:
                          cur.execute("ALTER TABLE ops.process_events ADD COLUMN IF NOT EXISTS contract_id uuid NULL")
                          cur.execute("ALTER TABLE ops.process_events ADD COLUMN IF NOT EXISTS project_id uuid NULL")
                          cur.execute("ALTER TABLE ops.process_events ADD COLUMN IF NOT EXISTS owner_department_id uuid NULL")
                          cur.execute("ALTER TABLE ops.process_events ADD COLUMN IF NOT EXISTS assignee_employee_id uuid NULL")
                          cur.execute("ALTER TABLE ops.process_events ADD COLUMN IF NOT EXISTS payload jsonb NOT NULL DEFAULT '{}'::jsonb")

                          cur.execute("CREATE INDEX IF NOT EXISTS idx_event_contract ON ops.process_events (contract_id)")
                          cur.execute("CREATE INDEX IF NOT EXISTS idx_event_project ON ops.process_events (project_id)")
                          cur.execute("CREATE INDEX IF NOT EXISTS idx_event_owner_dept ON ops.process_events (owner_department_id)")
                          cur.execute("CREATE INDEX IF NOT EXISTS idx_event_assignee ON ops.process_events (assignee_employee_id)")

                          cur.execute("UPDATE ops.process_events SET contract_id = scope_id WHERE scope_type = 'contract' AND contract_id IS NULL")
                          cur.execute("UPDATE ops.process_events SET project_id = scope_id WHERE scope_type = 'project' AND project_id IS NULL")
                          cur.execute("""
                              UPDATE ops.process_events AS e
                                 SET contract_id = p.contract_id
                                FROM prj.projects AS p
                               WHERE e.project_id = p.id
                                 AND e.contract_id IS NULL
                                 AND p.contract_id IS NOT NULL
                          """)

                          cur.execute("UPDATE ops.process_events SET stage = 'pre_contract' WHERE event_type = 'estimate'")
                          cur.execute("UPDATE ops.process_events SET stage = 'contract' WHERE event_type IN ('contract_doc', 'suspend')")
                          cur.execute("UPDATE ops.process_events SET stage = 'kickoff' WHERE event_type = 'kickoff'")
                          cur.execute("UPDATE ops.process_events SET stage = 'execution' WHERE event_type = 'progress_report'")
                          cur.execute("UPDATE ops.process_events SET stage = 'inspection' WHERE event_type = 'inspection'")
                          cur.execute("UPDATE ops.process_events SET stage = 'closeout' WHERE event_type = 'completion_doc'")
                          cur.execute("UPDATE ops.process_events SET stage = 'billing' WHERE event_type IN ('advance_payment', 'invoice', 'payment')")
                          cur.execute("UPDATE ops.process_events SET stage = 'execution' WHERE stage = 'project'")
                          cur.execute("UPDATE ops.process_events SET stage = 'billing' WHERE stage = 'blilling'")

                          cur.execute(
                              """
                              INSERT INTO django_migrations (app, name, applied)
                              SELECT %s, %s, NOW()
                               WHERE NOT EXISTS (
                                   SELECT 1 FROM django_migrations WHERE app=%s AND name=%s
                               )
                              """,
                              [APP, MIGRATION, APP, MIGRATION],
                          )

                      cur.execute("""
                          SELECT column_name
                            FROM information_schema.columns
                           WHERE table_schema='ops' AND table_name='process_events'
                      """)
                      columns = {text(r[0]) for r in cur.fetchall()}
                      if not REQUIRED_COLUMNS.issubset(columns):
                          raise RuntimeError("0019 required columns missing")

                      after_count = int(scalar(cur, "SELECT COUNT(*) FROM ops.process_events"))
                      if after_count != before_count:
                          raise RuntimeError("event row count changed")

                      legacy_project = int(scalar(cur, "SELECT COUNT(*) FROM ops.process_events WHERE stage='project'"))
                      legacy_blilling = int(scalar(cur, "SELECT COUNT(*) FROM ops.process_events WHERE stage='blilling'"))
                      if legacy_project or legacy_blilling:
                          raise RuntimeError("legacy stage normalization incomplete")

                      missing_contract_lineage = int(scalar(
                          cur,
                          "SELECT COUNT(*) FROM ops.process_events WHERE scope_type='contract' AND contract_id IS NULL",
                      ))
                      if missing_contract_lineage:
                          raise RuntimeError("contract lineage backfill incomplete")

                      missing_project_lineage = int(scalar(
                          cur,
                          "SELECT COUNT(*) FROM ops.process_events WHERE scope_type='project' AND project_id IS NULL",
                      ))
                      if missing_project_lineage:
                          raise RuntimeError("project lineage backfill incomplete")

                      migration_recorded = bool(scalar(
                          cur,
                          "SELECT EXISTS (SELECT 1 FROM django_migrations WHERE app=%s AND name=%s)",
                          [APP, MIGRATION],
                      ))
                      if not migration_recorded:
                          raise RuntimeError("0019 migration record missing")

                  conn.commit()
                  totals["already_applied" if already_applied else "migrated"] += 1
                  totals["event_rows_verified"] += before_count
              except Exception:
                  conn.rollback()
                  totals["migration_failed"] += 1
              finally:
                  conn.close()

          for key in (
              "configs", "active_tenants", "migrated", "already_applied",
              "schema_absent_skipped", "secret_resolution_failed", "connection_failed",
              "migration_failed", "event_rows_verified",
          ):
              print(f"phase4_event_activation_{key}={int(totals[key])}")

          accounted = totals["migrated"] + totals["already_applied"] + totals["schema_absent_skipped"]
          if accounted != totals["active_tenants"]:
              raise SystemExit("phase4_event_activation_blocker=not_all_active_tenants_accounted")
          if totals["secret_resolution_failed"] or totals["connection_failed"] or totals["migration_failed"]:
              raise SystemExit("phase4_event_activation_blocker=tenant_migration_failure")

          print("phase4_event_activation_db_complete=yes")
          PY

          # Database changes above are additive and backward-compatible with the
          # previous application SHA. Now deploy the exact reviewed release.
          git -C "$repo" fetch --prune origin refs/heads/release/stabilized-deploy
          fetched_sha="$(git -C "$repo" rev-parse FETCH_HEAD)"
          [ "$fetched_sha" = "$candidate_sha" ] || fail 'candidate_sha_not_current_release_head'

          rollback_needed=0
          rollback_code() {
            set +e
            if [ "$rollback_needed" -eq 1 ]; then
              echo 'phase4_event_activation_code_rollback_started=yes'
              if [ -n "$previous_branch" ]; then
                git -C "$repo" checkout -B "$previous_branch" "$previous_sha" >/dev/null 2>&1
              else
                git -C "$repo" checkout --detach "$previous_sha" >/dev/null 2>&1
              fi
              "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt" >/dev/null 2>&1
              "$python" "$repo/manage.py" collectstatic --noinput >/dev/null 2>&1
              sudo -n systemctl restart "$service"
              sleep 3
              echo "phase4_event_activation_rollback_service_state=$(systemctl is-active "$service" 2>/dev/null || true)"
              echo 'phase4_event_activation_code_rollback_completed=yes'
            fi
          }

          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              rollback_code
            fi
            exit "$rc"
          }
          trap on_exit EXIT
          rollback_needed=1

          git -C "$repo" checkout -B "$expected_branch" "$candidate_sha"
          [ "$(git -C "$repo" rev-parse HEAD)" = "$candidate_sha" ] || fail 'candidate_checkout_failed'

          "$python" -m pip install --disable-pip-version-check --no-input -r "$repo/requirements.txt"
          "$python" -m pip check
          "$python" "$repo/manage.py" check
          "$python" "$repo/manage.py" collectstatic --noinput

          sudo -n systemctl restart "$service"

          ready=no
          for _ in $(seq 1 30); do
            active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
            sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
            code="$(curl -sS -H 'Host: geoflow.co.kr' -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8011/login/ || true)"
            if [ "$active" = 'active' ] && [ "$sub" = 'running' ]; then
              case "$code" in
                2??|3??) ready=yes; break ;;
              esac
            fi
            sleep 2
          done
          [ "$ready" = yes ] || fail 'stabilized_service_failed_post_restart_healthcheck'

          public_login="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/login/ || true)"
          echo "phase4_event_activation_public_login_status=$public_login"
          [ "$public_login" = '200' ] || fail 'public_login_not_200_after_activation'

          rollback_needed=0
          trap - EXIT
          echo "phase4_event_activation_deployed_sha=$(git -C "$repo" rev-parse HEAD)"
          echo "phase4_event_activation_deployed_branch=$(git -C "$repo" rev-parse --abbrev-ref HEAD)"
          echo 'phase4_event_production_activation_complete=yes'
          REMOTE
