name: Phase 2 runtime security remediation launcher

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase2-runtime-security-remediation-launcher.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-reviewed-current-release:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact release merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release has not advanced
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'phase2_runtime_security_launcher_blocker=release_advanced'
            exit 2
          }
          test -f .github/workflows/phase2-runtime-security-remediation.yml || {
            echo 'phase2_runtime_security_launcher_blocker=remediation_workflow_missing'
            exit 2
          }
          echo 'phase2_runtime_security_launcher_exact_release=yes'

      - name: Dispatch reviewed guarded runtime security remediation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"release/stabilized-deploy","inputs":{"confirm_remediation":"PHASE2_RUNTIME_SECURITY","ssh_port":"22"}}'
          printf '%s' "$payload" | gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --input - \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/phase2-runtime-security-remediation.yml/dispatches"
          echo 'phase2_runtime_security_launcher_dispatched=yes'
