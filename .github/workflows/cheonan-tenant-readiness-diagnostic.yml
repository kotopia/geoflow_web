name: Cheonan tenant readiness diagnostic

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/cheonan-tenant-readiness-diagnostic.yml
  workflow_dispatch:
    inputs:
      ssh_port:
        description: SSH port for the reviewed GeoFlow host
        required: false
        default: "22"
        type: string

permissions:
  contents: read

jobs:
  cheonan-tenant-readiness:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ inputs.ssh_port || '22' }}

    steps:
      - name: Checkout reviewed release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate reviewed branch and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{1,5}$'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Read-only Cheonan central metadata and DB readiness diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/geoflow_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          service='geoflow-stabilized.service'
          [ "$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)" = active ] || {
            echo 'cheonan_diag_blocker=stabilized_service_not_active'
            exit 2
          }
          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || { echo 'cheonan_diag_blocker=runtime_python_missing'; exit 2; }

          "$python" - "$repo" <<'PY'
          import hmac
          import json
          import os
          import sys

          repo = sys.argv[1]
          sys.path.insert(0, repo)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "geoflow_project.settings")

          import django
          django.setup()

          import boto3
          import psycopg2
          from botocore.exceptions import ClientError
          from django.conf import settings
          from django.db import connections

          from control.services.tenant_db_secret_resolver import (
              is_tenant_db_secret_reference,
              resolve_tenant_db_password,
          )

          TARGET_ALIAS = "cheonan_db"

          def text(value):
              return str(value or "").strip()

          def yes(value):
              return "yes" if bool(value) else "no"

          def connect_ok(name, user, password, host, port):
              if not all(text(v) for v in (name, user, password, host, port)):
                  return False
              try:
                  conn = psycopg2.connect(
                      dbname=name,
                      user=user,
                      password=password,
                      host=host,
                      port=port,
                      sslmode="require",
                      connect_timeout=8,
                  )
                  try:
                      with conn.cursor() as cur:
                          cur.execute("SELECT 1")
                          row = cur.fetchone()
                          return bool(row and row[0] == 1)
                  finally:
                      conn.close()
              except Exception:
                  return False

          with connections["default"].cursor() as cur:
              cur.execute(
                  """
                  SELECT g.id::text, g.status, c.db_name, c.db_host, c.db_port,
                         c.db_user, c.db_password
                    FROM group_db_config c
                    JOIN groups g ON g.id = c.group_id
                   WHERE c.db_alias = %s
                  """,
                  [TARGET_ALIAS],
              )
              rows = cur.fetchall()

          print(f"cheonan_diag_config_rows={len(rows)}")
          if len(rows) != 1:
              raise SystemExit("cheonan_diag_blocker=expected_single_config")

          group_id, group_status, db_name, db_host, db_port, db_user, stored_password = rows[0]
          raw_status = str(group_status or "")
          print(f"cheonan_diag_group_status_exact_active={yes(raw_status.lower() == 'active')}")
          print(f"cheonan_diag_group_status_normalized_active={yes(raw_status.strip().lower() == 'active')}")
          print(f"cheonan_diag_group_dropdown_eligible={yes(raw_status.lower() == 'active')}")

          with connections["default"].cursor() as cur:
              cur.execute(
                  """
                  SELECT
                      COUNT(*),
                      COUNT(*) FILTER (WHERE ugm.status = 'active'),
                      COUNT(*) FILTER (WHERE lower(trim(COALESCE(ugm.status,''))) = 'active'),
                      COUNT(*) FILTER (
                          WHERE ugm.status = 'active'
                            AND u.is_active = TRUE
                            AND u.email_verified = TRUE
                      )
                    FROM user_group_map ugm
                    JOIN users u ON u.id = ugm.user_id
                   WHERE ugm.group_id = %s
                  """,
                  [group_id],
              )
              total_memberships, active_memberships, normalized_active, serving_memberships = cur.fetchone()

              cur.execute(
                  """
                  SELECT r.code,
                         COUNT(*) AS memberships,
                         COUNT(rp.permission_id) AS permission_links
                    FROM user_group_map ugm
                    JOIN roles r ON r.id = ugm.role_id
                    LEFT JOIN role_permissions rp ON rp.role_id = r.id
                   WHERE ugm.group_id = %s
                     AND ugm.status = 'active'
                   GROUP BY r.code
                   ORDER BY r.code
                  """,
                  [group_id],
              )
              role_rows = cur.fetchall()

          print(f"cheonan_diag_memberships_total={int(total_memberships)}")
          print(f"cheonan_diag_memberships_exact_active={int(active_memberships)}")
          print(f"cheonan_diag_memberships_normalized_active={int(normalized_active)}")
          print(f"cheonan_diag_active_verified_memberships={int(serving_memberships)}")
          print(f"cheonan_diag_assigned_active_roles={len(role_rows)}")
          permissionless = 0
          for role_code, membership_count, permission_links in role_rows:
              safe_code = text(role_code).replace("\n", "").replace("\r", "")
              print(f"cheonan_diag_role={safe_code}:memberships={int(membership_count)}:permission_links={int(permission_links)}")
              if int(permission_links) == 0:
                  permissionless += 1
          print(f"cheonan_diag_permissionless_active_roles={permissionless}")

          required = (db_name, db_host, db_port, db_user, stored_password)
          print(f"cheonan_diag_group_config_complete={yes(all(text(v) for v in required))}")
          if not text(stored_password):
              password_mode = "blank"
          elif is_tenant_db_secret_reference(stored_password):
              password_mode = "secret_reference"
          else:
              password_mode = "plain_value"
          print(f"cheonan_diag_password_mode={password_mode}")

          try:
              resolved_stored = resolve_tenant_db_password(stored_password)
          except Exception:
              resolved_stored = ""
          print(
              "cheonan_diag_group_config_connects="
              + yes(connect_ok(db_name, db_user, resolved_stored, db_host, db_port))
          )

          static = settings.DATABASES.get(TARGET_ALIAS)
          print(f"cheonan_diag_static_alias_registered={yes(isinstance(static, dict))}")
          if isinstance(static, dict):
              static_required = (
                  static.get("NAME"), static.get("HOST"), static.get("PORT"),
                  static.get("USER"), static.get("PASSWORD"),
              )
              print(f"cheonan_diag_static_config_complete={yes(all(text(v) for v in static_required))}")
              try:
                  with connections[TARGET_ALIAS].cursor() as cur:
                      cur.execute("SELECT 1")
                      static_connects = cur.fetchone() == (1,)
              except Exception:
                  static_connects = False
              print(f"cheonan_diag_static_alias_connects={yes(static_connects)}")
              print(f"cheonan_diag_name_matches_static={yes(text(db_name) == text(static.get('NAME')))}")
              print(f"cheonan_diag_host_matches_static={yes(text(db_host).lower() == text(static.get('HOST')).lower())}")
              print(f"cheonan_diag_port_matches_static={yes(text(db_port) == text(static.get('PORT')))}")
              print(f"cheonan_diag_user_matches_static={yes(text(db_user) == text(static.get('USER')))}")
              static_password = text(static.get("PASSWORD"))
              password_matches = bool(resolved_stored and static_password) and hmac.compare_digest(
                  resolved_stored, static_password
              )
              print(f"cheonan_diag_password_matches_static={yes(password_matches)}")

          region = text(os.environ.get("AWS_REGION")) or "ap-northeast-2"
          sm = boto3.client("secretsmanager", region_name=region)
          secret_id = f"geoflow/tenant-db/{group_id}/password"
          secret_password = ""
          secret_exists = False
          try:
              response = sm.get_secret_value(SecretId=secret_id)
              secret_exists = True
              payload = json.loads(response.get("SecretString") or "{}")
              if isinstance(payload, dict):
                  secret_password = text(payload.get("password"))
          except ClientError as exc:
              code = text(exc.response.get("Error", {}).get("Code"))
              print(f"cheonan_diag_secret_readable={yes(code not in {'AccessDeniedException','AccessDenied','UnauthorizedException'})}")
          except Exception:
              pass

          print(f"cheonan_diag_secret_exists={yes(secret_exists)}")
          if secret_exists:
              print(f"cheonan_diag_secret_password_present={yes(bool(secret_password))}")
              secret_matches_stored = bool(secret_password and resolved_stored) and hmac.compare_digest(
                  secret_password, resolved_stored
              )
              print(f"cheonan_diag_secret_matches_stored={yes(secret_matches_stored)}")
              print(
                  "cheonan_diag_secret_connects="
                  + yes(connect_ok(db_name, db_user, secret_password, db_host, db_port))
              )

          print("cheonan_tenant_readiness_diagnostic_complete=yes")
          PY
          REMOTE
