name: Phase 2 runtime security remediation push

on:
  push:
    branches:
      - release/stabilized-deploy
    paths:
      - .github/workflows/phase2-runtime-security-remediation-push.yml

permissions:
  contents: read

jobs:
  runtime-security-remediation:
    if: github.ref_name == 'release/stabilized-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.GEOFLOW_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.GEOFLOW_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.GEOFLOW_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GEOFLOW_DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: "22"

    steps:
      - name: Checkout exact reviewed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate exact release and connection inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "release/stabilized-deploy"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin release/stabilized-deploy
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'phase2_runtime_security_blocker=release_advanced'
            exit 2
          }
          test -n "$SSH_HOST" || { echo 'phase2_runtime_security_blocker=missing_ssh_host'; exit 2; }
          test -n "$SSH_USER" || { echo 'phase2_runtime_security_blocker=missing_ssh_user'; exit 2; }
          test -n "$SSH_KEY" || { echo 'phase2_runtime_security_blocker=missing_ssh_key'; exit 2; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'phase2_runtime_security_blocker=missing_known_hosts'; exit 2; }
          echo 'phase2_runtime_security_exact_release=yes'

      - name: Configure strict SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/geoflow_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/geoflow_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/geoflow_deploy_key" >/dev/null

      - name: Apply guarded runtime security remediation
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/geoflow_deploy_key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077

          service='geoflow-stabilized.service'
          expected_settings_blob='e66e9e1ecd11947180afe92690a61c8900c32eec'
          expected_db_preflight_blob='52426eafe3e5cd0295252d8a98e4c68bb04942db'
          expected_secret_preflight_blob='c47026132a6665bec32b49ec8af307a4d7f2f47a'
          expected_web_preflight_blob='bd6a6504bc658d9365d0f34567afae62758f0035'
          expected_command_blob='fa1e7432935b7ec992b34c0c841a499ce585530d'
          fail() { echo "phase2_runtime_security_blocker=$1"; exit 2; }
          role_only_shape_env() {
            env \
              AWS_ACCESS_KEY_ID= \
              AWS_SECRET_ACCESS_KEY= \
              AWS_SESSION_TOKEN= \
              AWS_PROFILE= \
              AWS_DEFAULT_PROFILE= \
              AWS_SHARED_CREDENTIALS_FILE= \
              AWS_CONFIG_FILE= \
              AWS_EC2_METADATA_DISABLED= \
              AWS_REQUIRE_ROLE_CREDENTIALS=1 \
              "$@"
          }

          command -v sudo >/dev/null 2>&1 || fail 'sudo_missing'
          sudo -n true >/dev/null 2>&1 || fail 'passwordless_sudo_required'
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'service_not_running_before_remediation'

          workdir="$(systemctl show "$service" -p WorkingDirectory --value 2>/dev/null || true)"
          [ -n "$workdir" ] && [ -d "$workdir" ] || fail 'service_working_directory_missing'
          repo="$(git -C "$workdir" rev-parse --show-toplevel 2>/dev/null || true)"
          [ -n "$repo" ] && [ -d "$repo/.git" ] || fail 'runtime_repo_missing'
          [ -f "$repo/.env" ] || fail 'runtime_dotenv_missing'
          python="$repo/.venv/bin/python"
          [ -x "$python" ] || fail 'runtime_python_missing'

          [ "$(git -C "$repo" hash-object geoflow_project/settings.py)" = "$expected_settings_blob" ] || fail 'runtime_settings_not_reviewed'
          [ "$(git -C "$repo" hash-object control/services/database_runtime_preflight.py)" = "$expected_db_preflight_blob" ] || fail 'runtime_db_preflight_not_reviewed'
          [ "$(git -C "$repo" hash-object control/services/django_secret_preflight.py)" = "$expected_secret_preflight_blob" ] || fail 'runtime_secret_preflight_not_reviewed'
          [ "$(git -C "$repo" hash-object control/services/web_security_preflight.py)" = "$expected_web_preflight_blob" ] || fail 'runtime_web_preflight_not_reviewed'
          [ "$(git -C "$repo" hash-object control/management/commands/check_release_preflight.py)" = "$expected_command_blob" ] || fail 'runtime_preflight_command_not_reviewed'

          # Do not print systemd Environment values; they may contain secret material.
          service_environment="$(systemctl show "$service" -p Environment --value 2>/dev/null || true)"
          if printf '%s' "$service_environment" | grep -Eq '(^|[[:space:]"])(DJANGO_SECRET_KEY|DJANGO_CSRF_TRUSTED_ORIGINS)='; then
            unset service_environment
            fail 'systemd_direct_runtime_security_override_present'
          fi
          unset service_environment

          # Allow the reviewed repository .env only. Other systemd EnvironmentFile
          # sources must not override either setting managed by this remediation.
          unit_dump="$(mktemp)"
          systemctl cat "$service" > "$unit_dump" 2>/dev/null || fail 'systemd_unit_read_failed'
          unit_rc=0
          "$python" - "$unit_dump" "$repo/.env" <<'PY' || unit_rc=$?
          import re
          import shlex
          import sys
          from pathlib import Path

          unit_path = Path(sys.argv[1])
          allowed_env = Path(sys.argv[2]).resolve()
          forbidden = re.compile(
              r"^\s*(?:export\s+)?(?:DJANGO_SECRET_KEY|DJANGO_CSRF_TRUSTED_ORIGINS)\s*="
          )
          for raw in unit_path.read_text(errors="replace").splitlines():
              line = raw.strip()
              if not line.startswith("EnvironmentFile="):
                  continue
              spec = line.split("=", 1)[1].strip()
              try:
                  items = shlex.split(spec)
              except ValueError:
                  raise SystemExit(3)
              for item in items:
                  optional = item.startswith("-")
                  candidate = item[1:] if optional else item
                  if not candidate or any(ch in candidate for ch in ("%", "*", "?", "[")):
                      raise SystemExit(3)
                  path = Path(candidate)
                  if not path.is_absolute():
                      raise SystemExit(3)
                  try:
                      resolved = path.resolve()
                  except OSError:
                      raise SystemExit(3)
                  if resolved == allowed_env:
                      continue
                  if not resolved.is_file():
                      if optional:
                          continue
                      raise SystemExit(3)
                  for env_line in resolved.read_text(errors="replace").splitlines():
                      if forbidden.match(env_line):
                          raise SystemExit(4)
          print('phase2_runtime_security_environment_files_safe=yes')
          PY
          rm -f "$unit_dump"
          [ "$unit_rc" -eq 0 ] || fail 'systemd_environment_file_not_safe'

          cd "$repo"
          before="$(mktemp)"
          before_rc=0
          role_only_shape_env "$python" manage.py check_release_preflight --strict >"$before" 2>&1 || before_rc=$?
          [ "$before_rc" -ne 0 ] || { rm -f "$before"; fail 'preflight_unexpectedly_ready_before_remediation'; }
          fail_count="$(grep -c '^\[FAIL\]' "$before" || true)"
          [ "$fail_count" = '2' ] || { rm -f "$before"; fail 'unexpected_preflight_failure_set'; }
          grep -Fq '[FAIL] django_secret_key:' "$before" || { rm -f "$before"; fail 'django_secret_key_not_expected_blocker'; }
          grep -Fq '[FAIL] csrf_canonical_origin:' "$before" || { rm -f "$before"; fail 'csrf_origin_not_expected_blocker'; }
          rm -f "$before"
          echo 'phase2_runtime_security_precheck_exact_failures=yes'

          backup="$(mktemp /tmp/geoflow-phase2-runtime-security.XXXXXX.env)"
          cp -p "$repo/.env" "$backup"
          chmod 600 "$backup"
          mutation_started=0
          rollback() {
            set +e
            if [ "$mutation_started" -eq 1 ] && [ -f "$backup" ]; then
              cp -p "$backup" "$repo/.env"
              sudo -n systemctl restart "$service" >/dev/null 2>&1 || true
              sleep 2
            fi
            rm -f "$backup"
            echo 'phase2_runtime_security_rollback_completed=yes'
          }
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then rollback; fi
            exit "$rc"
          }
          trap on_exit EXIT

          mutation_started=1
          "$python" - "$repo/.env" <<'PY'
          import os
          import secrets
          import sys
          from pathlib import Path

          env_path = Path(sys.argv[1])
          managed = {"DJANGO_SECRET_KEY", "DJANGO_CSRF_TRUSTED_ORIGINS"}
          out = []
          for line in env_path.read_text().splitlines():
              stripped = line.lstrip()
              if stripped.startswith("#") or "=" not in line:
                  out.append(line)
                  continue
              if line.split("=", 1)[0].strip() not in managed:
                  out.append(line)
          new_key = secrets.token_urlsafe(64)
          if len(new_key) < 50 or new_key.startswith("django-insecure-"):
              raise SystemExit(3)
          out.append(f"DJANGO_SECRET_KEY={new_key}")
          out.append("DJANGO_CSRF_TRUSTED_ORIGINS=https://geoflow.co.kr")
          tmp = env_path.with_name(env_path.name + ".phase2-runtime-security.tmp")
          tmp.write_text("\n".join(out) + "\n")
          os.chmod(tmp, 0o600)
          os.replace(tmp, env_path)
          print('phase2_runtime_security_env_updated=yes')
          PY

          role_only_shape_env "$python" manage.py check_release_preflight --strict >/dev/null
          echo 'phase2_runtime_security_role_only_preflight_ready=yes'
          env -u DJANGO_SECRET_KEY -u DJANGO_CSRF_TRUSTED_ORIGINS "$python" manage.py check >/dev/null

          sudo -n systemctl restart "$service"
          sleep 3
          active="$(systemctl show "$service" -p ActiveState --value 2>/dev/null || true)"
          sub="$(systemctl show "$service" -p SubState --value 2>/dev/null || true)"
          [ "$active" = active ] && [ "$sub" = running ] || fail 'service_not_running_after_remediation'
          local_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 http://127.0.0.1:8011/ || true)"
          case "$local_code" in 2??|3??) ;; *) fail 'local_health_failed_after_remediation' ;; esac
          public_code="$(curl --proto '=https' -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://geoflow.co.kr/login/ || true)"
          [ "$public_code" = '200' ] || fail 'public_login_not_200_after_remediation'

          rm -f "$backup"
          mutation_started=0
          trap - EXIT
          echo 'phase2_runtime_security_complete=yes'
          REMOTE
